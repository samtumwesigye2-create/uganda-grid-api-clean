<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Review Submissions - Uganda National Grid</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111827}
  header{background:#111827;color:#fff;padding:16px;text-align:center}
  header h1{margin:0;font-size:20px}
  main{max-width:640px;margin:16px auto;padding:16px}
  .loginBox{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  input,button{width:100%;font-size:16px;border-radius:8px;padding:12px;border:1px solid #d1d5db;box-sizing:border-box}
  button{border:0;font-weight:700;cursor:pointer;margin-top:8px}
  #unlockBtn{background:#2563eb;color:#fff}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .card img,.card video{max-width:100%;border-radius:8px;margin-top:8px}
  .tag{display:inline-block;background:#f3f4f6;border-radius:999px;padding:4px 10px;font-size:12px;margin-right:6px}
  .decisionRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .approveForm{margin-top:10px;display:none}
  .approveForm.active{display:block}
  .approveForm input{margin-bottom:8px}
  .denyBtn{background:#374151;color:#fff}
  .toggleApproveBtn{background:#059669;color:#fff}
  .confirmApproveBtn{background:#059669;color:#fff}
  .statusMsg{font-size:12px;margin-top:6px;color:#6b7280}
  #logoutBar{display:flex;justify-content:flex-end;margin-bottom:10px}
  #logoutBtn{width:auto;background:#e5e7eb;color:#111827;padding:8px 14px;font-size:13px}
</style>

<style id="ungGlobalBrandStyle">
  .ungGlobalBrand{
    flex:0 0 auto;
    width:100%;
    min-height:58px;
    padding:5px 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border-bottom:1px solid rgba(15,23,42,.12);
    position:relative;
    z-index:4200;
  }
  .ungGlobalBrand a{display:flex;align-items:center;justify-content:center;text-decoration:none;line-height:0;}
  .ungGlobalBrand img{
    display:block;
    width:min(230px,62vw);
    max-height:56px;
    object-fit:contain;
  }
  @media(max-width:600px){
    .ungGlobalBrand{min-height:52px;padding:4px 10px;}
    .ungGlobalBrand img{width:min(205px,68vw);max-height:50px;}
  }
  @media print{
    .ungGlobalBrand{border-bottom:0;padding:0 0 8px;min-height:0;}
    .ungGlobalBrand img{width:190px;max-height:50px;}
  }
</style>

</head>
<body>
<div class="ungGlobalBrand" id="ungGlobalBrand"><a href="/" aria-label="Uganda National Grid home"><img src="/assets/uganda-national-grid-logo.png" alt="Uganda National Grid" /></a></div>

<header><h1>Submission Review</h1></header>
<main>
  <div id="loginSection" class="loginBox">
    <label style="display:block;font-weight:700;font-size:13px;margin-bottom:6px">Enter passcode</label>
    <input type="password" id="passcodeInput" placeholder="Passcode" />
    <button id="unlockBtn">Unlock</button>
    <div id="loginStatus" class="statusMsg"></div>
  </div>

  <div id="reviewSection" style="display:none">
    <div id="logoutBar"><button id="logoutBtn">Lock</button></div>
    <div id="list"></div>
  </div>
</main>

<script>
(function () {
  var passcode = '';
  var passcodeInput = document.getElementById('passcodeInput');
  var unlockBtn = document.getElementById('unlockBtn');
  var loginStatus = document.getElementById('loginStatus');
  var loginSection = document.getElementById('loginSection');
  var reviewSection = document.getElementById('reviewSection');
  var list = document.getElementById('list');
  var logoutBtn = document.getElementById('logoutBtn');

  var BUILDING_LABELS = {
    hospital: 'Hospital / Health Facility',
    police: 'Police Station',
    government: 'Government Office',
    residence: 'Home / Residence',
    business: 'Business',
    other: 'Other'
  };

  function apiCandidates() {
    var urls = [];
    if (location.protocol.indexOf('http') === 0) urls.push(location.origin);
    urls.push('https://uganda-grid-api-clean-production.up.railway.app');
    return urls;
  }

  async function fetchSubmissions() {
    var candidates = apiCandidates();
    for (var i = 0; i < candidates.length; i++) {
      try {
        var r = await fetch(candidates[i] + '/submissions?status=pending', {
          headers: { 'X-Admin-Passcode': passcode }
        });
        if (r.status === 401) return { unauthorized: true };
        if (r.ok) {
          var d = await r.json();
          return { base: candidates[i], results: d.results || [] };
        }
      } catch (e) {}
    }
    return null;
  }

  function mediaHtml(sub, base) {
    if (!sub.media_url) return '';
    var url = base + sub.media_url;
    if (sub.media_type && sub.media_type.indexOf('video') === 0) {
      return '<video src="' + url + '" controls></video>';
    }
    return '<img src="' + url + '" />';
  }

  function escapeHtml(v) {
    return String(v || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderList(base, submissions) {
    list.innerHTML = '';
    if (!submissions.length) {
      list.innerHTML = '<div class="card">No pending submissions.</div>';
      return;
    }
    submissions.forEach(function (sub) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<span class="tag">' + escapeHtml(BUILDING_LABELS[sub.building_type] || sub.building_type) + '</span>' +
        '<span class="tag">' + sub.lat.toFixed(6) + ', ' + sub.lon.toFixed(6) + '</span>' +
        (sub.note ? '<p>' + escapeHtml(sub.note) + '</p>' : '') +
        mediaHtml(sub, base) +
        '<div class="decisionRow">' +
        '<button class="toggleApproveBtn" data-id="' + sub.id + '">Approve</button>' +
        '<button class="denyBtn" data-id="' + sub.id + '">Deny</button>' +
        '</div>' +
        '<div class="approveForm" id="approveForm-' + sub.id + '">' +
        '<input type="text" placeholder="Grid ID e.g. UG-ENT-000123" id="gridId-' + sub.id + '" />' +
        '<input type="text" placeholder="Full address" id="address-' + sub.id + '" />' +
        '<button data-id="' + sub.id + '" class="confirmApproveBtn">Confirm Approval</button>' +
        '</div>' +
        '<div class="statusMsg" id="msg-' + sub.id + '"></div>';
      list.appendChild(card);
    });

    document.querySelectorAll('.toggleApproveBtn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.dataset.id;
        document.getElementById('approveForm-' + id).classList.toggle('active');
      });
    });

    document.querySelectorAll('.denyBtn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        decide(base, btn.dataset.id, 'deny', '', '');
      });
    });

    document.querySelectorAll('.confirmApproveBtn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.dataset.id;
        var gridId = document.getElementById('gridId-' + id).value.trim();
        var address = document.getElementById('address-' + id).value.trim();
        if (!gridId || !address) {
          document.getElementById('msg-' + id).textContent = 'Grid ID and address are required';
          return;
        }
        decide(base, id, 'approve', gridId, address);
      });
    });
  }

  async function decide(base, id, action, gridId, address) {
    var msg = document.getElementById('msg-' + id);
    if (msg) msg.textContent = 'Saving...';
    var formData = new FormData();
    formData.append('action', action);
    formData.append('grid_id', gridId);
    formData.append('address', address);
    try {
      var r = await fetch(base + '/submissions/' + id + '/decision', {
        method: 'POST',
        headers: { 'X-Admin-Passcode': passcode },
        body: formData
      });
      if (r.ok) {
        loadSubmissions();
      } else if (msg) {
        msg.textContent = 'Failed to save decision';
      }
    } catch (e) {
      if (msg) msg.textContent = 'Network error';
    }
  }

  async function loadSubmissions() {
    var result = await fetchSubmissions();
    if (!result) {
      loginStatus.textContent = 'Unable to reach server';
      return;
    }
    if (result.unauthorized) {
      loginStatus.textContent = 'Incorrect passcode';
      loginSection.style.display = 'block';
      reviewSection.style.display = 'none';
      return;
    }
    loginSection.style.display = 'none';
    reviewSection.style.display = 'block';
    renderList(result.base, result.results);
  }

  unlockBtn.addEventListener('click', function () {
    passcode = passcodeInput.value;
    loginStatus.textContent = 'Checking...';
    loadSubmissions();
  });

  logoutBtn.addEventListener('click', function () {
    passcode = '';
    passcodeInput.value = '';
    loginSection.style.display = 'block';
    reviewSection.style.display = 'none';
    loginStatus.textContent = '';
  });
})();
</script>
</body>
</html>
