<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UGAFORCE-HR | Password</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:#fff;border:1px solid #e1e6ea;border-radius:14px;padding:24px;box-shadow:0 8px 30px rgba(16,24,32,.08)}.brand{font-weight:800;font-size:20px;letter-spacing:.4px;color:#101820;margin-bottom:26px}.brand small{display:block;font-size:11px;color:#687684;margin-top:6px}.notice{background:#f2f6f9;border:1px solid #dce5ec;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:18px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#44515d}.field input{width:100%;border:1px solid #d5dde4;border-radius:8px;padding:11px 12px;font-size:15px;background:#fff}.btn{width:100%;border:0;border-radius:8px;padding:12px 14px;background:#182a38;color:#fff;font-weight:700;font-size:14px;margin-top:8px}.btn:disabled{opacity:.55}.msg{font-size:13px;margin-top:12px;min-height:18px}.error{color:#a33}.ok{color:#187548}.back{display:block;text-align:center;margin-top:15px;color:#405d73;text-decoration:none;font-size:13px}.hidden{display:none!important}h1{font-size:24px;margin:0 0 8px}.sub{font-size:13px;color:#687684;margin-bottom:18px;line-height:1.45}
</style>
</head>
<body>
<section class="card">
  <div class="brand">UGAFORCE-HR<small>ACCOUNT SECURITY</small></div>
  <h1 id="heading">Change your password</h1>
  <div class="sub" id="subtitle">Use your current credential once, then create the password you want to use going forward.</div>
  <div class="notice hidden" id="requiredNotice"><strong>Password change required.</strong> Your current credential is temporary. Create your permanent password before continuing.</div>
  <div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password"></div>
  <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 10 characters"></div>
  <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password"></div>
  <button class="btn" id="savePassword">Save new password</button>
  <div class="msg" id="message"></div>
  <a class="back" id="back" href="/">Back to UGAFORCE-HR</a>
</section>
<script>
const API='/api/v1', tokenKey='ugaforce-hr-token';
const token=sessionStorage.getItem(tokenKey)||'';
const message=document.getElementById('message');
const requiredNotice=document.getElementById('requiredNotice');
const back=document.getElementById('back');
const heading=document.getElementById('heading');
const subtitle=document.getElementById('subtitle');

function showMessage(text,ok=false){message.textContent=text;message.className='msg '+(ok?'ok':'error')}
async function call(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.detail||'Request failed');
  return data;
}
async function initialize(){
  if(!token){location.replace('/');return}
  try{
    const state=await call('/auth/password-state');
    if(state.must_change_password){
      requiredNotice.classList.remove('hidden');
      back.classList.add('hidden');
      heading.textContent='Create your password';
      subtitle.textContent='You signed in with a temporary credential. Replace it now with your permanent password.';
    }
  }catch(e){sessionStorage.removeItem(tokenKey);location.replace('/')}
}
document.getElementById('savePassword').addEventListener('click',async()=>{
  const current=document.getElementById('currentPassword').value;
  const next=document.getElementById('newPassword').value;
  const confirm=document.getElementById('confirmPassword').value;
  if(!current){showMessage('Enter your current password.');return}
  if(next.length<10){showMessage('New password must be at least 10 characters.');return}
  if(next!==confirm){showMessage('New passwords do not match.');return}
  const btn=document.getElementById('savePassword');btn.disabled=true;showMessage('');
  try{
    await call('/auth/change-password',{method:'POST',body:JSON.stringify({current_password:current,new_password:next})});
    document.getElementById('currentPassword').value='';document.getElementById('newPassword').value='';document.getElementById('confirmPassword').value='';
    requiredNotice.classList.add('hidden');back.classList.remove('hidden');
    showMessage('Password changed successfully. Redirecting to UGAFORCE-HR…',true);
    setTimeout(()=>location.replace('/'),700);
  }catch(e){showMessage(e.message)}finally{btn.disabled=false}
});
initialize();
</script>
</body>
</html>
