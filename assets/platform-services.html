<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGAMAP Platform Services</title><style>:root{--bg:#08131e;--card:#10243a;--card2:#132b48;--line:#31558b;--text:#f6f8ff;--muted:#9db1ca;--good:#39d98a;--warn:#f7c65f;--bad:#ff6b6b;--blue:#5294ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#091224,#08131e 55%,#07111a);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:rgba(8,19,30,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);padding:12px 14px;display:flex;align-items:center;gap:10px}.back,.tool,.func{border:0;border-radius:10px;color:#fff;font-weight:700}.back{padding:10px 13px;background:#172a40}.brand{flex:1}.brand h1{margin:0;font-size:18px}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}.net{font-size:10px;color:var(--warn)}main{max-width:1180px;margin:auto;padding:14px}.topbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}.access{display:flex;gap:8px}.access input,.control input,.control select,.control textarea{width:100%;background:#0b1a29;border:1px solid rgba(255,255,255,.1);color:#fff;padding:10px;border-radius:10px}.tool{padding:10px 12px;background:#1a4f82}.tools{display:flex;gap:7px;flex-wrap:wrap}.panel{background:rgba(15,34,55,.94);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:13px;margin-bottom:12px}.panel h2{font-size:15px;margin:0 0 9px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.service{min-height:142px;background:linear-gradient(180deg,#172f53,#10243f);border:1px solid #31558b;border-radius:14px;padding:13px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-align:left}.service h3{font-size:16px;margin:0}.service p{font-size:11px;color:var(--muted);margin:8px 0;line-height:1.35}.service .count{font-size:10px;color:#82b6ff}.service.active{outline:2px solid #5b95ef}.workspace{display:grid;grid-template-columns:1.05fr .95fr;gap:11px}.purpose{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:10px}.inner{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.func{background:#173a61;padding:11px;text-align:left}.func small{display:block;color:#afc3da;font-weight:500;margin-top:4px;line-height:1.3}.control{margin-top:10px;background:#0b1d2e;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;display:grid;gap:8px}.control label{font-size:10px;color:var(--muted)}.output{background:#07121d;border:1px solid rgba(255,255,255,.09);border-radius:12px;min-height:285px;padding:11px;white-space:pre-wrap;word-break:break-word;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}.network{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.node{background:#0b1d2e;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:9px}.node b{font-size:11px;display:block}.node span{font-size:10px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:5px}.good .dot{background:var(--good)}.bad .dot{background:var(--bad)}.filebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.filebox input{font-size:11px;color:var(--muted)}@media(max-width:800px){.services{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.network{grid-template-columns:1fr 1fr}.topbar{grid-template-columns:1fr}.access{flex-direction:column}}@media(max-width:480px){.services{grid-template-columns:1fr}.inner{grid-template-columns:1fr}}</style></head><body><header><button class="back" onclick="history.back()">‹</button><div class="brand"><h1>Platform Services</h1><p>UGAMAP network-wide operations, governance and shared services</p></div><div class="net" id="networkState">CHECKING NETWORK</div></header><main><div class="topbar"><div class="access"><input id="access" type="password" placeholder="Staff/admin access code"><button class="tool" id="refresh">Refresh Network</button></div><div class="tools"><button class="tool" onclick="printCurrent()">Print</button><button class="tool" onclick="shareCurrent()">Share</button><button class="tool" onclick="downloadJSON()">Export JSON</button><button class="tool" onclick="downloadCSV()">Export CSV</button></div></div><section class="panel"><h2>Core Platform Services</h2><div class="services" id="services"></div></section><section class="panel workspace"><div><h2 id="moduleTitle">Select a service</h2><div class="purpose" id="modulePurpose"></div><div class="inner" id="functions"></div><div class="control" id="controlBox"><label id="controlLabel">Input</label><input id="controlInput" placeholder="Optional value"><select id="controlSelect"><option>Automatic</option><option>Standard</option><option>High priority</option></select><textarea id="controlText" rows="3" placeholder="Notes, template, rule or data"></textarea><button class="tool" id="execute">Execute Selected Function</button></div><div class="filebox"><input type="file" id="fileInput"><button class="tool" onclick="readFile()">Load File</button><button class="tool" onclick="copyOutput()">Copy Output</button></div></div><div><h2>Output</h2><div class="output" id="output">Platform ready. Select a service and an inner function.</div></div></section><section class="panel"><h2>Network Connections</h2><div class="network" id="network"></div></section></main><script>const modules=[{name:'User & Access Management',purpose:'Authenticates identity, controls permissions with role/attribute rules, and manages user profiles and account states.',f:[['Authenticate Identity','Verify password/passcode credentials against protected network services.'],['RBAC / ABAC Access','Evaluate role and attribute permissions before protected actions.'],['Profile Management','Create a profile payload with preferences and account state.'],['Session & Access Report','Generate a session/access snapshot for review.'],['Biometric / SSO Readiness','Record supported authentication methods and integration readiness.'],['Account Export','Export user/access data for authorized review.']]},{name:'Workflow Engine',purpose:'Automates business processes, routes tasks between people or systems, and tracks each process from start to finish.',f:[['Create Workflow','Create a multi-step workflow definition from the entered rule or process.'],['Route Task','Assign the next action to a person, role or connected system.'],['Approval Flow','Generate and track an approval sequence.'],['State Tracking','Track queued, running, waiting, approved and completed states.'],['Business Rules','Evaluate rule conditions and next-step routing.'],['Workflow Export','Export current process state and history.']]},{name:'Notification Service',purpose:'Dispatches alerts through multiple channels, manages templates, and queues delivery so the main application is not blocked.',f:[['Dispatch Alert','Build an email, SMS, push, Slack or in-app notification payload.'],['Template Manager','Create reusable transactional notification templates.'],['Delivery Queue','Queue a message with priority and delivery state.'],['Delivery Status','Track queued, sent, delivered, failed or retry states.'],['Escalation Rules','Create alert escalation rules for missed or failed events.'],['Notification Export','Export notification history and payloads.']]},{name:'Document Management',purpose:'Stores and catalogs digital files, tracks document versions, and applies view/download/edit/delete access controls.',f:[['Store / Index File','Read a selected file and generate its document record.'],['Version Tracking','Create a version history entry and restore-point metadata.'],['Document Permissions','Generate view, download, edit and delete permission rules.'],['Document Metadata','Capture file name, type, size, owner and timestamps.'],['Print / Share Package','Prepare the active document/output for printing or sharing.'],['Document Export','Export the current document manifest.']]},{name:'Audit & Compliance',purpose:'Logs who did what and when, creates accountable audit trails, and identifies suspicious or unauthorized activity.',f:[['Activity Log','Record actor, action, target and timestamp.'],['Immutable Audit Snapshot','Generate a tamper-evident-style snapshot identifier for the current event set.'],['Compliance Checklist','Create GDPR/HIPAA-style control review fields without claiming certification.'],['Anomaly Detection','Flag unusual failures, denied access or unhealthy services.'],['Evidence Package','Bundle current audit evidence into exportable data.'],['Compliance Export','Export audit and compliance records.']]},{name:'Master Data Management',purpose:'Centralizes trusted core entities, cleans duplicates and formatting, and synchronizes consistent reference data across UGAMAP services.',f:[['Canonical Data Snapshot','Load national address, geography, warehouse and product reference data where available.'],['Duplicate / Format Check','Normalize and detect duplicate values in entered master data.'],['Address Master','Load national address statistics and search data.'],['Geography Master','Load state and ZIP/ZIPPER geography status.'],['Inventory Master','Load warehouse and product master records.'],['Master Data Export','Export the current source-of-truth snapshot.']]},{name:'API Management',purpose:'Exposes backend services securely, tracks endpoint availability and latency, and defines rate-limit and developer access policies.',f:[['API Health','Check the core API health endpoint.'],['Endpoint Catalog','List connected UGAMAP API endpoints.'],['Rate-Limit Policy','Generate throttling policy values for traffic protection.'],['Usage Monitor','Measure endpoint status and request latency.'],['Developer Access','Generate an API access policy record without exposing secrets.'],['API Export','Export the endpoint and usage catalog.']]},{name:'Monitoring Service',purpose:'Tracks service health and latency, reports errors, and triggers alert-ready events when performance degrades.',f:[['Health Monitor','Probe all connected service endpoints.'],['Latency Monitor','Measure request latency across the network.'],['Error Monitor','Report unavailable or failing services.'],['Database / Data Monitor','Check data-facing endpoints such as statistics and inventory.'],['Alert Trigger','Generate an alert when unhealthy services are detected.'],['Monitoring Export','Export the latest monitoring snapshot.']]},{name:'Feature Management',purpose:'Turns features on or off, controls gradual rollouts, and supports controlled A/B test definitions without redeploying code.',f:[['Feature Toggle','Create or change an enabled/disabled feature state.'],['Canary Rollout','Set a gradual rollout percentage for a feature.'],['A/B Test','Define variant A/B allocation and success metric.'],['Feature Registry','List platform feature groups and states.'],['Dependency Check','Probe dependencies required by a feature.'],['Feature Export','Export the feature registry and rollout configuration.']]}];const endpoints=[['Core API','/health'],['Statistics','/stats'],['Geography','/geography/status'],['States','/geography/states'],['ZIPPER','/geography/zips'],['Warehouses','/inventory/warehouses'],['Products','/inventory/products'],['Search','/search?q=Kampala']];let selected=0,selectedFn=0,lastData={},audit=[],workflowState=[],notificationQueue=[],featureRegistry={};const $=id=>document.getElementById(id);function authHeaders(){const c=$('access').value.trim();return c?{'X-Access-Code':c,'X-Admin-Passcode':c}:{};}function esc(x){return String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));}function renderServices(){$('services').innerHTML=modules.map((m,i)=>`<button class="service ${i===selected?'active':''}" onclick="selectModule(${i})"><div><h3>${esc(m.name)}</h3><p>${esc(m.purpose)}</p></div><div class="count">${m.f.length} inner functions</div></button>`).join('');}function selectModule(i){selected=i;selectedFn=0;renderServices();const m=modules[i];$('moduleTitle').textContent=m.name;$('modulePurpose').textContent=m.purpose;$('functions').innerHTML=m.f.map((x,j)=>`<button class="func" onclick="chooseFunction(${j})">${esc(x[0])}<small>${esc(x[1])}</small></button>`).join('');$('output').textContent=m.name+' ready. Choose an inner function.';}function chooseFunction(j){selectedFn=j;$('controlLabel').textContent=modules[selected].f[j][0];$('output').textContent=modules[selected].f[j][0]+' selected. Enter optional data and execute.';}async function api(path){const t=performance.now();const r=await fetch(path,{headers:authHeaders(),cache:'no-store'});const ms=Math.round(performance.now()-t);const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error((data&&data.detail)||('HTTP '+r.status));return {path,status:r.status,latency_ms:ms,data};}function emit(title,data){lastData={module:modules[selected].name,function:title,timestamp:new Date().toISOString(),data};$('output').textContent=title+'\n\n'+JSON.stringify(data,null,2);}async function safeApi(p){try{return await api(p)}catch(e){return {path:p,ok:false,error:e.message}}}async function probeAll(){const rows=[];for(const [name,path] of endpoints){const t=performance.now();try{const r=await fetch(path,{headers:authHeaders(),cache:'no-store'});rows.push({name,path,ok:r.ok,status:r.status,latency_ms:Math.round(performance.now()-t)})}catch(e){rows.push({name,path,ok:false,error:e.message,latency_ms:Math.round(performance.now()-t)})}}return rows;}function val(){return {input:$('controlInput').value.trim(),mode:$('controlSelect').value,notes:$('controlText').value.trim()}}function event(action,target,result='ok'){const e={id:'AUD-'+Date.now(),actor:$('access').value?'authenticated-user':'anonymous',action,target,result,timestamp:new Date().toISOString()};audit.unshift(e);return e}async function execute(){const title=modules[selected].f[selectedFn][0],v=val();$('output').textContent='Running '+title+'…';try{let d;if(selected===0){if(selectedFn===0){const checks=[await safeApi('/health'),await safeApi('/inventory/warehouses')];d={authenticated:checks.some(x=>x.status===200),methods:['password/passcode','SSO-ready','biometric-ready'],checks};}else if(selectedFn===1)d={policy:'RBAC + ABAC',role:v.input||'operator',attributes:v.notes||'none supplied',decision:v.mode==='High priority'?'review-required':'allow-by-policy',rules:['least privilege','role scope','attribute conditions']};else if(selectedFn===2)d={profile:{display_name:v.input||'New User',preferences:v.notes||'',account_state:v.mode==='High priority'?'restricted':'active'}};else if(selectedFn===3)d={session:{state:$('access').value?'authenticated-context':'anonymous-context',generated_at:new Date().toISOString()},audit:audit.slice(0,20)};else if(selectedFn===4)d={supported:['password/passcode'],integration_ready:['SSO/OIDC','biometric device assertion'],note:'Biometric verification and external SSO require their identity providers/devices.'};else d={accounts:'export-ready',audit:audit.slice(0,50)};}else if(selected===1){if(selectedFn===0){const w={id:'WF-'+Date.now(),name:v.input||'Untitled workflow',rule:v.notes||'No rule supplied',state:'queued',created_at:new Date().toISOString()};workflowState.unshift(w);d=w}else if(selectedFn===1){const w={task:v.input||'Task',route_to:v.notes||'next-role',priority:v.mode,state:'routed'};workflowState.unshift(w);d=w}else if(selectedFn===2)d={approval_id:'APR-'+Date.now(),steps:['submitted','manager review','final approval'],state:'pending',subject:v.input||'Unspecified'};else if(selectedFn===3)d={workflows:workflowState,state_counts:workflowState.reduce((a,x)=>(a[x.state]=(a[x.state]||0)+1,a),{})};else if(selectedFn===4)d={condition:v.input||'default',rule:v.notes||'if approved -> next step',evaluation:'ready'};else d={workflows:workflowState};}else if(selected===2){if(selectedFn===0){const n={id:'NTF-'+Date.now(),channel:v.input||'in-app',priority:v.mode,message:v.notes||'UGAMAP notification',state:'queued'};notificationQueue.unshift(n);d=n}else if(selectedFn===1)d={template_id:'TPL-'+Date.now(),name:v.input||'transactional-template',body:v.notes||'Message body',channels:['email','SMS','push','Slack','in-app']};else if(selectedFn===2)d={queue:notificationQueue,reliable_delivery:true,non_blocking_design:true};else if(selectedFn===3)d={messages:notificationQueue.map(x=>({...x,delivery_status:x.state}))};else if(selectedFn===4)d={rule:v.input||'delivery failure',escalate_after:v.notes||'5 minutes',priority:v.mode};else d={notifications:notificationQueue};}else if(selected===3){if(selectedFn===0){if(!$('fileInput').files[0])throw new Error('Choose a file first');return readFile()}else if(selectedFn===1)d={document:v.input||'current-document',new_version:'v'+(Date.now()%10000),history_preserved:true,restore_point:true};else if(selectedFn===2)d={document:v.input||'current-document',permissions:{view:true,download:true,edit:v.mode!=='Standard',delete:false},policy:'role/attribute controlled'};else if(selectedFn===3){const f=$('fileInput').files[0];d=f?{name:f.name,type:f.type,size:f.size,last_modified:new Date(f.lastModified).toISOString()}:{message:'No file selected'}}else if(selectedFn===4){d={print_ready:true,share_ready:true,current:lastData};}else d={manifest:lastData};}else if(selected===4){if(selectedFn===0)d=event(v.input||'manual activity',v.notes||'platform');else if(selectedFn===1)d={snapshot_id:'AUDSNAP-'+Date.now(),events:audit,integrity_note:'Snapshot identifier generated; true immutability requires append-only/WORM storage.'};else if(selectedFn===2)d={controls:[{name:'Access control',status:'review'},{name:'Data minimization',status:'review'},{name:'Retention',status:'review'},{name:'Auditability',status:'enabled'}],framework_reference:v.input||'general',note:'Checklist only; not a certification.'};else if(selectedFn===3){const rows=await probeAll();d={anomalies:rows.filter(x=>!x.ok||x.latency_ms>1500),network:rows};}else if(selectedFn===4)d={evidence:{audit:audit,network:await probeAll(),generated_at:new Date().toISOString()}};else d={audit:audit};}else if(selected===5){if(selectedFn===0)d={stats:await safeApi('/stats'),geography:await safeApi('/geography/status'),warehouses:await safeApi('/inventory/warehouses'),products:await safeApi('/inventory/products')};else if(selectedFn===1){const raw=(v.input+' '+v.notes).split(/[\n,]+/).map(x=>x.trim()).filter(Boolean),norm=[...new Set(raw.map(x=>x.replace(/\s+/g,' ').trim()))];d={input_count:raw.length,unique_count:norm.length,duplicates_removed:raw.length-norm.length,normalized:norm};}else if(selectedFn===2)d={stats:await safeApi('/stats'),search:await safeApi('/search?q='+(encodeURIComponent(v.input||'Kampala')))};else if(selectedFn===3)d=await safeApi('/geography/status');else if(selectedFn===4)d={warehouses:await safeApi('/inventory/warehouses'),products:await safeApi('/inventory/products')};else d={source_of_truth:lastData};}else if(selected===6){if(selectedFn===0)d=await api('/health');else if(selectedFn===1)d={endpoints:endpoints.map(x=>({name:x[0],path:x[1],security:x[1].startsWith('/inventory')?'protected':'public/read'}))};else if(selectedFn===2)d={policy:{requests_per_minute:Number(v.input)||120,burst:Number(v.notes)||30,scope:v.mode},note:'Policy definition; enforcement depends on gateway/server middleware.'};else if(selectedFn===3)d=await probeAll();else if(selectedFn===4)d={developer_access:{name:v.input||'developer',scope:v.notes||'read-only',credential:'not displayed',status:'policy-ready'}};else d={catalog:endpoints,latest:lastData};}else if(selected===7){const rows=await probeAll();if(selectedFn===0)d=rows;else if(selectedFn===1)d={latency:rows.map(x=>({name:x.name,latency_ms:x.latency_ms,status:x.status}))};else if(selectedFn===2)d={errors:rows.filter(x=>!x.ok)};else if(selectedFn===3)d={stats:await safeApi('/stats'),warehouses:await safeApi('/inventory/warehouses'),products:await safeApi('/inventory/products')};else if(selectedFn===4)d={triggered:rows.some(x=>!x.ok||x.latency_ms>1500),conditions:{unavailable:rows.filter(x=>!x.ok).length,slow:rows.filter(x=>x.latency_ms>1500).length},channel:v.input||'engineering-alert'};else d={monitoring:rows};}else if(selected===8){if(selectedFn===0){const k=v.input||'feature-'+Date.now();featureRegistry[k]={enabled:v.mode!=='Standard',updated_at:new Date().toISOString()};d={feature:k,...featureRegistry[k]};}else if(selectedFn===1){const k=v.input||'feature';const pct=Math.max(0,Math.min(100,Number(v.notes)||10));featureRegistry[k]={...(featureRegistry[k]||{}),rollout_percent:pct,mode:'canary'};d={feature:k,rollout_percent:pct};}else if(selectedFn===2)d={experiment:v.input||'A/B test',variant_a:50,variant_b:50,success_metric:v.notes||'conversion',status:'configured'};else if(selectedFn===3)d={features:featureRegistry,platform_groups:modules.map(x=>x.name)};else if(selectedFn===4)d={dependencies:await probeAll()};else d={features:featureRegistry};}event(title,modules[selected].name,'ok');emit(title,d)}catch(e){event(title,modules[selected].name,'error');emit(title,{ok:false,error:e.message})}}async function refreshNetwork(){const n=$('network');n.innerHTML=endpoints.map(x=>`<div class="node"><b><span class="dot"></span>${esc(x[0])}</b><span>Checking…</span></div>`).join('');const rows=await probeAll();n.innerHTML=rows.map(r=>`<div class="node ${r.ok?'good':'bad'}"><b><span class="dot"></span>${esc(r.name)}</b><span>${r.ok?'ONLINE':'UNAVAILABLE'} · ${r.status||''} ${r.latency_ms||0}ms</span></div>`).join('');const online=rows.filter(r=>r.ok).length;$('networkState').textContent=online+'/'+rows.length+' SERVICES ONLINE';$('networkState').style.color=online?'#39d98a':'#ff6b6b';lastData={network:rows,timestamp:new Date().toISOString()};return rows;}function printCurrent(){window.print()}async function shareCurrent(){const text=$('output').textContent;try{if(navigator.share)await navigator.share({title:'UGAMAP Platform Services',text});else{await navigator.clipboard.writeText(text);alert('Output copied for sharing.')}}catch(e){}}function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function downloadJSON(){download('ugamap-platform-services.json','application/json',JSON.stringify(lastData,null,2))}function flatten(obj,p='',out={}){Object.entries(obj||{}).forEach(([k,v])=>{const key=p?p+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v))flatten(v,key,out);else out[key]=Array.isArray(v)?JSON.stringify(v):v});return out}function downloadCSV(){const f=flatten(lastData);const csv='field,value\n'+Object.entries(f).map(([k,v])=>`"${String(k).replaceAll('"','""')}","${String(v??'').replaceAll('"','""')}"`).join('\n');download('ugamap-platform-services.csv','text/csv',csv)}async function readFile(){const f=$('fileInput').files[0];if(!f)return emit('File Reader',{error:'No file selected'});const text=await f.text();const d={name:f.name,type:f.type,size:f.size,last_modified:new Date(f.lastModified).toISOString(),version:'v1',permissions:{view:true,download:true,edit:true,delete:false},preview:text.slice(0,20000)};event('file-index',f.name,'ok');emit('File Reader',d);return d}async function copyOutput(){try{await navigator.clipboard.writeText($('output').textContent);$('networkState').textContent='OUTPUT COPIED'}catch(e){}}$('execute').onclick=execute;$('refresh').onclick=refreshNetwork;renderServices();selectModule(0);refreshNetwork();</script></body></html>
