<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGAMAP Platform Services</title><style>:root{--bg:#08131e;--card:#10243a;--card2:#132b48;--line:#31558b;--text:#f6f8ff;--muted:#9db1ca;--good:#39d98a;--warn:#f7c65f;--bad:#ff6b6b;--blue:#5294ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#091224,#08131e 55%,#07111a);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:rgba(8,19,30,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);padding:12px 14px;display:flex;align-items:center;gap:10px}.back,.tool,.func{border:0;border-radius:10px;color:white;font-weight:700}.back{padding:10px 13px;background:#172a40}.brand{flex:1}.brand h1{margin:0;font-size:18px}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}.net{font-size:10px;color:var(--warn)}main{max-width:1180px;margin:auto;padding:14px}.topbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}.access{display:flex;gap:8px}.access input{width:100%;background:#0b1a29;border:1px solid rgba(255,255,255,.1);color:#fff;padding:10px;border-radius:10px}.tool{padding:10px 12px;background:#1a4f82}.tools{display:flex;gap:7px;flex-wrap:wrap}.panel{background:rgba(15,34,55,.94);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:13px;margin-bottom:12px}.panel h2{font-size:15px;margin:0 0 9px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.service{min-height:132px;background:linear-gradient(180deg,#172f53,#10243f);border:1px solid #31558b;border-radius:14px;padding:13px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.service h3{font-size:16px;margin:0}.service p{font-size:11px;color:var(--muted);margin:8px 0}.service .count{font-size:10px;color:#82b6ff}.service.active{outline:2px solid #5b95ef}.workspace{display:grid;grid-template-columns:1.05fr .95fr;gap:11px}.inner{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.func{background:#173a61;padding:11px;text-align:left}.func small{display:block;color:#afc3da;font-weight:500;margin-top:4px;line-height:1.3}.output{background:#07121d;border:1px solid rgba(255,255,255,.09);border-radius:12px;min-height:225px;padding:11px;white-space:pre-wrap;word-break:break-word;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}.network{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.node{background:#0b1d2e;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:9px}.node b{font-size:11px;display:block}.node span{font-size:10px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:5px}.good .dot{background:var(--good)}.bad .dot{background:var(--bad)}.filebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.filebox input{font-size:11px;color:var(--muted)}@media(max-width:800px){.services{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.network{grid-template-columns:1fr 1fr}.topbar{grid-template-columns:1fr}.access{flex-direction:column}}@media(max-width:480px){.services{grid-template-columns:1fr}.inner{grid-template-columns:1fr}}</style></head><body><header><button class="back" onclick="history.back()">‹</button><div class="brand"><h1>Platform Services</h1><p>UGAMAP network-wide operations and shared services</p></div><div class="net" id="networkState">CHECKING NETWORK</div></header><main><div class="topbar"><div class="access"><input id="access" type="password" placeholder="Optional staff/admin access code"><button class="tool" id="refresh">Refresh Network</button></div><div class="tools"><button class="tool" onclick="printCurrent()">Print</button><button class="tool" onclick="shareCurrent()">Share</button><button class="tool" onclick="downloadJSON()">Export JSON</button><button class="tool" onclick="downloadCSV()">Export CSV</button></div></div><section class="panel"><h2>Platform Services</h2><div class="services" id="services"></div></section><section class="panel workspace"><div><h2 id="moduleTitle">Select a service</h2><div class="inner" id="functions"></div><div class="filebox"><input type="file" id="fileInput"><button class="tool" onclick="readFile()">Load File</button><button class="tool" onclick="copyOutput()">Copy Output</button></div></div><div><h2>Output</h2><div class="output" id="output">Platform ready. Select a service and an inner function.</div></div></section><section class="panel"><h2>Network Connections</h2><div class="network" id="network"></div></section></main><script>const modules=[{name:'User & Access Management',desc:'Identity, roles, permissions and sessions.',f:[['Users','List and inspect network users'],['Roles & Permissions','Review access policy and permissions'],['Staff Access','Connect protected operational services'],['Session Report','Generate access/session report'],['Access Audit','Review access events'],['Account Export','Export account data']]},{name:'Workflow Engine',desc:'Create, track and coordinate business workflows.',f:[['Workflow Queue','View active work items'],['Create Workflow','Build a new workflow record'],['Approvals','Review pending approvals'],['Assignments','Route tasks to teams'],['SLA Monitor','Check workflow timing'],['Workflow Export','Export workflow status']]},{name:'Notification Service',desc:'System alerts and delivery coordination.',f:[['Notification Feed','View platform alerts'],['Compose Notice','Create notification payload'],['Delivery Status','Check delivery state'],['Escalations','Generate escalation list'],['Templates','Build reusable messages'],['Notification Export','Export notices']]},{name:'Document Management',desc:'Files, records, exports and document exchange.',f:[['Document Index','Create document inventory'],['File Reader','Load a local file into workspace'],['Document Metadata','Generate metadata record'],['Print Package','Prepare printable output'],['Share Package','Prepare shareable data'],['Document Export','Export document manifest']]},{name:'Audit & Compliance',desc:'Evidence, traceability, controls and reporting.',f:[['Audit Snapshot','Capture current network state'],['Compliance Checklist','Generate control checklist'],['Event Log','Create platform event log'],['Exception Report','Generate exception report'],['Evidence Package','Build evidence data'],['Compliance Export','Export audit results']]},{name:'Master Data Management',desc:'Canonical addresses, ZIPs, products and reference data.',f:[['Address Statistics','Load national address statistics'],['Geography Status','Load state and ZIP geography status'],['Warehouse Master','Load warehouse reference data'],['Product Master','Load inventory product data'],['Search Master Data','Open national search endpoint'],['Master Data Export','Export loaded reference data']]},{name:'API Management',desc:'Network endpoints, health, access and service discovery.',f:[['API Health','Check core API health'],['Endpoint Catalog','Show connected endpoint catalog'],['Service Probe','Probe all platform services'],['API Response','Display latest API response'],['Open API Docs','Open FastAPI documentation'],['API Export','Export service catalog']]},{name:'Monitoring Service',desc:'Network availability, operational health and service status.',f:[['Health Monitor','Check API availability'],['Address Metrics','Load platform record totals'],['Geography Monitor','Check geography services'],['Inventory Monitor','Check warehouse APIs'],['Latency Check','Measure request time'],['Monitoring Export','Export monitoring snapshot']]},{name:'Feature Management',desc:'Feature inventory, readiness and controlled rollout.',f:[['Feature Registry','List platform feature groups'],['Availability Matrix','Generate feature availability'],['Dependency Check','Check connected service dependencies'],['Readiness Report','Generate readiness output'],['Release Snapshot','Create current release snapshot'],['Feature Export','Export feature registry']]}];const endpoints=[['Core API','/health'],['Statistics','/stats'],['Geography','/geography/status'],['States','/geography/states'],['ZIPPER','/geography/zips'],['Warehouses','/inventory/warehouses'],['Products','/inventory/products'],['Search','/search?q=Kampala']];let selected=0,lastData={};const $=id=>document.getElementById(id);function authHeaders(){const c=$('access').value.trim();return c?{'X-Access-Code':c,'X-Admin-Passcode':c}:{};}function esc(x){return String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));}function renderServices(){$('services').innerHTML=modules.map((m,i)=>`<div class="service ${i===selected?'active':''}" onclick="selectModule(${i})"><div><h3>${esc(m.name)}</h3><p>${esc(m.desc)}</p></div><div class="count">${m.f.length} inner functions</div></div>`).join('');}function selectModule(i){selected=i;renderServices();const m=modules[i];$('moduleTitle').textContent=m.name;$('functions').innerHTML=m.f.map((x,j)=>`<button class="func" onclick="runFunction(${j})">${esc(x[0])}<small>${esc(x[1])}</small></button>`).join('');$('output').textContent=m.name+' ready. Choose an inner function.';}async function api(path){const t=performance.now();const r=await fetch(path,{headers:authHeaders(),cache:'no-store'});const ms=Math.round(performance.now()-t);const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error((data&&data.detail)||('HTTP '+r.status));return {path,status:r.status,latency_ms:ms,data};}function emit(title,data){lastData={module:modules[selected].name,function:title,timestamp:new Date().toISOString(),data};$('output').textContent=title+'\n\n'+JSON.stringify(data,null,2);}async function runFunction(j){const title=modules[selected].f[j][0];$('output').textContent='Running '+title+'…';try{let d;const m=selected;if(m===5&&j===0)d=await api('/stats');else if(m===5&&j===1)d=await api('/geography/status');else if(m===5&&j===2)d=await api('/inventory/warehouses');else if(m===5&&j===3)d=await api('/inventory/products');else if(m===6&&j===0)d=await api('/health');else if(m===6&&j===1)d={endpoints:endpoints.map(x=>({name:x[0],path:x[1]}))};else if((m===6&&j===2)||(m===7&&j===0)){d=await probeAll();}else if(m===6&&j===3)d=lastData||{};else if(m===6&&j===4){location.href='/docs';return}else if(m===7&&j===1)d=await api('/stats');else if(m===7&&j===2)d=await api('/geography/status');else if(m===7&&j===3){d={warehouses:await safeApi('/inventory/warehouses'),products:await safeApi('/inventory/products')}}else if(m===7&&j===4){d=await api('/health')}else if(m===3&&j===1){$('fileInput').click();d={message:'Choose a file, then tap Load File.'}}else if(m===3&&j===3){printCurrent();return}else if(m===3&&j===4){shareCurrent();return}else if(j===5)d={export_ready:true,module:modules[m].name,latest:lastData};else d=genericResult(m,title,j);emit(title,d)}catch(e){emit(title,{ok:false,error:e.message})}}function genericResult(m,title,j){const now=new Date().toISOString();const templates={0:{users_endpoint:'/users',access_header:'X-Access-Code',status:'Connected to shared authentication layer'},1:{queue:'Ready',approval_state:'No live workflow backend configured yet',network_context:'Shared UGAMAP API'},2:{delivery:'Ready',channels:['in-app','data export','share package'],network_context:'Shared UGAMAP API'},3:{documents:'Workspace enabled',outputs:['print','share','JSON','CSV','file read']},4:{audit_time:now,controls:['access','data integrity','network health','export trace'],status:'Snapshot generated'},8:{features:modules.map(x=>x.name),status:'Registry generated'}};return {ok:true,generated_at:now,action:title,...(templates[m]||{}),note:'This output is generated from the platform workspace; live endpoints are used where available.'}}async function safeApi(p){try{return await api(p)}catch(e){return {path:p,ok:false,error:e.message}}}async function probeAll(){const rows=[];for(const [name,path] of endpoints){const t=performance.now();try{const r=await fetch(path,{headers:authHeaders(),cache:'no-store'});rows.push({name,path,ok:r.ok,status:r.status,latency_ms:Math.round(performance.now()-t)})}catch(e){rows.push({name,path,ok:false,error:e.message,latency_ms:Math.round(performance.now()-t)})}}return rows;}async function refreshNetwork(){const n=$('network');n.innerHTML=endpoints.map(x=>`<div class="node"><b><span class="dot"></span>${esc(x[0])}</b><span>Checking…</span></div>`).join('');const rows=await probeAll();n.innerHTML=rows.map(r=>`<div class="node ${r.ok?'good':'bad'}"><b><span class="dot"></span>${esc(r.name)}</b><span>${r.ok?'ONLINE':'UNAVAILABLE'} · ${r.status||''} ${r.latency_ms||0}ms</span></div>`).join('');const online=rows.filter(r=>r.ok).length;$('networkState').textContent=online+'/'+rows.length+' SERVICES ONLINE';$('networkState').style.color=online?'#39d98a':'#ff6b6b';lastData={network:rows,timestamp:new Date().toISOString()};return rows;}function printCurrent(){window.print()}async function shareCurrent(){const text=$('output').textContent;try{if(navigator.share)await navigator.share({title:'UGAMAP Platform Services',text});else{await navigator.clipboard.writeText(text);alert('Output copied for sharing.')}}catch(e){}}function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);}function downloadJSON(){download('ugamap-platform-services.json','application/json',JSON.stringify(lastData,null,2))}function flatten(obj,p='',out={}){Object.entries(obj||{}).forEach(([k,v])=>{const key=p?p+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v))flatten(v,key,out);else out[key]=Array.isArray(v)?JSON.stringify(v):v});return out}function downloadCSV(){const f=flatten(lastData);const csv='field,value\n'+Object.entries(f).map(([k,v])=>`"${String(k).replaceAll('"','""')}","${String(v??'').replaceAll('"','""')}"`).join('\n');download('ugamap-platform-services.csv','text/csv',csv)}async function readFile(){const f=$('fileInput').files[0];if(!f)return emit('File Reader',{error:'No file selected'});const text=await f.text();emit('File Reader',{name:f.name,type:f.type,size:f.size,last_modified:new Date(f.lastModified).toISOString(),preview:text.slice(0,20000)})}async function copyOutput(){try{await navigator.clipboard.writeText($('output').textContent);$('networkState').textContent='OUTPUT COPIED'}catch(e){}}$('refresh').onclick=refreshNetwork;renderServices();selectModule(0);refreshNetwork();</script></body></html>
