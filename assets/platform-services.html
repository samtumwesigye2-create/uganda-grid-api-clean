<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGAMAP Platform Services</title><style>:root{--bg:#07131c;--card:#10283a;--line:#2b5877;--text:#f4f8fb;--muted:#9ab0bf;--good:#42d392;--warn:#f5bf54;--bad:#ff7474;--blue:#5aa7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07131c,#0a1b27);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(7,19,28,.96);border-bottom:1px solid #173247;padding:12px 14px;display:flex;gap:10px;align-items:center}.back,.btn,.tab,.service{border:0;border-radius:10px;color:#fff;font-weight:800}.back,.btn{padding:10px 12px;background:#194d70}.back{background:#132b3c}.brand{flex:1}.brand h1{font-size:18px;margin:0}.brand p,.note{font-size:10px;color:var(--muted);line-height:1.45}.state{font-size:10px;color:var(--warn)}main{max-width:1200px;margin:auto;padding:14px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}.toolbar input,.field input,.field select{width:100%;background:#091a25;border:1px solid #24465c;color:#fff;border-radius:10px;padding:10px}.tools,.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap}.panel{background:rgba(14,36,52,.95);border:1px solid #21455d;border-radius:16px;padding:13px;margin-bottom:12px}.panel h2{font-size:15px;margin:0 0 10px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.service{border:1px solid var(--line);background:linear-gradient(180deg,#16344b,#0f293b);padding:12px;text-align:left;min-height:118px}.service.active{outline:2px solid var(--blue)}.service h3{font-size:14px;margin:0 0 6px}.service p{font-size:10px;line-height:1.4;color:var(--muted);margin:0}.badge{display:inline-block;margin-top:8px;font-size:9px;padding:4px 7px;border-radius:999px;background:#133e59;color:#9fd0ff}.badge.live{background:#123c2d;color:#8af0bd}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tab{border:1px solid #2c5874;background:#102a3c;padding:9px;font-size:11px}.tab.active{background:#1e5c83}.field{display:grid;gap:7px;margin-bottom:8px}.field label{font-size:10px;color:var(--muted)}.output{min-height:310px;background:#061019;border:1px solid #1e3c50;border-radius:12px;padding:11px;white-space:pre-wrap;word-break:break-word;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#0a1c28;border:1px solid #1d4056;border-radius:11px;padding:10px}.metric b{display:block;font-size:16px}.metric span{font-size:9px;color:var(--muted)}.danger{background:#712d35}.success{background:#176542}@media(max-width:800px){.services{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}@media(max-width:480px){.services{grid-template-columns:1fr}}</style></head><body><header><button class="back" onclick="history.back()">‹</button><div class="brand"><h1>Platform Services</h1><p>UGAMAP shared platform infrastructure</p></div><div class="state" id="networkState">CHECKING</div></header><main><div class="toolbar"><input id="access" type="password" placeholder="Staff/admin access code"><div class="tools"><button class="btn" onclick="refreshStatus()">Refresh</button><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="exportJSON()">Export</button></div></div><section class="panel"><h2>Platform Service Registry</h2><div class="services" id="services"></div></section><section class="panel"><div class="grid4"><div class="metric"><b id="mApi">—</b><span>API HEALTH</span></div><div class="metric"><b id="mSession">—</b><span>USER SESSION</span></div><div class="metric"><b>3</b><span>IDENTITY MODES</span></div><div class="metric"><b>9</b><span>PLATFORM SERVICES</span></div></div></section><section class="panel workspace"><div><h2 id="moduleTitle">User & Access Management</h2><div class="tabs" id="tabs"></div><div id="form"></div><div class="note" id="note"></div></div><div><h2>Platform Output</h2><div class="output" id="output">Platform Services ready.</div></div></section></main><script>const modules=[['User & Access Management','Passwords, sessions, profiles, RBAC/ABAC policy and SSO/biometric integration readiness.',true],['Workflow Engine','Rules, task routing, approvals and multi-step process state.',false],['Notification Service','Email, SMS, push, Slack and in-app delivery queues.',false],['Document Management','Files, versions, metadata and permissions.',false],['Audit & Compliance','Actor/action/time trails, evidence and anomaly review.',false],['Master Data Management','Canonical addresses, geography, warehouses and products.',false],['API Management','Endpoint catalog, access policy, throttling and usage controls.',false],['Monitoring Service','Health, latency, errors and alerts.',false],['Feature Management','Feature flags, canary rollout and A/B definitions.',false]];let current=0,last={},tab=0;const $=x=>document.getElementById(x);function hdr(){const c=$('access').value.trim();return c?{'X-Access-Code':c,'X-Admin-Passcode':c}:{};}async function call(path,opt={}){const r=await fetch(path,{cache:'no-store',...opt,headers:{...(opt.headers||{}),...hdr()}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(typeof d==='object'?(d.detail||JSON.stringify(d)):d||('HTTP '+r.status));return d}function show(title,data){last={title,time:new Date().toISOString(),data};$('output').textContent=title+'\n\n'+JSON.stringify(data,null,2)}function renderServices(){$('services').innerHTML=modules.map((m,i)=>`<button class="service ${i===current?'active':''}" onclick="selectService(${i})"><h3>${m[0]}</h3><p>${m[1]}</p><span class="badge ${m[2]?'live':''}">${m[2]?'ACTIVE WORKSPACE':'REGISTERED'}</span></button>`).join('')}function selectService(i){current=i;renderServices();$('moduleTitle').textContent=modules[i][0];if(i===0)renderUAM();else{$('tabs').innerHTML='';$('form').innerHTML=`<div class="note">${modules[i][0]} is registered. User & Access Management is being completed first so all later platform modules inherit identity and permission controls.</div>`;$('note').textContent='';show(modules[i][0],{status:'registered',implementation:'next',depends_on:'User & Access Management'})}}const tabs=['Login','Session','Profile','Access Policy','Identity Methods'];function renderUAM(){$('tabs').innerHTML=tabs.map((x,i)=>`<button class="tab ${tab===i?'active':''}" onclick="openTab(${i})">${x}</button>`).join('');let h='';if(tab===0)h=`<div class="field"><label>Email</label><input id="email" type="email" placeholder="user@example.com"></div><div class="field"><label>Password</label><input id="password" type="password"></div><div class="actions"><button class="btn success" onclick="login()">Login</button><button class="btn" onclick="signup()">Create Account</button></div>`;if(tab===1)h=`<div class="field"><label>Session token</label><input id="token" placeholder="Paste session token"></div><div class="actions"><button class="btn" onclick="sessionCheck()">Verify Session</button><button class="btn danger" onclick="logout()">Logout</button></div>`;if(tab===2)h=`<div class="field"><label>Session token</label><input id="token" placeholder="Session token"></div><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Address</label><input id="address"></div><button class="btn success" onclick="profile()">Update Profile</button>`;if(tab===3)h=`<div class="field"><label>Role</label><select id="role"><option>viewer</option><option>operator</option><option>manager</option><option>administrator</option></select></div><div class="field"><label>Attribute / scope</label><input id="scope" placeholder="warehouse:main, state:central"></div><button class="btn" onclick="policy()">Evaluate Policy</button>`;if(tab===4)h=`<div class="field"><label>Identity method</label><select id="method"><option>Password / Session Token</option><option>SSO / OIDC</option><option>Biometric Device Assertion</option></select></div><button class="btn" onclick="identity()">Check Readiness</button>`;$('form').innerHTML=h;$('note').textContent=tab===4?'Password/session authentication is live. SSO/OIDC and biometric verification require an external identity provider or trusted biometric device integration.':''}function openTab(i){tab=i;renderUAM()}async function login(){try{const d=await call('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});if(d.token)localStorage.setItem('ugamap_platform_token',d.token);$('mSession').textContent='ACTIVE';show('Login successful',{user:{id:d.id,name:d.name,email:d.email},session_token_saved_locally:true})}catch(e){show('Login failed',{error:e.message})}}async function signup(){try{const d=await call('/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:($('email').value.split('@')[0]||'UGAMAP User'),email:$('email').value,password:$('password').value,phone:'',address:''})});if(d.token)localStorage.setItem('ugamap_platform_token',d.token);$('mSession').textContent='ACTIVE';show('Account created',{id:d.id,name:d.name,email:d.email})}catch(e){show('Account creation failed',{error:e.message})}}function token(){return ($('token')?.value||localStorage.getItem('ugamap_platform_token')||'').trim()}async function sessionCheck(){try{const d=await call('/auth/me?token='+encodeURIComponent(token()));$('mSession').textContent='ACTIVE';show('Session verified',d)}catch(e){$('mSession').textContent='INVALID';show('Session verification failed',{error:e.message})}}async function logout(){try{const fd=new FormData();fd.append('token',token());const d=await call('/auth/logout',{method:'POST',body:fd});localStorage.removeItem('ugamap_platform_token');$('mSession').textContent='NONE';show('Logout',d)}catch(e){show('Logout failed',{error:e.message})}}async function profile(){try{const d=await call('/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token(),name:$('name').value,phone:$('phone').value,address:$('address').value})});show('Profile updated',d)}catch(e){show('Profile update failed',{error:e.message})}}function policy(){const role=$('role').value,scope=$('scope').value.trim(),permissions={viewer:['read'],operator:['read','operate'],manager:['read','operate','approve'],administrator:['read','operate','approve','admin']}[role];show('RBAC / ABAC policy evaluation',{role,attributes:scope||'none',permissions,decision:'policy-preview',enforcement:'Protected backend endpoints continue to enforce their own permission checks.'})}function identity(){const m=$('method').value;if(m==='Password / Session Token')show('Identity readiness',{method:m,status:'live',backend:['/auth/login','/auth/me','/auth/logout','/profile']});else show('Identity readiness',{method:m,status:'integration-required',live:false,requirement:m.startsWith('SSO')?'OIDC/SAML identity provider configuration':'trusted biometric device/passkey assertion service'})}async function refreshStatus(){try{await call('/health');$('networkState').textContent='NETWORK ONLINE';$('networkState').style.color='var(--good)';$('mApi').textContent='ONLINE'}catch(e){$('networkState').textContent='NETWORK ERROR';$('networkState').style.color='var(--bad)';$('mApi').textContent='ERROR'}try{const t=localStorage.getItem('ugamap_platform_token');if(t){await call('/auth/me?token='+encodeURIComponent(t));$('mSession').textContent='ACTIVE'}else $('mSession').textContent='NONE'}catch{$('mSession').textContent='INVALID'}}function exportJSON(){const b=new Blob([JSON.stringify(last,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ugamap-platform-services.json';a.click();URL.revokeObjectURL(a.href)}renderServices();renderUAM();refreshStatus();</script></body></html>
