<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGAMAP Platform Services</title><style>:root{--bg:#07131c;--card:#10283a;--line:#2b5877;--text:#f4f8fb;--muted:#9ab0bf;--good:#42d392;--warn:#f5bf54;--bad:#ff7474;--blue:#5aa7ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07131c,#0a1b27);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(7,19,28,.96);border-bottom:1px solid #173247;padding:12px 14px;display:flex;gap:10px;align-items:center}.back,.btn,.tab,.service{border:0;border-radius:10px;color:#fff;font-weight:800}.back,.btn{padding:10px 12px;background:#194d70}.back{background:#132b3c}.brand{flex:1}.brand h1{font-size:18px;margin:0}.brand p,.note{font-size:10px;color:var(--muted);line-height:1.45}.state{font-size:10px;color:var(--warn)}main{max-width:1200px;margin:auto;padding:14px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}.toolbar input,.field input,.field select,.field textarea{width:100%;background:#091a25;border:1px solid #24465c;color:#fff;border-radius:10px;padding:10px}.tools,.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap}.panel{background:rgba(14,36,52,.95);border:1px solid #21455d;border-radius:16px;padding:13px;margin-bottom:12px}.panel h2{font-size:15px;margin:0 0 10px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.service{border:1px solid var(--line);background:linear-gradient(180deg,#16344b,#0f293b);padding:12px;text-align:left;min-height:140px}.service.active{outline:2px solid var(--blue)}.service h3{font-size:14px;margin:0 0 6px}.service p{font-size:10px;line-height:1.4;color:var(--muted);margin:0}.badge{display:inline-block;margin-top:8px;font-size:9px;padding:4px 7px;border-radius:999px;background:#123c2d;color:#8af0bd}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tab{border:1px solid #2c5874;background:#102a3c;padding:9px;font-size:11px}.tab.active{background:#1e5c83}.field{display:grid;gap:7px;margin-bottom:8px}.field label{font-size:10px;color:var(--muted)}.output{min-height:340px;background:#061019;border:1px solid #1e3c50;border-radius:12px;padding:11px;white-space:pre-wrap;word-break:break-word;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#0a1c28;border:1px solid #1d4056;border-radius:11px;padding:10px}.metric b{display:block;font-size:16px}.metric span{font-size:9px;color:var(--muted)}.danger{background:#712d35}.success{background:#176542}@media(max-width:800px){.services{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}@media(max-width:480px){.services{grid-template-columns:1fr}}</style></head><body><header><button class="back" onclick="history.back()">‹</button><div class="brand"><h1>Platform Services</h1><p>UGAMAP shared platform infrastructure</p></div><div class="state" id="networkState">CHECKING</div></header><main><div class="toolbar"><input id="access" type="password" placeholder="Staff/admin access code"><div class="tools"><button class="btn" onclick="refreshStatus()">Refresh</button><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="exportJSON()">Export</button></div></div><section class="panel"><h2>Platform Service Registry</h2><div class="services" id="services"></div></section><section class="panel"><div class="grid4"><div class="metric"><b id="mApi">—</b><span>API HEALTH</span></div><div class="metric"><b id="mSession">—</b><span>USER SESSION</span></div><div class="metric"><b id="mWorkflow">—</b><span>ACTIVE WORKFLOWS</span></div><div class="metric"><b>9</b><span>PLATFORM SERVICES</span></div></div></section><section class="panel workspace"><div><h2 id="moduleTitle"></h2><div class="tabs" id="tabs"></div><div id="form"></div><div class="note" id="note"></div></div><div><h2>Platform Output</h2><div class="output" id="output">Platform Services ready.</div></div></section></main><script>const modules=[['User & Access Management','Login visibility controls, registration, password changes/resets, profile management, roles, permissions and attribute policy.'],['Workflow Engine','Persistent multi-step processes, approval chains, task routing, deadlines and live status tracking.'],['Notification Service','Persistent email/SMS/push/in-app queues, templates and scheduled delivery records.'],['Document Management','Stored files, search, metadata, version history and controlled retrieval foundation.'],['Audit & Compliance','Persistent user/system action history for security review and compliance evidence.'],['Master Data Management','Canonical records linking disconnected systems with standardized core data.'],['API Management','Developer access credentials, API policies, rate-limit definitions and usage/security controls.'],['Monitoring Service','Infrastructure/data health snapshots, performance history and technical alert foundation.'],['Feature Management','Persistent feature flags, user-targeted rollout percentages, A/B variants and evaluation.']];let current=0,tab=0,last={};const $=x=>document.getElementById(x);function hdr(){const c=$('access').value.trim();return c?{'X-Access-Code':c,'X-Admin-Passcode':c}:{}}async function call(path,opt={}){const r=await fetch(path,{cache:'no-store',...opt,headers:{...(opt.headers||{}),...hdr()}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(typeof d==='object'?(typeof d.detail==='object'?JSON.stringify(d.detail):d.detail||JSON.stringify(d)):d||('HTTP '+r.status));return d}function show(title,data){last={title,time:new Date().toISOString(),data};$('output').textContent=title+'\n\n'+JSON.stringify(data,null,2)}function renderServices(){$('services').innerHTML=modules.map((m,i)=>`<button class="service ${i===current?'active':''}" onclick="selectService(${i})"><h3>${m[0]}</h3><p>${m[1]}</p><span class="badge">BACKEND READY</span></button>`).join('')}function selectService(i){current=i;tab=0;renderServices();$('moduleTitle').textContent=modules[i][0];if(i===0)renderUAM();else if(i===1)renderWorkflow();else{$('tabs').innerHTML='';$('form').innerHTML=`<div class="note">${modules[i][1]}</div>`;$('note').textContent='Backend capability is registered. We are finishing the workspaces one service at a time.';show(modules[i][0],{status:'backend-ready',capability:modules[i][1]})}}function field(label,id,type='text',ph=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" placeholder="${ph}"></div>`}function tabs(names,fn){$('tabs').innerHTML=names.map((x,i)=>`<button class="tab ${tab===i?'active':''}" onclick="${fn}(${i})">${x}</button>`).join('')}function renderUAM(){tabs(['Login / Register','Session / Profile','Password','Roles / Permissions','Identity'], 'openUAM');let h='';if(tab===0)h=field('Name','name')+field('Email','email','email','user@example.com')+field('Password','password','password')+`<div class="actions"><button class="btn success" onclick="login()">Login</button><button class="btn" onclick="signup()">Register</button></div>`;if(tab===1)h=field('Session token','token')+field('Name','pname')+field('Phone','phone')+field('Address','address')+`<div class="actions"><button class="btn" onclick="sessionCheck()">Verify</button><button class="btn success" onclick="profile()">Update Profile</button><button class="btn danger" onclick="logout()">Logout</button></div>`;if(tab===2)h=field('Session token','token')+field('Current password','currentPassword','password')+field('New password','newPassword','password')+`<button class="btn success" onclick="changePassword()">Change Password</button><hr>`+field('User email for admin reset','resetEmail','email')+field('New password','resetPassword','password')+`<button class="btn danger" onclick="adminReset()">Admin Reset Password</button>`;if(tab===3)h=field('Role name','roleName')+field('Permissions (comma separated)','permissions')+field('Attributes JSON','attributes','text','{"warehouse":"main"}')+`<button class="btn" onclick="createRole()">Create Role</button><hr>`+field('User ID','userId')+field('Role ID','roleId')+`<div class="actions"><button class="btn success" onclick="assignRole()">Assign Role</button><button class="btn" onclick="effectiveAccess()">Effective Access</button><button class="btn" onclick="listRoles()">List Roles</button></div>`;if(tab===4)h=`<div class="note">Live now: password/session authentication. SSO/OIDC and biometric assertions require trusted external identity providers/devices before they can be enforced.</div>`;$('form').innerHTML=h;$('note').textContent='Roles and platform permissions are persisted. Existing protected APIs also retain their current server-side permission checks.'}function openUAM(i){tab=i;renderUAM()}function token(){return ($('token')?.value||localStorage.getItem('ugamap_platform_token')||'').trim()}async function login(){try{const d=await call('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});localStorage.setItem('ugamap_platform_token',d.token);$('mSession').textContent='ACTIVE';show('Login',d)}catch(e){show('Login failed',{error:e.message})}}async function signup(){try{const d=await call('/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value,phone:'',address:''})});localStorage.setItem('ugamap_platform_token',d.token);show('Registration',d)}catch(e){show('Registration failed',{error:e.message})}}async function sessionCheck(){try{show('Session',await call('/auth/me?token='+encodeURIComponent(token())))}catch(e){show('Session failed',{error:e.message})}}async function profile(){try{show('Profile',await call('/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token(),name:$('pname').value,phone:$('phone').value,address:$('address').value})}))}catch(e){show('Profile failed',{error:e.message})}}async function logout(){const f=new FormData();f.append('token',token());try{show('Logout',await call('/auth/logout',{method:'POST',body:f}));localStorage.removeItem('ugamap_platform_token')}catch(e){show('Logout failed',{error:e.message})}}async function changePassword(){try{show('Password changed',await call('/auth/password/change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token(),current_password:$('currentPassword').value,new_password:$('newPassword').value})}));localStorage.removeItem('ugamap_platform_token')}catch(e){show('Password change failed',{error:e.message})}}async function adminReset(){try{show('Password reset',await call('/auth/password/admin-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('resetEmail').value,new_password:$('resetPassword').value})}))}catch(e){show('Password reset failed',{error:e.message})}}async function createRole(){try{let a={};try{a=JSON.parse($('attributes').value||'{}')}catch{}show('Role created',await call('/platform/access/roles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('roleName').value,permissions:$('permissions').value.split(',').map(x=>x.trim()).filter(Boolean),attributes:a})}))}catch(e){show('Role failed',{error:e.message})}}async function listRoles(){try{show('Roles',await call('/platform/access/roles'))}catch(e){show('Roles failed',{error:e.message})}}async function assignRole(){try{show('Role assigned',await call('/platform/access/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:$('userId').value,role_id:$('roleId').value})}))}catch(e){show('Assign failed',{error:e.message})}}async function effectiveAccess(){try{show('Effective access',await call('/platform/access/effective/'+encodeURIComponent($('userId').value)))}catch(e){show('Access failed',{error:e.message})}}function renderWorkflow(){tabs(['Create Workflow','Workflow Queue','Advance / Approve','Workflow Detail'],'openWorkflow');let h='';if(tab===0)h=field('Workflow name','wfName')+field('Steps (comma separated)','wfSteps','text','submitted, manager approval, execution, completed')+field('Assignee / system','wfAssignee')+field('Due in hours','wfDue','number','24')+field('Context JSON','wfContext','text','{"order":"UG-ORD..."}')+`<button class="btn success" onclick="createWorkflow()">Create Workflow</button>`;if(tab===1)h=`<div class="actions"><button class="btn" onclick="loadWorkflows()">Load All</button><button class="btn" onclick="loadWorkflows('running')">Running</button><button class="btn" onclick="loadWorkflows('completed')">Completed</button></div>`;if(tab===2)h=field('Workflow ID','wfId')+`<div class="field"><label>Action</label><select id="wfAction"><option value="complete_step">Complete Current Step</option><option value="approve">Approve</option><option value="reject">Reject</option><option value="cancel">Cancel</option></select></div>`+field('Actor','wfActor','text','manager')+field('Detail / approval note','wfDetail')+`<button class="btn success" onclick="advanceWorkflow()">Apply Workflow Action</button>`;if(tab===3)h=field('Workflow ID','wfId')+`<button class="btn" onclick="workflowDetail()">Load Full History</button>`;$('form').innerHTML=h;$('note').textContent='Workflow records persist in the shared database, route by assignee, maintain history, and report overdue processes from their due_at deadline.'}function openWorkflow(i){tab=i;renderWorkflow()}async function createWorkflow(){try{let ctx={};try{ctx=JSON.parse($('wfContext').value||'{}')}catch{}const hrs=Number($('wfDue').value||0);const due=hrs?Date.now()/1000+hrs*3600:null;show('Workflow created',await call('/platform/workflows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('wfName').value,steps:$('wfSteps').value.split(',').map(x=>x.trim()).filter(Boolean),assignee:$('wfAssignee').value,due_at:due,context:ctx})}));loadWorkflowMetric()}catch(e){show('Workflow creation failed',{error:e.message})}}async function loadWorkflows(status=''){try{const d=await call('/platform/workflows'+(status?'?status='+encodeURIComponent(status):''));show('Workflow queue',d);$('mWorkflow').textContent=(d.results||[]).filter(x=>x.status==='running').length}catch(e){show('Workflow queue failed',{error:e.message})}}async function advanceWorkflow(){try{show('Workflow action',await call('/platform/workflows/'+encodeURIComponent($('wfId').value)+'/advance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:$('wfAction').value,actor:$('wfActor').value,detail:$('wfDetail').value})}));loadWorkflowMetric()}catch(e){show('Workflow action failed',{error:e.message})}}async function workflowDetail(){try{show('Workflow detail',await call('/platform/workflows/'+encodeURIComponent($('wfId').value)))}catch(e){show('Workflow detail failed',{error:e.message})}}async function loadWorkflowMetric(){try{const d=await call('/platform/workflows?status=running');$('mWorkflow').textContent=(d.results||[]).length}catch{$('mWorkflow').textContent='—'}}async function refreshStatus(){try{await call('/health');$('networkState').textContent='NETWORK ONLINE';$('networkState').style.color='var(--good)';$('mApi').textContent='ONLINE'}catch{$('networkState').textContent='NETWORK ERROR';$('mApi').textContent='ERROR'}try{const t=localStorage.getItem('ugamap_platform_token');if(t){await call('/auth/me?token='+encodeURIComponent(t));$('mSession').textContent='ACTIVE'}else $('mSession').textContent='NONE'}catch{$('mSession').textContent='INVALID'}loadWorkflowMetric()}function exportJSON(){const b=new Blob([JSON.stringify(last,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ugamap-platform-services.json';a.click();URL.revokeObjectURL(a.href)}renderServices();selectService(0);refreshStatus();</script></body></html>
