<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAMAP Platform Services</title><style>:root{--bg:#07131c;--panel:#0e2434;--line:#21455d;--text:#f4f8fb;--muted:#9ab0bf;--blue:#1e5c83;--green:#176542;--red:#712d35}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07131c,#0a1b27);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}header{position:sticky;top:0;z-index:10;background:#07131cf5;border-bottom:1px solid #173247;padding:12px 14px;display:flex;gap:10px;align-items:center}.btn,.tab,.service{border:0;border-radius:10px;color:#fff;font-weight:800;padding:10px 12px;background:#194d70}.brand{flex:1}.brand h1{margin:0;font-size:18px}.brand p,.note{font-size:10px;color:var(--muted)}main{max-width:1200px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.field input,.field select,.field textarea{width:100%;background:#091a25;border:1px solid #24465c;color:#fff;border-radius:10px;padding:10px}.toolbar input{flex:1;min-width:220px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.service{text-align:left;min-height:130px;background:linear-gradient(#16344b,#0f293b);border:1px solid #2b5877}.service.active{outline:2px solid #5aa7ff}.service h3{font-size:14px;margin:0 0 6px}.service p{font-size:10px;color:var(--muted);margin:0}.badge{display:inline-block;margin-top:8px;font-size:9px;background:#123c2d;color:#8af0bd;padding:4px 7px;border-radius:999px}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.tab{font-size:11px;background:#102a3c;border:1px solid #2c5874}.tab.active{background:var(--blue)}.field{display:grid;gap:5px;margin-bottom:8px}.field label{font-size:10px;color:var(--muted)}.output{min-height:420px;background:#061019;border:1px solid #1e3c50;border-radius:12px;padding:11px;white-space:pre-wrap;word-break:break-word;font:11px/1.45 ui-monospace,Menlo,monospace}.success{background:var(--green)}.danger{background:var(--red)}@media(max-width:800px){.services{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}}@media(max-width:480px){.services{grid-template-columns:1fr}}</style></head><body><header><button class="btn" onclick="history.back()">‹</button><div class="brand"><h1>Platform Services</h1><p>UGAMAP shared infrastructure, governance and operations</p></div><span id="state" class="note">CHECKING</span></header><main><div class="toolbar"><input id="access" type="password" placeholder="Staff/admin access code"><button class="btn" onclick="health()">Refresh</button><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="exportJSON()">Export</button></div><section class="panel"><div class="services" id="services"></div></section><section class="panel workspace" id="platformWorkspace"><div><h2 id="title"></h2><div class="tabs" id="tabs"></div><div id="form"></div><div id="note" class="note"></div></div><div><h2>Platform Output</h2><div id="output" class="output">Platform Services ready.</div></div></section></main><script>const mods=[['User & Access Management','Registration, login, profiles, roles and permissions.'],['Workflow Engine','Multi-step processes, approvals, routing and deadlines.'],['Notification Service','Templates, scheduling, queues and delivery tracking.'],['Document Management','Storage, search, retrieval, versions and permissions.'],['Audit & Compliance','Audit history, evidence, controls, reviews and anomaly checks.'],['Master Data Management','Canonical records, source links, quality and duplicate control.'],['API Management','Products, developer keys, policies, authorization and usage.'],['Monitoring Service','Health, performance samples, alerts and incidents.'],['Feature Management','Flags, targeting, canary rollout and A/B variants.']];let cur=0,tab=0,last={};const $=x=>document.getElementById(x);function hdr(){let c=$('access').value.trim();return c?{'X-Access-Code':c,'X-Admin-Passcode':c}:{}}async function call(path,opt={}){let r=await fetch(path,{cache:'no-store',...opt,headers:{...(opt.headers||{}),...hdr()}}),t=await r.text(),d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error((d&&d.detail)||t||('HTTP '+r.status));return d}function show(t,d){last={title:t,time:new Date().toISOString(),data:d};$('output').textContent=t+'\n\n'+JSON.stringify(d,null,2)}function field(l,id,type='text',ph=''){return `<div class="field"><label>${l}</label><input id="${id}" type="${type}" placeholder="${ph}"></div>`}function area(l,id){return `<div class="field"><label>${l}</label><textarea id="${id}" rows="4"></textarea></div>`}function sel(l,id,opts){return `<div class="field"><label>${l}</label><select id="${id}">${opts.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div>`}function tabs(a,fn){$('tabs').innerHTML=a.map((x,i)=>`<button class="tab ${tab===i?'active':''}" onclick="${fn}(${i})">${x}</button>`).join('')}function render(){$('services').innerHTML=mods.map((m,i)=>`<button class="service ${i===cur?'active':''}" onclick="selectModule(${i})"><h3>${m[0]}</h3><p>${m[1]}</p><span class="badge">OPEN WORKSPACE ›</span></button>`).join('')}function selectModule(i){cur=i;tab=0;render();$('title').textContent=mods[i][0];[uam,wf,notify,docs,auditUI,mdmUI,apiUI,monitorUI,featureUI][i]();if(window.innerWidth<=800){setTimeout(()=>{let w=$('platformWorkspace');if(w)w.scrollIntoView({behavior:'smooth',block:'start'})},40)}}function json(id,def={}){try{return JSON.parse($(id).value||JSON.stringify(def))}catch{return def}}
function openU(i){tab=i;uam()}function uam(){tabs(['Login/Register','Profile','Roles'],'openU');let h='';if(tab===0)h=field('Name','name')+field('Email','email','email')+field('Password','password','password')+'<div class="actions"><button class="btn success" onclick="login()">Login</button><button class="btn" onclick="signup()">Register</button></div>';if(tab===1)h=field('Session token','token')+field('Name','pname')+field('Phone','phone')+field('Address','address')+'<button class="btn success" onclick="profile()">Update Profile</button>';if(tab===2)h=field('Role name','role')+field('Permissions comma separated','perms')+'<div class="actions"><button class="btn" onclick="roleCreate()">Create Role</button><button class="btn" onclick="roleList()">List Roles</button></div>';$('form').innerHTML=h;$('note').textContent='Password/session authentication is live. SSO and biometrics still require trusted external identity/device integrations.'}async function login(){try{let d=await call('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});localStorage.setItem('ugamap_platform_token',d.token);show('Login',d)}catch(e){show('Login failed',{error:e.message})}}async function signup(){try{show('Registration',await call('/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value,phone:'',address:''})}))}catch(e){show('Registration failed',{error:e.message})}}async function profile(){try{show('Profile',await call('/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:$('token').value||localStorage.getItem('ugamap_platform_token')||'',name:$('pname').value,phone:$('phone').value,address:$('address').value})}))}catch(e){show('Profile failed',{error:e.message})}}async function roleCreate(){try{show('Role',await call('/platform/access/roles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('role').value,permissions:$('perms').value.split(',').map(x=>x.trim()).filter(Boolean),attributes:{}})}))}catch(e){show('Role failed',{error:e.message})}}async function roleList(){try{show('Roles',await call('/platform/access/roles'))}catch(e){show('Roles failed',{error:e.message})}}
function openW(i){tab=i;wf()}function wf(){tabs(['Create','Queue','Advance','Detail'],'openW');let h='';if(tab===0)h=field('Name','wname')+field('Steps comma separated','steps')+field('Assignee','assignee')+field('Due in hours','due','number')+'<button class="btn success" onclick="wfCreate()">Create Workflow</button>';if(tab===1)h='<button class="btn" onclick="wfList()">Load Workflows</button>';if(tab===2)h=field('Workflow ID','wid')+sel('Action','wa',['complete_step','approve','reject','cancel'])+field('Actor','actor')+'<button class="btn success" onclick="wfAdvance()">Apply</button>';if(tab===3)h=field('Workflow ID','wid')+'<button class="btn" onclick="wfDetail()">Load Detail</button>';$('form').innerHTML=h;$('note').textContent='Persistent routing, approvals, deadlines and workflow history.'}async function wfCreate(){try{let hrs=Number($('due').value||0);show('Workflow',await call('/platform/workflows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('wname').value,steps:$('steps').value.split(',').map(x=>x.trim()).filter(Boolean),assignee:$('assignee').value,due_at:hrs?Date.now()/1000+hrs*3600:null,context:{}})}))}catch(e){show('Workflow failed',{error:e.message})}}async function wfList(){try{show('Workflows',await call('/platform/workflows'))}catch(e){show('Workflows failed',{error:e.message})}}async function wfAdvance(){try{show('Workflow action',await call('/platform/workflows/'+encodeURIComponent($('wid').value)+'/advance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:$('wa').value,actor:$('actor').value,detail:''})}))}catch(e){show('Action failed',{error:e.message})}}async function wfDetail(){try{show('Workflow detail',await call('/platform/workflows/'+encodeURIComponent($('wid').value)))}catch(e){show('Detail failed',{error:e.message})}}
function openN(i){tab=i;notify()}function notify(){tabs(['Templates','Compose','Queue','Control'],'openN');let h='';if(tab===0)h=field('Template name','tn')+sel('Channel','tc',['in-app','email','sms','push'])+field('Subject','ts')+area('Body','tb')+'<button class="btn success" onclick="tpl()">Save Template</button>';if(tab===1)h=field('Recipient','nr')+sel('Channel','nc',['in-app','email','sms','push'])+field('Template ID optional','nt')+field('Subject','ns')+area('Body','nb')+'<button class="btn success" onclick="sendN()">Queue</button>';if(tab===2)h='<button class="btn" onclick="listN()">Load Queue</button>';if(tab===3)h=field('Notification ID','nid')+'<div class="actions"><button class="btn" onclick="retryN()">Retry</button><button class="btn success" onclick="processN()">Process Due</button></div>';$('form').innerHTML=h;$('note').textContent='In-app delivery is internal. Email, SMS and push require external delivery providers.'}async function tpl(){try{show('Template',await call('/platform/notifications/templates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('tn').value,channel:$('tc').value,subject:$('ts').value,body:$('tb').value})}))}catch(e){show('Template failed',{error:e.message})}}async function sendN(){try{show('Notification',await call('/platform/notifications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipient:$('nr').value,channel:$('nc').value,template_id:$('nt').value,subject:$('ns').value,body:$('nb').value,scheduled_at:null})}))}catch(e){show('Notification failed',{error:e.message})}}async function listN(){try{show('Notifications',await call('/platform/notifications'))}catch(e){show('Queue failed',{error:e.message})}}async function retryN(){try{show('Retry',await call('/platform/notifications/'+encodeURIComponent($('nid').value)+'/retry',{method:'POST'}))}catch(e){show('Retry failed',{error:e.message})}}async function processN(){try{show('Processed',await call('/platf function openD(i){tab=i;docs()}function docs(){tabs(['Upload','Search','Versions','Permissions','Download/Delete'],'openD');let h='';if(tab===0)h='<div class="field"><label>File</label><input id="df" type="file"></div>'+field('Existing Document ID optional','did')+field('Tags','dtags')+field('Owner','downer')+'<button class="btn success" onclick="uploadDoc()">Upload Document</button>';if(tab===1)h=field('Search','dq')+'<button class="btn" onclick="searchDoc()">Search Documents</button>';if(tab===2)h=field('Document ID','did')+'<button class="btn" onclick="docVersions()">Version History</button>';if(tab===3)h=field('Document ID','did')+field('Subject','subject')+'<button class="btn" onclick="docPerm()">Save Permission</button>';if(tab===4)h=field('Document ID','did')+'<div class="actions"><button class="btn" onclick="downloadDoc()">Download</button><button class="btn danger" onclick="deleteDoc()">Delete</button></div>';$('form').innerHTML=h;$('note').textContent='Server-side storage, search, retrieval, versioning and document permission records.'}async function uploadDoc(){try{let f=$('df').files[0];if(!f)throw new Error('Choose a file');let fd=new FormData();fd.append('file',f);fd.append('tags',$('dtags').value);fd.append('owner',$('downer').value);fd.append('document_id',$('did').value);show('Document uploaded',await call('/platform/documents/upload',{method:'POST',body:fd}))}catch(e){show('Upload failed',{error:e.message})}}async function searchDoc(){try{show('Document search',await call('/platform/documents?q='+encodeURIComponent($('dq').value)))}catch(e){show('Search failed',{error:e.message})}}async function docVersions(){try{show('Versions',await call('/platform/documents/'+encodeURIComponent($('did').value)+'/versions'))}catch(e){show('Versions failed',{error:e.message})}}async function docPerm(){try{show('Permission',await call('/platform/documents/'+encodeURIComponent($('did').value)+'/permissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:$('subject').value||'all',can_view:true,can_download:true,can_edit:false,can_delete:false})}))}catch(e){show('Permission failed',{error:e.message})}}function downloadDoc(){window.open('/platform/documents/'+encodeURIComponent($('did').value)+'/download','_blank')}async function deleteDoc(){try{show('Delete',await call('/platform/documents/'+encodeURIComponent($('did').value),{method:'DELETE'}))}catch(e){show('Delete failed',{error:e.message})}}
function openA(i){tab=i;auditUI()}function auditUI(){tabs(['Event Log','Snapshot','Controls','Reviews','Anomalies'],'openA');let h='';if(tab===0)h=field('Actor','aa')+field('Action','ac')+'<button class="btn" onclick="auditEvents()">Search Audit Log</button>';if(tab===1)h='<div class="actions"><button class="btn success" onclick="auditSnapshot()">Create Snapshot</button><button class="btn" onclick="auditSnapshots()">List Snapshots</button></div>';if(tab===2)h=field('Framework','cf','text','UGAMAP')+field('Control key','ck')+field('Title','ct')+sel('Status','cs',['review','passed','compliant','failed','open','closed'])+field('Owner','co')+area('Evidence','ce')+'<div class="actions"><button class="btn success" onclick="saveControl()">Save</button><button class="btn" onclick="listControls()">List</button></div>';if(tab===3)h=field('Framework','rf','text','UGAMAP')+area('Summary','rs')+sel('Status','rst',['open','completed','closed'])+'<div class="actions"><button class="btn success" onclick="saveReview()">Record</button><button class="btn" onclick="listReviews()">List</button></div>';if(tab===4)h='<div class="actions"><button class="btn" onclick="auditAnomalies()">Detect Anomalies</button><button class="btn" onclick="auditSummary()">Summary</button></div>';$('form').innerHTML=h;$('note').textContent='SHA-256 evidence snapshots are tamper-evident, not immutable WORM storage or legal certification.'}async function auditEvents(){try{show('Audit events',await call('/platform/audit/events?actor='+encodeURIComponent($('aa').value)+'&action='+encodeURIComponent($('ac').value)))}catch(e){show('Audit failed',{error:e.message})}}async function auditSnapshot(){try{show('Snapshot',await call('/platform/audit/snapshot',{method:'POST'}))}catch(e){show('Snapshot failed',{error:e.message})}}async function auditSnapshots(){try{show('Snapshots',await call('/platform/audit/snapshots'))}catch(e){show('Snapshots failed',{error:e.message})}}async function saveControl(){try{show('Control',await call('/platform/audit/controls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({framework:$('cf').value||'UGAMAP',control_key:$('ck').value,title:$('ct').value,status:$('cs').value,evidence:$('ce').value,owner:$('co').value,review_due_at:null})}))}catch(e){show('Control failed',{error:e.message})}}async function listControls(){try{show('Controls',await call('/platform/audit/controls'))}catch(e){show('Controls failed',{error:e.message})}}async function saveReview(){try{show('Review',await call('/platform/audit/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({framework:$('rf').value||'UGAMAP',summary:$('rs').value,status:$('rst').value})}))}catch(e){show('Review failed',{error:e.message})}}async function listReviews(){try{show('Reviews',await call('/platform/audit/reviews'))}catch(e){show('Reviews failed',{error:e.message})}}async function auditAnomalies(){try{show('Anomalies',await call('/platform/audit/anomalies'))}catch(e){show('Anomaly check failed',{error:e.message})}}async function auditSummary(){try{show('Audit summary',await call('/platform/audit/summary'))}catch(e){show('Summary failed',{error:e.message})}}
function openM(i){tab=i;mdmUI()}function mdmUI(){tabs(['Canonical Record','Search / Detail','Source Link','Duplicates / Merge','Quality'],'openM');let h='';if(tab===0)h=field('Entity type','me','text','customer')+field('Record key','mk')+field('Source system','ms','text','manual')+field('Source ID','msid')+field('Priority','mp','number','100')+area('Canonical JSON data','md')+'<button class="btn success" onclick="mdmSave()">Save Master Record</button>';if(tab===1)h=field('Entity type','me','text','customer')+field('Search','mq')+field('Record key for detail','mk')+'<div class="actions"><button class="btn" onclick="mdmSearch()">Search</button><button class="btn" onclick="mdmDetail()">Detail</button></div>';if(tab===2)h=field('Entity type','me')+field('Record key','mk')+field('Source system','ms')+field('Source ID','msid')+field('Priority','mp','number','100')+'<button class="btn success" onclick="mdmLink()">Link Source</button>';if(tab===3)h=field('Entity type','me')+field('Canonical key','mk')+field('Duplicate keys comma separated','mdup')+'<div class="actions"><button class="btn" onclick="mdmDuplicates()">Find Duplicates</button><button class="btn success" onclick="mdmMerge()">Merge to Canonical</button></div>';if(tab===4)h=field('Entity type optional','me')+'<button class="btn" onclick="mdmQuality()">Load Data Quality</button>';$('form').innerHTML=h;$('note').textContent='Canonical records provide one authoritative master record while preserving source links, aliases, history and quality scores.'}async function mdmSave(){try{show('Master record',await call('/platform/mdm-runtime/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity_type:$('me').value,record_key:$('mk').value,data:json('md',{}),source:$('ms').value||'manual',source_id:$('msid').value,priority:Number($('mp').value||100),changed_by:'staff'})}))}catch(e){show('MDM save failed',{error:e.message})}}async function mdmSearch(){try{show('Master records',await call(
