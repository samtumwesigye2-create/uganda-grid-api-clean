<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGAMAP Warehouse Control</title><style>:root{--bg:#07131d;--card:#0d2532;--line:#23495a;--text:#f5f7fb;--muted:#9db1bd;--green:#20d49c;--red:#ef6464;--amber:#f1b454}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08131f,#061019);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:14px;background:rgba(7,19,29,.96);border-bottom:1px solid #173240}button,input,select{font:inherit}button{cursor:pointer}.back,.btn{border:1px solid var(--line);background:#102635;color:#fff;border-radius:10px;padding:10px 12px}.primary{background:#126858;border-color:#1c8a73}.danger{background:#6f2d33}.wrap{max-width:1150px;margin:auto;padding:14px}.top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;background:#091a24;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.metric b{font-size:24px;display:block}.metric span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card h3{margin:0 0 10px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.status{font-size:12px;color:var(--muted);min-height:18px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px;border-bottom:1px solid #183743;text-align:left;white-space:nowrap}.low{color:var(--amber)}.ok{color:var(--green)}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><header><button class="back" onclick="history.back()">‹</button><div><strong>Warehouse Control System</strong><div style="font-size:11px;color:var(--muted)">Live inventory, stock movement and warehouse control</div></div></header><main class="wrap"><div class="top"><div class="field"><label>Staff / Admin access code</label><input id="code" type="password" placeholder="Access code"></div><button class="btn primary" onclick="refreshAll()">Connect & Refresh</button></div><div class="metrics"><div class="metric"><b id="mWh">—</b><span>Warehouses</span></div><div class="metric"><b id="mSku">—</b><span>SKUs</span></div><div class="metric"><b id="mUnits">—</b><span>Total units</span></div><div class="metric"><b id="mLow">—</b><span>Low-stock SKUs</span></div></div><div class="grid"><section class="card"><h3>Create Product</h3><div class="row"><div class="field"><label>SKU</label><input id="pSku"></div><div class="field"><label>Name</label><input id="pName"></div></div><div class="row"><div class="field"><label>Unit cost</label><input id="pCost" type="number" min="0" value="0"></div><div class="field"><label>Initial quantity</label><input id="pQty" type="number" min="0" value="0"></div></div><div class="row"><div class="field"><label>Reorder point</label><input id="pReorder" type="number" min="0" value="0"></div><div class="field"><label>Warehouse</label><select id="pWh"></select></div></div><button class="btn primary" onclick="createProduct()">Create Product</button></section><section class="card"><h3>Stock Movement</h3><div class="row"><div class="field"><label>SKU</label><input id="sSku"></div><div class="field"><label>Quantity</label><input id="sQty" type="number" min="0" value="1"></div></div><div class="row"><div class="field"><label>Warehouse</label><select id="sWh"></select></div><div class="field"><label>Note</label><input id="sNote" placeholder="Reason / reference"></div></div><div class="actions"><button class="btn primary" onclick="moveStock('receive')">Receive</button><button class="btn" onclick="moveStock('dispatch')">Dispatch</button><button class="btn" onclick="adjustStock()">Adjust to Quantity</button></div></section></div><section class="card" style="margin-top:12px"><div style="display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap"><h3>Inventory</h3><div class="actions"><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="shareData()">Share</button><button class="btn" onclick="exportJson()">Export JSON</button></div></div><div class="status" id="status">Enter an access code and connect.</div><div class="tableWrap"><table class="table"><thead><tr><th>SKU</th><th>Product</th><th>On hand</th><th>Reorder point</th><th>Warehouse stock</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>let products=[],warehouses=[];const code=()=>document.getElementById('code').value.trim();const headers=()=>({'X-Access-Code':code()});async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers()};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}function setStatus(t,bad=false){const e=document.getElementById('status');e.textContent=t;e.style.color=bad?'var(--red)':'var(--muted)'}async function refreshAll(){try{setStatus('Loading live warehouse data…');const [w,p]=await Promise.all([api('/inventory/warehouses'),api('/inventory/products')]);warehouses=w.results||[];products=p.results||[];render();setStatus('Warehouse network connected.')}catch(e){setStatus(e.message,true)}}function render(){mWh.textContent=warehouses.filter(w=>w.is_active!==0).length;mSku.textContent=products.length;const units=products.reduce((s,p)=>s+Number(p.total_quantity_on_hand||0),0);mUnits.textContent=units.toLocaleString();const low=products.filter(p=>Number(p.total_quantity_on_hand||0)<=Number(p.reorder_point||0));mLow.textContent=low.length;const opts=warehouses.filter(w=>w.is_active!==0).map(w=>`<option value="${esc(w.id)}">${esc(w.name)} (${esc(w.id)})</option>`).join('');pWh.innerHTML=opts;sWh.innerHTML=opts;rows.innerHTML=products.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td class="${Number(p.total_quantity_on_hand||0)<=Number(p.reorder_point||0)?'low':'ok'}">${num(p.total_quantity_on_hand)}</td><td>${num(p.reorder_point)}</td><td>${(p.by_warehouse||[]).map(x=>esc(x.warehouse_id)+': '+num(x.quantity_on_hand)).join('<br>')}</td></tr>`).join('')||'<tr><td colspan="5">No products yet.</td></tr>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(v){return Number(v||0).toLocaleString()}function form(obj){const f=new FormData();Object.entries(obj).forEach(([k,v])=>f.append(k,v));return f}async function createProduct(){try{await api('/inventory/products',{method:'POST',body:form({sku:pSku.value.trim().toUpperCase(),name:pName.value.trim(),unit_cost:pCost.value||0,reorder_point:pReorder.value||0,reorder_quantity:0,initial_quantity:pQty.value||0,warehouse_id:pWh.value||'main'})});setStatus('Product created.');await refreshAll()}catch(e){setStatus(e.message,true)}}async function moveStock(type){try{await api('/inventory/stock/'+type,{method:'POST',body:form({sku:sSku.value.trim().toUpperCase(),quantity:sQty.value||0,warehouse_id:sWh.value||'main',note:sNote.value.trim()})});setStatus(type==='receive'?'Stock received.':'Stock dispatched.');await refreshAll()}catch(e){setStatus(e.message,true)}}async function adjustStock(){try{await api('/inventory/stock/adjust',{method:'POST',body:form({sku:sSku.value.trim().toUpperCase(),new_quantity:sQty.value||0,warehouse_id:sWh.value||'main',note:sNote.value.trim()||'Manual WCS adjustment'})});setStatus('Stock adjusted.');await refreshAll()}catch(e){setStatus(e.message,true)}}function exportJson(){const blob=new Blob([JSON.stringify({generated_at:new Date().toISOString(),warehouses,products},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ugamap-warehouse.json';a.click();URL.revokeObjectURL(a.href)}async function shareData(){const text=`UGAMAP WCS: ${warehouses.length} warehouses, ${products.length} SKUs, ${products.reduce((s,p)=>s+Number(p.total_quantity_on_hand||0),0)} units`;try{if(navigator.share)await navigator.share({title:'UGAMAP Warehouse Control',text});else{await navigator.clipboard.writeText(text);setStatus('Warehouse summary copied.')}}catch(e){}}</script></body></html>
