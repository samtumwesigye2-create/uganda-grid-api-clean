<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGAMAP Warehouse Control System</title><style>:root{--bg:#07131d;--card:#0e2230;--panel:#0b2b31;--line:#245a62;--text:#f5f7fb;--muted:#9db1bc;--green:#20d49a;--red:#ef5b5b;--amber:#f2b84b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07131d,#091a25);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;background:#0a1823;border-bottom:1px solid rgba(255,255,255,.08);padding:13px 14px;display:flex;align-items:center;gap:10px;z-index:5}button{border:0;border-radius:10px;padding:10px 12px;font-weight:700}.back{background:#132735;color:#fff}.title{flex:1}.title h1{font-size:17px;margin:0}.title p{font-size:11px;color:var(--muted);margin:2px 0 0}.online{font-size:10px;color:#78efbb}main{max-width:1100px;margin:auto;padding:14px}.login,.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:13px;margin-bottom:12px}.login{display:flex;gap:8px}.login input,input,select{width:100%;background:#081722;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:10px}.primary{background:#166b5c;color:#fff}.danger{background:#6d2f34;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:#0b2631;border:1px solid rgba(255,255,255,.07);padding:12px;border-radius:12px}.metric b{font-size:21px;display:block}.metric span{font-size:10px;color:var(--muted)}h2{font-size:15px;margin:0 0 10px}.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form{background:#0b2631;border-radius:12px;padding:11px}.form label{font-size:10px;color:var(--muted);display:block;margin:7px 0 4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.status{font-size:11px;min-height:16px;margin-top:8px;color:var(--muted)}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}.table th{color:var(--muted);font-size:10px}.low{color:var(--amber)}.ok{color:var(--green)}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.forms{grid-template-columns:1fr}.login{flex-direction:column}}</style></head><body><header><button class="back" onclick="history.back()">‹</button><div class="title"><h1>Warehouse Control System</h1><p>Live inventory, warehouses, receiving and dispatch</p></div><div class="online" id="conn">LOCKED</div></header><main><div class="login"><input id="access" type="password" placeholder="Staff or admin access code"><button class="primary" id="connect">Connect</button></div><section class="card"><div class="grid"><div class="metric"><b id="mWh">—</b><span>Warehouses</span></div><div class="metric"><b id="mSku">—</b><span>SKUs</span></div><div class="metric"><b id="mUnits">—</b><span>Total units</span></div><div class="metric"><b id="mLow">—</b><span>Low-stock SKUs</span></div></div></section><section class="card"><h2>Stock Control</h2><div class="forms"><div class="form"><strong>Receive / Dispatch</strong><label>SKU</label><select id="sku"></select><label>Warehouse</label><select id="warehouse"></select><label>Quantity</label><input id="qty" type="number" min="0.01" step="0.01"><label>Note</label><input id="note" placeholder="Reference or note"><div class="actions"><button class="primary" id="receive">Receive</button><button class="danger" id="dispatch">Dispatch</button></div><div class="status" id="moveStatus"></div></div><div class="form"><strong>Add Product</strong><label>SKU</label><input id="newSku"><label>Name</label><input id="newName"><label>Initial quantity</label><input id="newQty" type="number" value="0"><label>Reorder point</label><input id="newReorder" type="number" value="0"><button class="primary" id="createProduct" style="margin-top:9px;width:100%">Create Product</button><div class="status" id="productStatus"></div></div></div></section><section class="card"><h2>Inventory</h2><div class="tableWrap"><table class="table"><thead><tr><th>SKU</th><th>Product</th><th>On hand</th><th>Reorder point</th><th>Status</th></tr></thead><tbody id="inventoryBody"><tr><td colspan="5">Enter an access code to load warehouse data.</td></tr></tbody></table></div></section></main><script>let code='',products=[],warehouses=[];const $=id=>document.getElementById(id);function headers(){return {'X-Access-Code':code}}async function get(path){const r=await fetch(path,{headers:headers(),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}async function post(path,data){const f=new FormData();Object.entries(data).forEach(([k,v])=>f.append(k,v));const r=await fetch(path,{method:'POST',headers:headers(),body:f});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}function render(){const total=products.reduce((s,p)=>s+Number(p.total_quantity_on_hand||0),0);const low=products.filter(p=>Number(p.total_quantity_on_hand||0)<=Number(p.reorder_point||0)).length;$('mWh').textContent=warehouses.filter(w=>w.is_active!==0).length;$('mSku').textContent=products.length;$('mUnits').textContent=total.toLocaleString();$('mLow').textContent=low;$('sku').innerHTML=products.map(p=>`<option value="${p.sku}">${p.sku} — ${p.name}</option>`).join('');$('warehouse').innerHTML=warehouses.filter(w=>w.is_active!==0).map(w=>`<option value="${w.id}">${w.name}</option>`).join('');$('inventoryBody').innerHTML=products.length?products.map(p=>{const q=Number(p.total_quantity_on_hand||0),rp=Number(p.reorder_point||0),low=q<=rp;return `<tr><td><b>${p.sku}</b></td><td>${p.name}</td><td>${q}</td><td>${rp}</td><td class="${low?'low':'ok'}">${low?'LOW':'OK'}</td></tr>`}).join(''):'<tr><td colspan="5">No products yet.</td></tr>'}async function load(){code=$('access').value.trim();if(!code)return;try{$('conn').textContent='CONNECTING';const [w,p]=await Promise.all([get('/inventory/warehouses'),get('/inventory/products')]);warehouses=w.results||[];products=p.results||[];render();$('conn').textContent='LIVE';$('conn').style.color='#78efbb'}catch(e){$('conn').textContent='DENIED';$('inventoryBody').innerHTML=`<tr><td colspan="5">${e.message}</td></tr>`}}$('connect').onclick=load;async function move(type){const out=$('moveStatus');try{out.textContent='Working…';await post('/inventory/stock/'+type,{sku:$('sku').value,warehouse_id:$('warehouse').value,quantity:$('qty').value,note:$('note').value});out.textContent=type==='receive'?'Stock received ✓':'Stock dispatched ✓';await load()}catch(e){out.textContent=e.message}}$('receive').onclick=()=>move('receive');$('dispatch').onclick=()=>move('dispatch');$('createProduct').onclick=async()=>{const out=$('productStatus');try{out.textContent='Creating…';await post('/inventory/products',{sku:$('newSku').value.trim(),name:$('newName').value.trim(),initial_quantity:$('newQty').value||0,reorder_point:$('newReorder').value||0,reorder_quantity:0,unit_cost:0,warehouse_id:$('warehouse').value||'main'});out.textContent='Product created ✓';await load()}catch(e){out.textContent=e.message}};</script></body></html>
