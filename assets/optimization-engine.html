<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGAMAP Optimization Engine</title><style>:root{--bg:#07131d;--card:#0d2d37;--line:#2d655f;--text:#f5f7fb;--muted:#9eb6bb;--green:#20d49c;--amber:#f1b454}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08131f,#061019);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;background:#07131df2;border-bottom:1px solid #183842;padding:13px;display:flex;gap:10px;align-items:center}.back,.btn{border:1px solid #28534f;background:#102a34;color:#fff;border-radius:10px;padding:10px 12px}.primary{background:#126858}main{max-width:1100px;margin:auto;padding:14px}.access{display:flex;gap:8px}.access input{flex:1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:13px 0}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.metric b{display:block;font-size:24px}.metric span,.muted{font-size:10px;color:var(--muted)}input,select{background:#071b24;color:#fff;border:1px solid #28534f;border-radius:9px;padding:10px;font:inherit}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.rec{padding:10px;border-bottom:1px solid #1b4445}.rec:last-child{border:0}.pill{font-size:10px;border:1px solid #386b62;border-radius:999px;padding:3px 7px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.runs{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #1b4445;text-align:left}.score{color:var(--green)}#msg{font-size:11px;color:var(--muted);min-height:18px;margin-top:8px}@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}.access{flex-direction:column}}</style></head><body><header><button class="back" onclick="history.back()">‹</button><div><b>Optimization Engine</b><div class="muted">Network workload, yard, orders and transport optimization</div></div></header><main><div class="access"><input id="access" type="password" placeholder="Staff / admin access code"><button class="btn primary" onclick="loadAll()">Connect</button></div><div class="metrics"><div class="metric"><b id="score">—</b><span>Optimization score</span></div><div class="metric"><b id="orders">—</b><span>Active orders</span></div><div class="metric"><b id="yard">—</b><span>Yard waiting</span></div><div class="metric"><b id="ships">—</b><span>Active shipments</span></div></div><section class="panel"><b>Run Optimization</b><div class="controls" style="margin-top:9px"><select id="target"><option>network</option><option>warehouse</option><option>yard</option><option>transport</option><option>orders</option></select><select id="strategy"><option>balanced</option><option>speed</option><option>capacity</option><option>cost</option></select><button class="btn primary" onclick="runOpt()">Optimize</button></div><div id="msg"></div></section><section class="panel" style="margin-top:11px"><b>Recommendations</b><div id="recs"></div></section><div class="toolbar"><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="shareData()">Share</button><button class="btn" onclick="exportData()">Export JSON</button><button class="btn" onclick="loadAll()">Refresh</button></div><section class="panel"><b>Optimization Runs</b><div class="runs"><table><thead><tr><th>Run</th><th>Target</th><th>Strategy</th><th>Score</th><th>Inputs</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>let current={},runs=[];const code=()=>access.value.trim();async function api(url,opt={}){opt.headers={...(opt.headers||{}),'X-Access-Code':code(),...(opt.body?{'Content-Type':'application/json'}:{})};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}function say(t,e=false){msg.textContent=t;msg.style.color=e?'#ff8585':'var(--muted)'}function render(d){current=d;const s=d.snapshot||{};score.textContent=Math.round(d.optimization_score??d.score??0);orders.textContent=s.orders_active??0;yard.textContent=s.yard_waiting??0;ships.textContent=s.shipments_active??0;recs.innerHTML=(d.recommendations||[]).map(x=>`<div class="rec"><span class="pill">${x.priority}</span> <b>${x.area}</b><div>${x.action}</div><div class="muted">Estimated gain: ${x.estimated_gain_pct}%</div></div>`).join('')||'<div class="rec">No recommendations.</div>'}function renderRuns(){rows.innerHTML=runs.map(x=>`<tr><td>${x.id}</td><td>${x.target}</td><td>${x.strategy}</td><td class="score">${x.score}</td><td>${x.input_count}</td></tr>`).join('')||'<tr><td colspan="5">No optimization runs yet.</td></tr>'}async function loadAll(){try{say('Loading network workload…');const [s,r]=await Promise.all([api('/optimization/summary'),api('/optimization/runs')]);render(s);runs=r.results||[];renderRuns();say('Optimization network connected.')}catch(e){say(e.message,true)}}async function runOpt(){try{say('Optimizing…');const d=await api('/optimization/run',{method:'POST',body:JSON.stringify({target:target.value,strategy:strategy.value,max_tasks:100})});render(d);await loadAll();say('Optimization run completed: '+d.run_id)}catch(e){say(e.message,true)}}function exportData(){const b=new Blob([JSON.stringify({generated_at:new Date().toISOString(),current,runs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ugamap-optimization.json';a.click();URL.revokeObjectURL(a.href)}async function shareData(){const t=`UGAMAP Optimization Engine\nScore: ${score.textContent}\nActive orders: ${orders.textContent}\nYard waiting: ${yard.textContent}\nActive shipments: ${ships.textContent}`;try{if(navigator.share)await navigator.share({title:'UGAMAP Optimization Engine',text:t});else{await navigator.clipboard.writeText(t);say('Summary copied.')}}catch(e){}}</script></body></html>
