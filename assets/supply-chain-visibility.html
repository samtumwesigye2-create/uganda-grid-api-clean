<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAMAP Supply Chain Visibility</title><style>*{box-sizing:border-box}body{margin:0;background:#06131c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}header{padding:14px;background:#081b25;border-bottom:1px solid #244b4d;display:flex;gap:10px;align-items:center}.btn,input{background:#0b2731;color:#fff;border:1px solid #315e5b;border-radius:9px;padding:10px}.green{background:#126b59}main{max-width:1150px;margin:auto;padding:14px}.connect,.search{display:flex;gap:8px}.connect input,.search input{flex:1}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.card,.panel{background:#0b2932;border:1px solid #2e625d;border-radius:13px;padding:12px}.card b{font-size:24px;display:block}.muted,.card span{font-size:10px;color:#9db6ba}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}.list{max-height:420px;overflow:auto}.row{padding:9px;border-bottom:1px solid #1c4446;font-size:12px}.tag{float:right;border:1px solid #3c6b63;border-radius:999px;padding:3px 7px;font-size:10px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#msg{font-size:11px;color:#9db6ba;margin:7px 0}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.connect,.search{flex-direction:column}}</style></head><body><header><button class="btn" onclick="history.back()">‹</button><div><b>Supply Chain Visibility</b><div class="muted">End-to-end orders, yard and shipment tracking</div></div></header><main><div class="connect"><input id="code" type="password" placeholder="Staff / admin access code"><button class="btn green" onclick="loadAll()">Connect</button></div><div id="msg"></div><div class="metrics"><div class="card"><b id="m0">—</b><span>Tracked shipments</span></div><div class="card"><b id="m1">—</b><span>Delivered</span></div><div class="card"><b id="m2">—</b><span>At risk</span></div><div class="card"><b id="m3">—</b><span>Active orders</span></div><div class="card"><b id="m4">—</b><span>Yard units</span></div></div><div class="search"><input id="q" placeholder="Shipment, order, ZIPPER / Grid reference"><button class="btn green" onclick="searchNetwork()">Trace</button></div><div class="toolbar"><button class="btn" onclick="loadAll()">Refresh</button><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="shareIt()">Share</button><button class="btn" onclick="exportIt()">Export JSON</button></div><div class="grid"><section class="panel"><b>Shipments</b><div id="ships" class="list"></div></section><section class="panel"><b>Orders</b><div id="orders" class="list"></div></section><section class="panel"><b>Yard</b><div id="yard" class="list"></div></section></div></main><script>let data={};const h=()=>({'X-Access-Code':code.value.trim()});async function api(u){let r=await fetch(u,{headers:h()}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}function row(a,b,s){return `<div class="row"><b>${a||'—'}</b><span class="tag">${s||'—'}</span><div class="muted">${b||''}</div></div>`}function render(d){data=d;ships.innerHTML=(d.shipments||[]).map(x=>row(x.shipment_number,x.delivery_status,x.status)).join('')||row('No shipments','','');orders.innerHTML=(d.orders||[]).map(x=>row(x.order_number,(x.delivery_grid_id||'')+' • '+(x.shipment_number||''),x.status)).join('')||row('No orders','','');yard.innerHTML=(d.yard||[]).map(x=>row(x.unit_number||x.id,(x.shipment_number||'')+' • '+(x.order_number||''),x.status)).join('')||row('Yard clear','','')}async function loadAll(){try{msg.textContent='Loading supply chain network…';let [s,n]=await Promise.all([api('/visibility/summary'),api('/visibility/network')]);[s.tracked_shipments,s.delivered,s.at_risk,s.active_orders,s.yard_units].forEach((v,i)=>document.getElementById('m'+i).textContent=v??0);render(n);msg.textContent='Supply chain network connected.'}catch(e){msg.textContent=e.message}}async function searchNetwork(){try{let v=q.value.trim();data=await api('/visibility/trace/'+encodeURIComponent(v));render(data);msg.textContent='Trace complete: '+v}catch(e){msg.textContent=e.message}}function exportIt(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ugamap-supply-chain-visibility.json';a.click();URL.revokeObjectURL(a.href)}async function shareIt(){let t=`UGAMAP Supply Chain Visibility\nTracked: ${m0.textContent}\nDelivered: ${m1.textContent}\nAt risk: ${m2.textContent}\nActive orders: ${m3.textContent}`;if(navigator.share)try{await navigator.share({title:'UGAMAP Supply Chain Visibility',text:t})}catch(e){}else navigator.clipboard?.writeText(t)}</script></body></html>
