<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAMAP Supply Chain Visibility</title><style>*{box-sizing:border-box}body{margin:0;background:#06131c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}header{padding:14px;background:#081b25;border-bottom:1px solid #244b4d;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:4}.btn,input,select{background:#0b2731;color:#fff;border:1px solid #315e5b;border-radius:9px;padding:10px}.green{background:#126b59}main{max-width:1180px;margin:auto;padding:14px}.connect,.search,.form{display:flex;gap:8px;flex-wrap:wrap}.connect input,.search input,.form input,.form select{flex:1;min-width:130px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.card,.panel{background:#0b2932;border:1px solid #2e625d;border-radius:13px;padding:12px}.card b{font-size:24px;display:block}.muted,.card span{font-size:10px;color:#9db6ba}.focus{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.focus button{text-align:left}.focus strong{display:block;font-size:14px}.focus small{display:block;color:#9db6ba;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}.list{max-height:420px;overflow:auto}.row{padding:9px;border-bottom:1px solid #1c4446;font-size:12px}.tag{float:right;border:1px solid #3c6b63;border-radius:999px;padding:3px 7px;font-size:10px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#msg{font-size:11px;color:#9db6ba;margin:7px 0}.workspace{margin-top:10px}.workspace pre{white-space:pre-wrap;font-size:11px;background:#071b23;border:1px solid #24504d;padding:10px;border-radius:10px;max-height:360px;overflow:auto}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.grid,.focus{grid-template-columns:1fr}.connect,.search{flex-direction:column}}</style></head><body><header><button class="btn" onclick="history.back()">‹</button><div><b>Supply Chain Visibility</b><div class="muted">Planning, sourcing, suppliers, production, network design and customer experience</div></div></header><main><div class="connect"><input id="code" type="password" placeholder="Staff / admin access code"><button class="btn green" onclick="loadAll()">Connect</button></div><div id="msg"></div><div class="metrics"><div class="card"><b id="m0">—</b><span>Tracked shipments</span></div><div class="card"><b id="m1">—</b><span>Delivered</span></div><div class="card"><b id="m2">—</b><span>At risk</span></div><div class="card"><b id="m3">—</b><span>Active orders</span></div><div class="card"><b id="m4">—</b><span>Low-stock SKUs</span></div></div><section class="panel"><b>Supply Chain Focus</b><div class="focus"><button class="btn" onclick="focusCall('demand')"><strong>1. Demand Planning</strong><small>Forecast demand signals, variability and service expectations</small></button><button class="btn" onclick="focusCall('supply')"><strong>2. Supply Planning</strong><small>Balance capacity, inventory, constraints and service levels</small></button><button class="btn" onclick="focusCall('sourcing')"><strong>3. Strategic Sourcing</strong><small>Supplier selection, category strategy, contracts and cost alignment</small></button><button class="btn" onclick="focusCall('suppliers')"><strong>4. Supplier Management</strong><small>Performance, collaboration, continuity and risk oversight</small></button><button class="btn" onclick="focusCall('production')"><strong>5. Production Planning</strong><small>Scheduling, materials planning, capacity loading and output control</small></button><button class="btn" onclick="focusCall('network')"><strong>6. Network Design</strong><small>Plants, warehouses, nodes, channels and fulfillment model decisions</small></button><button class="btn" onclick="focusCall('cx')"><strong>7. Customer Experience</strong><small>Availability, delivery promise, cost-to-serve and service quality</small></button></div></section><section class="panel workspace"><b>Planning / Management Workspace</b><div class="form" style="margin-top:8px"><select id="planType"><option value="demand">demand</option><option value="supply">supply</option><option value="production">production</option><option value="network">network</option></select><input id="planName" placeholder="Plan name"><input id="planHorizon" type="number" value="30" min="1" max="365"><button class="btn green" onclick="createPlan()">Create Plan</button></div><div class="form" style="margin-top:8px"><input id="supName" placeholder="Supplier name"><input id="supCategory" placeholder="Category"><input id="supQuality" type="number" value="80" min="0" max="100"><input id="supOnTime" type="number" value="80" min="0" max="100"><input id="supRisk" type="number" value="20" min="0" max="100"><button class="btn green" onclick="addSupplier()">Add Supplier</button></div><pre id="workspace">Choose a focus area above.</pre></section><div class="search"><input id="q" placeholder="Shipment, order, ZIPPER / Grid reference"><button class="btn green" onclick="searchNetwork()">Trace</button></div><div class="toolbar"><button class="btn" onclick="loadAll()">Refresh</button><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="shareIt()">Share</button><button class="btn" onclick="exportIt()">Export JSON</button></div><div class="grid"><section class="panel"><b>Shipments</b><div id="ships" class="list"></div></section><section class="panel"><b>Orders</b><div id="orders" class="list"></div></section><section class="panel"><b>Yard</b><div id="yard" class="list"></div></section></div></main><script>let data={},focusData={};const h=(json=false)=>Object.assign({'X-Access-Code':code.value.trim()},json?{'Content-Type':'application/json'}:{});async function api(u,o={}){o.headers=Object.assign({},h(!!o.body),o.headers||{});let r=await fetch(u,o),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}function row(a,b,s){return `<div class="row"><b>${a||'—'}</b><span class="tag">${s||'—'}</span><div class="muted">${b||''}</div></div>`}function render(d){data=d;ships.innerHTML=(d.shipments||[]).map(x=>row(x.shipment_number,x.delivery_status,x.status)).join('')||row('No shipments','','');orders.innerHTML=(d.orders||[]).map(x=>row(x.order_number,(x.delivery_grid_id||'')+' • '+(x.shipment_number||''),x.status)).join('')||row('No orders','','');yard.innerHTML=(d.yard||[]).map(x=>row(x.unit_number||x.id,(x.shipment_number||'')+' • '+(x.order_number||''),x.status)).join('')||row('Yard clear','','')}async function loadAll(){try{msg.textContent='Loading supply chain network…';let [s,n]=await Promise.all([api('/visibility/summary'),api('/visibility/network')]);[s.tracked_shipments,s.delivered,s.at_risk,s.active_orders,s.low_stock_skus].forEach((v,i)=>document.getElementById('m'+i).textContent=v??0);render(n);msg.textContent='Supply chain control center connected.'}catch(e){msg.textContent=e.message}}async function focusCall(k){const map={demand:'/visibility/demand-planning?horizon_days=30',supply:'/visibility/supply-planning',sourcing:'/visibility/strategic-sourcing',suppliers:'/visibility/suppliers',production:'/visibility/production-planning',network:'/visibility/network-design',cx:'/visibility/customer-experience'};try{workspace.textContent='Loading '+k+'…';focusData=await api(map[k]);workspace.textContent=JSON.stringify(focusData,null,2)}catch(e){workspace.textContent=e.message}}async function createPlan(){try{focusData=await api('/visibility/plans',{method:'POST',body:JSON.stringify({plan_type:planType.value,name:planName.value||'Supply Chain Plan',horizon_days:Number(planHorizon.value||30),capacity:0,target_service_level:95,constraints:''})});workspace.textContent=JSON.stringify(focusData,null,2)}catch(e){workspace.textContent=e.message}}async function addSupplier(){try{focusData=await api('/visibility/suppliers',{method:'POST',body:JSON.stringify({name:supName.value,category:supCategory.value||'general',cost_score:50,quality_score:Number(supQuality.value||0),on_time_score:Number(supOnTime.value||0),risk_score:Number(supRisk.value||0),notes:''})});workspace.textContent=JSON.stringify(focusData,null,2)}catch(e){workspace.textContent=e.message}}async function searchNetwork(){try{let v=q.value.trim();data=await api('/visibility/trace/'+encodeURIComponent(v));render(data);msg.textContent='Trace complete: '+v}catch(e){msg.textContent=e.message}}function exportIt(){let b=new Blob([JSON.stringify({network:data,focus:focusData},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ugamap-supply-chain-visibility.json';a.click();URL.revokeObjectURL(a.href)}async function shareIt(){let t=`UGAMAP Supply Chain Visibility\nTracked: ${m0.textContent}\nDelivered: ${m1.textContent}\nAt risk: ${m2.textContent}\nActive orders: ${m3.textContent}\nLow-stock SKUs: ${m4.textContent}`;if(navigator.share)try{await navigator.share({title:'UGAMAP Supply Chain Visibility',text:t})}catch(e){}else navigator.clipboard?.writeText(t)}</script></body></html>
