<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGAMAP Order Management</title><style>:root{--bg:#07131d;--card:#0e2230;--panel:#0b2631;--line:#24495e;--text:#f4f7fb;--muted:#9eb0bd;--green:#23cf91;--blue:#3f8efc;--red:#ef6363;--amber:#f3bd57}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07131d,#091b26);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:8;background:rgba(7,19,29,.96);border-bottom:1px solid rgba(255,255,255,.08);padding:13px 14px;display:flex;align-items:center;gap:10px}.back,.btn{border:0;border-radius:10px;color:#fff;font-weight:700;padding:10px 12px}.back{background:#152938}.btn{background:#17695a}.btn.blue{background:#245f9f}.btn.red{background:#6c3238}.title{flex:1}.title h1{font-size:17px;margin:0}.title p{font-size:11px;color:var(--muted);margin:2px 0 0}.state{font-size:10px;color:var(--amber)}main{max-width:1180px;margin:auto;padding:14px}.bar,.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:12px;margin-bottom:12px}.bar{display:grid;grid-template-columns:1fr auto auto;gap:8px}.bar input,input,select,textarea{width:100%;background:#081722;color:#fff;border:1px solid rgba(255,255,255,.11);border-radius:9px;padding:10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#0b2631;border-radius:11px;padding:11px;border:1px solid rgba(255,255,255,.06)}.metric b{display:block;font-size:20px}.metric span{font-size:10px;color:var(--muted)}.layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:11px}.form{background:#0b2631;border-radius:12px;padding:11px}.form h2,.card h2{font-size:15px;margin:0 0 9px}.form label{display:block;color:var(--muted);font-size:10px;margin:7px 0 4px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.line{display:grid;grid-template-columns:1.2fr 1.7fr .7fr .9fr auto;gap:6px;margin-bottom:6px}.line button{padding:8px;border:0;border-radius:8px;background:#6c3238;color:#fff}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}.table th{font-size:10px;color:var(--muted)}.orderRow{cursor:pointer}.pill{padding:3px 7px;border-radius:999px;font-size:9px;background:#183447;color:#b9d0df}.detail{display:none}.detail.active{display:block}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.statusline{font-size:11px;color:var(--muted);min-height:16px;margin-top:8px}.history{margin-top:8px}.event{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px}.event small{color:var(--muted)}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.bar{grid-template-columns:1fr}.twocol{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}.line input:nth-child(5){grid-column:span 1}}</style></head><body><header><button class="back" onclick="history.back()">‹</button><div class="title"><h1>Order Management</h1><p>Orders, fulfillment, shipment handoff and audit</p></div><div class="state" id="state">LOCKED</div></header><main><div class="bar"><input id="access" type="password" placeholder="Staff or admin access code"><button class="btn" id="connect">Connect</button><button class="btn blue" onclick="window.print()">Print</button></div><section class="card"><div class="metrics"><div class="metric"><b id="mTotal">—</b><span>Total orders</span></div><div class="metric"><b id="mOpen">—</b><span>Open orders</span></div><div class="metric"><b id="mShip">—</b><span>Shipped</span></div><div class="metric"><b id="mValue">—</b><span>Active value (UGX)</span></div></div></section><section class="layout"><div class="form"><h2>Create Order</h2><div class="twocol"><div><label>Customer name</label><input id="customerName"></div><div><label>Warehouse ID</label><input id="warehouse" value="main"></div></div><div class="twocol"><div><label>Email</label><input id="email"></div><div><label>Phone</label><input id="phone"></div></div><label>Delivery address</label><input id="address"><label>Delivery Grid / ZIP</label><input id="gridId"><label>Items</label><div id="items"></div><button class="btn blue" id="addLine">+ Add item</button><label>Notes</label><textarea id="notes" rows="3"></textarea><button class="btn" id="create" style="width:100%;margin-top:9px">Create Order</button><div class="statusline" id="createStatus"></div></div><div><section class="card"><h2>Order Queue</h2><div class="twocol"><input id="search" placeholder="Search order, customer, email or Grid ID"><select id="filter"><option value="">All statuses</option><option>submitted</option><option>confirmed</option><option>allocated</option><option>picking</option><option>packed</option><option>ready_to_ship</option><option>shipped</option><option>delivered</option><option>cancelled</option><option>returned</option></select></div><div class="tableWrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Value</th><th>Shipment</th></tr></thead><tbody id="orderBody"><tr><td colspan="5">Enter access code to load orders.</td></tr></tbody></table></div></section><section class="card detail" id="detail"><h2 id="detailTitle">Order</h2><div id="detailBody"></div><div class="twocol" style="margin-top:9px"><select id="statusSelect"><option>confirmed</option><option>allocated</option><option>picking</option><option>packed</option><option>ready_to_ship</option><option>shipped</option><option>delivered</option><option>returned</option></select><input id="statusNote" placeholder="Status note"></div><div class="actions"><button class="btn" id="setStatus">Update Status</button><button class="btn blue" id="linkShipment">Link Shipment</button><button class="btn blue" id="shareOrder">Share</button><button class="btn blue" id="exportOrder">Export JSON</button><button class="btn red" id="cancelOrder">Cancel</button></div><input id="shipmentNumber" placeholder="UG-SHIP-000001" style="margin-top:8px"><div class="statusline" id="detailStatus"></div><div class="history" id="history"></div></section></div></section></main><script>let code='',orders=[],current=null;const $=id=>document.getElementById(id);function headers(){return {'X-Access-Code':code,'Content-Type':'application/json'}}async function api(path,opt={}){const r=await fetch(path,{cache:'no-store',...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}function money(v){return Number(v||0).toLocaleString()}function addLine(data={}){const wrap=document.createElement('div');wrap.className='line';wrap.innerHTML=`<input class="sku" placeholder="SKU" value="${data.sku||''}"><input class="name" placeholder="Item name" value="${data.name||''}"><input class="qty" type="number" min="0.01" step="0.01" placeholder="Qty" value="${data.quantity||1}"><input class="price" type="number" min="0" step="1" placeholder="Price" value="${data.unit_price||0}"><button type="button">✕</button>`;wrap.querySelector('button').onclick=()=>wrap.remove();$('items').appendChild(wrap)}$('addLine').onclick=()=>addLine();addLine();async function load(){code=$('access').value.trim();if(!code)return;try{$('state').textContent='CONNECTING';const [s,o]=await Promise.all([api('/orders/summary'),api('/orders?limit=200')]);orders=o.results||[];renderSummary(s);renderOrders();$('state').textContent='LIVE';$('state').style.color='#6fe8b0'}catch(e){$('state').textContent='DENIED';$('orderBody').innerHTML=`<tr><td colspan="5">${e.message}</td></tr>`}}$('connect').onclick=load;function renderSummary(s){$('mTotal').textContent=s.total_orders||0;const b=s.by_status||{};$('mShip').textContent=b.shipped||0;$('mOpen').textContent=(s.total_orders||0)-((b.delivered||0)+(b.cancelled||0)+(b.returned||0));$('mValue').textContent=money(s.active_value)}function renderOrders(){const q=$('search').value.toLowerCase(),f=$('filter').value;const rows=orders.filter(o=>(!f||o.status===f)&&(!q||[o.order_number,o.customer_name,o.customer_email,o.delivery_grid_id].some(x=>String(x||'').toLowerCase().includes(q))));$('orderBody').innerHTML=rows.length?rows.map(o=>`<tr class="orderRow" data-id="${o.id}"><td><b>${o.order_number}</b></td><td>${o.customer_name}</td><td><span class="pill">${o.status}</span></td><td>${money(o.subtotal)}</td><td>${o.shipment_number||'—'}</td></tr>`).join(''):'<tr><td colspan="5">No matching orders.</td></tr>';$('orderBody').querySelectorAll('.orderRow').forEach(r=>r.onclick=()=>openOrder(r.dataset.id))}$('search').oninput=renderOrders;$('filter').onchange=renderOrders;$('create').onclick=async()=>{const out=$('createStatus');try{const items=[...$('items').children].map(x=>({sku:x.querySelector('.sku').value,name:x.querySelector('.name').value,quantity:Number(x.querySelector('.qty').value),unit_price:Number(x.querySelector('.price').value)})).filter(x=>x.sku&&x.quantity>0);out.textContent='Creating…';const d=await api('/orders',{method:'POST',body:JSON.stringify({customer_name:$('customerName').value,customer_email:$('email').value,customer_phone:$('phone').value,delivery_address:$('address').value,delivery_grid_id:$('gridId').value,warehouse_id:$('warehouse').value||'main',currency:'UGX',notes:$('notes').value,items})});out.textContent='Created '+d.order_number+' ✓';await load();openOrder(d.id)}catch(e){out.textContent=e.message}};async function openOrder(id){try{current=await api('/orders/'+encodeURIComponent(id));$('detail').classList.add('active');$('detailTitle').textContent=current.order_number;$('detailBody').innerHTML=`<div><b>${current.customer_name}</b><br><small>${current.customer_email||''} ${current.customer_phone||''}</small></div><div style="margin-top:7px">Status: <span class="pill">${current.status}</span> · Warehouse: ${current.warehouse_id||'main'} · Value: UGX ${money(current.subtotal)}</div><div style="margin-top:7px">Delivery: ${current.delivery_address||'—'} ${current.delivery_grid_id?('· '+current.delivery_grid_id):''}</div><div style="margin-top:8px">${(current.items||[]).map(i=>`${i.sku} — ${i.name||''} × ${i.quantity} @ ${money(i.unit_price)} = ${money(i.line_total)}`).join('<br>')}</div>`;$('shipmentNumber').value=current.shipment_number||'';$('history').innerHTML='<h2>History</h2>'+((current.history||[]).map(h=>`<div class="event"><b>${h.event}</b><br><small>${h.note||''} · ${new Date(h.created_at*1000).toLocaleString()}</small></div>`).join('')||'<div class="event">No history.</div>');$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){$('detailStatus').textContent=e.message}}$('setStatus').onclick=async()=>{if(!current)return;try{await api('/orders/'+current.id+'/status',{method:'POST',body:JSON.stringify({status:$('statusSelect').value,note:$('statusNote').value})});$('detailStatus').textContent='Status updated ✓';await load();await openOrder(current.id)}catch(e){$('detailStatus').textContent=e.message}};$('linkShipment').onclick=async()=>{if(!current)return;try{await api('/orders/'+current.id+'/shipment',{method:'POST',body:JSON.stringify({shipment_number:$('shipmentNumber').value})});$('detailStatus').textContent='Shipment linked ✓';await load();await openOrder(current.id)}catch(e){$('detailStatus').textContent=e.message}};$('cancelOrder').onclick=async()=>{if(!current)return;try{await api('/orders/'+current.id+'/cancel',{method:'POST',body:'{}'});$('detailStatus').textContent='Order cancelled ✓';await load();await openOrder(current.id)}catch(e){$('detailStatus').textContent=e.message}};function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),300)}$('exportOrder').onclick=async()=>{if(!current)return;try{const d=await api('/orders/'+current.id+'/export');download(current.order_number+'.json',d)}catch(e){$('detailStatus').textContent=e.message}};$('shareOrder').onclick=async()=>{if(!current)return;const text=`${current.order_number}\nCustomer: ${current.customer_name}\nStatus: ${current.status}\nValue: UGX ${money(current.subtotal)}\nShipment: ${current.shipment_number||'Not linked'}`;try{if(navigator.share)await navigator.share({title:current.order_number,text});else await navigator.clipboard.writeText(text)}catch(e){}}</script></body></html>
