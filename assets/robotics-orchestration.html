<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAMAP Robotics</title><style>*{box-sizing:border-box}body{margin:0;background:#06131c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}header{padding:14px;background:#081b25;border-bottom:1px solid #244b4d;display:flex;gap:10px;align-items:center}.btn,input,select{background:#0b2731;color:#fff;border:1px solid #315e5b;border-radius:9px;padding:10px}.green{background:#126b59}main{max-width:1100px;margin:auto;padding:14px}.connect,.form{display:flex;gap:7px;flex-wrap:wrap}.connect input{flex:1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.card,.panel{background:#0b2932;border:1px solid #2e625d;border-radius:13px;padding:12px}.card b{font-size:24px;display:block}.muted,.card span{font-size:10px;color:#9db6ba}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{max-height:330px;overflow:auto}.row{padding:9px;border-bottom:1px solid #1c4446;font-size:12px}.tag{float:right;border:1px solid #3c6b63;border-radius:999px;padding:3px 7px;font-size:10px}.form input,.form select{flex:1;min-width:120px}#msg{font-size:11px;color:#9db6ba;margin:8px 0}@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><header><button class="btn" onclick="history.back()">‹</button><div><b>Robotics Orchestration</b><div class="muted">Robot registry, missions and operational status</div></div></header><main><div class="connect"><input id="code" type="password" placeholder="Staff / admin access code"><button class="btn green" onclick="load()">Connect</button></div><div id="msg"></div><div class="metrics"><div class="card"><b id="r0">—</b><span>Robots</span></div><div class="card"><b id="r1">—</b><span>Online</span></div><div class="card"><b id="r2">—</b><span>Active missions</span></div><div class="card"><b id="r3">—</b><span>Charging</span></div></div><div class="grid"><section class="panel"><b>Register Robot</b><div class="form" style="margin-top:8px"><input id="name" placeholder="Robot name"><select id="type"><option>mobile</option><option>forklift</option><option>picker</option><option>sorter</option><option>drone</option></select><input id="wh" value="main" placeholder="Warehouse"><button class="btn green" onclick="addRobot()">Register</button></div><div class="list" id="robots"></div></section><section class="panel"><b>Create Mission</b><div class="form" style="margin-top:8px"><select id="bot"></select><select id="mission"><option>move</option><option>pick</option><option>putaway</option><option>stage</option><option>inspect</option></select><input id="src" placeholder="Source"><input id="dst" placeholder="Destination"><input id="ref" placeholder="Order / shipment ref"><button class="btn green" onclick="addMission()">Dispatch</button></div><div class="list" id="missions"></div></section></div></main><script>const h=()=>({'X-Access-Code':code.value.trim(),'Content-Type':'application/json'});async function api(u,o={}){o.headers=h();let r=await fetch(u,o),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}function row(a,b,s){return `<div class="row"><b>${a}</b><span class="tag">${s}</span><div class="muted">${b||''}</div></div>`}async function load(){try{msg.textContent='Synchronizing robotics network…';let [s,rb,ms]=await Promise.all([api('/robotics/summary'),api('/robotics/robots'),api('/robotics/missions')]);[s.robots,s.online,s.active_missions,s.charging].forEach((v,i)=>document.getElementById('r'+i).textContent=v);robots.innerHTML=(rb.results||[]).map(x=>row(x.name,x.id+' • '+x.robot_type+' • '+x.warehouse_id,x.status)).join('')||row('No robots','','—');bot.innerHTML=(rb.results||[]).map(x=>`<option value="${x.id}">${x.name} (${x.id})</option>`).join('');missions.innerHTML=(ms.results||[]).map(x=>row(x.id,x.mission_type+' • '+x.source_location+' → '+x.destination_location,x.status)).join('')||row('No missions','','—');msg.textContent='Robotics network connected.'}catch(e){msg.textContent=e.message}}async function addRobot(){try{await api('/robotics/robots',{method:'POST',body:JSON.stringify({name:name.value,robot_type:type.value,warehouse_id:wh.value})});name.value='';await load()}catch(e){msg.textContent=e.message}}async function addMission(){try{await api('/robotics/missions',{method:'POST',body:JSON.stringify({robot_id:bot.value,mission_type:mission.value,reference:ref.value,source_location:src.value,destination_location:dst.value,priority:'normal'})});await load()}catch(e){msg.textContent=e.message}}</script></body></html>
