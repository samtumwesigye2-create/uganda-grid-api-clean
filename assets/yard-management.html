<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UGAMAP Yard Management</title>
<style>
:root{--bg:#07131d;--panel:#0c2630;--card:#102f39;--line:#2c6f67;--text:#f5f7fb;--muted:#9eb6bb;--green:#1fd49a;--amber:#f7b955;--red:#ef5b5b;--blue:#4cb7ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08131f,#07131d);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:5;background:rgba(7,19,29,.96);border-bottom:1px solid rgba(255,255,255,.08);padding:13px 15px;display:flex;gap:10px;align-items:center}.back{width:42px;height:42px;border-radius:12px;border:1px solid #29404c;background:#10202d;color:#fff;font-size:20px}.title{flex:1}.title h1{font-size:18px;margin:0}.title p{font-size:11px;color:var(--muted);margin:2px 0 0}.badge{font-size:10px;color:#7ef0bd;border:1px solid rgba(31,212,154,.3);padding:6px 8px;border-radius:999px}main{max-width:1150px;margin:auto;padding:16px}.gate{background:#0b1d28;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;gap:8px;align-items:center}.gate input{flex:1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric,.panel{background:linear-gradient(180deg,#0d3440,#092833);border:1px solid rgba(112,210,188,.28);border-radius:15px;padding:13px}.metric b{font-size:24px;display:block}.metric span,.hint{font-size:10px;color:var(--muted)}.sections{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel h2{font-size:15px;margin:0 0 10px}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#071a24;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:10px}textarea{min-height:70px;resize:vertical}button.action{background:#136c5d;color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700}.secondary{background:#17384a!important}.danger{background:#7b2b32!important}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.toolbar button{border:1px solid rgba(255,255,255,.1);background:#102738;color:#fff;border-radius:9px;padding:9px 11px}.tableWrap{overflow:auto;border:1px solid rgba(255,255,255,.08);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:800px;font-size:12px}th,td{padding:9px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}th{color:#a8c2c7;background:#0a1d28}.pill{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;background:#153949}.resources{display:grid;grid-template-columns:1fr 1fr;gap:8px}.resource{background:#0b1d28;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:10px}.resource b{display:block}.resource small{color:var(--muted)}#msg{font-size:11px;color:#9ed8cf;margin-top:8px;min-height:16px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.sections{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.resources{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><button class="back" onclick="history.back()">‹</button><div class="title"><h1>Yard Management</h1><p>Gates, bays, trailers, appointments and yard flow</p></div><div class="badge">NETWORKED</div></header>
<main>
<div class="gate"><input id="access" type="password" placeholder="Staff / admin access code"><button class="action" onclick="loadAll()">Connect</button></div>
<div class="grid"><div class="metric"><b id="mUnits">—</b><span>Active yard units</span></div><div class="metric"><b id="mArrivals">—</b><span>Expected / checked-in</span></div><div class="metric"><b id="mBays">—</b><span>Available bays</span></div><div class="metric"><b id="mGates">—</b><span>Open gates</span></div></div>
<div class="sections">
<section class="panel"><h2>Add Yard Unit</h2><div class="form"><input id="unitNumber" placeholder="Trailer / unit number"><select id="unitType"><option value="trailer">Trailer</option><option value="truck">Truck</option><option value="container">Container</option><option value="van">Van</option></select><input id="carrier" placeholder="Carrier"><input id="plate" placeholder="Plate number"><input id="shipment" placeholder="Shipment number"><input id="order" placeholder="Order number"><textarea id="notes" class="full" placeholder="Notes"></textarea><button class="action full" onclick="createUnit()">Create Yard Unit</button></div></section>
<section class="panel"><h2>Create Yard Resource</h2><div class="form"><input id="resId" placeholder="ID e.g. BAY-01"><input id="resName" placeholder="Name"><button class="action" onclick="createResource('bays')">Create Bay</button><button class="action secondary" onclick="createResource('gates')">Create Gate</button></div><div id="resources" class="resources" style="margin-top:10px"></div></section>
</div>
<div class="toolbar"><input id="search" style="max-width:250px" placeholder="Search unit, carrier, shipment..." oninput="renderUnits()"><select id="statusFilter" style="max-width:180px" onchange="renderUnits()"><option value="">All statuses</option><option>expected</option><option>checked_in</option><option>staged</option><option>at_dock</option><option>loading</option><option>unloading</option><option>released</option><option>departed</option><option>cancelled</option></select><button onclick="window.print()">Print</button><button onclick="shareData()">Share</button><button onclick="exportData()">Export JSON</button><button onclick="loadAll()">Refresh</button></div>
<section class="panel"><h2>Yard Units</h2><div class="tableWrap"><table><thead><tr><th>Unit</th><th>Type</th><th>Carrier</th><th>Shipment</th><th>Order</th><th>Status</th><th>Bay</th><th>Gate</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table></div><div id="msg"></div></section>
</main>
<script>
let units=[], bays=[], gates=[];
const code=()=>document.getElementById('access').value.trim();
const headers=(json=false)=>Object.assign({'X-Access-Code':code()},json?{'Content-Type':'application/json'}:{});
async function api(url,opt={}){opt.headers=Object.assign({},headers(!!opt.body),opt.headers||{});const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}
function say(t,err=false){const m=document.getElementById('msg');m.textContent=t;m.style.color=err?'#ff9a9a':'#9ed8cf'}
async function loadAll(){try{const [s,u,b,g]=await Promise.all([api('/yard/summary'),api('/yard/units'),api('/yard/bays'),api('/yard/gates')]);units=u.results||[];bays=b.results||[];gates=g.results||[];mUnits.textContent=s.active_units??0;mArrivals.textContent=s.arrivals??0;mBays.textContent=(s.bays||{}).available||0;mGates.textContent=(s.gates||{}).open||0;renderUnits();renderResources();say('Connected to Yard Management API')}catch(e){say(e.message,true)}}
async function createUnit(){try{const payload={unit_number:unitNumber.value,unit_type:unitType.value,carrier:carrier.value,plate_number:plate.value,shipment_number:shipment.value,order_number:order.value,notes:notes.value,appointment_time:null};await api('/yard/units',{method:'POST',body:JSON.stringify(payload)});await loadAll();say('Yard unit created')}catch(e){say(e.message,true)}}
async function createResource(type){try{await api('/yard/'+type,{method:'POST',body:JSON.stringify({resource_id:resId.value,name:resName.value})});await loadAll();say(type==='bays'?'Bay created':'Gate created')}catch(e){say(e.message,true)}}
function renderResources(){resources.innerHTML='<div><div class="hint">BAYS</div>'+bays.map(x=>`<div class="resource"><b>${esc(x.id)} · ${esc(x.name)}</b><small>${esc(x.status)}</small></div>`).join('')+'</div><div><div class="hint">GATES</div>'+gates.map(x=>`<div class="resource"><b>${esc(x.id)} · ${esc(x.name)}</b><small>${esc(x.status)}</small></div>`).join('')+'</div>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderUnits(){const q=search.value.toLowerCase(),st=statusFilter.value;const rows=units.filter(x=>(!st||x.status===st)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));tbody.innerHTML=rows.map(x=>`<tr><td><b>${esc(x.unit_number)}</b><br><span class="hint">${esc(x.plate_number)}</span></td><td>${esc(x.unit_type)}</td><td>${esc(x.carrier)}</td><td>${esc(x.shipment_number)}</td><td>${esc(x.order_number)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${esc(x.bay_id)}</td><td>${esc(x.gate_id)}</td><td><button class="action" onclick="editUnit('${esc(x.id)}')">Update</button></td></tr>`).join('')||'<tr><td colspan="9">No yard units</td></tr>'}
async function editUnit(id){const u=units.find(x=>x.id===id);if(!u)return;const status=prompt('Status: expected, checked_in, staged, at_dock, loading, unloading, released, departed, cancelled',u.status);if(status===null)return;const bay=prompt('Bay ID',u.bay_id||'');if(bay===null)return;const gate=prompt('Gate ID',u.gate_id||'');if(gate===null)return;try{await api('/yard/units/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({status,bay_id:bay,gate_id:gate})});await loadAll();say('Yard unit updated')}catch(e){say(e.message,true)}}
function exportData(){const blob=new Blob([JSON.stringify({generated_at:new Date().toISOString(),units,bays,gates},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ugamap-yard-management.json';a.click();URL.revokeObjectURL(a.href)}
async function shareData(){const text=`UGAMAP Yard Management\nActive units: ${mUnits.textContent}\nArrivals: ${mArrivals.textContent}\nAvailable bays: ${mBays.textContent}\nOpen gates: ${mGates.textContent}`;try{if(navigator.share)await navigator.share({title:'UGAMAP Yard Management',text});else{await navigator.clipboard.writeText(text);say('Summary copied')}}catch(e){say(e.message,true)}}
</script>
</body></html>
