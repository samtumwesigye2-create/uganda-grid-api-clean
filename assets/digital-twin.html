<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGAMAP Digital Twin</title><style>*{box-sizing:border-box}body{margin:0;background:#06131c;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}header{padding:14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #24474d;background:#081a24;position:sticky;top:0}.btn,input,select{border:1px solid #315e5c;background:#0b2630;color:#fff;border-radius:10px;padding:10px}.btn{cursor:pointer}.green{background:#126b59}main{max-width:1150px;margin:auto;padding:14px}.connect{display:flex;gap:8px}.connect input{flex:1}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}.card,.panel{background:#0b2932;border:1px solid #2e625d;border-radius:14px;padding:12px}.card b{font-size:23px;display:block}.card span,.muted{font-size:10px;color:#9db6ba}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{max-height:330px;overflow:auto}.row{padding:9px;border-bottom:1px solid #1d4447;font-size:12px}.row:last-child{border:0}.tag{float:right;font-size:10px;padding:3px 7px;border:1px solid #3d6b65;border-radius:999px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}#status{font-size:11px;color:#9db6ba;margin:7px 0}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.connect{flex-direction:column}}</style></head><body><header><button class="btn" onclick="history.back()">‹</button><div><b>Digital Twin</b><div class="muted">Live operational mirror of UGAMAP network</div></div></header><main><div class="connect"><input id="code" type="password" placeholder="Staff / admin access code"><button class="btn green" onclick="loadTwin()">Connect Twin</button></div><div id="status"></div><div class="metrics"><div class="card"><b id="m0">—</b><span>Facilities</span></div><div class="card"><b id="m1">—</b><span>Active orders</span></div><div class="card"><b id="m2">—</b><span>Yard assets</span></div><div class="card"><b id="m3">—</b><span>Shipments</span></div><div class="card"><b id="m4">—</b><span>Vehicles</span></div><div class="card"><b id="lag">—</b><span>Sync ms</span></div></div><div class="toolbar"><button class="btn" onclick="loadTwin()">Sync Now</button><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="shareTwin()">Share</button><button class="btn" onclick="exportTwin()">Export Snapshot</button></div><div class="grid"><section class="panel"><b>Facilities & Stock</b><div class="list" id="facilities"></div></section><section class="panel"><b>Active Orders</b><div class="list" id="orders"></div></section><section class="panel"><b>Yard Layer</b><div class="list" id="yard"></div></section><section class="panel"><b>Shipment Layer</b><div class="list" id="ships"></div></section></div></main><script>let twin={};async function api(u){const r=await fetch(u,{headers:{'X-Access-Code':code.value.trim()}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}function row(a,b,c=''){return `<div class="row"><b>${a||'—'}</b>${c?`<span class="tag">${c}</span>`:''}<div class="muted">${b||''}</div></div>`}async function loadTwin(){try{status.textContent='Synchronizing digital twin…';twin=await api('/digital-twin/snapshot');let m=twin.metrics||{};[m.facilities,m.active_orders,m.yard_assets,m.shipments,m.vehicles].forEach((x,i)=>document.getElementById('m'+i).textContent=x??0);lag.textContent=twin.sync_ms??0;facilities.innerHTML=(twin.facilities||[]).map(x=>row(x.name,x.address,x.id)).join('')||row('No facilities','');orders.innerHTML=(twin.orders||[]).map(x=>row(x.order_number,(x.delivery_grid_id||'')+' • '+(x.warehouse_id||''),x.status)).join('')||row('No active orders','');yard.innerHTML=(twin.yard||[]).map(x=>row(x.unit_number||x.id,(x.gate_id||'')+' • '+(x.bay_id||''),x.status)).join('')||row('Yard clear','');ships.innerHTML=(twin.shipments||[]).map(x=>row(x.shipment_number,x.delivery_status||'',x.status)).join('')||row('No shipments','');status.textContent='Twin synchronized • '+new Date().toLocaleTimeString()}catch(e){status.textContent=e.message}}function exportTwin(){const b=new Blob([JSON.stringify(twin,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ugamap-digital-twin.json';a.click();URL.revokeObjectURL(a.href)}async function shareTwin(){const t=`UGAMAP Digital Twin\nFacilities: ${m0.textContent}\nOrders: ${m1.textContent}\nYard assets: ${m2.textContent}\nShipments: ${m3.textContent}\nVehicles: ${m4.textContent}`;if(navigator.share)try{await navigator.share({title:'UGAMAP Digital Twin',text:t})}catch(e){}else navigator.clipboard?.writeText(t)}</script></body></html>
