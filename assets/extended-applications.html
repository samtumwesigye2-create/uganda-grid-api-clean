<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGAMAP Extended Applications</title><style>:root{--text:#f5f7fb;--muted:#9eb6bb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08131f,#07131d);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}header{position:sticky;top:0;background:#07131df2;border-bottom:1px solid #ffffff14;padding:14px 16px;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff1f;background:#10202d;color:#fff;font-size:20px}.title{flex:1}.title h1{font-size:18px;margin:0}.title p{font-size:12px;color:var(--muted);margin:3px 0 0}.status{font-size:11px;color:#7ef0bd}main{padding:16px;max-width:1100px;margin:auto}.shell{background:linear-gradient(180deg,#114b3fea,#082b2df0);border:1px solid #50b99b80;border-radius:20px;padding:14px}.shell h2{text-align:center;margin:4px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.app{min-height:118px;border-radius:16px;border:1px solid #70d2bc59;background:linear-gradient(180deg,#0d3440,#092833);color:#fff;padding:16px 12px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer}.app:active{transform:scale(.985)}.icon{font-size:25px}.app strong{font-size:15px}.app span{font-size:10px;color:var(--muted)}footer{padding:16px;text-align:center;color:var(--muted);font-size:10px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.app strong{font-size:13px}.status{display:none}}</style></head><body><header><button class="back" onclick="history.back()">‹</button><div class="title"><h1>UGAMAP Operations</h1><p>Extended Applications Control Center</p></div><div class="status">SYSTEM READY</div></header><main><section class="shell"><h2>Extended Applications</h2><div class="grid" id="apps"></div></section></main><footer>Uganda National Grid • Extended Applications</footer><script>const modules=[['🧱','Platform Services','Access, workflows, documents, audit, APIs and monitoring','/assets/platform-services.html'],['🚚','Transport Management','Fleet, drivers, dispatch and shipment handoff','/assets/transport-management.html'],['📦','Order Management','Orders, fulfillment and shipment handoff','/assets/order-management.html'],['🏭','Warehouse Control System (WCS)','Live inventory, stock movement and warehouse control','/assets/warehouse-control.html'],['🚧','Yard Management','Gates, bays, trailers, appointments and yard flow','/assets/yard-management.html'],['🧠','AI / ML Analytics','Live forecasting, anomaly detection and network intelligence','/assets/ai-ml-analytics.html'],['⚙️','Optimization Engine','Live workload, yard, orders and transport optimization','/assets/optimization-engine.html'],['🧩','Digital Twin','Live synchronized operational network model','/assets/digital-twin.html'],['🤖','Robotics Orchestration','Robot registry, tasks, missions and operational state','/assets/robotics-orchestration.html'],['🌐','Supply Chain Visibility','End-to-end orders, yard and shipment tracking','/assets/supply-chain-visibility.html']];const a=document.getElementById('apps');modules.forEach(m=>{const b=document.createElement('button');b.className='app';b.innerHTML=`<div class="icon">${m[0]}</div><strong>${m[1]}</strong><span>${m[2]}</span>`;b.onclick=()=>location.href=m[3];a.appendChild(b)});</script></body></html>
