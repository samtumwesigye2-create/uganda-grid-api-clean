<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector 5250 Operations</title><style>*{box-sizing:border-box}body{margin:0;background:#010704;color:#79ed9d;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.shell{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #1f6b38;padding-bottom:12px;margin-bottom:16px}.brand{font-size:22px;font-weight:900;letter-spacing:.08em;color:#caffd7}.sub{font-size:12px;color:#52b972;margin-top:4px}.screen{border:2px solid #1f6b38;background:linear-gradient(#031108,#010704);box-shadow:inset 0 0 40px #00260e;border-radius:10px;padding:18px;min-height:76vh}.statusbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#d8aa4f;border-bottom:1px solid #1b4b2a;padding-bottom:10px;margin-bottom:14px}.command{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:18px;border-top:1px solid #1f6b38;padding-top:14px}.command input{width:100%;background:#001c0c;color:#d8ffe3;border:1px solid #2c7644;border-radius:4px;padding:12px;font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}.btn{background:#082311;color:#bfffd0;border:1px solid #2c7644;border-radius:5px;padding:11px 14px;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.menu button{text-align:left}.panel{border:1px solid #1b4b2a;border-radius:6px;padding:14px;margin:12px 0}.title{color:#d8aa4f;font-size:17px;margin-bottom:10px}.row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #11341e}.row:last-child{border-bottom:0}.amber{color:#d8aa4f}.muted{color:#3d8b55}.keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{min-height:22px;margin-top:10px}.error{color:#ff7777}.ok{color:#7cff9f}@media(max-width:650px){.shell{padding:10px}.screen{padding:14px}.command{grid-template-columns:1fr}.command label{display:none}.menu{grid-template-columns:1fr}.row{grid-template-columns:46px 1fr}.row .right{grid-column:2}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="shell"><div class="top"><div><div class="brand">VECTOR 5250 OPERATIONS</div><div class="sub">INDEPENDENT SYSTEM OF RECORD · MANAGER AND ABOVE ONLY</div></div><button class="btn" onclick="location.href='/warehouse'">WAREHOUSE APP</button></div><section class="screen"><div class="statusbar"><span id="screenName">MANAGER COMMAND INDEX</span><span id="sessionState">CHECKING SESSION…</span></div><div id="content"></div><div class="keys"><button class="btn" data-key="F3">F3 BACK</button><button class="btn" data-key="F5">F5 REFRESH</button><button class="btn" data-key="F9">F9 HISTORY</button><button class="btn" data-key="F12">F12 CANCEL</button></div><div class="command"><label>COMMAND ==&gt;</label><input id="cmd" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn" id="enter">ENTER</button></div><div id="msg" class="msg"></div></section></main><script>(function(){const $=id=>document.getElementById(id);const hist=[];let commands={};let current='dashboard';const views={dashboard:{name:'MANAGER COMMAND INDEX',html:`<div class="menu">${[['0','Manager Dashboard'],['1','Exceptions'],['2','Dispatch'],['3','Orders'],['4','Warehouse Records'],['5','Documents'],['6','Alerts & Tasks'],['7','Search'],['8','Recent Transactions'],['9','Favorites']].map(x=>`<button class="btn" data-cmd="${x[0]}">${x[0]} ${x[1]}</button>`).join('')}</div>`},exceptions:{name:'EXCEPTION CENTER',html:'<div class="panel"><div class="title">PRIORITY QUEUE</div><div class="row"><span class="amber">1</span><span>Critical exceptions requiring manager action</span><span class="right amber">OPEN</span></div><div class="row"><span class="amber">2</span><span>Adjustments, releases and overrides awaiting approval</span><span class="right amber">PENDING</span></div></div>'},dispatch:{name:'DISPATCH OPERATIONS',html:'<div class="panel"><div class="title">DISPATCH RECORDS</div><div class="muted">Dedicated Vector dispatch records screen.</div></div>'},orders:{name:'ORDER OPERATIONS',html:'<div class="panel"><div class="title">ORDER RECORDS</div><div class="muted">Dedicated Vector order records screen.</div></div>'},warehouse:{name:'WAREHOUSE RECORDS',html:'<div class="panel"><div class="title">WAREHOUSE RECORDS</div><div class="muted">Independent Vector warehouse record index. This page does not embed the warehouse application.</div></div>'},documents:{name:'DOCUMENTS',html:'<div class="panel"><div class="title">RECORD DOCUMENTS</div><div class="muted">Bills of lading, delivery records, pickup records, proof and chain-of-custody index.</div></div>'},alerts:{name:'ALERTS & TASKS',html:'<div class="panel"><div class="title">ACTIVE CONTROL ITEMS</div><div class="muted">No record feed loaded yet.</div></div>'},search:{name:'RECORD SEARCH',html:'<div class="panel"><div class="title">SEARCH</div><div class="muted">Enter a U-Code or record reference in COMMAND.</div></div>'},recent:{name:'RECENT TRANSACTIONS',html:'<div class="panel"><div class="title">RECENT VECTOR TRANSACTIONS</div><div id="recentRows" class="muted">No transactions in this browser session.</div></div>'},favorites:{name:'FAVORITES',html:'<div class="panel"><div class="title">FAVORITES</div><div class="muted">0 Dashboard · 1 Exceptions · 2 Dispatch · 4 Warehouse Records · 5 Documents</div></div>'}};function render(name){current=name;const v=views[name]||views.dashboard;$('screenName').textContent=v.name;$('content').innerHTML=v.html;$('content').querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>exec(b.dataset.cmd));if(name==='recent')$('recentRows').textContent=hist.length?hist.slice().reverse().join(' · '):'No transactions in this browser session.';}function target(t){if(views[t]){render(t);return true}return false}async function session(){const code=localStorage.getItem('vector5250-access')||'';if(!code){$('sessionState').textContent='MANAGER SIGN-IN REQUIRED';return false}try{const r=await fetch('/warehouse/manager/session',{headers:{'x-access-code':code},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.detail||'ACCESS DENIED');commands=d.commands||{};$('sessionState').textContent='SESSION ACTIVE · '+String(d.role||'manager').toUpperCase();return true}catch(e){$('sessionState').textContent='ACCESS DENIED';$('msg').textContent=e.message;$('msg').className='msg error';return false}}async function exec(raw){const c=String(raw||'').trim().toUpperCase();if(!c)return;if(!(await session()))return;hist.push(c);const key=c.replace(/^U\s*/,'U-').replace(/^U--/,'U-');const tx=commands[key]||commands[c];if(!tx){$('msg').textContent='INVALID COMMAND: '+c;$('msg').className='msg error';return}target(tx.target);$('msg').textContent=key+' · '+tx.label;$('msg').className='msg ok';$('cmd').value='';$('cmd').focus()}$('enter').onclick=()=>exec($('cmd').value);$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();exec(e.currentTarget.value)}});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='F3')render('dashboard');if(k==='F5'){render(current);session()}if(k==='F9')render('recent');if(k==='F12'){$('cmd').value='';$('msg').textContent='CANCELLED';$('msg').className='msg'}});render('dashboard');session()})();</script></body></html>
