<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vector 5250 Operations</title><style>*{box-sizing:border-box}body{margin:0;background:#010704;color:#79ed9d;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.shell{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #1f6b38;padding-bottom:12px;margin-bottom:16px}.brand{font-size:22px;font-weight:900;letter-spacing:.08em;color:#caffd7}.sub{font-size:12px;color:#52b972;margin-top:4px}.screen{border:2px solid #1f6b38;background:linear-gradient(#031108,#010704);box-shadow:inset 0 0 40px #00260e;border-radius:10px;padding:18px;min-height:82vh}.statusbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#d8aa4f;border-bottom:1px solid #1b4b2a;padding-bottom:10px;margin-bottom:14px}.command{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:18px;border-top:1px solid #1f6b38;padding-top:14px}.command input{width:100%;background:#001c0c;color:#d8ffe3;border:1px solid #2c7644;border-radius:4px;padding:12px;font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}.btn{background:#082311;color:#bfffd0;border:1px solid #2c7644;border-radius:5px;padding:11px 14px;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.menu button{text-align:left}.panel{border:1px solid #1b4b2a;border-radius:6px;padding:14px;margin:12px 0}.title{color:#d8aa4f;font-size:17px;margin-bottom:10px}.row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #11341e}.row:last-child{border-bottom:0}.amber{color:#d8aa4f}.muted{color:#3d8b55}.keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{min-height:22px;margin-top:10px}.error{color:#ff7777}.ok{color:#7cff9f}@media(max-width:650px){.shell{padding:10px}.screen{padding:14px}.command{grid-template-columns:1fr}.command label{display:none}.menu{grid-template-columns:1fr}.row{grid-template-columns:46px 1fr}.row .right{grid-column:2}.top{align-items:flex-start;flex-direction:column}.keys .btn{flex:1 1 30%}}</style></head><body><main class="shell"><div class="top"><div><div class="brand">VECTOR 5250 OPERATIONS</div><div class="sub">INDEPENDENT SYSTEM OF RECORD · 5250 TERMINAL ENVIRONMENT</div></div><div class="sub">UGANDA NATIONAL GRID</div></div><section class="screen"><div class="statusbar"><span id="screenName">V5250-MAIN VECTOR 5250 MAIN MENU</span><span id="sessionState">CHECKING SESSION…</span></div><div id="content"></div><div class="keys"><button class="btn" data-key="F3">F3 BACK</button><button class="btn" data-key="F4">F4 PROMPT</button><button class="btn" data-key="F5">F5 REFRESH</button><button class="btn" data-key="F9">F9 HISTORY</button><button class="btn" data-key="F12">F12 CANCEL</button><button class="btn" data-key="F24">F24 MORE</button></div><div class="command"><label>COMMAND ==&gt;</label><input id="cmd" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Vector 5250 command"><button class="btn" id="enter">ENTER</button></div><div id="msg" class="msg"></div></section></main><script src="/vector5250-runtime.js?v=2"></script></body></html>
