<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UGATU Driver</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111827}.shell{max-width:900px;margin:auto;min-height:100vh;background:#fff}.brand{height:64px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #e5e7eb}.brand img{max-height:48px;max-width:230px}.pad{padding:18px}.login{max-width:420px;margin:70px auto}.login h1{text-align:center}.login input,.login button,.scanSheet input,.scanSheet select,.scanSheet button{width:100%;min-height:54px;border-radius:14px;font-size:18px}.login input,.scanSheet input,.scanSheet select{border:1px solid #cbd5e1;padding:0 16px;background:#fff}.login button,.primary{border:0;background:#111827;color:#fff;font-weight:800;margin-top:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:24px;margin:0}.muted{color:#64748b}.routeCard{margin:18px 0;padding:20px;border-radius:20px;background:#111827;color:#fff}.routeCard h2{margin:0 0 6px;font-size:22px}.routeCard .stop{margin-top:18px;background:#1f2937;padding:15px;border-radius:14px;display:flex;flex-direction:column;gap:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{min-height:110px;border:0;border-radius:18px;background:#eef2f7;font-size:20px;font-weight:800;text-align:left;padding:18px}.action.main{background:#111827;color:#fff}.action.full{grid-column:1/-1}.tasks{margin-top:22px}.tasks h2{font-size:20px}.taskRow{width:100%;border:1px solid #e5e7eb;background:#fff;border-radius:16px;padding:14px;margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left}.taskRow b{font-size:16px}.taskRow small{grid-column:2;color:#64748b}.pill{font-size:10px;font-weight:900;padding:5px 7px;border-radius:999px;align-self:start}.pickup{background:#dbeafe;color:#1d4ed8}.delivery{background:#dcfce7;color:#166534}.handoff{background:#fef3c7;color:#92400e}.bottom{position:sticky;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid #e5e7eb;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.bottom button{flex:1;border:0;background:#f1f5f9;border-radius:12px;min-height:48px;font-weight:700}.notice{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;max-width:90vw;padding:12px 16px;border-radius:12px;background:#dcfce7;color:#14532d;font-weight:700}.notice.bad{background:#fee2e2;color:#991b1b}.notice.warn{background:#fef3c7;color:#92400e}.scanSheet{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:15;display:flex;align-items:flex-end}.sheet{width:100%;max-width:900px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetHead button{width:auto;min-height:44px;border:0;background:#e2e8f0;padding:0 14px}.scanSheet label{display:block;font-weight:700;margin:14px 0 6px}.empty{padding:24px;text-align:center;color:#64748b}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.action.full{grid-column:auto}}</style></head><body><div class="shell"><div class="brand"><img src="/assets/uganda-national-grid-logo.png" alt="Uganda National Grid"></div><div id="ugatuMsg" class="notice" hidden></div><section id="login" class="login pad"><h1>UGATU Driver</h1><p class="muted" style="text-align:center">Driver Operations</p><input id="passcode" type="password" inputmode="numeric" placeholder="Driver passcode"><button id="loginBtn">Log In</button></section><main id="app" hidden><div class="pad"><div class="top"><div><div class="muted">DRIVER</div><h1 id="driverName">Driver</h1></div><button id="syncBtn" style="border:0;background:#eef2f7;border-radius:12px;padding:12px">Sync <span id="offlineCount">0</span></button></div><section class="routeCard"><h2>Today's Work</h2><div id="routeSummary" class="muted" style="color:#cbd5e1">Loading…</div><div id="currentStop" class="stop"><strong>Loading current stop…</strong></div></section><section class="grid"><button id="scanBtn" class="action main">SCAN</button><button id="ordersBtn" class="action">ORDERS</button><button id="docsBtn" class="action">DOCUMENTS</button><button id="issueBtn" class="action">REPORT ISSUE</button></section><section class="tasks"><div class="top"><h2>Active Stops</h2><button id="refreshBtn" style="border:0;background:#eef2f7;border-radius:10px;padding:10px 14px">Refresh</button></div><div id="taskList"></div></section></div><nav class="bottom"><button>ROUTE</button><button id="ordersNav">ORDERS</button><button onclick="document.getElementById('scanBtn').click()">SCAN</button><button>TASKS</button><button>MORE</button></nav></main></div><div id="scanSheet" class="scanSheet" hidden><div class="sheet"><div class="sheetHead"><h2>Scan Freight</h2><button id="scanClose">Close</button></div><label for="scanMode">Action</label><select id="scanMode"><option>PICKUP</option><option>DELIVERY</option><option>HANDOFF</option></select><label for="scanValue">Package / Freight ID</label><input id="scanValue" autocomplete="off" autocapitalize="characters" placeholder="Scan barcode or enter ID"><button id="scanSubmit" class="primary">CONFIRM SCAN</button></div></div><script src="/assets/driver-ugatu-v1.js"></script></body></html>
