<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>UGAMAP ZIP Assignment</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#07111e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.bar{padding:12px;background:#0d1826;border-bottom:1px solid #26364b}.bar h2{margin:0 0 9px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}select,input,button{width:100%;padding:10px;border-radius:7px;border:1px solid #33445c;background:#101d2d;color:#fff;font-size:14px}button{background:#3155ed;font-weight:700}.danger{background:#a93636}.wide{grid-column:1/-1}#draw.active{background:#16a34a}#map{height:58vh;min-height:390px;touch-action:pan-x pan-y}.drawing #map{touch-action:none}.hint{font-size:11px;color:#9ba9ba;margin-top:7px}.status{font-size:12px;color:#8fb0ff;margin-top:7px}.list{padding:10px 12px}.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #1d2b3d;padding:8px 0}.item span{flex:1;font-size:12px}.item button{width:auto;padding:6px 9px;font-size:11px}.vertex{background:#ffd54a;border:2px solid #111;border-radius:50%;width:12px;height:12px}@media(max-width:500px){#map{height:55vh}.bar{padding:10px}}</style></head><body><div class="bar"><h2>UGAMAP · Assign Reserve ZIP</h2><div class="grid"><input id="pass" type="password" placeholder="Admin passcode"><select id="region"><option value="">Select postal region</option><option value="KLA">Kampala Metropolitan · 20</option><option value="JIN">Nile · 22</option><option value="MBA">Western Highlands · 23</option><option value="MBL">Elgon · 24</option><option value="GUL">Northern Savannah · 25</option><option value="ARU">West Nile · 26</option><option value="SOR">Eastern Plains · 27</option><option value="MOR">Karamoja · 28</option><option value="HOI">Albertine · 29</option><option value="MSK">Lake Victoria mainland · 30</option><option value="ENT">Entebbe & Islands · 21</option></select><select id="zip"><option value="">Reserve ZIP</option></select><input id="name" placeholder="Area name, e.g. Zigoti"><button id="draw" class="wide">Start Drawing</button><button id="undo">Undo Point</button><button id="clear" class="danger">Clear</button><button id="save" class="wide">Assign ZIP to Drawn Area</button></div><div class="hint">Tap Start Drawing. While drawing, map panning is locked so every tap adds a boundary point. Tap Start Drawing again to stop.</div><div id="status" class="status"></div></div><div id="map"></div><div class="list"><b>Manual assignments</b><div id="list"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{tap:true,touchZoom:true}).setView([1.37,32.29],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let pts=[],poly=null,drawing=false,markers=[];const $=id=>document.getElementById(id),hdr=()=>({'X-Admin-Passcode':$('pass').value});function msg(x){$('status').textContent=x}function redraw(){if(poly)map.removeLayer(poly);markers.forEach(m=>map.removeLayer(m));markers=[];if(pts.length){poly=L.polygon(pts,{color:'#ffd54a',weight:3,fillOpacity:.18,interactive:false}).addTo(map);pts.forEach(p=>markers.push(L.circleMarker(p,{radius:5,color:'#111',weight:2,fillColor:'#ffd54a',fillOpacity:1,interactive:false}).addTo(map)))}else poly=null}function setDrawing(on){drawing=on;$('draw').classList.toggle('active',on);$('draw').textContent=on?'Drawing ON — tap map':'Start Drawing';document.body.classList.toggle('drawing',on);if(on){map.dragging.disable();map.doubleClickZoom.disable();msg('Drawing ON — tap the map to add boundary points')}else{map.dragging.enable();map.doubleClickZoom.enable();msg(pts.length?pts.length+' boundary points ready':'Drawing stopped')}}function addPoint(latlng){if(!drawing)return;pts.push(latlng);redraw();msg(pts.length+' boundary points added')}map.on('click',e=>addPoint(e.latlng));const mc=map.getContainer();mc.addEventListener('pointerup',ev=>{if(!drawing||ev.pointerType==='mouse')return;ev.preventDefault();const r=mc.getBoundingClientRect(),pt=L.point(ev.clientX-r.left,ev.clientY-r.top);addPoint(map.containerPointToLatLng(pt))},{passive:false});$('draw').onclick=()=>setDrawing(!drawing);$('undo').onclick=()=>{pts.pop();redraw();msg(pts.length+' boundary points')};$('clear').onclick=()=>{pts=[];redraw();msg('Cleared')};$('region').onchange=loadReserves;async function loadReserves(){let r=$('region').value;$('zip').innerHTML='<option value="">Reserve ZIP</option>';if(!r)return;let x=await fetch('/admin/zips/reserves/'+r,{headers:hdr()});if(!x.ok){msg('Enter correct admin passcode');return}let d=await x.json();d.results.forEach(z=>$('zip').insertAdjacentHTML('beforeend','<option>'+z+'</option>'));msg(d.results.length+' reserve ZIPs available')}async function loadList(){let x=await fetch('/admin/zips/manual',{headers:hdr()});if(!x.ok)return;let d=await x.json(),el=$('list');el.innerHTML='';d.results.forEach(a=>{let row=document.createElement('div');row.className='item';row.innerHTML='<span><b>'+a.zip_code+'</b> · '+a.name+'</span><button class="danger">Delete</button>';row.querySelector('button').onclick=()=>del(a.zip_code);el.appendChild(row)})}async function del(z){if(!confirm('Delete manual ZIP '+z+'?'))return;let x=await fetch('/admin/zips/manual/'+z,{method:'DELETE',headers:hdr()});msg(x.ok?'Deleted '+z:'Delete failed');loadList();loadReserves()}$('save').onclick=async()=>{let region=$('region').value,z=$('zip').value,name=$('name').value.trim();if(!region||!z||!name||pts.length<3){msg('Choose region + ZIP + name and draw at least 3 points');return}let coords=pts.map(p=>[p.lng,p.lat]);coords.push(coords[0]);let body={zip_code:z,postal_region:region,state_code:'MANUAL',name,geometry:{type:'Polygon',coordinates:[coords]}};let x=await fetch('/admin/zips/manual',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await x.json();if(!x.ok){msg(d.detail||'Assignment failed');return}msg('Assigned '+z+' to '+name);pts=[];redraw();setDrawing(false);loadReserves();loadList()};$('pass').onchange=()=>{loadReserves();loadList()};fetch('/geography/zips').then(r=>r.json()).then(g=>L.geoJSON(g,{style:f=>({color:f.properties.manual?'#ff3b7b':'#43a5ff',weight:f.properties.manual?3:1,fillOpacity:f.properties.manual?.18:.03}),interactive:false}).addTo(map));</script></body></html>
