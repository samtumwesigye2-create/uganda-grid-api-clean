<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>UGAMAP ZIP Assignment</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#07111e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.bar{padding:12px;background:#0d1826;border-bottom:1px solid #26364b}.bar h2{margin:0 0 9px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}select,input,button{width:100%;padding:10px;border-radius:7px;border:1px solid #33445c;background:#101d2d;color:#fff;font-size:14px}button{background:#3155ed;font-weight:700}.danger{background:#a93636}.wide{grid-column:1/-1}#draw.active{background:#16a34a}#map{height:58vh;min-height:390px;touch-action:pan-x pan-y}.drawing #map{touch-action:none}.hint{font-size:11px;color:#9ba9ba;margin-top:7px}.status{font-size:12px;color:#8fb0ff;margin-top:7px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:#b8c4d4;margin-top:7px}.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}.list{padding:10px 12px}.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #1d2b3d;padding:8px 0}.item span{flex:1;font-size:12px}.item button{width:auto;padding:6px 9px;font-size:11px}.zip-label{background:rgba(7,17,30,.90);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:5px;box-shadow:none;font-size:10px;font-weight:800;padding:2px 5px}.zip-label:before{display:none}.zip-label.manual{background:rgba(126,20,73,.92);border-color:#ff3b7b}.zip-label.protected{background:rgba(9,91,68,.92);border-color:#34d399}@media(max-width:500px){#map{height:55vh}.bar{padding:10px}}</style></head><body><div class="bar"><h2>UGAMAP · Assign ZIP Boundary</h2><div class="grid"><input id="pass" type="password" placeholder="Admin passcode"><select id="region"><option value="">Select state</option><option value="KAMPALA_CENTRAL">Kampala Central · 10000–19999</option><option value="VICTORIA_EQUATORIAL">Victoria Equatorial · 20000–29999</option><option value="ALBERTINE_RIFT">Albertine Rift · 30000–32249</option><option value="WEST_NILE">West Nile · 32250–35349</option><option value="RWENZORI_VIRUNGA">Rwenzori Virunga · 40000–49999</option><option value="KATONGA_HIGHLAND">Katonga Highland · 50000–59999</option><option value="NILE_SOURCE">Nile Source · 60000–69999</option><option value="ELGON_KARAMOJA">Elgon Karamoja · 70000–79999</option><option value="KYOGA_KWANIA">Kyoga Kwania · 80000–89999</option><option value="ASWA_SAVANNAH">Aswa Savannah · 90000–99999</option></select><select id="zip"><option value="">Select available ZIP</option></select><input id="name" placeholder="Area name, e.g. Zigoti"><button id="draw" class="wide">Start Drawing</button><button id="undo">Undo Point</button><button id="clear" class="danger">Clear</button><button id="save" class="wide">Assign ZIP to Drawn Area</button></div><div class="hint">Choose a state, then select an unused ZIP from its finalized national range. Draw at least 3 points around the area, then assign.</div><div class="legend"><span><i style="background:#43a5ff"></i>Existing ZIP</span><span><i style="background:#34d399"></i>Protected</span><span><i style="background:#ff3b7b"></i>Manually assigned</span></div><div id="status" class="status"></div></div><div id="map"></div><div class="list"><b>Manual assignments</b><div id="list"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{tap:true,touchZoom:true}).setView([1.37,32.29],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let pts=[],poly=null,drawing=false,markers=[],assignedLayer=null;const $=id=>document.getElementById(id),hdr=()=>({'X-Admin-Passcode':$('pass').value});function msg(x){$('status').textContent=x}function redraw(){if(poly)map.removeLayer(poly);markers.forEach(m=>map.removeLayer(m));markers=[];if(pts.length){poly=L.polygon(pts,{color:'#ffd54a',weight:3,fillOpacity:.18,interactive:false}).addTo(map);pts.forEach(p=>markers.push(L.circleMarker(p,{radius:5,color:'#111',weight:2,fillColor:'#ffd54a',fillOpacity:1,interactive:false}).addTo(map)))}else poly=null}function setDrawing(on){drawing=on;$('draw').classList.toggle('active',on);$('draw').textContent=on?'Drawing ON — tap map':'Start Drawing';document.body.classList.toggle('drawing',on);if(on){map.dragging.disable();map.doubleClickZoom.disable();msg('Drawing ON — tap the map to add boundary points')}else{map.dragging.enable();map.doubleClickZoom.enable();msg(pts.length?pts.length+' boundary points ready':'Drawing stopped')}}function addPoint(latlng){if(!drawing)return;pts.push(latlng);redraw();msg(pts.length+' boundary points added')}map.on('click',e=>addPoint(e.latlng));const mc=map.getContainer();mc.addEventListener('pointerup',ev=>{if(!drawing||ev.pointerType==='mouse')return;ev.preventDefault();const r=mc.getBoundingClientRect(),pt=L.point(ev.clientX-r.left,ev.clientY-r.top);addPoint(map.containerPointToLatLng(pt))},{passive:false});$('draw').onclick=()=>setDrawing(!drawing);$('undo').onclick=()=>{pts.pop();redraw();msg(pts.length+' boundary points')};$('clear').onclick=()=>{pts=[];redraw();msg('Cleared')};$('region').onchange=loadZips;async function loadZips(){const region=$('region').value;$('zip').innerHTML='<option value="">Select available ZIP</option>';if(!region)return;msg('Loading available ZIPs…');const x=await fetch('/admin/zips/reserves/'+encodeURIComponent(region),{headers:hdr(),cache:'no-store'});if(!x.ok){msg(x.status===401?'Enter correct admin passcode':'Could not load ZIP list');return}const d=await x.json();(d.results||[]).forEach(z=>{const o=document.createElement('option');o.value=z;o.textContent=z;$('zip').appendChild(o)});msg((d.results||[]).length+' unused ZIPs available')}async function loadList(){let x=await fetch('/admin/zips/manual',{headers:hdr()});if(!x.ok)return;let d=await x.json(),el=$('list');el.innerHTML='';d.results.forEach(a=>{let row=document.createElement('div');row.className='item';row.innerHTML='<span><b>'+a.zip_code+'</b> · '+a.name+'</span><button class="danger">Delete</button>';row.querySelector('button').onclick=()=>del(a.zip_code);el.appendChild(row)})}async function del(z){if(!confirm('Delete manual ZIP '+z+'?'))return;let x=await fetch('/admin/zips/manual/'+z,{method:'DELETE',headers:hdr()});msg(x.ok?'Deleted '+z:'Delete failed');loadList();loadZips();loadAssigned()}$('save').onclick=async()=>{let region=$('region').value,z=$('zip').value,name=$('name').value.trim();if(!region||!/^[0-9]{5}$/.test(z)||!name||pts.length<3){msg('Choose state + ZIP + name and draw at least 3 points');return}let coords=pts.map(p=>[p.lng,p.lat]);coords.push(coords[0]);let body={zip_code:z,postal_region:region,state_code:region,name,geometry:{type:'Polygon',coordinates:[coords]}};let x=await fetch('/admin/zips/manual',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await x.json();if(!x.ok){msg(d.detail||'Assignment failed');return}msg('Assigned '+z+' to '+name);pts=[];redraw();setDrawing(false);$('name').value='';loadZips();loadList();loadAssigned()};$('pass').onchange=()=>{loadZips();loadList()};$('pass').onblur=()=>{if($('region').value)loadZips()};function updateZipLabels(){if(!assignedLayer)return;const show=map.getZoom()>=8;assignedLayer.eachLayer(layer=>{const p=layer.feature&&layer.feature.properties||{},z=p.zip_code;if(!z)return;if(show){if(!layer.getTooltip())layer.bindTooltip(String(z),{permanent:true,direction:'center',className:'zip-label'+(p.manual?' manual':'')+(p.protected?' protected':''),opacity:.96});layer.openTooltip()}else if(layer.getTooltip())layer.unbindTooltip()})}async function loadAssigned(){try{let r=await fetch('/geography/zips',{cache:'no-store'});if(!r.ok)throw new Error();let g=await r.json();if(assignedLayer)map.removeLayer(assignedLayer);assignedLayer=L.geoJSON(g,{style:f=>{const p=f.properties||{};if(p.manual)return{color:'#ff3b7b',weight:3,fillColor:'#ff3b7b',fillOpacity:.18};if(p.protected)return{color:'#34d399',weight:2,fillColor:'#34d399',fillOpacity:.12};return{color:'#43a5ff',weight:1.5,fillColor:'#43a5ff',fillOpacity:.08}},onEachFeature:(f,l)=>{const p=f.properties||{};l.bindPopup('<b>ZIP '+(p.zip_code||'')+'</b><br>'+(p.name||p.state_name||'')+'<br>'+((p.district||p.postal_region||'')?('Area: '+(p.district||p.postal_region)):''))},interactive:true}).addTo(map);updateZipLabels()}catch(e){msg('Existing ZIP layer unavailable, but drawing is still available')}}map.on('zoomend',updateZipLabels);loadAssigned();</script></body></html>
