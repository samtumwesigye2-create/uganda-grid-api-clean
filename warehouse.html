<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGASHIP Warehouse Management</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:#0f1220;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.top a{color:#b9c4ff;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:16px}.hero,.panel{background:#fff;border:1px solid #dde3ea;border-radius:15px;padding:18px;margin-bottom:14px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#667085}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#3155e7;color:#fff}.secondary{background:#e9edf5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.layer{background:#fff;border:1px solid #dce2e9;border-radius:13px;padding:16px;text-align:left;min-height:150px;cursor:pointer}.layer:hover{border-color:#3155e7}.icon{font-size:25px}.layer b{display:block;margin:8px 0 5px;font-size:15px}.layer .desc{font-size:12px;color:#667085;line-height:1.45}.layer .steps{font-size:11px;color:#344054;margin-top:8px;line-height:1.5}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.card{background:#fff;border-radius:14px;padding:18px;width:min(620px,100%);max-height:94vh;overflow:auto}.card h2{margin-top:0}.workflow{background:#f7f8fa;border-radius:10px;padding:10px;margin-bottom:12px}.workflow button{margin:4px;padding:8px;border:1px solid #cbd5e1;background:white;border-radius:7px}.workflow button.sel{background:#172033;color:#fff}.card input,.card select,.card textarea{width:100%;padding:10px;margin:4px 0 9px;border:1px solid #cbd5e1;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.msg{font-size:13px;margin-top:9px}.recent{width:100%;border-collapse:collapse;font-size:12px}.recent th,.recent td{padding:8px;border-bottom:1px solid #eee;text-align:left}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}@media print{.top,.toolbar,.grid,.modal,.noPrint{display:none!important}body{background:white}.hero,.panel{border:0}.wrap{max-width:none}.recent{font-size:10pt}}</style></head><body><header class="top"><a href="/ship">← UGASHIP</a><b>Warehouse Management</b></header><main class="wrap"><section class="hero"><h1>UGASHIP Warehouse Management</h1><p>End-to-end warehouse execution, accuracy, safety and control.</p><div class="toolbar"><button class="btn primary" onclick="window.print()">🖨 Print Warehouse Report</button><button class="btn secondary" onclick="loadRecent()">↻ Refresh Records</button></div></section><section class="grid" id="layers"></section><section class="panel"><h3>Recent Warehouse Records</h3><div style="overflow:auto"><table class="recent"><thead><tr><th>Reference</th><th>Operation</th><th>Action</th><th>SKU</th><th>Qty</th><th>Location</th><th>Status</th><th>Date</th></tr></thead><tbody id="recent"><tr><td colspan="8">Enter staff access code in an operation to load protected records.</td></tr></tbody></table></div></section></main><div class="modal" id="modal"><div class="card"><h2 id="title"></h2><div class="workflow"><b>Workflow action</b><div id="workflow"></div></div><div class="row"><div><label>PO / Shipment / Reference</label><input id="shipment"></div><div><label>SKU / Asset ID</label><input id="sku"></div></div><div class="row"><div><label>Warehouse</label><input id="warehouse" value="main"></div><div><label>Quantity</label><input id="qty" type="number" min="0" value="1"></div></div><div class="row"><div><label>Bin / Zone / Dock / Location</label><input id="location"></div><div><label>Condition</label><select id="condition"><option value="good">Good</option><option value="inspection">Inspection</option><option value="damaged">Damaged</option><option value="returned">Returned</option><option value="quarantine">Quarantine</option><option value="secured">Secured</option></select></div></div><label>Checklist / Notes / Findings</label><textarea id="note" rows="4"></textarea><label>Staff access code</label><input id="code" type="password"><div class="actions"><button class="btn secondary" id="cancel">Cancel</button><button class="btn secondary" id="print">🖨 Print</button><button class="btn primary" id="save">Save Record</button></div><div class="msg" id="msg"></div></div></div><script>const layers=[
['receiving','📥','RECEIVING','Inbound verification and goods receipt',['verify_po:Verify PO','inspect_items:Inspect Items','receive:Receive Stock','create_grn:Create GRN','quality_check:Quality Check','discrepancy:Record Discrepancy']],
['putaway','📦','PUT-AWAY','Move received stock into controlled storage',['assign_location:Assign Location','fifo:FIFO','fefo:FEFO','store_scan:Store & Scan','confirm_bin:Confirm Bin']],
['storage','🏬','STORAGE','Organize SKUs and maintain safe storage',['organize_sku:Organize SKUs','slotting:Slotting','safety_check:Storage Safety','capacity:Capacity Check','housekeeping:Housekeeping']],
['picking','🛒','PICKING','Accurate order selection and verification',['pick_list:Pick List','pick:Pick Items','scan_verify:Scan & Verify','short_pick:Short Pick','substitution:Substitution']],
['packaging','🎁','PACKING','Verify, protect, label and seal shipments',['verify_items:Verify Items','secure_pack:Secure Packing','label:Label','seal:Seal','weight_check:Weight Check']],
['dispatch','🚚','DISPATCH','Outbound control and release',['manifest:Check Manifest','load_scan:Load & Scan','dispatch:Dispatch','gate_pass:Issue Gate Pass','handover:Carrier Handover']],
['inventory_control','📊','INVENTORY CONTROL','Maintain accurate physical and system stock',['cycle_count:Cycle Count','stock_audit:Stock Audit','variance:Variance Check','adjustment:Stock Adjustment','reconcile:Reconcile']],
['return','↩️','RETURNS','Inspect and process returned goods',['inspect_return:Inspect Return','sort_return:Sort Good / Bad','return_good:Return Good Stock','restock:Restock','vendor_return:Return to Vendor']],
['damaged','⚠️','DAMAGE CONTROL','Quarantine, investigate and dispose damaged stock',['inspect_damage:Inspect Damage','quarantine:Quarantine','claim:Damage Claim','write_off:Write Off','dispose:Dispose']],
['safety_security','🛡️','SAFETY & SECURITY','Protect staff, inventory and facility',['ppe:PPE Check','access:Monitor Access','fire:Fire Safety','incident:Safety Incident','inspection:Security Inspection','emergency:Emergency Check']],
['documentation','📄','DOCUMENTATION','Complete warehouse records and traceability',['record:Record Keeping','report:Operational Report','manifest_doc:Manifest','grn_doc:GRN Record','audit_doc:Audit Trail','accuracy_doc:Data Accuracy']],
['layout','🗺️','LAYOUT','Improve space use and movement',['space:Space Utilization','zone:Zone Assignment','aisle:Aisle Check','dock:Dock Planning','fast_pick:Fast Pick Area','storage_plan:Storage Plan']],
['optimization','⚙️','OPTIMIZATION','Improve capacity, speed and productivity',['workflow:Workflow Review','bottleneck:Bottleneck Check','capacity_opt:Capacity Optimization','labor:Labor Planning','kpi:KPI Review','route_opt:Pick Route Optimization']],
['equipment_management','🏗️','EQUIPMENT MANAGEMENT','Keep warehouse equipment safe and ready',['inspection_eq:Equipment Inspection','maintenance:Maintenance','checklist:Checklist','readiness:Readiness','fault:Report Fault','service:Service Record']],
['accuracy','🎯','ACCURACY / REDUCE ERRORS','Prevent inventory and fulfillment mistakes',['double_check:Double Check','barcode:Barcode Verification','location_verify:Location Verify','quantity_verify:Quantity Verify','error_report:Error Report','corrective:Corrective Action']]
];let current='receiving',action='';const $=x=>document.getElementById(x);$('layers').innerHTML=layers.map(x=>`<button class="layer" data-op="${x[0]}"><div class="icon">${x[1]}</div><b>${x[2]}</b><div class="desc">${x[3]}</div><div class="steps">${x[4].slice(0,4).map(s=>s.split(':')[1]).join(' • ')}</div></button>`).join('');function openLayer(op){current=op;let x=layers.find(v=>v[0]===op);$('title').textContent=x[1]+' '+x[2];$('workflow').innerHTML=x[4].map((s,i)=>{let [v,l]=s.split(':');return `<button data-action="${v}" class="${i===0?'sel':''}">${l}</button>`}).join('');action=x[4][0].split(':')[0];$('workflow').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('workflow').querySelectorAll('button').forEach(q=>q.classList.remove('sel'));b.classList.add('sel');action=b.dataset.action});$('msg').textContent='';$('modal').classList.add('open')};document.querySelectorAll('.layer').forEach(b=>b.onclick=()=>openLayer(b.dataset.op));$('cancel').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('print').onclick=()=>window.print();$('save').onclick=async()=>{let m=$('msg');m.textContent='Saving…';let details={action,condition:$('condition').value,location:$('location').value.trim()};let f=new URLSearchParams({operation_type:current,action_code:action,shipment_id:$('shipment').value.trim(),sku:$('sku').value.trim(),warehouse_id:$('warehouse').value.trim()||'main',quantity:$('qty').value||'0',location_code:$('location').value.trim(),condition_code:$('condition').value,note:$('note').value.trim(),details_json:JSON.stringify(details)});try{let r=await fetch('/warehouse/operations',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','x-access-code':$('code').value},body:f});let d=await r.json();if(!r.ok)throw Error(d.detail||'Save failed');m.innerHTML='Saved: <b>'+d.reference_no+'</b> — ready to print.';m.style.color='#087b4c';loadRecent()}catch(e){m.textContent=e.message;m.style.color='#b42318'}};async function loadRecent(){let code=$('code').value;if(!code)return;try{let r=await fetch('/warehouse/operations?limit=50',{headers:{'x-access-code':code},cache:'no-store'});let d=await r.json();if(!r.ok)return;$('recent').innerHTML=(d.results||[]).map(x=>`<tr><td>${x.reference_no||x.id.slice(0,8)}</td><td>${x.operation_type}</td><td>${x.action_code||''}</td><td>${x.sku||''}</td><td>${x.quantity||0}</td><td>${x.location_code||''}</td><td>${x.status}</td><td>${new Date(x.created_at*1000).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="8">No records yet.</td></tr>'}catch(e){}};</script></body></html>
