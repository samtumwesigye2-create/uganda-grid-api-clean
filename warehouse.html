<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGASHIP Warehouse Management</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:#0f1220;color:#fff;padding:18px}.top a{color:#9fb0ff;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:18px}.hero{background:#fff;border:1px solid #dde3ea;border-radius:16px;padding:20px;margin-bottom:16px}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#667085}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.layer{background:#fff;border:1px solid #dde3ea;border-radius:14px;padding:18px;text-align:left;min-height:125px;cursor:pointer}.layer:hover{border-color:#3b5bfd}.icon{font-size:26px}.layer b{display:block;margin:9px 0 5px;font-size:16px}.layer span{font-size:12px;color:#667085;line-height:1.4}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.card{background:#fff;border-radius:14px;padding:18px;width:min(500px,100%);max-height:90vh;overflow:auto}.card input,.card select,.card textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #cbd5e1;border-radius:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{padding:12px;border:0;border-radius:8px;font-weight:700}.save{background:#3b5bfd;color:#fff}.cancel{background:#e5e7eb}.msg{font-size:13px;margin-top:10px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="/ship">← Ship & Mail</a></div><main class="wrap"><section class="hero"><h1>UGASHIP Warehouse Management</h1><p>Warehouse operations, control, safety, documentation, layout, optimization and equipment management.</p></section><section class="grid" id="layers"></section></main><div class="modal" id="modal"><div class="card"><h2 id="title">Operation</h2><label>Shipment / reference ID</label><input id="shipment"><label>SKU / asset ID</label><input id="sku"><label>Warehouse</label><input id="warehouse" value="main"><label>Quantity</label><input id="qty" type="number" min="0" value="1"><label>Location / bin / zone</label><input id="location"><label>Condition / classification</label><select id="condition"><option>good</option><option>damaged</option><option>returned</option><option>inspection</option><option>secured</option></select><label>Notes / documentation</label><textarea id="note" rows="4"></textarea><label>Staff access code</label><input id="code" type="password"><div class="actions"><button class="cancel" id="cancel">Cancel</button><button class="save" id="save">Save</button></div><div class="msg" id="msg"></div></div></div><script>const L=[['receiving','📥','Receiving','Inbound receipt, verification and intake'],['picking','🛒','Picking','Pick inventory for orders and shipments'],['putaway','📦','Put Away','Assign received stock to warehouse locations'],['packaging','🎁','Packaging','Packing and shipment preparation'],['dispatch','🚚','Dispatch','Outbound staging, loading and release'],['return','↩️','Returns','Returned-item intake and disposition'],['damaged','⚠️','Damaged','Damage reporting, quarantine and stock control'],['inventory_control','📊','Inventory Control','Counts, adjustments, stock accuracy and reconciliation'],['safety_security','🛡️','Safety & Security','Safety inspections, security events and access control'],['documentation','📄','Documentation','Warehouse records, manifests and operational documents'],['layout','🗺️','Layout','Zones, bins, docks, aisles and storage layout'],['optimization','⚙️','Optimization','Workflow, capacity and productivity improvements'],['equipment_management','🏗️','Equipment Management','Forklifts, scanners, vehicles and warehouse equipment']];let current='receiving';const $=x=>document.getElementById(x);$('layers').innerHTML=L.map(x=>`<button class="layer" data-op="${x[0]}"><div class="icon">${x[1]}</div><b>${x[2]}</b><span>${x[3]}</span></button>`).join('');document.querySelectorAll('.layer').forEach(b=>b.onclick=()=>{current=b.dataset.op;let x=L.find(v=>v[0]===current);$('title').textContent=x[1]+' '+x[2];$('msg').textContent='';$('modal').classList.add('open')});$('cancel').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('save').onclick=async()=>{let m=$('msg');m.textContent='Saving…';m.style.color='#555';let f=new URLSearchParams({operation_type:current,shipment_id:$('shipment').value.trim(),sku:$('sku').value.trim(),warehouse_id:$('warehouse').value.trim()||'main',quantity:$('qty').value||'0',location_code:$('location').value.trim(),condition_code:$('condition').value,note:$('note').value.trim()});try{let r=await fetch('/warehouse/operations',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','x-access-code':$('code').value},body:f});let d=await r.json();if(!r.ok)throw Error(d.detail||'Save failed');m.textContent='Saved successfully.';m.style.color='#087b4c'}catch(e){m.textContent=e.message;m.style.color='#b42318'}};</script></body></html>
