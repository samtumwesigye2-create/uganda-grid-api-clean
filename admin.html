<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Admin - Uganda National Grid</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3}
  header{background:#111827;padding:16px;text-align:center}
  header h1{margin:0;font-size:20px}
  main{max-width:480px;margin:40px auto;padding:16px}
  .loginBox{background:#161b22;border-radius:12px;padding:24px;border:1px solid #2a3150}
  label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}
  input,button{width:100%;font-size:16px;border-radius:8px;padding:12px;border:1px solid #2a3150;box-sizing:border-box}
  input{background:#0d1117;color:#e6edf3;margin-bottom:12px}
  button{border:0;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}
  button:disabled{opacity:.6;cursor:default}
  #loginStatus{font-size:13px;margin-top:10px;color:#9ca3af}
  #panel{display:none;margin-top:20px}
  .row{background:#161b22;border:1px solid #2a3150;border-radius:12px;padding:16px;margin-bottom:12px}
</style>
</head>
<body>
<header><h1>Admin</h1></header>
<main>
  <div id="loginSection" class="loginBox">
    <label for="passcodeInput">Admin passcode</label>
    <input type="password" id="passcodeInput" placeholder="Passcode" autocomplete="off" />
    <button id="unlockBtn">Unlock</button>
    <div id="loginStatus"></div>
  </div>

  <div id="panel">
    <div class="row">
      <p>You're in. This confirms the passcode is being accepted by the backend.</p>
      <p style="color:#9ca3af;font-size:13px">Pending submissions: <span id="pendingCount">–</span></p>
    </div>
    <button id="lockBtn" style="background:#374151">Lock</button>
  </div>
</main>

<script>
(function () {
  var passcode = '';
  var passcodeInput = document.getElementById('passcodeInput');
  var unlockBtn = document.getElementById('unlockBtn');
  var loginStatus = document.getElementById('loginStatus');
  var loginSection = document.getElementById('loginSection');
  var panel = document.getElementById('panel');
  var lockBtn = document.getElementById('lockBtn');
  var pendingCount = document.getElementById('pendingCount');

  // Same-origin only — this page is served by the same API it talks to,
  // so no cross-origin guessing needed.
  var API_BASE = location.origin;

  async function tryUnlock() {
    passcode = passcodeInput.value;
    if (!passcode) {
      loginStatus.textContent = 'Enter a passcode first.';
      return;
    }
    unlockBtn.disabled = true;
    loginStatus.textContent = 'Checking...';

    try {
      var r = await fetch(API_BASE + '/submissions?status=pending', {
        headers: { 'X-Admin-Passcode': passcode }
      });

      if (r.status === 401) {
        loginStatus.textContent = 'Incorrect passcode — rejected by server.';
        unlockBtn.disabled = false;
        return;
      }
      if (!r.ok) {
        loginStatus.textContent = 'Server error (' + r.status + '). Try again.';
        unlockBtn.disabled = false;
        return;
      }

      var data = await r.json();
      pendingCount.textContent = data.count;
      loginSection.style.display = 'none';
      panel.style.display = 'block';
    } catch (e) {
      loginStatus.textContent = 'Network error — could not reach ' + API_BASE;
      unlockBtn.disabled = false;
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);
  passcodeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryUnlock();
  });

  lockBtn.addEventListener('click', function () {
    passcode = '';
    passcodeInput.value = '';
    loginStatus.textContent = '';
    unlockBtn.disabled = false;
    panel.style.display = 'none';
    loginSection.style.display = 'block';
  });
})();
</script>
</body>
</html>
