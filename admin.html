l<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Test Shipment</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background:#0f1220; color:#eee; margin:0; padding:16px; min-height:100vh;
  }
  .wrap { max-width:480px; margin:0 auto; }
  h1 { font-size:20px; text-align:center; margin:24px 0 6px; }
  .subtitle { text-align:center; color:#999; font-size:13px; margin-bottom:24px; }
  label { display:block; font-size:12px; color:#999; margin:14px 0 6px; }
  input {
    width:100%; padding:10px; border-radius:8px; border:1px solid #333;
    background:#1a1d2e; color:#eee; font-size:14px; font-family:inherit;
  }
  button {
    width:100%; margin-top:20px; padding:12px; border:none; border-radius:8px;
    background:#3b5bfd; color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:disabled { opacity:.6; }
  .box {
    display:none; border-radius:8px; padding:12px 14px; font-size:13px; margin-top:16px;
    word-break: break-word;
  }
  .box.show { display:block; }
  .errorBox { background:#2a1414; border:1px solid #5a2a2a; color:#f0a3a3; }
  .successBox { background:#132a18; border:1px solid #275c34; color:#a3f0b8; }
  .num { font-weight:700; font-size:16px; user-select:all; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Create Test Shipment</h1>
  <div class="subtitle">Creates a draft, then marks it paid (cash) so it's ready to test in Shipment Admin.</div>

  <label>Base URL (your Railway app)</label>
  <input id="baseUrl" value="https://uganda-grid-api-clean-production.up.railway.app" />

  <label>Admin passcode</label>
  <input id="passcode" placeholder="same one set in Shipment Admin" />

  <label>Pickup (grid ID or address)</label>
  <input id="pickup" value="UG-ENT-000001" />

  <label>Delivery (grid ID or address)</label>
  <input id="delivery" value="UG-ENT-000002" />

  <label>Weight (kg)</label>
  <input id="weight" value="2" />

  <label>Recipient email (for the notification test)</label>
  <input id="recipientEmail" value="samtumwesigye2@gmail.com" />

  <label>Recipient name</label>
  <input id="recipientName" value="Test Customer" />

  <button id="btn" onclick="run()">Create &amp; Mark Paid</button>

  <div class="box errorBox" id="errorBox"></div>
  <div class="box successBox" id="successBox"></div>
</div>

<script>
async function run() {
  const btn = document.getElementById('btn');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  errorBox.classList.remove('show');
  successBox.classList.remove('show');

  const base = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
  const passcode = document.getElementById('passcode').value;
  if (!passcode) {
    errorBox.textContent = 'Enter the admin passcode.';
    errorBox.classList.add('show');
    return;
  }

  btn.disabled = true;
  try {
    // Step 1: create the draft
    const createBody = new URLSearchParams({
      pickup: document.getElementById('pickup').value,
      delivery: document.getElementById('delivery').value,
      weight_kg: document.getElementById('weight').value,
      speed_tier: 'seven_day',
      recipient_name: document.getElementById('recipientName').value,
      recipient_email: document.getElementById('recipientEmail').value,
    });
    const createRes = await fetch(base + '/ship/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: createBody.toString(),
    });
    if (!createRes.ok) {
      const d = await createRes.json().catch(() => ({}));
      throw new Error('Create failed: ' + (d.detail || createRes.status));
    }
    const createData = await createRes.json();
    const draftId = createData.id;

    // Step 2: mark it paid via cash
    const payRes = await fetch(base + '/ship/' + encodeURIComponent(draftId) + '/pay/cash', {
      method: 'POST',
      headers: { 'X-Admin-Passcode': passcode },
    });
    if (!payRes.ok) {
      const d = await payRes.json().catch(() => ({}));
      throw new Error('Cash-pay failed: ' + (d.detail || payRes.status));
    }
    const payData = await payRes.json();

    successBox.innerHTML = 'Created and paid! Tracking number:<br>' +
      '<span class="num">' + payData.shipment_number + '</span><br><br>' +
      'Copy this into Shipment Admin\'s Look Up box.';
    successBox.classList.add('show');
  } catch (e) {
    errorBox.textContent = e.message;
    errorBox.classList.add('show');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
