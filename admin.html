<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uganda National Grid Admin</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#0f1220; color:#eee; margin:0; padding:16px; }
  h1 { font-size:22px; text-align:center; margin-bottom:20px; }
  #passGate { max-width:320px; margin:80px auto; text-align:center; }
  #passGate input { width:100%; padding:10px; border-radius:8px; border:1px solid #333; background:#1a1d2e; color:#eee; margin-bottom:10px; }
  #passGate button { width:100%; padding:10px; border-radius:8px; border:none; background:#e2593a; color:#fff; font-size:15px; }
  #main { display:none; max-width:900px; margin:0 auto; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; }
  .tab { padding:10px 16px; border-radius:8px; border:1px solid #333; background:#1a1d2e; color:#ccc; cursor:pointer; font-size:14px; }
  .tab.active { background:#3b5bfd; color:#fff; border-color:#3b5bfd; }
  .panel { display:none; }
  .panel.active { display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  th, td { border:1px solid #2a2d3e; padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#1a1d2e; }
  .refreshBtn { padding:8px 12px; border-radius:6px; border:none; background:#3b5bfd; color:#fff; margin-bottom:10px; }
  .empty { color:#888; padding:20px; text-align:center; }
  .badge { padding:2px 8px; border-radius:6px; font-size:12px; }
  .pending { background:#fde8d4; color:#a35b00; }
  .approved, .paid { background:#d4f4dd; color:#1a7a37; }
  .denied { background:#fbd4d4; color:#a30000; }
</style>
</head>
<body>

<div id="passGate">
  <h1>Admin Login</h1>
  <input id="pass" type="password" placeholder="Admin passcode" />
  <button onclick="unlock()">Enter</button>
</div>

<div id="main">
  <h1>Uganda National Grid Admin</h1>
  <div class="tabs">
    <div class="tab active" data-tab="submissions">Submissions</div>
    <div class="tab" data-tab="reports">Reports</div>
    <div class="tab" data-tab="mailing">Mailing</div>
    <div class="tab" data-tab="shipments">Shipments</div>
    <div class="tab" data-tab="data">Data</div>
  </div>

  <div class="panel active" id="panel-submissions">
    <button class="refreshBtn" onclick="loadSubmissions()">Refresh</button>
    <div id="submissionsOut"></div>
  </div>

  <div class="panel" id="panel-reports">
    <button class="refreshBtn" onclick="loadReports()">Refresh</button>
    <div id="reportsOut"></div>
  </div>

  <div class="panel" id="panel-mailing">
    <button class="refreshBtn" onclick="loadMailing()">Refresh</button>
    <div id="mailingOut"></div>
  </div>

  <div class="panel" id="panel-shipments">
    <button class="refreshBtn" onclick="loadShipments()">Refresh</button>
    <div id="shipmentsOut"></div>
  </div>

  <div class="panel" id="panel-data">
    <input id="filterType" placeholder="Filter by form_type (blank = all)" style="padding:8px;border-radius:6px;border:1px solid #333;background:#1a1d2e;color:#eee;" />
    <button class="refreshBtn" onclick="loadData()">Refresh</button>
    <button class="refreshBtn" onclick="exportData()">Export CSV</button>
    <div id="dataStats" style="color:#aaa;font-size:13px;margin:8px 0;"></div>
    <div id="dataOut"></div>
  </div>
</div>

<script>
let PASS = "";

function unlock() {
  PASS = document.getElementById('pass').value;
  document.getElementById('passGate').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  loadSubmissions();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    document.getElementById('panel-' + name).classList.add('active');
    if (name === 'submissions') loadSubmissions();
    if (name === 'reports') loadReports();
    if (name === 'mailing') loadMailing();
    if (name === 'shipments') loadShipments();
    if (name === 'data') loadData();
  });
});

async function authedFetch(url) {
  const res = await fetch(url, { headers: { 'X-Admin-Passcode': PASS } });
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

function renderTable(container, rows, columns) {
  if (!rows.length) {
    container.innerHTML = '<div class="empty">No records yet.</div>';
    return;
  }
  let html = '<table><thead><tr>';
  columns.forEach(c => html += `<th>${c.label}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr>';
    columns.forEach(c => html += `<td>${c.render ? c.render(r) : (r[c.key] ?? '')}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

async function loadSubmissions() {
  const out = document.getElementById('submissionsOut');
  try {
    const data = await authedFetch('/submissions');
    renderTable(out, data.results, [
      { label: 'Building', key: 'building_type' },
      { label: 'Note', key: 'note' },
      { label: 'Status', render: r => `<span class="badge ${r.status}">${r.status}</span>` },
      { label: 'Assigned', render: r => r.assigned_grid_id || '—' },
    ]);
  } catch (e) { out.innerHTML = '<div class="empty">Error loading submissions.</div>'; }
}

async function loadReports() {
  const out = document.getElementById('reportsOut');
  try {
    const res = await fetch('/reports');
    const data = await res.json();
    renderTable(out, data.results, [
      { label: 'Category', key: 'category' },
      { label: 'Note', key: 'note' },
      { label: 'Location', render: r => `${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}` },
    ]);
  } catch (e) { out.innerHTML = '<div class="empty">Error loading reports.</div>'; }
}

async function loadMailing() {
  const out = document.getElementById('mailingOut');
  try {
    const data = await authedFetch('/mail/list');
    renderTable(out, data.results, [
      { label: 'Email', key: 'email' },
      { label: 'Name', key: 'name' },
      { label: 'Subscribed', render: r => new Date(r.created_at * 1000).toLocaleDateString() },
    ]);
  } catch (e) { out.innerHTML = '<div class="empty">Error loading mailing list.</div>'; }
}

async function loadShipments() {
  const out = document.getElementById('shipmentsOut');
  try {
    const data = await authedFetch('/ship/list');
    renderTable(out, data.results, [
      { label: '#', key: 'shipment_number' },
      { label: 'Pickup', key: 'pickup' },
      { label: 'Delivery', key: 'delivery' },
      { label: 'Weight', render: r => r.weight_kg + ' kg' },
      { label: 'Rate', render: r => 'UGX ' + Number(r.rate_ugx).toLocaleString() },
      { label: 'Status', render: r => `<span class="badge ${r.status === 'paid' ? 'paid' : 'pending'}">${r.status}</span>` },
    ]);
  } catch (e) { out.innerHTML = '<div class="empty">Error loading shipments.</div>'; }
}

async function loadData() {
  const type = document.getElementById('filterType').value.trim();
  const out = document.getElementById('dataOut');
  const statsBox = document.getElementById('dataStats');
  try {
    const url = '/data/records' + (type ? ('?form_type=' + encodeURIComponent(type)) : '');
    const data = await authedFetch(url);
    renderTable(out, data.results, [
      { label: 'Type', key: 'form_type' },
      { label: 'Data', render: r => `<pre style="white-space:pre-wrap;margin:0;font-size:12px;">${JSON.stringify(r.payload, null, 2)}</pre>` },
      { label: 'Created', render: r => new Date(r.created_at * 1000).toLocaleString() },
    ]);
    const stats = await authedFetch('/data/stats');
    statsBox.textContent = `Total: ${stats.total_records} — ` +
      Object.entries(stats.by_form_type).map(([k, v]) => `${k}: ${v}`).join(', ');
  } catch (e) { out.innerHTML = '<div class="empty">Error loading data.</div>'; }
}

function exportData() {
  const type = document.getElementById('filterType').value.trim();
  const url = '/data/export.csv' + (type ? ('?form_type=' + encodeURIComponent(type)) : '');
  fetch(url, { headers: { 'X-Admin-Passcode': PASS } })
    .then(res => res.blob())
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'data_export.csv';
      a.click();
    });
}
</script>
</body>
</html>
