<!-- Create Shipment box now looks like this -->
<div class="formBox">
  <h3 style="margin-top:0;">Create Shipment</h3>
  <div class="row2">
    <input id="newShipPickup" placeholder="Pickup grid ID or address" />
    <input id="newShipDelivery" placeholder="Delivery grid ID or address" />
  </div>
  <input id="newShipWeight" type="number" step="0.1" placeholder="Weight (kg)" />
  <button onclick="getShipmentRates()">Get Rates</button>
  <div id="shipRatesOut" style="margin-top:10px;"></div>

  <div id="shipCreateFields" style="display:none; margin-top:10px;">
    <div class="row2">
      <input id="newShipSenderName" placeholder="Sender name (optional)" />
      <input id="newShipSenderPhone" placeholder="Sender phone (optional)" />
    </div>
    <div class="row2">
      <input id="newShipRecipientName" placeholder="Recipient name (optional)" />
      <input id="newShipRecipientPhone" placeholder="Recipient phone (optional)" />
    </div>
    <button onclick="createShipment()">Create Shipment</button>
  </div>
  <div id="newShipResult" style="margin-top:10px; font-size:13px;"></div>
</div>
