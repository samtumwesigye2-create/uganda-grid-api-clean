<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uganda National Grid Invoice</title><link rel="stylesheet" href="/business-documents/one-page-print.css?v=2"><style>@page{size:auto;margin:8mm}body{margin:0;background:#f4f7fb;color:#102030;font:14px system-ui}.bar{padding:10px;text-align:center;background:white;border-bottom:1px solid #ddd}.doc{max-width:900px;margin:20px auto;background:white;padding:28px;border-radius:12px}.brand{display:flex;align-items:center;gap:12px;padding:0 0 10px;border-bottom:2px solid #111827;margin-bottom:12px}.brand img{width:82px;height:56px;object-fit:contain;display:block}.brandText{line-height:1.1}.brandName{font-size:18px;font-weight:800;letter-spacing:.02em;color:#0b1220}.brandTag{font-size:9px;color:#667085;margin-top:3px;text-transform:uppercase;letter-spacing:.08em}.head{display:flex;justify-content:space-between;gap:18px;border-bottom:3px solid #0f4c81;padding-bottom:10px}h1,h2{color:#0f4c81;margin:8px 0}h3{margin:12px 0 6px}input,textarea{width:100%;border:0;border-bottom:1px dashed #aaa;padding:4px;background:transparent}textarea{min-height:34px;resize:vertical}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:6px;border-bottom:1px solid #ddd;text-align:left}.num{text-align:right}.tot{margin-left:auto;max-width:320px}.tot div{display:flex;justify-content:space-between;padding:5px}.grand{font-size:18px;font-weight:bold}button{padding:9px 13px;border:0;border-radius:7px;background:#0f4c81;color:white}@media print{html,body{width:100%;height:auto;background:#fff;font-size:10.5px}.bar,.remove{display:none!important}.doc{margin:0;padding:0;max-width:none;border-radius:0;box-shadow:none}.brand{gap:8px;padding-bottom:6px;margin-bottom:7px}.brand img{width:58px;height:40px}.brandName{font-size:14px}.brandTag{font-size:7px}.head{gap:12px;padding-bottom:6px}h1{font-size:16px;margin:4px 0}h2{font-size:15px;margin:4px 0}h3{font-size:11px;margin:7px 0 3px}input,textarea{font-size:10px;padding:2px}textarea{min-height:22px;height:22px}table{margin-top:5px}th,td{padding:3px;font-size:9.5px}.tot{max-width:260px}.tot div{padding:2px}.grand{font-size:13px}.brand,.head,table,.tot,h3{break-inside:avoid;page-break-inside:avoid}}@media(max-width:650px){.head{display:block}.doc{margin:0;padding:16px}.brand img{width:66px;height:46px}.brandName{font-size:15px}}</style></head><body><div class="bar"><button onclick="print()">Print / Save PDF</button> <button onclick="add()">+ Add Line</button></div><main class="doc"><div class="brand"><img src="/assets/uganda-national-grid-logo.png?v=official2" alt="Uganda National Grid"><div class="brandText"><div class="brandName">UGANDA NATIONAL GRID</div><div class="brandTag">Connecting People. Powering Progress.</div></div></div><div class="head"><div><h1>Uganda National Grid</h1><input placeholder="Office / branch address"><input placeholder="Phone • Email • Website"></div><div><h2>INVOICE</h2><label>Invoice # <input value="INV-1001"></label><label>Date <input type="date"></label><label>Due <input type="date"></label></div></div><h3>BILL TO</h3><input placeholder="Customer / Company"><textarea placeholder="Billing address"></textarea><table id="items"><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th class="num">Amount</th><th class="remove"></th></tr></thead><tbody><tr><td><input placeholder="Product / service"></td><td><input class="q" type="number" value="1"></td><td><input class="r" type="number" step=".01" value="0"></td><td class="a num">0.00</td><td class="remove"><button onclick="this.closest('tr').remove();calc()">×</button></td></tr></tbody></table><div class="tot"><div><span>Subtotal</span><b id="sub">0.00</b></div><div><span>Tax % <input id="tax" type="number" value="0" style="width:70px"></span><b id="ta">0.00</b></div><div class="grand"><span>TOTAL</span><b id="total">0.00</b></div></div><h3>PAYMENT / NOTES</h3><textarea placeholder="Payment instructions and terms"></textarea></main><script>function calc(){let s=0;document.querySelectorAll('#items tbody tr').forEach(x=>{let v=(+x.querySelector('.q').value||0)*(+x.querySelector('.r').value||0);x.querySelector('.a').textContent=v.toFixed(2);s+=v});let t=s*(+tax.value||0)/100;sub.textContent=s.toFixed(2);ta.textContent=t.toFixed(2);total.textContent=(s+t).toFixed(2)}function add(){let x=document.querySelector('#items tbody').insertRow();x.innerHTML='<td><input placeholder="Product / service"></td><td><input class="q" type="number" value="1"></td><td><input class="r" type="number" step=".01" value="0"></td><td class="a num">0.00</td><td class="remove"><button onclick="this.closest(\'tr\').remove();calc()">×</button></td>';calc()}document.addEventListener('input',calc);calc()</script></body></html>
