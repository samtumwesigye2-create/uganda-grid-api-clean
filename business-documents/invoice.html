<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uganda National Grid Invoice</title><style>body{margin:0;background:#f4f7fb;color:#102030;font:14px system-ui}.bar{padding:10px;text-align:center;background:white;border-bottom:1px solid #ddd}.doc{max-width:900px;margin:20px auto;background:white;padding:32px;border-radius:12px}.brand{display:flex;align-items:center;gap:14px;padding:0 0 16px;border-bottom:2px solid #111827;margin-bottom:20px}.brand img{width:92px;height:64px;object-fit:contain;display:block}.brandText{line-height:1.15}.brandName{font-size:19px;font-weight:800;letter-spacing:.02em;color:#0b1220}.brandTag{font-size:10px;color:#667085;margin-top:4px;text-transform:uppercase;letter-spacing:.08em}.head{display:flex;justify-content:space-between;border-bottom:3px solid #0f4c81;padding-bottom:18px}h1,h2{color:#0f4c81}input,textarea{width:100%;border:0;border-bottom:1px dashed #aaa;padding:5px;background:transparent}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.num{text-align:right}.tot{margin-left:auto;max-width:350px}.tot div{display:flex;justify-content:space-between;padding:7px}.grand{font-size:20px;font-weight:bold}button{padding:9px 13px;border:0;border-radius:7px;background:#0f4c81;color:white}@media print{body{background:#fff}.bar,.remove{display:none}.doc{margin:0;padding:20px;max-width:none}.brand{break-inside:avoid}.brand img{width:78px;height:54px}}@media(max-width:650px){.head{display:block}.doc{margin:0;padding:18px}.brand img{width:72px;height:50px}.brandName{font-size:16px}}</style></head><body><div class="bar"><button onclick="print()">Print / Save PDF</button> <button onclick="add()">+ Add Line</button></div><main class="doc"><div class="brand"><img src="/assets/uganda-national-grid-logo.png?v=official2" alt="Uganda National Grid"><div class="brandText"><div class="brandName">UGANDA NATIONAL GRID</div><div class="brandTag">Connecting People. Powering Progress.</div></div></div><div class="head"><div><h1>Uganda National Grid</h1><input placeholder="Office / branch address"><input placeholder="Phone • Email • Website"></div><div><h2>INVOICE</h2><label>Invoice # <input value="INV-1001"></label><label>Date <input type="date"></label><label>Due <input type="date"></label></div></div><h3>BILL TO</h3><input placeholder="Customer / Company"><textarea placeholder="Billing address"></textarea><table id="items"><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th class="num">Amount</th><th class="remove"></th></tr></thead><tbody><tr><td><input placeholder="Product / service"></td><td><input class="q" type="number" value="1"></td><td><input class="r" type="number" step=".01" value="0"></td><td class="a num">0.00</td><td class="remove"><button onclick="this.closest('tr').remove();calc()">×</button></td></tr></tbody></table><div class="tot"><div><span>Subtotal</span><b id="sub">0.00</b></div><div><span>Tax % <input id="tax" type="number" value="0" style="width:70px"></span><b id="ta">0.00</b></div><div class="grand"><span>TOTAL</span><b id="total">0.00</b></div></div><h3>PAYMENT / NOTES</h3><textarea placeholder="Payment instructions and terms"></textarea></main><script>function calc(){let s=0;document.querySelectorAll('#items tbody tr').forEach(x=>{let v=(+x.querySelector('.q').value||0)*(+x.querySelector('.r').value||0);x.querySelector('.a').textContent=v.toFixed(2);s+=v});let t=s*(+tax.value||0)/100;sub.textContent=s.toFixed(2);ta.textContent=t.toFixed(2);total.textContent=(s+t).toFixed(2)}function add(){let x=document.querySelector('#items tbody').insertRow();x.innerHTML='<td><input placeholder="Product / service"></td><td><input class="q" type="number" value="1"></td><td><input class="r" type="number" step=".01" value="0"></td><td class="a num">0.00</td><td class="remove"><button onclick="this.closest(\'tr\').remove();calc()">×</button></td>';calc()}document.addEventListener('input',calc);calc()</script></body></html>
