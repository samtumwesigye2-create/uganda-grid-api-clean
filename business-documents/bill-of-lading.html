<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill of Lading</title><style>body{margin:0;background:#f4f7fb;color:#102030;font:14px system-ui}.bar{text-align:center;padding:10px;background:#fff}.doc{max-width:900px;margin:20px auto;background:#fff;padding:32px}.head,.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.head{border-bottom:3px solid #0f4c81}.box{border:1px solid #ddd;padding:12px;margin-top:18px}h1,h2{color:#0f4c81}input,textarea,select{width:100%;border:0;border-bottom:1px dashed #aaa;padding:5px;background:transparent}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:9px;border:1px solid #ddd}button{padding:9px 13px;border:0;border-radius:7px;background:#0f4c81;color:white}.sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:50px}.line{border-top:1px solid #222;padding-top:6px}@media print{.bar{display:none}.doc{margin:0}}@media(max-width:650px){.head,.grid,.sig{grid-template-columns:1fr}.doc{margin:0;padding:18px}}</style></head><body><div class="bar"><button onclick="print()">Print / Save PDF</button></div><main class="doc"><div class="head"><div><h1><input value="YOUR CARRIER / COMPANY"></h1><input placeholder="Address"><input placeholder="Phone • Email"></div><div><h2>BILL OF LADING</h2><label>BOL # <input value="BOL-1001"></label><label>Date <input type="date"></label></div></div><div class="grid"><div class="box"><b>SHIPPER</b><input placeholder="Shipper name"><textarea placeholder="Pickup address"></textarea></div><div class="box"><b>CONSIGNEE</b><input placeholder="Consignee name"><textarea placeholder="Delivery address"></textarea></div></div><div class="grid"><div class="box"><b>CARRIER</b><input placeholder="Carrier"></div><div class="box"><b>TRACKING / PRO #</b><input placeholder="Tracking number"></div></div><table><tr><th>Packages</th><th>Description of Goods</th><th>Weight</th><th>Class / NMFC</th><th>Hazmat</th></tr><tr><td><input value="1"></td><td><textarea placeholder="Commodity description"></textarea></td><td><input placeholder="0 lb"></td><td><input placeholder="Class"></td><td><select><option>No</option><option>Yes</option></select></td></tr></table><div class="box"><b>SPECIAL INSTRUCTIONS</b><textarea placeholder="Handling / delivery instructions"></textarea></div><div class="sig"><div class="line">Shipper signature / date</div><div class="line">Carrier signature / date</div></div></main></body></html>
