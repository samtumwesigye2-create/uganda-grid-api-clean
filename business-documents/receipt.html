<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt</title><style>body{margin:0;background:#f4f7fb;color:#102030;font:14px system-ui}.bar{text-align:center;padding:10px;background:#fff}.doc{max-width:900px;margin:20px auto;background:#fff;padding:32px}.head{display:flex;justify-content:space-between;border-bottom:3px solid #0f4c81}h1,h2{color:#0f4c81}.paid{color:#137333;font-weight:bold}input,textarea,select{width:100%;border:0;border-bottom:1px dashed #aaa;padding:5px;background:transparent}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:9px;border-bottom:1px solid #ddd}.num{text-align:right}.tot{margin-left:auto;max-width:350px}.tot div{display:flex;justify-content:space-between;padding:7px}.grand{font-size:20px;font-weight:bold}button{padding:9px 13px;border:0;border-radius:7px;background:#0f4c81;color:#fff}@media print{.bar,.remove{display:none}.doc{margin:0}}@media(max-width:650px){.head{display:block}.doc{margin:0;padding:18px}}</style></head><body><div class="bar"><button onclick="print()">Print / Save PDF</button> <button onclick="add()">+ Add Line</button></div><main class="doc"><div class="head"><div><h1><input value="YOUR COMPANY NAME"></h1><input placeholder="Address"><input placeholder="Phone • Email"></div><div><h2>RECEIPT</h2><label>Receipt # <input value="RCT-1001"></label><label>Date <input type="date"></label><p class="paid">PAID</p></div></div><h3>RECEIVED FROM</h3><input placeholder="Customer name"><textarea placeholder="Customer address"></textarea><p>Payment method <select><option>Cash</option><option>Card</option><option>Bank Transfer</option><option>Check</option><option>Mobile Payment</option></select></p><table id="items"><tr><th>Description</th><th>Qty</th><th>Rate</th><th class="num">Amount</th><th class="remove"></th></tr><tbody><tr><td><input placeholder="Product / service"></td><td><input class="q" type="number" value="1"></td><td><input class="r" type="number" step=".01" value="0"></td><td class="a num">0.00</td><td class="remove"><button onclick="this.closest('tr').remove();calc()">×</button></td></tr></tbody></table><div class="tot"><div><span>Subtotal</span><b id="sub">0.00</b></div><div><span>Tax % <input id="tax" type="number" value="0" style="width:70px"></span><b id="ta">0.00</b></div><div class="grand"><span>TOTAL PAID</span><b id="total">0.00</b></div></div><h3>NOTES</h3><textarea placeholder="Thank you for your payment."></textarea></main><script>function calc(){let s=0;document.querySelectorAll('#items tbody tr').forEach(x=>{let v=(+x.querySelector('.q').value||0)*(+x.querySelector('.r').value||0);x.querySelector('.a').textContent=v.toFixed(2);s+=v});let t=s*(+tax.value||0)/100;sub.textContent=s.toFixed(2);ta.textContent=t.toFixed(2);total.textContent=(s+t).toFixed(2)}function add(){let x=document.querySelector('#items tbody').insertRow();x.innerHTML='<td><input placeholder="Product / service"></td><td><input class="q" type="number" value="1"></td><td><input class="r" type="number" step=".01" value="0"></td><td class="a num">0.00</td><td class="remove"><button onclick="this.closest(\'tr\').remove();calc()">×</button></td>';calc()}document.addEventListener('input',calc);calc()</script></body></html>
