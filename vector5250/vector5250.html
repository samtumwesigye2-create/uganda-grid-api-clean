<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vector 5250</title><style>:root{--g:#33ff66;--a:#ffb000;--r:#ff5555;--d:#1a8f3c;--bg:#050805;--panel:#071007}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--g);font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:14px}.head,.panel{border:1px solid var(--d);background:var(--panel);padding:12px;margin-bottom:10px}.head{display:flex;justify-content:space-between;gap:10px}.brand{font-size:20px;color:var(--a);font-weight:800}.sub{font-size:11px;color:var(--d);margin-top:3px}.status{font-size:11px;text-align:right}.row{display:flex;gap:8px;flex-wrap:wrap}.input,select,textarea{background:#000;color:var(--g);border:1px solid var(--d);padding:10px;font:inherit}.grow{flex:1}.btn{background:#001d08;color:var(--g);border:1px solid var(--g);padding:10px 13px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{border-color:var(--d);color:var(--d)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.kpi{border:1px solid var(--d);padding:10px}.kpi small{display:block;color:var(--d);font-size:10px}.kpi strong{display:block;color:var(--a);font-size:24px;margin-top:7px}.term{white-space:pre-wrap;min-height:110px;font-size:12px}.commands{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cmd{border:1px solid var(--d);padding:9px;cursor:pointer}.cmd b{color:var(--a)}.cmd small{display:block;color:var(--d)}.hidden{display:none!important}.error{color:var(--r)}.ok{color:var(--g)}label{font-size:11px;color:var(--d);display:block;margin-top:7px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.commands{grid-template-columns:1fr}.head{align-items:flex-start}.row>*{min-width:0}}@media(max-width:430px){.wrap{padding:8px}.row>*{width:100%}}</style></head><body><main class="wrap"><section class="head"><div><div class="brand">VECTOR 5250</div><div class="sub">INDEPENDENT ENTERPRISE SYSTEM OF RECORD • PHASE 2</div></div><div class="status"><div id="sys">SYSTEM: CHECKING</div><div id="who">NOT SIGNED ON</div><div id="backup">BACKUP: CHECKING</div></div></section><section id="login" class="panel"><div style="color:var(--a);margin-bottom:8px">SIGN ON</div><div class="row"><input id="code" class="input grow" type="password" inputmode="text" autocomplete="current-password" placeholder="Staff access code"><button class="btn" onclick="signOn()">ENTER</button></div><div id="loginMsg" class="sub"></div></section><section id="app" class="hidden"><section class="panel"><div class="row"><input id="wh" class="input" value="main" aria-label="Warehouse"><button class="btn" onclick="loadDashboard()">REFRESH</button><button class="btn secondary" onclick="loadBackup()">BACKUP STATUS</button><button class="btn secondary" onclick="signOff()">SIGN OFF</button></div></section><section class="grid"><div class="kpi"><small>RECEIVING TODAY</small><strong id="recv">—</strong></div><div class="kpi"><small>SCANS TODAY</small><strong id="scans">—</strong></div><div class="kpi"><small>SKUS</small><strong id="skus">—</strong></div><div class="kpi"><small>UNITS</small><strong id="units">—</strong></div><div class="kpi"><small>PHASE</small><strong>2</strong></div></section><section class="panel"><div style="color:var(--a)">RECEIVING / VRCV</div><div class="row"><div class="grow"><label>PO / SHIPMENT / REFERENCE</label><input id="rref" class="input" style="width:100%"></div><div class="grow"><label>SKU / PACKAGE</label><input id="rsku" class="input" style="width:100%"></div><div><label>QTY</label><input id="rqty" class="input" type="number" min="0.01" step="any" value="1"></div></div><div class="row"><div><label>TYPE</label><select id="rtype"><option>package</option><option>freight</option><option>pallet</option></select></div><div class="grow"><label>LOCATION</label><input id="rloc" class="input" style="width:100%"></div><div><label>CONDITION</label><select id="rcond"><option>good</option><option>inspection</option><option>damaged</option><option>quarantine</option></select></div></div><button class="btn" style="margin-top:10px" onclick="receive()">POST RECEIPT</button></section><section class="panel"><div style="color:var(--a)">SCAN / VSCAN</div><div class="row"><input id="scode" class="input grow" placeholder="Barcode / QR / pallet / location"><select id="stype"><option>package</option><option>freight</option><option>pallet</option><option>location</option></select><select id="saction"><option>receive</option><option>verify</option><option>move</option><option>load</option><option>unload</option><option>handoff</option></select><button class="btn" onclick="postScan()">SCAN</button></div></section><section class="panel"><div style="color:var(--a)">COMMAND LINE</div><div class="row"><input id="cmd" class="input grow" autocapitalize="characters" spellcheck="false" placeholder="MIGO, VRCV, VSCAN, VCUST, MB51..."><button class="btn" onclick="resolveCommand()">RUN</button></div><div id="terminal" class="term"></div></section><section class="panel"><div style="color:var(--a);margin-bottom:8px">VECTOR COMMANDS</div><div id="commands" class="commands"></div></section></section></main><script>let accessCode='';const $=id=>document.getElementById(id);const headers=()=>({'x-access-code':accessCode,'content-type':'application/json'});const reqid=p=>p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2);function line(t,c){const d=document.createElement('div');if(c)d.className=c;d.textContent=t;$('terminal').prepend(d)}async function j(url,opt={}){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d}async function boot(){try{const s=await j('/api/vector5250/status');$('sys').textContent='SYSTEM: '+s.mode.toUpperCase()+' / '+s.version;$('backup').textContent='BACKUP: '+(s.backup_replication?'ENABLED':'OFF')}catch(e){$('sys').textContent='SYSTEM: OFFLINE';$('sys').className='error'}}async function signOn(){accessCode=$('code').value;try{const me=await j('/api/vector5250/session',{headers:{'x-access-code':accessCode}});$('who').textContent=me.name+' / '+me.role;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('code').value='';await Promise.all([loadDashboard(),loadCommands(),loadBackup()]);line('SIGN-ON ACCEPTED','ok')}catch(e){accessCode='';$('loginMsg').textContent=e.message;$('loginMsg').className='error'}}function signOff(){accessCode='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('who').textContent='NOT SIGNED ON';$('terminal').textContent=''}async function loadDashboard(){try{const d=await j('/api/vector5250/dashboard?warehouse_id='+encodeURIComponent($('wh').value||'main'),{headers:{'x-access-code':accessCode}});$('recv').textContent=d.today.receiving;$('scans').textContent=d.today.scans;$('skus').textContent=d.inventory.skus;$('units').textContent=d.inventory.units}catch(e){line('DASHBOARD ERROR: '+e.message,'error')}}async function loadBackup(){try{const d=await j('/api/vector5250/backup-status',{headers:{'x-access-code':accessCode}});const s=d.status||{};$('backup').textContent='BACKUP: '+(d.backup_service_configured?'CONFIGURED':'TOKEN MISSING')+' / OK '+(s.completed||0)+' FAIL '+(s.failed||0);line($('backup').textContent,s.failed?'error':'ok')}catch(e){line('BACKUP STATUS ERROR: '+e.message,'error')}}async function loadCommands(){try{const d=await j('/api/vector5250/commands',{headers:{'x-access-code':accessCode}});$('commands').innerHTML='';Object.entries(d.results).forEach(([k,v])=>{const x=document.createElement('div');x.className='cmd';x.onclick=()=>{$('cmd').value=k;resolveCommand()};x.innerHTML='<b>'+k+'</b><small>'+v.label+'</small>';$('commands').appendChild(x)})}catch(e){line('COMMAND ERROR: '+e.message,'error')}}async function resolveCommand(){const c=$('cmd').value.trim().toUpperCase();if(!c)return;try{const d=await j('/api/vector5250/resolve/'+encodeURIComponent(c),{headers:{'x-access-code':accessCode}});line(d.command+' → '+d.label+' ['+d.screen+'] / VECTOR5250','ok');$('cmd').value=''}catch(e){line(c+' → '+e.message,'error')}}async function receive(){const p={reference:$('rref').value.trim(),warehouse_id:$('wh').value||'main',sku:$('rsku').value.trim(),quantity:Number($('rqty').value),unit_type:$('rtype').value,location:$('rloc').value.trim()||null,condition:$('rcond').value,client_request_id:reqid('RCV')};try{const d=await j('/api/vector5250/receiving',{method:'POST',headers:headers(),body:JSON.stringify(p)});line('RECEIVED '+p.sku+' x'+p.quantity+' / '+d.receipt_id,'ok');$('rsku').value='';await Promise.all([loadDashboard(),loadBackup()])}catch(e){line('RECEIVING ERROR: '+e.message,'error')}}async function postScan(){const p={code:$('scode').value.trim(),warehouse_id:$('wh').value||'main',scan_type:$('stype').value,action:$('saction').value,client_request_id:reqid('SCN')};try{const d=await j('/api/vector5250/scan',{method:'POST',headers:headers(),body:JSON.stringify(p)});line('SCAN '+p.code+' '+p.action.toUpperCase()+' / '+d.scan_id,'ok');$('scode').value='';await Promise.all([loadDashboard(),loadBackup()])}catch(e){line('SCAN ERROR: '+e.message,'error')}}$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')resolveCommand()});$('code').addEventListener('keydown',e=>{if(e.key==='Enter')signOn()});$('scode').addEventListener('keydown',e=>{if(e.key==='Enter')postScan()});boot();</script></body></html>
