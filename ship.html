<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship & Mail — Uganda National Grid</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#f5f5f5; color:#111; margin:0; padding:20px; }
  .header { background:#0f1220; color:#fff; text-align:center; padding:24px 16px; border-radius:12px; margin-bottom:16px; }
  .header h1 { margin:0 0 6px; font-size:22px; }
  .header p { margin:0; color:#aaa; font-size:14px; }
  .tabs { display:flex; gap:10px; margin-bottom:16px; }
  .tab { flex:1; padding:14px; text-align:center; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; }
  .tab.active { background:#e2593a; color:#fff; }
  .tab:not(.active) { background:#0f1220; color:#fff; }
  .card { background:#0f1220; color:#fff; border-radius:12px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:17px; margin-top:0; }
  label { display:block; font-size:14px; color:#ccc; margin:12px 0 6px; }
  input, select { width:100%; padding:12px; border-radius:8px; border:1px solid #333; background:#1a1d2e; color:#eee; font-size:15px; }
  .btn { width:100%; padding:14px; border:none; border-radius:8px; background:#e2593a; color:#fff; font-size:16px; font-weight:600; margin-top:16px; cursor:pointer; }
  .btn.secondary { background:#3b5bfd; }
  .panel { display:none; }
  .panel.active { display:block; }
  .quotes { margin-top:16px; }
  .quote { display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid #2a2d3e; border-radius:8px; margin-bottom:8px; }
  .quote .label { font-weight:600; }
  .quote .eta { color:#999; font-size:13px; }
  .quote .price { font-weight:700; color:#e2593a; }
  .quote button { padding:8px 14px; border:none; border-radius:6px; background:#3b5bfd; color:#fff; font-size:13px; }
  .msg { padding:12px; border-radius:8px; margin-top:12px; font-size:14px; }
  .msg.error { background:#3a1a1a; color:#ff9b9b; }
  .msg.success { background:#1a3a22; color:#9bffb0; }
  .track-result { margin-top:16px; }
  .rate-toggle { display:flex; gap:8px; margin-bottom:16px; }
  .rate-toggle button { flex:1; padding:10px; border-radius:8px; border:1px solid #333; background:#1a1d2e; color:#ccc; font-size:14px; cursor:pointer; }
  .rate-toggle button.active { background:#3b5bfd; color:#fff; border-color:#3b5bfd; }
</style>
</head>
<body>

<div class="header">
  <h1>Ship & Mail</h1>
  <p>Send a parcel or subscribe to updates</p>
</div>

<div class="tabs">
  <button class="tab active" data-tab="ship">Ship a Package</button>
  <button class="tab" data-tab="track">Track a Shipment</button>
</div>

<div class="panel active" id="panel-ship">
  <div class="card">
    <h2>Get a rate</h2>
    <div class="rate-toggle">
      <button id="domesticToggle" class="active" onclick="setRateMode('domestic')">Domestic (Uganda)</button>
      <button id="intlToggle" onclick="setRateMode('international')">International</button>
    </div>

    <div id="domesticFields">
      <label>Pickup (address or grid ID)</label>
      <input id="pickup" placeholder="e.g. UG-ENT-000001" />
      <label>Delivery (address or grid ID)</label>
      <input id="delivery" placeholder="e.g. UG-ENT-000400" />
      <label>Weight (kg)</label>
      <input id="weight" type="number" step="0.1" placeholder="e.g. 2.5" />
      <button class="btn" onclick="getRates()">Get Rates</button>
    </div>

    <div id="intlFields" style="display:none;">
      <label>Destination country</label>
      <input id="intlCountry" placeholder="e.g. United Kingdom" />
      <label>Recipient address</label>
      <input id="intlAddress" placeholder="Street, city, postal code" />
      <label>Weight (kg)</label>
      <input id="intlWeight" type="number" step="0.1" placeholder="e.g. 2.5" />
      <button class="btn" onclick="getInternationalRates()">Get Rates</button>
    </div>

    <div id="rateMsg"></div>
    <div class="quotes" id="quotes"></div>
  </div>

  <div class="card" id="detailsCard" style="display:none;">
    <h2>Sender & Recipient (optional)</h2>
    <label>Sender name</label>
    <input id="senderName" />
    <label>Sender phone</label>
    <input id="senderPhone" />
    <label>Recipient name</label>
    <input id="recipientName" />
    <label>Recipient phone</label>
    <input id="recipientPhone" />
    <button class="btn secondary" onclick="createShipment()">Confirm & Create Shipment</button>
    <div id="createMsg"></div>
  </div>

  <div class="card">
    <h2>Get shipping & delivery updates by email</h2>
    <label>Email</label>
    <input id="subEmail" type="email" placeholder="you@example.com" />
    <label>Name (optional)</label>
    <input id="subName" />
    <button class="btn secondary" onclick="subscribe()">Subscribe</button>
    <div id="subMsg"></div>
  </div>
</div>

<div class="panel" id="panel-track">
  <div class="card">
    <h2>Track a Shipment</h2>
    <label>Shipment number</label>
    <input id="trackNumber" placeholder="e.g. UG-SHIP-000001" />
    <button class="btn" onclick="trackShipment()">Track</button>
    <div class="track-result" id="trackResult"></div>
  </div>
</div>

<script>
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

let selectedQuote = null;
let rateMode = 'domestic';

function setRateMode(mode) {
  rateMode = mode;
  document.getElementById('domesticToggle').classList.toggle('active', mode === 'domestic');
  document.getElementById('intlToggle').classList.toggle('active', mode === 'international');
  document.getElementById('domesticFields').style.display = mode === 'domestic' ? 'block' : 'none';
  document.getElementById('intlFields').style.display = mode === 'international' ? 'block' : 'none';
  document.getElementById('quotes').innerHTML = '';
  document.getElementById('rateMsg').innerHTML = '';
  document.getElementById('detailsCard').style.display = 'none';
  selectedQuote = null;
}

async function getRates() {
  const pickup = document.getElementById('pickup').value.trim();
  const delivery = document.getElementById('delivery').value.trim();
  const weight = document.getElementById('weight').value;
  const msgBox = document.getElementById('rateMsg');
  const quotesBox = document.getElementById('quotes');
  document.getElementById('detailsCard').style.display = 'none';
  quotesBox.innerHTML = '';
  msgBox.innerHTML = '';

  if (!pickup || !delivery || !weight) {
    msgBox.innerHTML = '<div class="msg error">Please fill in pickup, delivery, and weight.</div>';
    return;
  }

  try {
    const url = `/ship/rates?pickup=${encodeURIComponent(pickup)}&delivery=${encodeURIComponent(delivery)}&weight_kg=${encodeURIComponent(weight)}`;
    const res = await fetch(url);
    if (!res.ok) {
      const err = await res.json();
      msgBox.innerHTML = `<div class="msg error">${err.detail || 'Could not calculate rates.'}</div>`;
      return;
    }
    const data = await res.json();
    quotesBox.innerHTML = `<p style="color:#aaa;font-size:13px;">Distance: ${data.distance_km} km</p>`;
    renderQuotes(data.quotes, quotesBox);
  } catch (e) {
    msgBox.innerHTML = '<div class="msg error">Something went wrong. Please try again.</div>';
  }
}

async function getInternationalRates() {
  const country = document.getElementById('intlCountry').value.trim();
  const weight = document.getElementById('intlWeight').value;
  const msgBox = document.getElementById('rateMsg');
  const quotesBox = document.getElementById('quotes');
  document.getElementById('detailsCard').style.display = 'none';
  quotesBox.innerHTML = '';
  msgBox.innerHTML = '';

  if (!country || !weight) {
    msgBox.innerHTML = '<div class="msg error">Please fill in destination country and weight.</div>';
    return;
  }

  try {
    const url = `/ship/international/rates?country=${encodeURIComponent(country)}&weight_kg=${encodeURIComponent(weight)}`;
    const res = await fetch(url);
    if (!res.ok) {
      const err = await res.json();
      msgBox.innerHTML = `<div class="msg error">${err.detail || 'Could not calculate rates.'}</div>`;
      return;
    }
    const data = await res.json();
    renderQuotes(data.quotes, quotesBox);
  } catch (e) {
    msgBox.innerHTML = '<div class="msg error">Something went wrong. Please try again.</div>';
  }
}

function renderQuotes(quotes, container) {
  quotes.forEach(q => {
    const row = document.createElement('div');
    row.className = 'quote';
    row.innerHTML = `
      <div>
        <div class="label">${q.label}</div>
        <div class="eta">${q.eta_days === 0 ? 'Same day' : q.eta_days + ' day(s)'}</div>
      </div>
      <div class="price">UGX ${q.rate_ugx.toLocaleString()}</div>
      <button onclick='selectQuote(${JSON.stringify(q.speed_tier)})'>Select</button>
    `;
    container.appendChild(row);
  });
}

function selectQuote(speedTier) {
  selectedQuote = speedTier;
  document.getElementById('detailsCard').style.display = 'block';
  document.getElementById('detailsCard').scrollIntoView({ behavior: 'smooth' });
}

async function createShipment() {
  const msgBox = document.getElementById('createMsg');
  if (!selectedQuote) {
    msgBox.innerHTML = '<div class="msg error">Please select a delivery speed first.</div>';
    return;
  }

  const common = {
    speed_tier: selectedQuote,
    sender_name: document.getElementById('senderName').value.trim(),
    sender_phone: document.getElementById('senderPhone').value.trim(),
    recipient_name: document.getElementById('recipientName').value.trim(),
    recipient_phone: document.getElementById('recipientPhone').value.trim(),
  };

  let url, body;
  if (rateMode === 'domestic') {
    url = '/ship/create';
    body = new URLSearchParams({
      ...common,
      pickup: document.getElementById('pickup').value.trim(),
      delivery: document.getElementById('delivery').value.trim(),
      weight_kg: document.getElementById('weight').value,
    });
  } else {
    url = '/ship/international/create';
    body = new URLSearchParams({
      ...common,
      country: document.getElementById('intlCountry').value.trim(),
      recipient_address: document.getElementById('intlAddress').value.trim(),
      weight_kg: document.getElementById('intlWeight').value,
    });
  }

  try {
    const res = await fetch(url, { method: 'POST', body });
    if (!res.ok) {
      const err = await res.json();
      msgBox.innerHTML = `<div class="msg error">${err.detail || 'Could not create shipment.'}</div>`;
      return;
    }
    const data = await res.json();
    msgBox.innerHTML = `<div class="msg success">
      Shipment created: <strong>${data.shipment_number}</strong><br>
      Total: UGX ${data.rate_ugx.toLocaleString()}<br>
      <a href="${data.receipt_url}" style="color:#9bd4ff;" target="_blank">View Receipt</a>
    </div>`;
  } catch (e) {
    msgBox.innerHTML = '<div class="msg error">Something went wrong. Please try again.</div>';
  }
}

async function subscribe() {
  const email = document.getElementById('subEmail').value.trim();
  const name = document.getElementById('subName').value.trim();
  const msgBox = document.getElementById('subMsg');

  if (!email) {
    msgBox.innerHTML = '<div class="msg error">Please enter an email address.</div>';
    return;
  }

  const body = new URLSearchParams({ email, name });
  try {
    const res = await fetch('/mail/subscribe', { method: 'POST', body });
    if (!res.ok) {
      const err = await res.json();
      msgBox.innerHTML = `<div class="msg error">${err.detail || 'Could not subscribe.'}</div>`;
      return;
    }
    const data = await res.json();
    msgBox.innerHTML = data.status === 'already_subscribed'
      ? '<div class="msg success">You are already subscribed.</div>'
      : '<div class="msg success">Subscribed! You will receive shipping updates.</div>';
  } catch (e) {
    msgBox.innerHTML = '<div class="msg error">Something went wrong. Please try again.</div>';
  }
}

async function trackShipment() {
  const number = document.getElementById('trackNumber').value.trim();
  const box = document.getElementById('trackResult');
  if (!number) {
    box.innerHTML = '<div class="msg error">Please enter a shipment number.</div>';
    return;
  }
  window.location.href = `/ship/receipt/${encodeURIComponent(number)}`;
}
</script>
</body>
</html>
