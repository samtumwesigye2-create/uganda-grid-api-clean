<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Dashboard — Uganda National Grid</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background:#0f1220; color:#eee; margin:0; padding:16px; }
  h1 { font-size:20px; text-align:center; margin-bottom:16px; }
  #loginBox { max-width:340px; margin:80px auto; text-align:center; }
  #loginBox input { width:100%; padding:12px; border-radius:8px; border:1px solid #333; background:#1a1d2e; color:#eee; margin-bottom:10px; font-size:15px; }
  #loginBox button { width:100%; padding:12px; border-radius:8px; border:none; background:#e2593a; color:#fff; font-size:15px; }
  #dashboard { display:none; max-width:520px; margin:0 auto; }
  .topBar { display:flex; justify-content:space-between; align-items:center; background:#1a1d2e; border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .topBar .name { font-weight:700; }
  .dutyToggle { display:flex; gap:6px; }
  .dutyToggle button { padding:8px 12px; border-radius:6px; border:1px solid #333; background:#171a2b; color:#aaa; font-size:12px; }
  .dutyToggle button.active { background:#3b5bfd; color:#fff; border-color:#3b5bfd; }
  .progressCard { background:#1a1d2e; border-radius:10px; padding:14px; margin-bottom:14px; text-align:center; }
  .progressCard .count { font-size:28px; font-weight:800; color:#e2593a; }
  .progressCard .label { font-size:12px; color:#999; margin-top:2px; }
  .taskCard { background:#1a1d2e; border:1px solid #2a2d3e; border-radius:10px; padding:14px; margin-bottom:12px; }
  .taskCard .taskType { display:inline-block; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:700; margin-bottom:8px; }
  .taskType.pickup { background:#dbe6ff; color:#2a3a7a; }
  .taskType.dropoff_customer { background:#d4f4dd; color:#1a7a37; }
  .taskType.dropoff_warehouse { background:#fde8d4; color:#a35b00; }
  .taskCard .loc { font-size:15px; font-weight:600; margin-bottom:4px; }
  .taskCard .num { font-size:12px; color:#888; margin-bottom:10px; }
  .taskCard .status { font-size:12px; color:#ccc; margin-bottom:10px; }
  .taskCard select { width:100%; padding:9px; border-radius:6px; border:1px solid #333; background:#0f1220; color:#eee; margin-bottom:8px; font-size:14px; }
  .taskCard input[type=file] { width:100%; padding:8px; border:1px dashed #333; border-radius:6px; background:#0f1220; color:#eee; margin-bottom:8px; font-size:13px; }
  .taskCard button.submitBtn { width:100%; padding:11px; border:none; border-radius:6px; background:#3b5bfd; color:#fff; font-size:14px; font-weight:600; }
  .photoRequired { font-size:11px; color:#f39a9a; margin-bottom:8px; }
  .emptyState { text-align:center; color:#888; padding:40px 16px; }
  .msg { padding:10px; border-radius:8px; font-size:13px; margin-bottom:10px; }
  .msg.error { background:#3a1a1a; color:#ff9b9b; }
  .msg.success { background:#1a3a22; color:#9bffb0; }
  .refreshBtn { width:100%; padding:10px; border-radius:8px; border:none; background:#5a5f7a; color:#fff; font-size:13px; margin-bottom:14px; }
</style>
</head>
<body>

<div id="loginBox">
  <h1>Driver Login</h1>
  <input id="driverPasscode" type="password" placeholder="Your driver passcode" />
  <button onclick="loginDriver()">Log In</button>
  <div id="loginMsg"></div>
</div>

<div id="dashboard">
  <div class="topBar">
    <div>
      <div class="name" id="driverName">—</div>
      <div style="font-size:11px;color:#888;" id="driverPhone"></div>
    </div>
    <div class="dutyToggle">
      <button id="offDutyBtn" onclick="setDuty('off_duty')">Off</button>
      <button id="onDutyBtn" onclick="setDuty('on_duty')">On Duty</button>
    </div>
  </div>

  <div class="progressCard">
    <div class="count" id="progressCount">0 / 0</div>
    <div class="label">Tasks completed with photo proof</div>
  </div>

  <button class="refreshBtn" onclick="loadTasks()">Refresh Tasks</button>
  <div id="tasksOut"></div>
</div>

<script>
const PASSCODE_KEY = 'driver_passcode';
let passcode = localStorage.getItem(PASSCODE_KEY) || '';
let watchId = null;

if (passcode) {
  checkSession();
}

async function loginDriver() {
  const code = document.getElementById('driverPasscode').value.trim();
  const msgBox = document.getElementById('loginMsg');
  if (!code) { msgBox.innerHTML = '<div class="msg error">Enter your passcode</div>'; return; }
  passcode = code;
  const ok = await checkSession();
  if (!ok) {
    msgBox.innerHTML = '<div class="msg error">Invalid passcode</div>';
    passcode = '';
  }
}

async function checkSession() {
  try {
    const res = await fetch('/driver/me', { headers: { 'x-driver-passcode': passcode } });
    if (!res.ok) return false;
    const driver = await res.json();
    localStorage.setItem(PASSCODE_KEY, passcode);
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('driverName').textContent = driver.name;
    document.getElementById('driverPhone').textContent = driver.phone || '';
    updateDutyButtons(driver.status);
    loadTasks();
    return true;
  } catch (e) {
    return false;
  }
}

function updateDutyButtons(status) {
  document.getElementById('onDutyBtn').classList.toggle('active', status === 'on_duty');
  document.getElementById('offDutyBtn').classList.toggle('active', status !== 'on_duty');
}

async function setDuty(status) {
  await fetch('/driver/status', {
    method: 'POST',
    headers: { 'x-driver-passcode': passcode, 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ status })
  });
  updateDutyButtons(status);
  if (status === 'on_duty') startLocationTracking();
  else stopLocationTracking();
}

function startLocationTracking() {
  if (!navigator.geolocation || watchId) return;
  watchId = navigator.geolocation.watchPosition(pos => {
    fetch('/driver/location', {
      method: 'POST',
      headers: { 'x-driver-passcode': passcode, 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude
      })
    });
  }, () => {}, { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
}

function stopLocationTracking() {
  if (watchId && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
  watchId = null;
}

const TASK_TYPE_LABELS = {
  pickup: 'Pickup',
  dropoff_customer: 'Dropoff — Customer',
  dropoff_warehouse: 'Dropoff — Warehouse',
  warehouse_transfer: 'Warehouse Transfer'
};

const STATUS_FLOW = [
  'assigned', 'en_route_pickup', 'arrived_pickup', 'picked_up',
  'en_route_dropoff', 'arrived_dropoff', 'dropped_off_customer',
  'dropped_off_warehouse', 'completed', 'failed'
];

const PHOTO_REQUIRED = ['picked_up', 'dropped_off_customer', 'dropped_off_warehouse'];

async function loadTasks() {
  const out = document.getElementById('tasksOut');
  try {
    const res = await fetch('/driver/tasks', { headers: { 'x-driver-passcode': passcode } });
    const data = await res.json();
    const tasks = data.results || [];

    let completedWithPhoto = 0;
    tasks.forEach(t => { if (t.photo_url) completedWithPhoto++; });
    document.getElementById('progressCount').textContent = completedWithPhoto + ' / ' + tasks.length;

    if (!tasks.length) {
      out.innerHTML = '<div class="emptyState">No active tasks right now.</div>';
      return;
    }

    out.innerHTML = '';
    tasks.forEach(t => {
      const card = document.createElement('div');
      card.className = 'taskCard';
      const needsPhoto = PHOTO_REQUIRED.includes(t.status) || true; // photo box always available
      card.innerHTML = `
        <span class="taskType ${t.task_type}">${TASK_TYPE_LABELS[t.task_type] || t.task_type}</span>
        <div class="loc">${escapeHtml(t.location_text)}</div>
        <div class="num">${t.task_number}${t.shipment_number ? ' · ' + t.shipment_number : ''}</div>
        <div class="status">Current: <strong>${t.status.replace(/_/g, ' ')}</strong></div>
        <select id="statusSelect_${t.id}">
          ${STATUS_FLOW.map(s => `<option value="${s}" ${s === t.status ? 'selected' : ''}>${s.replace(/_/g, ' ')}</option>`).join('')}
        </select>
        <div class="photoRequired" id="photoNote_${t.id}"></div>
        <input type="file" id="photoInput_${t.id}" accept="image/*" capture="environment" />
        <button class="submitBtn" onclick="submitStatus('${t.id}')">Update Task</button>
        <div id="taskMsg_${t.id}"></div>
      `;
      out.appendChild(card);

      const select = card.querySelector('#statusSelect_' + t.id);
      const note = card.querySelector('#photoNote_' + t.id);
      const updateNote = () => {
        note.textContent = PHOTO_REQUIRED.includes(select.value)
          ? 'Photo required for this status'
          : '';
      };
      select.addEventListener('change', updateNote);
      updateNote();
    });
  } catch (e) {
    out.innerHTML = '<div class="msg error">Unable to load tasks.</div>';
  }
}

async function submitStatus(taskId) {
  const select = document.getElementById('statusSelect_' + taskId);
  const fileInput = document.getElementById('photoInput_' + taskId);
  const msgBox = document.getElementById('taskMsg_' + taskId);
  const newStatus = select.value;
  const file = fileInput.files[0];

  if (PHOTO_REQUIRED.includes(newStatus) && !file) {
    msgBox.innerHTML = '<div class="msg error">A photo is required for this status.</div>';
    return;
  }

  const fd = new FormData();
  fd.append('status', newStatus);
  if (file) fd.append('photo', file);

  msgBox.innerHTML = '<div style="color:#999;font-size:12px;">Uploading...</div>';

  try {
    const res = await fetch('/dispatch/tasks/' + taskId + '/status', {
      method: 'POST',
      headers: { 'x-driver-passcode': passcode },
      body: fd
    });
    if (!res.ok) {
      const err = await res.json();
      msgBox.innerHTML = `<div class="msg error">${err.detail || 'Update failed.'}</div>`;
      return;
    }
    msgBox.innerHTML = '<div class="msg success">Updated.</div>';
    loadTasks();
  } catch (e) {
    msgBox.innerHTML = '<div class="msg error">Something went wrong.</div>';
  }
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
</script>
</body>
</html>
