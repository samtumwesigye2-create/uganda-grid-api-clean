<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>UGAMAP Special ZIPs</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#07111e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.bar{padding:12px;background:#0d1826}.bar h2{margin:0 0 9px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}select,input,textarea,button{width:100%;padding:10px;border-radius:7px;border:1px solid #33445c;background:#101d2d;color:#fff;font-size:14px}.wide{grid-column:1/-1}button{background:#3155ed;font-weight:700}.danger{background:#a93636}.edit{background:#8b5cf6}#map{height:48vh;min-height:330px}.hint,.status{font-size:12px;margin-top:7px}.hint{color:#9ba9ba}.status{color:#8fb0ff}.list{padding:10px 12px}.item{display:flex;gap:7px;align-items:center;border-bottom:1px solid #1d2b3d;padding:8px 0}.item span{flex:1;font-size:12px}.item button{width:auto;padding:6px 8px;font-size:11px}.actions{display:flex;gap:5px}</style></head><body><div class="bar"><h2>UGAMAP · National Special ZIPs</h2><div class="grid"><input id="pass" class="wide" type="password" placeholder="Admin passcode"><select id="cat" class="wide"><option value="">Select category</option></select><input id="code" class="wide" inputmode="numeric" maxlength="5" placeholder="Special ZIP (optional — e.g. 00001)"><input id="name" class="wide" placeholder="Facility / site name"><input id="address" class="wide" placeholder="Address or locality (optional)"><textarea id="notes" class="wide" placeholder="Notes (optional)"></textarea><button id="pick" class="wide">Tap Facility Location on Map</button><button id="save" class="wide">Assign Special ZIP</button></div><div class="hint">For memorable national facilities you may enter the exact anchor code, such as 00001 for State House. Leave blank to use the next available code automatically.</div><div id="status" class="status"></div></div><div id="map"></div><div class="list"><b>Assigned Special ZIPs</b><div id="list"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=i=>document.getElementById(i),map=L.map('map').setView([1.37,32.29],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let point=null,marker=null,picking=false,editing=null,markers=[];const hdr=()=>({'X-Admin-Passcode':$('pass').value});function msg(x){$('status').textContent=x}function setPoint(lat,lng){point=L.latLng(lat,lng);if(marker)map.removeLayer(marker);marker=L.marker(point).addTo(map);map.setView(point,Math.max(map.getZoom(),16))}$('pick').onclick=()=>{picking=true;msg('Tap the facility location on the map')};map.on('click',e=>{if(!picking)return;setPoint(e.latlng.lat,e.latlng.lng);picking=false;msg('Location selected: '+point.lat.toFixed(5)+', '+point.lng.toFixed(5))});async function catalog(){let x=await fetch('/admin/special-zips/categories',{headers:hdr()});if(!x.ok){msg('Enter correct admin passcode');return}let d=await x.json();$('cat').innerHTML='<option value="">Select category</option>';d.results.forEach(c=>$('cat').insertAdjacentHTML('beforeend','<option value="'+c.category+'" data-anchor="'+c.anchor+'">'+c.anchor+' · '+c.name+'</option>'));load()}$('cat').onchange=()=>{if(!editing){let o=$('cat').selectedOptions[0];if(o&&o.dataset.anchor)$('code').placeholder='Special ZIP (anchor '+o.dataset.anchor+' or leave blank for automatic)'}};async function load(){let x=await fetch('/admin/special-zips',{headers:hdr()});if(!x.ok)return;let d=await x.json(),el=$('list');el.innerHTML='';markers.forEach(m=>map.removeLayer(m));markers=[];d.results.forEach(a=>{let row=document.createElement('div');row.className='item';row.innerHTML='<span><b>'+a.zip_code+'</b> · '+a.name+'<br>'+a.category+'</span><div class="actions"><button class="edit">Edit</button><button class="danger">Delete</button></div>';let bs=row.querySelectorAll('button');bs[0].onclick=()=>edit(a);bs[1].onclick=()=>del(a.zip_code);el.appendChild(row);markers.push(L.marker([a.latitude,a.longitude]).addTo(map).bindPopup('<b>'+a.zip_code+'</b><br>'+a.name))})}function edit(a){editing=a;$('cat').value=a.category;$('code').value=a.zip_code;$('name').value=a.name;$('address').value=a.address||'';$('notes').value=a.notes||'';setPoint(a.latitude,a.longitude);$('save').textContent='Save Changes';msg('Editing '+a.zip_code+' — you can change it to an allowed anchor such as 00001')}async function del(z){if(!confirm('Delete special ZIP '+z+'?'))return;let x=await fetch('/admin/special-zips/'+z,{method:'DELETE',headers:hdr()});msg(x.ok?'Deleted '+z:'Delete failed');load()}async function createBody(){return {category:$('cat').value,name:$('name').value.trim(),latitude:point.lat,longitude:point.lng,address:$('address').value,notes:$('notes').value,zip_code:$('code').value.trim()||undefined}}function reset(){editing=null;$('code').value='';$('name').value='';$('address').value='';$('notes').value='';point=null;if(marker){map.removeLayer(marker);marker=null}$('save').textContent='Assign Special ZIP'}$('save').onclick=async()=>{if(!$('cat').value||!$('name').value.trim()||!point){msg('Choose category, enter name, and select map location');return}let body=await createBody();if(!editing){let x=await fetch('/admin/special-zips',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await x.json();if(!x.ok){msg(d.detail||'Assignment failed');return}msg('Assigned '+d.zip_code+' to '+d.name);reset();load();return}let old=editing.zip_code,newCode=(body.zip_code||old).padStart(5,'0');if(newCode===old){let dx=await fetch('/admin/special-zips/'+old,{method:'DELETE',headers:hdr()});if(!dx.ok){msg('Could not update existing assignment');return}let px=await fetch('/admin/special-zips',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)}),pd=await px.json();if(!px.ok){msg(pd.detail||'Update failed');return}msg('Updated '+pd.zip_code);reset();load();return}let px=await fetch('/admin/special-zips',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)}),pd=await px.json();if(!px.ok){msg(pd.detail||'Update failed');return}let dx=await fetch('/admin/special-zips/'+old,{method:'DELETE',headers:hdr()});if(!dx.ok){msg('New code saved, but old code could not be removed');load();return}msg('Changed '+old+' to '+pd.zip_code);reset();load()};$('pass').onchange=catalog;</script></body></html>
