<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>UGAMAP Special ZIPs</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#07111e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.bar{padding:12px;background:#0d1826}.bar h2{margin:0 0 9px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}select,input,textarea,button{width:100%;padding:10px;border-radius:7px;border:1px solid #33445c;background:#101d2d;color:#fff;font-size:14px}.wide{grid-column:1/-1}button{background:#3155ed;font-weight:700}.danger{background:#a93636}#map{height:48vh;min-height:330px}.hint,.status{font-size:12px;margin-top:7px}.hint{color:#9ba9ba}.status{color:#8fb0ff}.list{padding:10px 12px}.item{display:flex;gap:7px;align-items:center;border-bottom:1px solid #1d2b3d;padding:8px 0}.item span{flex:1;font-size:12px}.item button{width:auto;padding:6px 8px;font-size:11px}</style></head><body><div class="bar"><h2>UGAMAP · National Special ZIPs</h2><div class="grid"><input id="pass" class="wide" type="password" placeholder="Admin passcode"><select id="cat" class="wide"><option value="">Select category</option></select><input id="name" class="wide" placeholder="Facility / site name"><input id="address" class="wide" placeholder="Address or locality (optional)"><textarea id="notes" class="wide" placeholder="Notes (optional)"></textarea><button id="pick" class="wide">Tap Facility Location on Map</button><button id="save" class="wide">Assign Next Special ZIP</button></div><div class="hint">Choose a category, tap the exact facility/site location, then assign. The next unused 00xxx code is selected automatically.</div><div id="status" class="status"></div></div><div id="map"></div><div class="list"><b>Assigned Special ZIPs</b><div id="list"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=i=>document.getElementById(i),map=L.map('map').setView([1.37,32.29],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let point=null,marker=null,picking=false;const hdr=()=>({'X-Admin-Passcode':$('pass').value});function msg(x){$('status').textContent=x}$('pick').onclick=()=>{picking=true;msg('Tap the facility location on the map')};map.on('click',e=>{if(!picking)return;point=e.latlng;if(marker)map.removeLayer(marker);marker=L.marker(point).addTo(map);picking=false;msg('Location selected: '+point.lat.toFixed(5)+', '+point.lng.toFixed(5))});async function catalog(){let x=await fetch('/admin/special-zips/categories',{headers:hdr()});if(!x.ok){msg('Enter correct admin passcode');return}let d=await x.json();$('cat').innerHTML='<option value="">Select category</option>';d.results.forEach(c=>$('cat').insertAdjacentHTML('beforeend','<option value="'+c.category+'">'+c.anchor+' · '+c.name+'</option>'));load()}async function load(){let x=await fetch('/admin/special-zips',{headers:hdr()});if(!x.ok)return;let d=await x.json(),el=$('list');el.innerHTML='';d.results.forEach(a=>{let row=document.createElement('div');row.className='item';row.innerHTML='<span><b>'+a.zip_code+'</b> · '+a.name+'<br>'+a.category+'</span><button class="danger">Delete</button>';row.querySelector('button').onclick=()=>del(a.zip_code);el.appendChild(row);L.marker([a.latitude,a.longitude]).addTo(map).bindPopup('<b>'+a.zip_code+'</b><br>'+a.name)})}async function del(z){if(!confirm('Delete special ZIP '+z+'?'))return;let x=await fetch('/admin/special-zips/'+z,{method:'DELETE',headers:hdr()});msg(x.ok?'Deleted '+z:'Delete failed');load()}$('save').onclick=async()=>{if(!$('cat').value||!$('name').value.trim()||!point){msg('Choose category, enter name, and select map location');return}let body={category:$('cat').value,name:$('name').value.trim(),latitude:point.lat,longitude:point.lng,address:$('address').value,notes:$('notes').value};let x=await fetch('/admin/special-zips',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await x.json();if(!x.ok){msg(d.detail||'Assignment failed');return}msg('Assigned '+d.zip_code+' to '+d.name);$('name').value='';$('address').value='';$('notes').value='';point=null;if(marker){map.removeLayer(marker);marker=null}load()};$('pass').onchange=catalog;</script></body></html>
