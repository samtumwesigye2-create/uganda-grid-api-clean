<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Uganda National Grid</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
}

header{
background:#111827;
color:white;
padding:20px;
text-align:center;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
}

.container{
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px #0002;
}

input{
width:100%;
box-sizing:border-box;
padding:14px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
padding:13px 18px;
border:0;
border-radius:8px;
background:#d71920;
color:white;
font-size:16px;
margin:5px;
}

button.secondary{
background:#166534;
}

.controls{
display:flex;
flex-wrap:wrap;
}

#map{
height:65vh;
width:100%;
}

.status{
background:#166534;
color:white;
padding:10px;
border-radius:8px;
text-align:center;
}

</style>

</head>

<body>

<header>

<h1>🇺🇬 Uganda National Grid</h1>

<p>
CONNECTED. MAPPED. MOVING UGANDA FORWARD.
</p>

</header>


<div class="container">


<div class="card">

<div class="status">
SYSTEM CONNECTED
</div>


<input
id="start"
placeholder="Start location (example: Kampala)"
>


<input
id="destination"
placeholder="Destination (example: Jinja)"
>


<div class="controls">

<button onclick="findRoute()">
Preview Route
</button>


<button class="secondary">
Start Navigation
</button>


<button>
Pause
</button>


<button>
Resume
</button>


<button>
Stop
</button>

</div>


</div>


<div class="card">

<button class="secondary">
UGAMAP
</button>

</div>


</div>


<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="app.js"></script>


</body>
</html>
