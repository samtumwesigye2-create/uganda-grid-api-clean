<!DOCTYPE html>
<html>
<head>
    <title>Uganda National Grid Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        input {
            width: 80%;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px;
            background: green;
            color: white;
            border: none;
        }

        table {
            margin-top:20px;
            width:100%;
            background:white;
            border-collapse:collapse;
        }

        td, th {
            border:1px solid #ddd;
            padding:8px;
        }
    </style>
</head>

<body>

<h1>Uganda National Grid API</h1>

<input id="search" placeholder="Search address or code">
<button onclick="searchData()">Search</button>

<table id="results">
<tr>
<th>ID</th>
<th>Code</th>
<th>Address</th>
</tr>
</table>


<script>

async function searchData(){

let q=document.getElementById("search").value;

let response = await fetch("/search?q="+q);

let data = await response.json();


let table=document.getElementById("results");

table.innerHTML=
`
<tr>
<th>ID</th>
<th>Code</th>
<th>Address</th>
</tr>
`;


data.forEach(row=>{

table.innerHTML +=
`
<tr>
<td>${row[0]}</td>
<td>${row[1]}</td>
<td>${row[7]}</td>
</tr>
`;

});


}

</script>

</body>
</html>
