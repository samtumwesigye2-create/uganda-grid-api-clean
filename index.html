<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Uganda National Grid</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px Arial;background:#eef1f4;color:#111827}
    header{height:44px;background:linear-gradient(135deg,#111827,#253447);color:#fff;padding:6px 8px;text-align:center;box-shadow:0 2px 8px #0003}
    header h1{margin:0;font-size:18px;letter-spacing:.3px}header small{font-size:9px;opacity:.8}
    main{margin:4px 6px;padding:6px 7px;background:#fff;border-radius:9px;box-shadow:0 2px 8px #0002}
    label{font-size:14px;font-weight:900;display:block;margin:1px 0}
    input,select{width:100%;height:30px;padding:4px 7px;margin:2px 0;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;font-size:12px;outline:none}
    input:focus{border-color:#d71920;box-shadow:0 0 0 2px #d7192022}
    .fieldwrap{position:relative}
    .suggest{display:none;position:absolute;left:0;right:0;top:34px;background:#fff;border:1px solid #cbd5e1;border-radius:6px;max-height:210px;overflow-y:auto;z-index:5000;box-shadow:0 5px 14px #0003;-webkit-overflow-scrolling:touch}
    .suggest button{display:block;width:100%;border:0;border-bottom:1px solid #e5e7eb;background:#fff;text-align:left;padding:12px 10px;font-size:12px;color:#111827;touch-action:manipulation}
    .suggest button:last-child{border-bottom:0}.suggest button:active{background:#f1f5f9}
    .resolved{font-size:9px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:11px}
    .controlrow{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:3px}.controlrow>*{width:100%;height:30px;min-width:0;margin:0;padding:2px;font-size:10px;border-radius:6px}
    .controlrow button{background:#d71920;color:#fff;border:0;font-weight:800;box-shadow:0 1px 3px #0002}.provider{background:#fff!important;color:#111!important;border:1px solid #9ca3af!important}.ugamap{display:flex!important;flex-direction:column;justify-content:center;align-items:center}.ugamap .flag{font-size:8px;line-height:8px}
    .status{font-size:10px;font-weight:700;color:#475569;min-height:11px}.status.ok{color:#15803d}.status.err{color:#b91c1c}
    #info{height:32px;padding:4px 8px;font-size:10px;background:#fff;font-weight:700;box-shadow:0 1px 5px #0002;position:relative;z-index:500}.routecard{display:inline-block;background:#f8fafc;border-radius:6px;padding:3px 6px;margin-right:3px}
    #map{height:calc(100vh - 252px);min-height:220px;width:100%;background:#dbe4ea}.reportbar{position:absolute;right:8px;top:8px;z-index:1200;display:flex;gap:3px;flex-wrap:wrap;max-width:210px}.reportbar button{border:0;border-radius:7px;padding:6px 7px;background:#fff;box-shadow:0 2px 7px #0003;font-size:10px;font-weight:800}
    .reportpanel{display:none;position:absolute;right:8px;top:48px;z-index:1300;width:230px;background:#fff;border-radius:9px;padding:8px;box-shadow:0 4px 14px #0004}.reportpanel h3{margin:0 0 5px;font-size:13px}.reportpanel select,.reportpanel textarea,.reportpanel button{width:100%;margin:3px 0;height:30px;border:1px solid #cbd5e1;border-radius:6px;font-size:11px}.reportpanel textarea{height:50px;padding:5px}.reportpanel button{background:#d71920;color:#fff;font-weight:800;border:0}
    .inspiration{position:absolute;left:0;right:0;bottom:0;height:48px;background:#fff;text-align:center;padding:3px;border-top:2px solid #d71920;z-index:1000;box-shadow:0 -2px 8px #0002}.inspiration .flag{font-size:17px;line-height:17px}.inspiration h2{display:inline;margin:0 5px;font-size:13px}.inspiration p{display:inline;margin:0;color:#4b5563;font-size:9px}
  </style>
</head>
<body>
<header><h1>🇺🇬 Uganda National Grid</h1><small>CONNECTED. MAPPED. MOVING UGANDA FORWARD.</small></header>
<main>
  <label>Start Location</label>
  <div class="fieldwrap"><input id="start" autocomplete="off" placeholder="UG-ENT-000001 or 1001 Lake Victoria Drive, Entebbe"><div id="ss" class="suggest"></div></div>
  <div id="sr" class="resolved"></div>
  <label>Destination</label>
  <div class="fieldwrap"><input id="dest" autocomplete="off" placeholder="UG-ENT-000005 or 1009 Lake Victoria Drive, Entebbe"><div id="ds" class="suggest"></div></div>
  <div id="dr" class="resolved"></div>
  <div class="controlrow">
  <select id="mode">
    <option value="driving">🚗 Drive</option>
    <option value="walking">🚶 Walk</option>
    <option value="cycling">🚲 Bike</option>
    <option value="flight">✈️ Plane</option>
  </select>

<button id="navigate" class="ugamap">
  <span class="flag">🇺🇬</span>
  <span>UGAMAP</span>
  <span>Navigate</span>
</button>>

  <button class="provider" id="googleMaps">Google Maps</button>
</div>
</main>
<div id="info">🇺🇬 Uganda National Grid · Ready</div>
<div id="map">
<div class="reportbar"></div>
  <div id="reportpanel" class="reportpanel"><h3>🇺🇬 Report on road</h3><select id="reportType"><option value="accident">🚨 Accident</option><option value="police">👮 Police / checkpoint</option><option value="closure">🚧 Road closure</option><option value="bridge">🌉 Bridge</option><option value="roundabout">🔄 Roundabout</option><option value="highway">🛣️ Controlled highway</option></select><textarea id="reportNote" placeholder="Optional details"></textarea><button onclick="submitReport()">Submit at map location</button><button onclick="closeReport()" style="background:#64748b">Cancel</button></div>
</div>
<section class="inspiration"><span class="flag">🇺🇬</span><h2>One Grid. One Nation. One Future.</h2><p>Building a connected Uganda, one community at a time.</p></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API='https://uganda-grid-api-clean-production.up.railway.app';
const G=id=>document.getElementById(id);
const map=L.map('map').setView([1.3733,32.2903],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const status=G('status'),info=G('info'),start=G('start'),dest=G('dest'),mode=G('mode');
let selectedStart=null,selectedDest=null,line,sm,dm,userMarker,simTimer,navActive=false,navPts=[],navIndex=0,currentNavPos=null,reportPosition=null,reportMarkers=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function grid(q){const r=await fetch(API+'/search?q='+encodeURIComponent(q));if(!r.ok)throw Error('Grid service unavailable');const d=await r.json();return d.results||[]}
function normalize(x){const lat=Number(x.latitude??x.lat),lon=Number(x.longitude??x.lon);return{lat,lon,id:x.grid_id||'',address:x.address||x.display_name||x.grid_id||'Selected location'}}
async function searchPlaces(q){if(/^UG-/i.test(q))return (await grid(q)).map(normalize);const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=ug&q='+encodeURIComponent(q));const d=await r.json();return d.map(normalize)}
async function locate(q){const list=await searchPlaces(q);if(!list.length)throw Error('Location not found');return list[0]}
function showResolved(id,x){G(id).textContent=(x.id?x.id+' — ':'')+x.address}
let selectedMarker;
function setSelected(kind,x){
  if(kind==='start'){
    selectedStart=x;
    start.value=x.id||x.address;
    showResolved('sr',x);
  }else{
    selectedDest=x;
    dest.value=x.id||x.address;
    showResolved('dr',x);
  }

  if(selectedMarker){
    map.removeLayer(selectedMarker);
  }

  selectedMarker=L.marker([x.lat,x.lon])
    .addTo(map)
    .bindPopup('<b>Selected location</b><br>'+esc(x.address))
    .openPopup();

  map.setView([x.lat,x.lon],16,{animate:true});

  status.textContent='✓ '+(kind==='start'?'Start':'Destination')+' selected';
  status.className='status ok';
}
function setupAutocomplete(input,box,resolved,kind){let timer=null,results=[];input.addEventListener('input',()=>{if(kind==='start')selectedStart=null;else selectedDest=null;clearTimeout(timer);const q=input.value.trim();if(q.length<3){box.style.display='none';return}timer=setTimeout(async()=>{try{results=await searchPlaces(q);box.innerHTML='';results.slice(0,6).forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.dataset.i=String(i);b.innerHTML=(x.id?'<b>'+esc(x.id)+'</b> · ':'')+esc(x.address);box.appendChild(b)});box.style.display=results.length?'block':'none'}catch(e){console.error(e);box.style.display='none'}},120)});
  const choose=e=>{const btn=e.target.closest('button[data-i]');if(!btn)return;e.preventDefault();e.stopPropagation();const x=results[Number(btn.dataset.i)];if(!x)return;setSelected(kind,x);box.style.display='none';input.blur()};
  box.addEventListener('click',function(e){
  const btn=e.target.closest('button[data-i]');
  if(!btn) return;

  const index=Number(btn.dataset.i);
  const x=results[index];

  if(!x) return;

  e.preventDefault();
  e.stopPropagation();

  setSelected(kind,x);
  box.innerHTML='';
  box.style.display='none';
  input.value=x.id||x.address;
  input.blur();
});

  e.preventDefault();
  e.stopPropagation();

  const x=results[Number(btn.dataset.i)];
  if(!x) return;

  setSelected(kind,x);
  box.style.display='none';
  input.blur();
};
  input.addEventListener('focus',()=>{if(box.children.length)box.style.display='block'});
}
setupAutocomplete(start,G('ss'),'sr','start');
setupAutocomplete(dest,G('ds'),'dr','dest');
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.fieldwrap')){G('ss').style.display='none';G('ds').style.display='none'}});
function hav(a,b){const R=6371000,p=Math.PI/180,x=Math.sin((b.lat-a.lat)*p/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin((b.lon-a.lon)*p/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function decodeShape(str){let i=0,la=0,lo=0,o=[];while(i<str.length){let sh=0,re=0,b;do{b=str.charCodeAt(i++)-63;re|=(b&31)<<sh;sh+=5}while(b>=32);la+=(re&1)?~(re>>1):re>>1;sh=0;re=0;do{b=str.charCodeAt(i++)-63;re|=(b&31)<<sh;sh+=5}while(b>=32);lo+=(re&1)?~(re>>1):re>>1;o.push([la/1e6,lo/1e6])}return o}
async function getRoute(a,b){if(mode.value==='flight'){const d=hav(a,b);return{pts:[[a.lat,a.lon],[b.lat,b.lon]],distance:d/1000,duration:d/800*3.6}}const costing=mode.value==='walking'?'pedestrian':mode.value==='cycling'?'bicycle':'auto';const payload={locations:[{lat:a.lat,lon:a.lon},{lat:b.lat,lon:b.lon}],costing,units:'kilometers',directions_options:{units:'kilometers'}};const r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error('Routing service unavailable');const d=await r.json();const leg=d.trip?.legs?.[0];if(!leg)throw Error('No route found');return{pts:decodeShape(leg.shape),distance:Number(leg.summary?.length)||0,duration:Number(leg.summary?.time)||0}}
function setRouteLine(pts){if(line)map.removeLayer(line);line=L.polyline(pts,{color:'#d71920',weight:5,opacity:.9}).addTo(map)}
function formatTime(s){const m=Math.max(1,Math.round(s/60));return m<60?m+' min':Math.floor(m/60)+' hr '+(m%60?m%60+' min':'')}
async function recalc(){if(!start.value.trim()||!dest.value.trim()){status.textContent='Enter both locations first.';status.className='status err';return}status.textContent='Calculating route…';status.className='status';try{const a=selectedStart||await locate(start.value.trim()),b=selectedDest||await locate(dest.value.trim());selectedStart=a;selectedDest=b;showResolved('sr',a);showResolved('dr',b);const z=await getRoute(a,b);setRouteLine(z.pts);if(sm)map.removeLayer(sm);if(dm)map.removeLayer(dm);sm=L.marker([a.lat,a.lon]).addTo(map).bindPopup('<b>Start</b><br>'+esc(a.address));dm=L.marker([b.lat,b.lon]).addTo(map).bindPopup('<b>Destination</b><br>'+esc(b.address));map.fitBounds(line.getBounds(),{padding:[20,20]});info.innerHTML='<span class="routecard">'+mode.options[mode.selectedIndex].text+'</span><span class="routecard">📏 '+z.distance.toFixed(1)+' km</span><span class="routecard">⏱ '+formatTime(z.duration)+'</span>';status.textContent='✓ Route ready';status.className='status ok'}catch(e){status.textContent=e.message;status.className='status err'}}
mode.onchange=()=>{
  if(start.value.trim() && dest.value.trim()){
    recalc();
  }
};

async function startNavigation(){
  try{
    if(!start.value.trim() || !dest.value.trim()){
      status.textContent='Enter both locations first.';
      status.className='status err';
      return;
    }

    const a=selectedStart||await locate(start.value.trim());
    const b=selectedDest||await locate(dest.value.trim());
    const z=await getRoute(a,b);

    navActive=true;
    navPts=z.pts;
    navIndex=0;

    if(simTimer) clearInterval(simTimer);

    setRouteLine(navPts);

    if(userMarker) map.removeLayer(userMarker);

    userMarker=L.marker(navPts[0]).addTo(map);
    map.fitBounds(line.getBounds(),{padding:[20,20]});

    status.textContent='🇺🇬 Navigation active.';
    status.className='status ok';

    simTimer=setInterval(()=>{
      if(!navActive || navIndex>=navPts.length-1){
        clearInterval(simTimer);
        navActive=false;
        status.textContent='✓ Arrived.';
        status.className='status ok';
        return;
      }

      navIndex++;
      currentNavPos=navPts[navIndex];

      userMarker.setLatLng(currentNavPos);
      map.panTo(currentNavPos);
    },600);

  }catch(e){
    status.textContent=e.message;
    status.className='status err';
  }
}

function closeNavigateMenu(){
  const old=document.getElementById('navigateMenu');
  if(old) old.remove();
}

let navigationPaused=false;

function pauseNavigation(){
  navigationPaused=true;
  status.textContent='⏸ Navigation paused.';
  status.className='status';
}

function resumeNavigation(){
  navigationPaused=false;
  status.textContent='▶️ Navigation resumed.';
  status.className='status ok';
}

function stopNavigation(){
  navActive=false;
  navigationPaused=false;

  if(simTimer){
    clearInterval(simTimer);
    simTimer=null;
  }

  if(userMarker){
    map.removeLayer(userMarker);
    userMarker=null;
  }

  status.textContent='⏹ Navigation stopped.';
  status.className='status';

  closeNavigateMenu();
}

async function startNavigation(){
  try{
    const a=selectedStart||await locate(start.value);
    const b=selectedDest||await locate(dest.value);
    const z=await getRoute(a,b);

    navActive=true;
    navigationPaused=false;
    navPts=z.pts;
    navIndex=0;

    setRouteLine(navPts);

    if(userMarker) map.removeLayer(userMarker);
    userMarker=L.marker(navPts[0]).addTo(map);

    status.textContent='🚗 Navigation active.';
    status.className='status ok';

    if(simTimer) clearInterval(simTimer);

    simTimer=setInterval(()=>{
      if(!navActive){
        clearInterval(simTimer);
        return;
      }

      if(navigationPaused) return;

      if(navIndex>=navPts.length-1){
        stopNavigation();
        status.textContent='✓ Arrived.';
        return;
      }

      navIndex++;
      currentNavPos=navPts[navIndex];
      userMarker.setLatLng(currentNavPos);
      map.panTo(currentNavPos);

    },600);

  }catch(e){
    status.textContent=e.message;
    status.className='status err';
  }
}


function closeNavigateMenu(){
  const old=document.getElementById('navigateMenu');
  if(old) old.remove();
}


G('navigate').onclick=()=>{

  closeNavigateMenu();

  const menu=document.createElement('div');
  menu.id='navigateMenu';

  menu.style.position='fixed';
  menu.style.top='80px';
  menu.style.right='10px';
  menu.style.width='200px';
  menu.style.background='#fff';
  menu.style.padding='8px';
  menu.style.borderRadius='8px';
  menu.style.boxShadow='0 4px 15px #0005';
  menu.style.zIndex='9999';


  const makeButton=(text,fn)=>{
    const b=document.createElement('button');
    b.textContent=text;
    b.style.width='100%';
    b.style.margin='4px 0';
    b.style.padding='10px';
    b.style.border='0';
    b.style.borderRadius='6px';
    b.style.fontWeight='800';
    b.onclick=()=>{
      closeNavigateMenu();
      fn();
    };
    return b;
  };


  menu.appendChild(makeButton('🗺 Preview Route',recalc));
  menu.appendChild(makeButton('🚗 Start Navigation',startNavigation));
  menu.appendChild(makeButton('⏸ Pause',pauseNavigation));
  menu.appendChild(makeButton('▶️ Resume',resumeNavigation));
  menu.appendChild(makeButton('⏹ Stop',stopNavigation));


  document.body.appendChild(menu);
};
  
  
G('myLocation').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{const pos=[p.coords.latitude,p.coords.longitude];if(userMarker)map.removeLayer(userMarker);userMarker=L.marker(pos).addTo(map);map.setView(pos,16);status.textContent='📍 Your location found.'},()=>status.textContent='Unable to access your location.',{enableHighAccuracy:true,timeout:10000});
G('ugamaps').onclick=()=>{map.invalidateSize();status.textContent='🇺🇬 UGAMAP is the built-in map.'};
G('googleMaps').onclick=()=>window.open(dest.value?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest.value):'https://www.google.com/maps','_blank');
function openReport(type){G('reportType').value=type==='infrastructure'?'bridge':type;G('reportpanel').style.display='block';reportPosition=null;status.textContent='Tap the map where you want to place the report.';map.once('click',e=>{reportPosition=[e.latlng.lat,e.latlng.lng];status.textContent='✓ Report location selected.'})}
function closeReport(){G('reportpanel').style.display='none';reportPosition=null}
function submitReport(){if(!reportPosition){status.textContent='Tap the map first to choose a location.';return}const type=G('reportType').value,note=G('reportNote').value.trim(),labels={accident:'🚨 Accident',police:'👮 Police / checkpoint',closure:'🚧 Road closure',bridge:'🌉 Bridge',roundabout:'🔄 Roundabout',highway:'🛣️ Controlled highway'};const m=L.marker(reportPosition).addTo(map).bindPopup('<b>'+labels[type]+'</b><br>'+(note?esc(note):''));reportMarkers.push(m);G('reportNote').value='';closeReport();status.textContent=labels[type]+' reported on the map.'}
info.textContent='🇺🇬 Uganda National Grid · Loading…';grid('UG-ENT-000001').then(x=>info.textContent=x.length?'🇺🇬 Uganda National Grid · 50 real test records loaded':'🇺🇬 Uganda National Grid · Ready').catch(()=>info.textContent='🇺🇬 Uganda National Grid · Ready');
</script>
</body>
</html>
