<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Uganda National Grid</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .8;
    }

    .search {
      background: white;
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      padding: 13px 22px;
      margin-top: 8px;
      border: none;
      border-radius: 7px;
      background: #d71920;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
    }

    #map {
      width: 100%;
      max-width: 1100px;
      height: 600px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }

    #routeInfo {
      max-width: 1000px;
      margin: 15px auto;
      padding: 15px 20px;
      background: white;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Uganda National Grid</h1>
  <p>National transportation and infrastructure network</p>
</header>

<section class="search">

  <label for="start">
    Start Location
  </label>

  <input
    id="start"
    placeholder="Example: Kampala, Uganda"
    autocomplete="off"
  >

  <label for="destination">
    Destination
  </label>

  <input
    id="destination"
    placeholder="Example: Jinja, Uganda"
    autocomplete="off"
  >

  <button id="findRouteButton">
    Find Route
  </button>

  <div id="status"></div>

</section>

<div id="routeInfo"></div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
  [1.3733, 32.2903],
  7
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);


let routeLine = null;
let startMarker = null;
let destinationMarker = null;


const statusBox =
  document.getElementById("status");

const routeInfo =
  document.getElementById("routeInfo");

const button =
  document.getElementById("findRouteButton");


async function geocode(place) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=json" +
    "&limit=1" +
    "&countrycodes=ug" +
    "&q=" +
    encodeURIComponent(place);

  const response =
    await fetch(url, {
      headers: {
        "Accept": "application/json"
      }
    });

  if (!response.ok) {
    throw new Error("Location search failed.");
  }

  const data =
    await response.json();

  if (!data.length) {
    return null;
  }

  return {
    lat: parseFloat(data[0].lat),
    lon: parseFloat(data[0].lon),
    name: data[0].display_name
  };
}


button.addEventListener(
  "click",
  async function() {

    const start =
      document.getElementById("start")
        .value
        .trim();

    const destination =
      document.getElementById("destination")
        .value
        .trim();


    if (!start || !destination) {

      statusBox.textContent =
        "Please enter both locations.";

      return;
    }


    button.disabled = true;

    statusBox.textContent =
      "Finding locations...";


    try {

      const startLocation =
        await geocode(start);

      if (!startLocation) {

        throw new Error(
          "Start location could not be found."
        );

      }


      const destinationLocation =
        await geocode(destination);

      if (!destinationLocation) {

        throw new Error(
          "Destination could not be found."
        );

      }


      statusBox.textContent =
        "Calculating road route...";


      const routeUrl =
        "https://router.project-osrm.org/route/v1/driving/" +
        startLocation.lon + "," +
        startLocation.lat +
        ";" +
        destinationLocation.lon + "," +
        destinationLocation.lat +
        "?overview=full&geometries=geojson";


      const response =
        await fetch(routeUrl);


      if (!response.ok) {

        throw new Error(
          "Routing service unavailable."
        );

      }


      const data =
        await response.json();


      if (
        !data.routes ||
        !data.routes.length
      ) {

        throw new Error(
          "No road route was found."
        );

      }


      const route =
        data.routes[0];


      const coordinates =
        route.geometry.coordinates.map(
          point => [
            point[1],
            point[0]
          ]
        );


      if (routeLine) {

        map.removeLayer(routeLine);

      }

      if (startMarker) {

        map.removeLayer(startMarker);

      }

      if (destinationMarker) {

        map.removeLayer(destinationMarker);

      }


      routeLine =
        L.polyline(
          coordinates,
          {
            color: "#d71920",
            weight: 6
          }
        ).addTo(map);


      startMarker =
        L.marker([
          startLocation.lat,
          startLocation.lon
        ])
        .addTo(map)
        .bindPopup(
          "<strong>Start</strong><br>" +
          startLocation.name
        );


      destinationMarker =
        L.marker([
          destinationLocation.lat,
          destinationLocation.lon
        ])
        .addTo(map)
        .bindPopup(
          "<strong>Destination</strong><br>" +
          destinationLocation.name
        );


      map.fitBounds(
        routeLine.getBounds(),
        {
          padding: [30, 30]
        }
      );


      const distanceKm =
        (route.distance / 1000)
          .toFixed(1);


      const hours =
        Math.floor(
          route.duration / 3600
        );

      const minutes =
        Math.round(
          (route.duration % 3600) / 60
        );


      routeInfo.style.display =
        "block";

      routeInfo.innerHTML =
        "<strong>Route found</strong><br>" +
        "Distance: " +
        distanceKm +
        " km<br>" +
        "Estimated driving time: " +
        hours +
        " hr " +
        minutes +
        " min";


      statusBox.textContent =
        "Route found successfully.";

    }

    catch (error) {

      console.error(error);

      statusBox.textContent =
        error.message;

      routeInfo.style.display =
        "none";

    }

    finally {

      button.disabled = false;

    }

  }
);

</script>

<!-- EXPERIMENTAL UGANDA GRID -->
<div id="gridStatus" style="
  max-width:1000px;
  margin:15px auto;
  padding:12px 20px;
  background:white;
  border-radius:10px;
  font-weight:bold;
">
  Uganda National Grid: Test Mode
</div>
</html>
