<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Uganda National Grid</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    header p {
      margin: 7px 0 0;
      opacity: .8;
    }

    .search {
      background: white;
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      padding: 13px 22px;
      margin-top: 8px;
      border: none;
      border-radius: 7px;
      background: #d71920;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #map {
      width: 100%;
      max-width: 1100px;
      height: 600px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>

<body>

<header>
  <h1>Uganda National Grid</h1>
  <p>National transportation and infrastructure network</p>
</header>

<section class="search">

  <label for="start">Start Location</label>

  <input
    id="start"
    placeholder="Enter starting location"
  >

  <label for="destination">Destination</label>

  <input
    id="destination"
    placeholder="Enter destination"
  >

  <button id="findRouteButton">
    Find Route
  </button>

</section>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
  [1.3733, 32.2903],
  7
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);


const cities = [
  ["Kampala", 0.3476, 32.5825],
  ["Entebbe", 0.0512, 32.4637],
  ["Jinja", 0.4479, 33.2026],
  ["Mbarara", -0.6072, 30.6545],
  ["Mbale", 1.0821, 34.1750],
  ["Gulu", 2.7746, 32.2990],
  ["Arua", 3.0303, 30.9111],
  ["Soroti", 1.7146, 33.6111],
  ["Moroto", 2.5345, 34.6666],
  ["Hoima", 1.4331, 31.3524],
  ["Masaka", -0.3476, 31.7330]
];


cities.forEach(city => {

  L.marker([
    city[1],
    city[2]
  ])
  .addTo(map)
  .bindPopup(
    "<strong>" + city[0] + "</strong>"
  );

});


function findCity(name) {

  name = name.trim().toLowerCase();

  for (const city of cities) {

    if (city[0].toLowerCase() === name) {

      return [
        city[1],
        city[2]
      ];

    }

  }

  return null;
}


let routeLine = null;


document
  .getElementById("findRouteButton")
  .addEventListener("click", async function () {

    const start =
      document.getElementById("start").value;

    const destination =
      document.getElementById("destination").value;


    if (!start || !destination) {

      alert(
        "Please enter both a start location and destination."
      );

      return;
    }


    const startCoords =
      findCity(start);

    const destinationCoords =
      findCity(destination);


    if (!startCoords) {

      alert(
        "Start location not found."
      );

      return;
    }


    if (!destinationCoords) {

      alert(
        "Destination not found."
      );

      return;
    }


    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      startCoords[1] + "," + startCoords[0] +
      ";" +
      destinationCoords[1] + "," + destinationCoords[0] +
      "?overview=full&geometries=geojson";


    try {

      const response =
        await fetch(url);


      const data =
        await response.json();


      if (
        !data.routes ||
        data.routes.length === 0
      ) {

        alert("No route found.");

        return;
      }


      const coordinates =
        data.routes[0]
          .geometry
          .coordinates
          .map(
            point => [
              point[1],
              point[0]
            ]
          );


      if (routeLine) {

        map.removeLayer(routeLine);

      }


      routeLine =
        L.polyline(
          coordinates,
          {
            color: "#d71920",
            weight: 6
          }
        ).addTo(map);


      map.fitBounds(
        routeLine.getBounds(),
        {
          padding: [30, 30]
        }
      );

    }

    catch (error) {

      console.error(error);

      alert(
        "Unable to calculate the route right now."
      );

    }

  });

</script>

</body>
</html>
