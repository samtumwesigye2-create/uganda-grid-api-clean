<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Uganda National Grid</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111827}
    header{background:#111827;color:#fff;padding:16px;text-align:center} header h1{margin:0;font-size:22px} header p{margin:6px 0 0;font-size:13px;opacity:.85}
    .panel{position:relative;z-index:1000;max-width:900px;margin:12px auto;padding:12px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    .field{position:relative;margin-bottom:10px} label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
    input,select,button,textarea{width:100%;font-size:16px;border-radius:8px} input,select,textarea{padding:12px;border:1px solid #d1d5db;background:#fff}
    button{padding:12px;border:0;background:#d71920;color:#fff;font-weight:700;cursor:pointer} button.secondary{background:#374151} button.light{background:#e5e7eb;color:#111827}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row.three{grid-template-columns:1fr 1fr 1fr}
    .suggest{position:absolute;left:0;right:0;top:100%;display:none;background:#fff;border:1px solid #d1d5db;border-radius:8px;max-height:240px;overflow:auto;z-index:3000;box-shadow:0 6px 18px rgba(0,0,0,.15)}
    .suggest div{padding:10px;border-bottom:1px solid #eee;cursor:pointer}.suggest div:last-child{border-bottom:0}
    .selected{font-size:12px;color:#4b5563;min-height:16px;margin-top:4px;word-break:break-word}.status{font-size:13px;margin:10px 0 0;padding:8px;border-radius:7px;background:#f3f4f6}.status.ok{background:#ecfdf5;color:#065f46}.status.err{background:#fef2f2;color:#991b1b}
    #info{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.routecard{background:#f3f4f6;border-radius:999px;padding:6px 9px;font-size:12px}
    #map{height:calc(100vh - 410px);min-height:390px;width:100%;max-width:1100px;margin:0 auto 16px;border-radius:12px;z-index:1}
    #navigate{line-height:1.3}
    #navigate .navMain{display:block;font-size:16px}
    #navigate .navSub{display:block;font-size:12px;font-weight:400;opacity:.85}
    .nav-arrow-icon{background:transparent !important;border:none !important;}
    #reportBtn{margin-top:8px;background:#f59e0b;color:#111827}
    .reportMenu{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
    .reportMenu button{background:#f3f4f6;color:#111827;font-weight:600;font-size:12px;padding:10px 4px}
    .navControls{display:none;gap:8px;margin-top:8px}
    .navControls.active{display:grid;grid-template-columns:1fr 1fr 1fr}
    .navControls button{font-size:13px;padding:10px 6px}
    #navCancel{background:#374151}
    #navRecenter{background:#2563eb}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5000;align-items:center;justify-content:center;padding:16px}
    .modal-overlay.active{display:flex}
    .modal-box{background:#fff;border-radius:12px;padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
    .modal-box h3{margin:0 0 10px;font-size:16px}
    .modal-box textarea{min-height:70px;font-family:inherit;resize:vertical}
    .modal-box input[type=file]{padding:8px;border:1px dashed #d1d5db}
    #modalStatus{font-size:12px;color:#6b7280;min-height:16px;margin-top:6px}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    #modalCancel{background:#e5e7eb;color:#111827}
    @media(max-width:600px){.panel{margin:8px;border-radius:10px}.row,.row.three{grid-template-columns:1fr 1fr}#map{height:calc(100vh - 470px);min-height:360px;border-radius:0}}
  </style>
</head>
<body>
  <header><h1>Uganda National Grid</h1><p>Search, route and navigate across Uganda</p></header>
  <main class="panel">
    <div class="field">
      <label for="start">Start location</label>
      <input id="start" autocomplete="off" placeholder="Address, place or grid ID e.g. UG-ENT-000001" />
      <div id="ss" class="suggest"></div><div id="sr" class="selected"></div>
    </div>
    <div class="field">
      <label for="dest">Destination</label>
      <input id="dest" autocomplete="off" placeholder="Address, place or grid ID e.g. UG-ENT-000400" />
      <div id="ds" class="suggest"></div><div id="dr" class="selected"></div>
    </div>
    <div class="row">
      <select id="mode" aria-label="Travel mode"><option value="driving">&#128664; Driving</option><option value="walking">&#128694; Walking</option><option value="cycling">&#128692; Cycling</option><option value="flight">&#9992;&#65039; Flight</option></select>
      <button id="navigate"><span class="navMain">&#127482;&#127468; UGAMAP</span><span class="navSub">Navigate</span></button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="myLocation" class="secondary">&#128205; My location</button>
      <button id="googleMaps" class="light">Google Maps</button>
    </div>
    <button id="reportBtn">&#9888;&#65039; Report</button>
    <div id="reportMenu" class="reportMenu">
      <button class="reportType" data-category="police">&#128659; Police</button>
      <button class="reportType" data-category="accident">&#128165; Accident</button>
      <button class="reportType" data-category="road_closure">&#128679; Closure</button>
      <button class="reportType" data-category="bridge">&#127753; Bridge</button>
      <button class="reportType" data-category="traffic">&#128678; Traffic</button>
      <button class="reportType" data-category="weather">&#127783;&#65039; Weather</button>
    </div>
    <div id="navControls" class="navControls">
      <button id="navPause" class="secondary">Pause</button>
      <button id="navCancel" class="light">Cancel</button>
      <button id="navRecenter">Recenter</button>
    </div>
    <div id="status" class="status">Loading...</div><div id="info"></div>
  </main>
  <div id="map"></div>

  <div id="reportModalOverlay" class="modal-overlay">
    <div class="modal-box">
      <h3 id="modalTitle">Report</h3>
      <div class="field">
        <label for="reportNote">Message (optional)</label>
        <textarea id="reportNote" placeholder="Add details..."></textarea>
      </div>
      <div class="field">
        <label for="reportFile">Photo or video (optional)</label>
        <input type="file" id="reportFile" accept="image/*,video/*" />
      </div>
      <div id="modalStatus"></div>
      <div class="modal-actions">
        <button id="modalCancel" type="button">Cancel</button>
        <button id="modalSubmit" type="button">Submit</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
