<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Uganda National Grid</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px Arial;background:#f4f6f8}header{height:42px;background:#111827;color:#fff;padding:7px;text-align:center}header h1{margin:0;font-size:19px}main{margin:4px 6px;padding:5px 7px;background:#fff;border-radius:7px}label{font-size:14px;font-weight:800;display:block;margin:1px 0;color:#111827}input,select{width:100%;height:28px;padding:4px 6px;margin:2px 0;font-size:12px}.controlrow{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:2px}.controlrow>*{width:100%;height:29px;min-width:0;margin:0;padding:2px;font-size:10px;border-radius:5px}.controlrow button{background:#d71920;color:#fff;border:0}.provider{background:#fff!important;color:#111!important;border:1px solid #999!important;font-weight:bold}.ugamap{display:flex!important;flex-direction:column;justify-content:center;align-items:center}.ugamap .flag{font-size:8px;line-height:8px}.resolved{font-size:9px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:10px}#info{height:30px;padding:3px 7px;font-size:10px;background:#fff}#map{height:calc(100vh - 250px);min-height:220px;width:100%}.inspiration{position:absolute;left:0;right:0;bottom:0;height:48px;background:#fff;text-align:center;padding:3px;border-top:2px solid #d71920;z-index:1000}.inspiration .flag{font-size:17px;line-height:17px}.inspiration h2{display:inline;margin:0 5px;font-size:13px;color:#111827}.inspiration p{display:inline;margin:0;color:#4b5563;font-size:9px}</style></head><body><header><h1>Uganda National Grid</h1></header><main><label>Start Location</label><input id="start" placeholder="UG-ENT-000001 or 1001 Lake Victoria Drive, Entebbe"><div id="sr" class="resolved"></div><label>Destination</label><input id="dest" placeholder="UG-ENT-000005 or 1009 Lake Victoria Drive, Entebbe"><div id="dr" class="resolved"></div><div class="controlrow"><select id="mode"><option value="driving">🚗 Drive</option><option value="walking">🚶 Walk</option><option value="cycling">🚲 Bike</option><option value="flight">✈️ Plane</option></select><button id="route">Route</button><button id="navigate">🧭 Nav</button><button id="myLocation">📍 Me</button><button class="provider ugamap" id="ugamaps"><span>UGAMAP</span><span class="flag">🇺🇬</span></button><button class="provider" id="googleMaps">Google</button></div><div id="status"></div></main><div id="info">Uganda National Grid: map ready</div><div id="map"></div><section class="inspiration"><span class="flag">🇺🇬</span><h2>One Grid. One Nation. One Future.</h2><p>Building a connected Uganda, one community at a time.</p></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://uganda-grid-api-clean-production.up.railway.app',G=id=>document.getElementById(id),map=L.map('map').setView([1.3733,32.2903],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const status=G('status'),info=G('info'),start=G('start'),dest=G('dest'),route=G('route'),navigate=G('navigate'),myLocation=G('myLocation'),mode=G('mode');let line,sm,dm,userMarker,simTimer;async function grid(q){const r=await fetch(API+'/search?q='+encodeURIComponent(q));if(!r.ok)throw Error('Grid service unavailable');const d=await r.json();return d.results&&d.results[0]||null}async function locate(q){if(/^UG-[A-Z0-9]+-\d+$/i.test(q)){const x=await grid(q);if(!x)throw Error('Grid ID not found');return{lat:+x.latitude,lon:+x.longitude,id:x.grid_id,address:x.address}}const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ug&q='+encodeURIComponent(q)),d=await r.json();if(!d[0])throw Error('Location not found');return{lat:+d[0].lat,lon:+d[0].lon,address:d[0].display_name}}function show(id,x){G(id).textContent=(x.id?x.id+' — ':'')+x.address}function hav(a,b){const R=6371000,p=Math.PI/180,x=Math.sin((b.lat-a.lat)*p/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin((b.lon-a.lon)*p/2)**2;return 2*R*Math.asin(Math.sqrt(x))}async function getRoute(a,b){if(mode.value==='flight'){const d=hav(a,b);return{pts:[[a.lat,a.lon],[b.lat,b.lon]],distance:d,duration:d/800*3600}}const costing=mode.value==='walking'?'pedestrian':mode.value==='cycling'?'bicycle':'auto';const payload={locations:[{lat:a.lat,lon:a.lon},{lat:b.lat,lon:b.lon}],costing:costing,units:'kilometers',directions_options:{units:'kilometers'}};const r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error('Mode routing service unavailable');const d=await r.json();if(!d.trip||!d.trip.legs||!d.trip.legs[0])throw Error('No route found');const leg=d.trip.legs[0],shape=decodeShape(leg.shape);return{pts:shape,distance:(leg.summary.length||0)*1000,duration:(leg.summary.time||0)}}function decodeShape(str){let index=0,lat=0,lon=0,out=[];while(index<str.length){let shift=0,result=0,b;do{b=str.charCodeAt(index++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32);lat+=(result&1)?~(result>>1):(result>>1);shift=0;result=0;do{b=str.charCodeAt(index++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32);lon+=(result&1)?~(result>>1):(result>>1);out.push([lat/1e6,lon/1e6])}return out}async function drawRoute(a,b){const z=await getRoute(a,b);if(line)map.removeLayer(line);if(sm)map.removeLayer(sm);if(dm)map.removeLayer(dm);line=L.polyline(z.pts,{color:'#d71920',weight:5}).addTo(map);sm=L.marker([a.lat,a.lon]).addTo(map).bindPopup('<b>Start</b><br>'+a.address);dm=L.marker([b.lat,b.lon]).addTo(map).bindPopup('<b>Destination</b><br>'+b.address);map.fitBounds(line.getBounds(),{padding:[20,20]});info.innerHTML='<b>'+mode.options[mode.selectedIndex].text+'</b> · '+z.distance.toFixed(1)+' km · '+Math.floor(z.duration/3600)+'h '+Math.round(z.duration%3600/60)+'m';return z}async function recalcForMode(){if(!start.value||!dest.value){status.textContent='Select a mode, then enter both locations.';return}status.textContent='Recalculating '+mode.options[mode.selectedIndex].text+' route...';try{const a=await locate(start.value),b=await locate(dest.value);show('sr',a);show('dr',b);await drawRoute(a,b);status.textContent=mode.options[mode.selectedIndex].text+' route updated.'}catch(e){status.textContent=e.message}}route.onclick=recalcForMode;mode.onchange=recalcForMode;navigate.onclick=async()=>{if(!start.value||!dest.value){status.textContent='Enter Start and Destination.';return}try{const a=await locate(start.value),b=await locate(dest.value),z=await getRoute(a,b);if(simTimer)clearInterval(simTimer);if(line)map.removeLayer(line);line=L.polyline(z.pts,{color:'#d71920',weight:5}).addTo(map);map.fitBounds(line.getBounds(),{padding:[20,20]});if(userMarker)map.removeLayer(userMarker);userMarker=L.marker(z.pts[0]).addTo(map);let i=0;status.textContent='🇺🇬 Navigation simulation active.';simTimer=setInterval(()=>{if(i>=z.pts.length-1){clearInterval(simTimer);status.textContent='Arrived at destination.';return}i++;userMarker.setLatLng(z.pts[i]);map.panTo(z.pts[i],{animate:true,duration:.2})},600)}catch(e){status.textContent=e.message}};myLocation.onclick=()=>navigator.geolocation.getCurrentPosition(p=>{if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([p.coords.latitude,p.coords.longitude]).addTo(map);map.setView([p.coords.latitude,p.coords.longitude],16);status.textContent='Your location found.'},()=>status.textContent='Unable to access your location.',{enableHighAccuracy:true,timeout:10000});G('ugamaps').onclick=()=>{map.invalidateSize();status.textContent='🇺🇬 UGAMAP is the built-in map.'};G('googleMaps').onclick=()=>window.open(dest.value?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest.value):'https://www.google.com/maps','_blank');info.textContent='Uganda National Grid: map ready — loading test records...';grid('UG-ENT-000001').then(x=>info.textContent=x?'Uganda National Grid: 50 real test records loaded':'Uganda National Grid: map ready').catch(()=>info.textContent='Uganda National Grid: map ready');</script></body></html>
