<!doctype html>
<html>
<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Uganda National Grid</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

*{
box-sizing:border-box
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font:13px Arial;
background:#eef1f4;
color:#111827
}

header{
height:44px;
background:linear-gradient(135deg,#111827,#253447);
color:#fff;
padding:6px 8px;
text-align:center;
box-shadow:0 2px 8px #0003
}

header h1{
margin:0;
font-size:18px;
letter-spacing:.3px
}

header small{
font-size:9px;
opacity:.8
}

main{
margin:4px 6px;
padding:6px 7px;
background:#fff;
border-radius:9px;
box-shadow:0 2px 8px #0002
}

label{
font-size:14px;
font-weight:900;
display:block;
margin:1px 0;
color:#111827
}

input,select{
width:100%;
height:28px;
padding:4px 7px;
margin:2px 0;
border:1px solid #cbd5e1;
border-radius:6px;
background:#f8fafc;
font-size:12px;
outline:none
}

input:focus{
border-color:#d71920;
box-shadow:0 0 0 2px #d7192022
}

.suggest{
display:none;
background:#fff;
border:1px solid #cbd5e1;
border-radius:6px;
max-height:72px;
overflow:hidden;
position:relative;
z-index:2000;
box-shadow:0 3px 8px #0002
}

.suggest div{
padding:5px 7px;
font-size:10px;
border-bottom:1px solid #e5e7eb;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.suggest div:last-child{
border:0
}

.controlrow{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:2px;
margin-top:3px
}

.controlrow>*{
width:100%;
height:30px;
min-width:0;
margin:0;
padding:2px;
font-size:10px;
border-radius:6px
}

.controlrow button{
background:#d71920;
color:#fff;
border:0;
font-weight:800;
box-shadow:0 1px 3px #0002
}

.provider{
background:#fff!important;
color:#111!important;
border:1px solid #9ca3af!important;
font-weight:800
}

#map{
height:calc(100vh - 252px);
min-height:220px;
width:100%;
background:#dbe4ea
}
  .resolved{
font-size:9px;
color:#475569;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.status{
font-size:10px;
font-weight:700;
color:#475569;
min-height:11px
}

.status.ok{
color:#15803d
}

.status.err{
color:#b91c1c
}

#info{
height:32px;
padding:4px 8px;
font-size:10px;
background:#fff;
font-weight:700;
box-shadow:0 1px 5px #0002;
position:relative;
z-index:500
}

.routecard{
display:inline-block;
background:#f8fafc;
border-radius:6px;
padding:3px 6px;
margin-right:3px
}

.inspiration{
position:absolute;
left:0;
right:0;
bottom:0;
height:48px;
background:#fff;
text-align:center;
padding:3px;
border-top:2px solid #d71920;
z-index:1000;
box-shadow:0 -2px 8px #0002
}

.inspiration .flag{
font-size:17px;
line-height:17px
}

.inspiration h2{
display:inline;
margin:0 5px;
font-size:13px;
color:#111827
}

.inspiration p{
display:inline;
margin:0;
color:#4b5563;
font-size:9px
}

</style>

</head>

<body>

<header>

<h1>🇺🇬 Uganda National Grid</h1>

<small>
CONNECTED. MAPPED. MOVING UGANDA FORWARD.
</small>

</header>


<main>

<label>
Start Location
</label>

<input
id="start"
autocomplete="off"
placeholder="UG-ENT-000001 or 1001 Lake Victoria Drive, Entebbe">


<div id="ss" class="suggest"></div>

<div id="sr" class="resolved"></div>



<label>
Destination
</label>

<input
id="dest"
autocomplete="off"
placeholder="UG-ENT-000005 or 1009 Lake Victoria Drive, Entebbe">


<div id="ds" class="suggest"></div>

<div id="dr" class="resolved"></div>


<div class="controlrow">

<select id="mode">

<option value="driving">
🚗 Drive
</option>

<option value="walking">
🚶 Walk
</option>

<option value="cycling">
🚲 Bike
</option>

<option value="flight">
✈️ Plane
</option>

</select>


<button id="navigate">
🧭 Navigate
</button>


<button id="myLocation">
📍 Me
</button>


<button class="provider ugamap" id="ugamaps">

<span>
UGAMAP
</span>

<span class="flag">
🇺🇬
</span>

</button>


<button class="provider" id="googleMaps">
Google
</button>


</div>


<div id="status" class="status"></div>


</main>


<div id="info">
🇺🇬 Uganda National Grid · Ready
</div>


<div id="map"></div>


<section class="inspiration">

<span class="flag">
🇺🇬
</span>

<h2>
One Grid. One Nation. One Future.
</h2>

<p>
Building a connected Uganda, one community at a time.
</p>

</section>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>  
<script>

const API =
'https://uganda-grid-api-clean-production.up.railway.app';


const G = id => document.getElementById(id);


const map = L.map('map').setView(
[1.3733,32.2903],
7
);



L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);



const status = G('status');

const info = G('info');

const start = G('start');

const dest = G('dest');

const navigate = G('navigate');

const myLocation = G('myLocation');

const mode = G('mode');



let line;

let sm;

let dm;

let userMarker;

let simTimer;

let navActive=false;

let navToken=0;


let timers={
start:null,
dest:null
};





async function grid(q){

const r = await fetch(
API+'/search?q='+encodeURIComponent(q)
);


if(!r.ok){

throw Error(
'Grid service unavailable'
);

}


const d = await r.json();

return d.results || [];

}





async function locate(q){


if(/^UG-[A-Z0-9]+-\d+$/i.test(q)){


const xs = await grid(q);

const x = xs[0];


if(!x){

throw Error(
'Grid ID not found'
);

}


return {

lat:+x.latitude,

lon:+x.longitude,

id:x.grid_id,

address:x.address

};


}





const r = await fetch(

'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ug&q='
+
encodeURIComponent(q)

);



const d = await r.json();



if(!d[0]){

throw Error(
'Location not found'
);

}



return {

lat:+d[0].lat,

lon:+d[0].lon,

address:d[0].display_name

};


}





function show(id,x){

G(id).textContent =
(x.id ? x.id+' — ' : '') +
x.address;

}





function esc(s){

return String(s).replace(

/[&<>"']/g,

c=>({

'&':'&amp;',

'<':'&lt;',

'>':'&gt;',

'"':'&quot;',

"'":'&#39;'

}[c])

);

}
  async function selectLocation(
input,
box,
out,
kind
){

const q=input.value.trim();

box.style.display='none';


if(q.length<3){

G(out).textContent='';

return;

}


status.textContent =
'Resolving '+kind+'…';

status.className='status';



try{


const x=await locate(q);


show(out,x);


status.textContent =
'✓ '+kind+' selected';


status.className='status ok';


}

catch(e){

G(out).textContent='';

status.textContent=e.message;

status.className='status err';

}


}





async function suggest(
input,
box,
kind,
out
){

clearTimeout(
timers[kind]
);


const q=input.value.trim();


if(q.length<3){

box.style.display='none';

return;

}



timers[kind]=setTimeout(async()=>{


try{


let arr=[];


if(/^UG-/i.test(q)){


arr=await grid(q);


}
else{


const r=await fetch(

'https://nominatim.openstreetmap.org/search?format=json&limit=4&countrycodes=ug&q='
+
encodeURIComponent(q)

);


arr=await r.json();


}



box.innerHTML=arr.slice(0,4).map(x=>{


const address =
x.address ||
x.display_name ||
'Unknown address';



const id =
x.grid_id || '';



return '<div data-value="'+
esc(id||address)
+'">'+

(id?
'<b>'+esc(id)+'</b> · '
:
'')

+

esc(address)

+

'</div>';



}).join('');



box.style.display =
arr.length?'block':'none';





box.querySelectorAll('div')
.forEach(el=>{


el.onclick=async()=>{


input.value =
el.dataset.value;



box.style.display='none';



await selectLocation(
input,
box,
out,
kind
);



};


});



}
catch{

box.style.display='none';

}


},250);


}





start.oninput=()=>suggest(
start,
G('ss'),
'start',
'sr'
);



dest.oninput=()=>suggest(
dest,
G('ds'),
'dest',
'dr'
);



start.onchange=()=>selectLocation(
start,
G('ss'),
'sr',
'Start Location'
);



dest.onchange=()=>selectLocation(
dest,
G('ds'),
'dr',
'Destination'
);



start.onblur=()=>setTimeout(
()=>G('ss').style.display='none',
180
);



dest.onblur=()=>setTimeout(
()=>G('ds').style.display='none',
180
);





function hav(a,b){

const R=6371000;

const p=Math.PI/180;

const x=
Math.sin((b.lat-a.lat)*p/2)**2
+
Math.cos(a.lat*p)
*
Math.cos(b.lat*p)
*
Math.sin((b.lon-a.lon)*p/2)**2;


return 2*R*Math.asin(
Math.sqrt(x)
);

}





async function getRoute(a,b){


if(mode.value==='flight'){


const d=hav(a,b);


return{

pts:[
[a.lat,a.lon],
[b.lat,b.lon]
],

distance:d,

duration:d/800*3600

};


}



const costing =
mode.value==='walking'
?
'pedestrian'
:
mode.value==='cycling'
?
'bicycle'
:
'auto';



const payload={

locations:[

{
lat:a.lat,
lon:a.lon
},

{
lat:b.lat,
lon:b.lon
}

],

costing,

units:'kilometers'

};



const r=await fetch(

'https://valhalla1.openstreetmap.de/route',

{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify(payload)

}

);



if(!r.ok){

throw Error(
'Mode routing service unavailable'
);

}



const d=await r.json();

const leg=d.trip.legs[0];


return{

pts:decodeShape(
leg.shape
),

distance:
leg.summary.length,

duration:
leg.summary.time

};


}
  function decodeShape(str){

let i=0;
let la=0;
let lo=0;
let out=[];


while(i<str.length){

let shift=0;
let result=0;
let b;


do{

b=str.charCodeAt(i++)-63;

result |= (b & 31) << shift;

shift+=5;

}while(b>=32);



la +=
(result & 1)
?
~(result>>1)
:
result>>1;



shift=0;
result=0;


do{

b=str.charCodeAt(i++)-63;

result |= (b & 31) << shift;

shift+=5;

}while(b>=32);



lo +=
(result & 1)
?
~(result>>1)
:
result>>1;



out.push([
la/1000000,
lo/1000000
]);


}


return out;

}





function formatTime(s){

const m=Math.max(
1,
Math.round(s/60)
);


return m<60
?
m+" min"
:
Math.floor(m/60)+" hr "+(m%60)+" min";

}





async function drawRoute(a,b){


const z=await getRoute(a,b);



if(line)
map.removeLayer(line);



line=L.polyline(
z.pts,
{
color:"#d71920",
weight:5
}
)
.addTo(map);



map.fitBounds(
line.getBounds(),
{
padding:[20,20]
}
);



info.innerHTML=

'<span class="routecard">'+
mode.options[mode.selectedIndex].text+
'</span>'+

'<span class="routecard">📏 '+
z.distance.toFixed(1)+
' km</span>'+

'<span class="routecard">⏱ '+
formatTime(z.duration)+
'</span>';



}




async function recalc(){


if(!start.value || !dest.value){

status.textContent=
"Enter Start and Destination.";

status.className="status err";

return;

}



try{


const a=await locate(start.value);

const b=await locate(dest.value);



show("sr",a);

show("dr",b);



await drawRoute(a,b);



status.textContent=
"✓ Route ready";

status.className=
"status ok";


}

catch(e){

status.textContent=e.message;

status.className=
"status err";

}


}





// ONE BUTTON = ROUTE + NAVIGATION

navigate.onclick=async()=>{


await recalc();


navActive=true;


status.textContent=
"🧭 Navigation active";


status.className=
"status ok";


};





myLocation.onclick=()=>{


navigator.geolocation.getCurrentPosition(

p=>{


if(userMarker)
map.removeLayer(userMarker);



userMarker=L.marker([

p.coords.latitude,

p.coords.longitude

])
.addTo(map);



map.setView([

p.coords.latitude,

p.coords.longitude

],16);



status.textContent=
"📍 Your location found.";


},


()=>{

status.textContent=
"Unable to access your location.";

}

);


};





G("ugamaps").onclick=()=>{

map.invalidateSize();

status.textContent=
"🇺🇬 UGAMAP active";

};





G("googleMaps").onclick=()=>{

window.open(

dest.value

?

"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest.value)

:

"https://www.google.com/maps",

"_blank"

);

};





info.textContent=
"🇺🇬 Uganda National Grid · Ready";



setTimeout(()=>{

map.invalidateSize();

},1000);



</script>


</body>

</html>
