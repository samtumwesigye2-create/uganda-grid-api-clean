<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGAMAP Admin — Mail &amp; Shipments</title>
<style>
  :root {
    --bg: #0d1225;
    --panel: #161c36;
    --panel-2: #1f2749;
    --accent: #e0483e;
    --text: #f2f4fb;
    --muted: #9aa3c7;
    --border: #2a3358;
    --ok: #4ade80;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 20px 24px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

  nav { display: flex; gap: 8px; padding: 12px 24px; border-bottom: 1px solid var(--border); }
  nav button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 18px; font-size: 0.95rem; cursor: pointer;
  }
  nav button.active { background: var(--accent); border-color: var(--accent); }

  main { padding: 20px 24px; max-width: 900px; }
  section { display: none; }
  section.active { display: block; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; margin-bottom: 18px;
  }
  .card h2 { margin: 0 0 12px; font-size: 1.05rem; }

  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 10px 0 4px; }
  input, textarea, select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; color: var(--text); font-size: 0.95rem;
  }
  textarea { min-height: 100px; resize: vertical; }

  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  button.primary {
    margin-top: 14px; background: var(--accent); border: none; border-radius: 10px;
    color: white; padding: 11px 20px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    margin-top: 14px; margin-left: 8px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); padding: 11px 20px; font-size: 0.95rem; cursor: pointer;
  }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }

  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 0.75rem;
    background: var(--panel-2); border: 1px solid var(--border);
  }
  .badge.delivered { color: var(--ok); border-color: var(--ok); }
  .badge.in_transit, .badge.out_for_delivery { color: var(--warn); border-color: var(--warn); }
  .badge.failed_delivery, .badge.returned { color: var(--accent); border-color: var(--accent); }
  .badge.paid { color: var(--ok); border-color: var(--ok); }
  .badge.unpaid { color: var(--warn); border-color: var(--warn); }

  .status-msg { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }

  .tier-option {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
  }
  .tier-option.selected { border-color: var(--accent); background: #2a1f2f; }
  .tier-option .tier-name { font-weight: 600; }
  .tier-option .tier-eta { color: var(--muted); font-size: 0.8rem; }
  .tier-option .tier-price { font-weight: 700; font-size: 1.05rem; }
</style>
</head>
<body>

<header>
  <h1>UGAMAP Admin</h1>
  <p>Mass mailing &amp; shipment management</p>
</header>

<nav>
  <button id="tabMailBtn" class="active" onclick="showTab('mail')">Mail</button>
  <button id="tabShipBtn" onclick="showTab('ship')">Shipments</button>
</nav>

<main>

  <!-- MAILING TAB -->
  <section id="mail" class="active">
    <div class="card">
      <h2>Add subscriber</h2>
      <label>Email</label>
      <input id="subEmail" type="email" placeholder="name@example.com">
      <div class="row">
        <div><label>Name</label><input id="subName" type="text"></div>
        <div><label>Region</label><input id="subRegion" type="text" placeholder="Kampala"></div>
      </div>
      <button class="primary" onclick="addSubscriber()">Add subscriber</button>
      <div class="status-msg" id="subStatus"></div>
    </div>

    <div class="card">
