<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>Uganda National Grid</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font: 13px Arial;
      background: #eef1f4;
      color: #111827;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px;
      text-align: center;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .controls {
      background: white;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      border-bottom: 1px solid #d1d5db;
    }

    .controls input {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .swap-button {
      width: 46px;
      height: 46px;
      padding: 0;
      background: #111827;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 22px;
      cursor: pointer;
    }

    .route-actions {
      background: white;
      padding: 0 10px 10px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .route-actions button {
      padding: 12px 18px;
      border: 0;
      border-radius: 7px;
      font-size: 15px;
      cursor: pointer;
    }

    .find-button {
      flex: 1;
      background: #d71920;
      color: white;
      font-weight: bold;
    }

    .clear-button {
      background: #e5e7eb;
      color: #111827;
    }

    #map {
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px;
      }

      header h1 {
        font-size: 19px;
      }

      .controls {
        grid-template-columns: 1fr 44px 1fr;
        gap: 6px;
        padding: 8px;
      }

      .controls input {
        padding: 11px 8px;
        font-size: 14px;
      }

      .swap-button {
        width: 44px;
        height: 44px;
        font-size: 20px;
      }

      .route-actions {
        padding: 0 8px 8px;
      }

      .route-actions button {
        padding: 11px 14px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <header>
    <h1>Uganda National Grid</h1>
  </header>

  <div class="controls">

    <input
      id="start"
      type="text"
      placeholder="Start location"
      autocomplete="off"
    >

    <button
      class="swap-button"
      onclick="swapLocations()"
      title="Swap start and destination"
    >
      ⇄
    </button>

    <input
      id="destination"
      type="text"
      placeholder="Destination"
      autocomplete="off"
    >

  </div>

  <div class="route-actions">

    <button
      class="find-button"
      onclick="findRoute()"
    >
      Find Route
    </button>

    <button
      class="clear-button"
      onclick="clearRoute()"
    >
      Clear
    </button>

  </div>

  <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="./app.js"></script>

</body>
</html>
