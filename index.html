<div class="controls">

  <input
    id="start"
    type="text"
    placeholder="Start location"
    autocomplete="off"
  >

  <button
    class="swap-button"
    onclick="swapLocations()"
    title="Swap start and destination"
  >
    ⇄
  </button>

  <input
    id="destination"
    type="text"
    placeholder="Destination"
    autocomplete="off"
  >

</div>

<div class="route-actions">

  <button
    class="find-button"
    onclick="findRoute()"
  >
    Find Route
  </button>

  <button
    class="clear-button"
    onclick="clearRoute()"
  >
    Clear
  </button>

</div>
