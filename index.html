<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Uganda National Grid</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef1f4;
}

header{
background:#111827;
color:white;
padding:25px 15px;
text-align:center;
}

header h1{
margin:0;
font-size:32px;
}

header p{
font-size:18px;
margin:10px 0 0;
}

.container{
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:14px;
margin-bottom:15px;
box-shadow:0 3px 10px #0002;
}

.status{
background:#166534;
color:white;
padding:14px;
border-radius:10px;
text-align:center;
font-size:20px;
}

label{
display:block;
font-size:18px;
font-weight:bold;
margin-top:12px;
}

input{
width:100%;
padding:15px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
margin-top:6px;
}

button{
background:#d71920;
color:white;
border:0;
padding:14px 20px;
border-radius:8px;
font-size:17px;
margin:5px;
}

.green{
background:#166534;
}

.controls{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

#map{
height:500px;
width:100%;
border-radius:12px;
margin-top:15px;
}

</style>

</head>

<body>

<header>
<h1>🇺🇬 Uganda National Grid</h1>
<p>CONNECTED. MAPPED. MOVING UGANDA FORWARD.</p>
</header>


<div class="container">


<div class="card">

<div class="status">
SYSTEM CONNECTED
</div>


<label>Start Location</label>

<input 
id="start"
placeholder="Enter starting location">


<label>Destination</label>

<input 
id="destination"
placeholder="Enter destination">


<div class="controls">

<button onclick="findRoute()">
Preview Route
</button>

<button class="green">
Start Navigation
</button>

<button>
Pause
</button>

<button>
Resume
</button>

<button>
Stop
</button>

</div>

</div>


<div class="card">

<button class="green">
UGAMAP 🇺🇬
</button>

</div>


<div id="map"></div>


</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="app.js"></script>


</body>

</html>
