<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uganda National Grid</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px Arial;background:#f4f6f8}header{background:#111827;color:#fff;padding:18px;text-align:center}main{max-width:1000px;margin:12px auto;padding:12px;background:#fff;border-radius:10px}label{font-size:19px;font-weight:800;display:block;margin-top:5px;color:#111827}input,select{width:100%;padding:10px;margin:4px 0 7px;box-sizing:border-box}button{padding:8px 4px;background:#d71920;color:#fff;border:0;border-radius:6px;margin:0;white-space:nowrap;font-size:12px}.controlrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;width:100%;overflow:hidden}.controlrow>*{width:100%;height:34px;min-width:0;box-sizing:border-box}.controlrow select{margin:0;padding:5px 2px;font-size:10px}.provider{background:#fff;color:#111;border:1px solid #999;font-weight:bold;line-height:12px}.ugamap{display:flex!important;flex-direction:column;justify-content:center;align-items:center;padding:2px!important}.ugamap .flag{font-size:10px;line-height:9px}.resolved{font-size:12px;color:#374151}.locationinfo{border:1px solid #d1d5db;border-radius:7px;margin-top:8px;padding:12px;background:#f9fafb}.locationinfo h3{margin:0 0 6px;font-size:16px}.locationinfo p{margin:3px 0;font-size:13px;color:#374151}#map{height:300px;width:100%}#info{padding:10px}.inspiration{margin:0 auto 20px;max-width:1000px;min-height:130px;background:#fff;text-align:center;padding:20px 18px;box-sizing:border-box;border-top:3px solid #d71920}.inspiration .flag{font-size:38px;line-height:1;margin-bottom:8px}.inspiration h2{margin:4px 0 8px;font-size:20px;color:#111827}.inspiration p{margin:0;color:#4b5563;font-size:15px;line-height:1.5}</style></head><body><header><h1>Uganda National Grid</h1></header><main><label>Start Location</label><input id="start" placeholder="UG-ENT-000001 or 1001 Lake Victoria Drive, Entebbe"><div id="sr" class="resolved"></div><label>Destination</label><input id="dest" placeholder="UG-ENT-000005 or 1009 Lake Victoria Drive, Entebbe"><div id="dr" class="resolved"></div><div class="controlrow"><select id="mode"><option value="driving">🚗 Drive</option><option value="walking">🚶 Walk</option><option value="cycling">🚲 Bike</option><option value="flight">✈️ Plane</option></select><button id="route">Route</button><button id="navigate">🧭 Nav</button><button id="myLocation">📍 Me</button><button class="provider ugamap" id="ugamaps"><span>UGAMAP</span><span class="flag">🇺🇬</span></button><button class="provider" id="googleMaps">Google</button></div><div id="status"></div></main><main><label>Location Information</label><div class="locationinfo"><h3>Selected Location</h3><p id="locationName">Enter a Grid ID or address above.</p><p id="locationGrid"></p><p id="locationCoords"></p></div></main><main><label>Navigation Test Mode</label><select id="navMode"><option value="simulate">🇺🇬 Uganda Simulation</option><option value="gps">📍 Real GPS</option></select></main><div id="info">Uganda National Grid: map ready</div><div id="map"></div><section class="inspiration"><div class="flag">🇺🇬</div><h2>One Grid. One Nation. One Future.</h2><p>Building a connected Uganda, one community at a time.</p></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://uganda-grid-api-clean-production.up.railway.app',G=id=>document.getElementById(id),map=L.map('map').setView([1.3733,32.2903],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const status=G('status'),info=G('info'),start=G('start'),dest=G('dest'),route=G('route'),navigate=G('navigate'),myLocation=G('myLocation'),mode=G('mode'),navMode=G('navMode');let line,sm,dm,userMarker,simTimer;async function grid(q){const r=await fetch(API+'/search?q='+encodeURIComponent(q));if(!r.ok)throw Error('Grid service unavailable');const d=await r.json();return d.results&&d.results[0]||null}async function locate(q){if(/^UG-[A-Z0-9]+-\d+$/i.test(q)){const x=await grid(q);if(!x)throw Error('Grid ID not found');return{lat:+x.latitude,lon:+x.longitude,id:x.grid_id,address:x.address}}const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ug&q='+encodeURIComponent(q)),d=await r.json();if(!d[0])throw Error('Location not found');return{lat:+d[0].lat,lon:+d[0].lon,address:d[0].display_name}}function show(id,x){G(id).textContent=(x.id?x.id+' — ':'')+x.address}function showInfo(x){G('locationName').textContent=x.address||'Selected location';G('locationGrid').textContent=x.id?'Grid ID: '+x.id:'';G('locationCoords').textContent='Coordinates: '+x.lat.toFixed(7)+', '+x.lon.toFixed(7)}function hav(a,b){const R=6371000,p=Math.PI/180,x=Math.sin((b.lat-a.lat)*p/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin((b.lon-a.lon)*p/2)**2;return 2*R*Math.asin(Math.sqrt(x))}async function getRoute(a,b){if(mode.value==='flight'){const d=hav(a,b);return{pts:[[a.lat,a.lon],[b.lat,b.lon]],distance:d,duration:d/700*3600}}const profile=mode.value==='walking'?'foot':mode.value==='cycling'?'bike':'driving',r=await fetch('https://router.project-osrm.org/route/v1/'+profile+'/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=full&geometries=geojson'),d=await r.json();if(!d.routes||!d.routes[0])throw Error('No route found');const z=d.routes[0];return{pts:z.geometry.coordinates.map(p=>[p[1],p[0]]),distance:z.distance,duration:z.duration}}async function drawRoute(a,b){const z=await getRoute(a,b);if(line)map.removeLayer(line);if(sm)map.removeLayer(sm);if(dm)map.removeLayer(dm);line=L.polyline(z.pts,{color:'#d71920',weight:6}).addTo(map);sm=L.marker([a.lat,a.lon]).addTo(map).bindPopup('<b>Start</b><br>'+a.address);dm=L.marker([b.lat,b.lon]).addTo(map).bindPopup('<b>Destination</b><br>'+b.address);map.fitBounds(line.getBounds(),{padding:[40,40]});info.innerHTML='<b>'+mode.options[mode.selectedIndex].text+'</b><br>Distance: '+(z.distance/1000).toFixed(1)+' km<br>Estimated time: '+Math.floor(z.duration/3600)+' hr '+Math.round(z.duration%3600/60)+' min';return z}route.onclick=async()=>{if(!start.value||!dest.value){status.textContent='Please enter both locations.';return}status.textContent='Calculating...';try{const a=await locate(start.value),b=await locate(dest.value);show('sr',a);show('dr',b);showInfo(b);await drawRoute(a,b);status.textContent='Route found successfully.'}catch(e){status.textContent=e.message}};navigate.onclick=async()=>{if(!start.value||!dest.value){status.textContent='Enter Start and Destination Grid IDs or addresses.';return}try{const a=await locate(start.value),b=await locate(dest.value),z=await getRoute(a,b);if(simTimer)clearInterval(simTimer);if(line)map.removeLayer(line);line=L.polyline(z.pts,{color:'#d71920',weight:6}).addTo(map);map.fitBounds(line.getBounds(),{padding:[50,50]});if(userMarker)map.removeLayer(userMarker);userMarker=L.marker(z.pts[0]).addTo(map).bindPopup('<b>🇺🇬 Simulated Navigation</b>').openPopup();if(navMode.value==='simulate'){let i=0;status.textContent='🇺🇬 Navigation simulation active.';simTimer=setInterval(()=>{if(i>=z.pts.length-1){clearInterval(simTimer);status.textContent='Navigation simulation arrived at destination.';return}i++;userMarker.setLatLng(z.pts[i]);map.panTo(z.pts[i],{animate:true,duration:.25})},600)}else{status.textContent='Requesting your real GPS location...';navigator.geolocation.getCurrentPosition(p=>{userMarker.setLatLng([p.coords.latitude,p.coords.longitude]);status.textContent='Real GPS navigation active.'},()=>status.textContent='Allow location access for real GPS navigation.',{enableHighAccuracy:true,timeout:10000})}}catch(e){status.textContent=e.message}};myLocation.onclick=()=>navigator.geolocation.getCurrentPosition(p=>{if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup('<b>My Location</b>').openPopup();map.setView([p.coords.latitude,p.coords.longitude],16);status.textContent='Your real location found.'},()=>status.textContent='Unable to access your location.',{enableHighAccuracy:true,timeout:10000});G('ugamaps').onclick=()=>{map.scrollIntoView({behavior:'smooth'});setTimeout(()=>map.invalidateSize(),100);status.textContent='🇺🇬 UGAMAP is the built-in map.'};G('googleMaps').onclick=()=>window.open(dest.value?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest.value):'https://www.google.com/maps','_blank');info.textContent='Uganda National Grid: map ready — loading test records...';grid('UG-ENT-000001').then(x=>info.textContent=x?'Uganda National Grid: 50 real test records loaded':'Uganda National Grid: map ready').catch(()=>info.textContent='Uganda National Grid: map ready — grid service unavailable');</script></body></html>
