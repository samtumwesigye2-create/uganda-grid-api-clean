<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uganda National Grid</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial}main{padding:8px}input{width:100%;height:30px}.suggest{border:1px solid #ccc}.suggest div{padding:6px}#map{height:70vh}
</style>
</head>
<body>
<main>
<h1>🇺🇬 Uganda National Grid</h1>
<input id="start" placeholder="Start location">
<div id="ss" class="suggest"></div>
<input id="dest" placeholder="Destination">
<div id="ds" class="suggest"></div>
<button id="route">Route</button>
</main>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API='https://uganda-grid-api-clean-production.up.railway.app';
const map=L.map('map').setView([1.3733,32.2903],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
async function search(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=4&countrycodes=ug&q='+encodeURIComponent(q));return await r.json();}
function setup(input,box){input.oninput=async()=>{if(input.value.length<3){box.innerHTML='';return}const results=await search(input.value);box.innerHTML=results.map(x=>`<div>${x.display_name}</div>`).join('');box.querySelectorAll('div').forEach(el=>{el.onclick=()=>{input.value=el.textContent;box.innerHTML='';};});};}
setup(document.getElementById('start'),document.getElementById('ss'));
setup(document.getElementById('dest'),document.getElementById('ds'));
</script>
</body>
</html>
