<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Uganda National Address Finder
</title>


<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">


<style>

body {

    margin:0;
    font-family:Arial, sans-serif;

    padding:25px;

}


h1 {

    margin:0;
    font-size:32px;

}


.subtitle {

    margin-top:10px;

}


.container {

    padding:20px;

}


button {

    width:100%;

#result {

}


#map {

    width:100%;
    height:500px;
    margin-top:15px;

}


</style>


</head>



<body>


<header>

<h1>
Uganda National Address Finder
</h1>

<div class="subtitle">
Search addresses and navigate between buildings
</div>

</header>



<div class="container">


<input 
id="addressInput"
placeholder="Enter Building ID or Address"
/>


<button id="searchButton">
Find Address
</button>


<button id="navigateButton">
🚗 Navigate Here
</button>


<div id="status">
Loading database...
</div>



<div id="result"></div>



<div id="map"></div>


</div>



<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>


<script src="app.js"></script>


</body>
