<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Uganda National Grid</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
--bg-page:#0b1220;
--bg-header:#0f1830;
--bg-card:#1c2540;
--bg-input:#1b2338;
--text-primary:#f5f7fb;
--text-secondary:#9aa4bd;
--border-subtle:rgba(255,255,255,0.08);
--border-strong:rgba(255,255,255,0.22);
--accent-red:#e0332f;
--accent-blue:#3b5bfd;
--accent-amber:#f5a623;
--success-bg:rgba(16,60,36,0.55);
--success-text:#6fe3a1;
--err-bg:rgba(80,20,20,0.55);
--err-text:#f39a9a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:var(--bg-page);color:var(--text-primary);display:flex;flex-direction:column;height:100vh;height:calc(var(--vh, 1vh) * 100);overflow:hidden}
header{flex:0 0 auto;background:var(--bg-header);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-subtle)}
header .icon-btn{background:none;border:0;color:var(--text-primary);font-size:18px;padding:4px;width:auto}
header .titleWrap{text-align:center;flex:1}
header h1{margin:0;font-size:15px;font-weight:700}
header p{margin:1px 0 0;font-size:10px;color:var(--text-secondary)}
.contentScroll{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.panel{flex:0 0 auto;max-width:900px;width:100%;margin:0 auto;padding:8px 10px}
.field{position:relative;margin-bottom:8px}
label{display:block;font-weight:700;font-size:11px;margin-bottom:4px;color:var(--text-secondary)}
input,select,textarea{width:100%;font-size:14px;border-radius:10px;padding:10px 36px 10px 12px;border:1px solid var(--border-subtle);background:var(--bg-input);color:var(--text-primary)}
input::placeholder,textarea::placeholder{color:var(--text-secondary)}
.fieldIcon{
position:absolute;
right:8px;
top:26px;
width:24px;
height:24px;
display:flex;
align-items:center;
justify-content:center;
color:var(--text-secondary);
font-size:15px;
background:none;
border:0;
padding:0;
cursor:pointer;
}
#start{ padding-right:40px; }
button{width:100%;font-size:14px;border-radius:10px;padding:10px;border:0;font-weight:700;cursor:pointer;color:var(--text-primary)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
select{background:var(--bg-input);padding:10px 12px}
#navigate{background:var(--accent-red);display:flex;align-items:center;justify-content:center;gap:8px}
#navigate .btnIcon{flex:0 0 auto;display:block}
#navigate .navText{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
#navigate .navMain{display:block;font-size:14px}
#navigate .navSub{display:block;font-size:10px;font-weight:400;opacity:.85}
.secondaryBtn{background:var(--bg-input);border:1px solid var(--border-subtle)}
#googleMaps{background:#ffffff;color:#1a73e8;border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;gap:8px}
#googleMaps .btnIcon{flex:0 0 auto;display:block}
.suggest{position:absolute;left:0;right:0;top:100%;display:none;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:10px;max-height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;z-index:3000;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.suggest div{padding:12px;border-bottom:1px solid var(--border-subtle);cursor:pointer;font-size:14px;color:var(--text-primary)}
.suggest div:last-child{border-bottom:0}
.suggest div:active,.suggest div:hover{background:var(--bg-input)}
.selected{font-size:11px;color:var(--text-secondary);min-height:14px;margin-top:3px}
.status{font-size:12px;margin:6px 0 0;padding:8px 10px;border-radius:8px;background:var(--bg-input)}
.status.ok{background:var(--success-bg);color:var(--success-text)}
.status.err{background:var(--err-bg);color:var(--err-text)}
#info{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.routecard{background:var(--bg-input);border-radius:999px;padding:5px 9px;font-size:11px}
.navControls{display:none;gap:6px;margin-top:6px}
.navControls.active{display:grid;grid-template-columns:1fr 1fr 1fr}
.navControls button{font-size:12px;padding:9px 6px;background:var(--bg-input);border:1px solid var(--border-subtle)}
.mapWrap{position:relative;flex:1 1 auto;min-height:160px;width:100%}
#map{height:100%;width:100%}
.locateFab{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;background:#fff;color:#111;font-size:17px;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:900}
.voiceFab{position:absolute;left:14px;bottom:14px;width:40px;height:40px;border-radius:50%;background:#fff;color:#111;font-size:16px;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:900;transition:opacity .15s}
.voiceFab.muted{opacity:.45}
.turnBanner{position:absolute;top:10px;left:10px;right:10px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;padding:10px 12px;display:none;flex-direction:column;gap:2px;z-index:950;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.turnBanner.active{display:flex}
.turnBanner .turnMain{font-size:15px;font-weight:700}
.turnBanner .turnSub{font-size:12px;color:var(--text-secondary)}
.nav-arrow-icon{background:transparent !important;border:none !important}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal-box{background:var(--bg-card);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
.modal-box h3{margin:0 0 10px;font-size:15px}
.modal-box textarea{min-height:70px;font-family:inherit;resize:vertical}
.modal-box input[type=file]{padding:8px;border:1px dashed var(--border-subtle)}
#modalStatus{font-size:12px;color:var(--text-secondary);min-height:16px;margin-top:6px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.modal-actions button{background:var(--bg-input);border:1px solid var(--border-subtle)}
#modalSubmit{background:var(--accent-blue);border:0}
.navWrap{flex:0 0 auto;position:relative;background:var(--bg-header);border-top:1px solid var(--border-subtle)}
.bottomNav{display:flex;justify-content:space-around;padding:6px 0 max(6px, env(safe-area-inset-bottom))}
.navTab{background:none;border:0;color:var(--text-secondary);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;width:auto;padding:4px 8px}
.navTab.active{color:var(--text-primary)}
.navTab .tabIcon{font-size:17px}
.reportMenu{position:absolute;left:10px;right:10px;bottom:100%;margin-bottom:8px;display:none;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:4000}
.reportMenu button{background:var(--bg-input);border:1px solid var(--border-subtle);font-weight:600;font-size:11px;padding:9px 4px}
.newsItem{display:block;background:var(--bg-input);border-radius:10px;padding:9px 10px;text-decoration:none;color:var(--text-primary)}
.newsItem .newsTitle{font-size:13px;font-weight:600}
.newsItem .newsSource{font-size:11px;color:var(--text-secondary);margin-top:2px}
.weatherCard{flex:0 0 auto;background:var(--bg-input);border-radius:10px;padding:8px 10px;text-align:center;min-width:58px}
.weatherCard .wDay{font-size:11px;color:var(--text-secondary)}
.weatherCard .wIcon{font-size:20px;margin:4px 0}
.weatherCard .wHi{font-size:12px}
.weatherCard .wLo{font-size:11px;color:var(--text-secondary)}
</style>
</head>
<body>
<header>
<button class="icon-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
<div class="titleWrap">
<h1>Uganda National Grid</h1>
<p>Search, route and navigate across Uganda</p>
</div>
<button class="icon-btn" id="bellBtn" aria-label="Notifications">&#128276;</button>
</header>
<div class="contentScroll" id="contentScroll">
<main class="panel">
<div class="field">
<label for="start">Start location</label>
<input id="start" autocomplete="off" placeholder="Address, place or grid ID e.g. 1001 Lake Victoria Drive" />
<button type="button" class="fieldIcon" id="startLocateBtn" aria-label="Use my location">&#8982;</button>
<div id="ss" class="suggest"></div><div id="sr" class="selected"></div>
</div>
<div class="field">
<label for="dest">Destination</label>
<input id="dest" autocomplete="off" placeholder="Address, place or grid ID e.g. UG-ENT-000400" />
<span class="fieldIcon">&#128205;</span>
<div id="ds" class="suggest"></div><div id="dr" class="selected"></div>
</div>
<div class="row">
<select id="mode" aria-label="Travel mode"><option value="driving">&#128664; Driving</option><option value="walking">&#128694; Walking</option><option value="cycling">&#128692; Cycling</option><option value="flight">&#9992;&#65039; Flight</option></select>
<button id="navigate">
<svg class="btnIcon" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<path d="M12 2 L19 21 L12 17 L5 21 Z" fill="#ffffff"/>
</svg>
<span class="navText"><span class="navMain">UGAMAP</span><span class="navSub">Navigate</span></span>
</button>
</div>
<div class="row">
<button id="myLocation" class="secondaryBtn">My location</button>
<button id="googleMaps">
<svg class="btnIcon" width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
<path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
<path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
<path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
</svg>
Google Maps
</button>
</div>
<div id="navControls" class="navControls">
<button id="navPause">Pause</button>
<button id="navCancel">Cancel</button>
<button id="navRecenter">Recenter</button>
</div>
<div id="status" class="status">Loading...</div>
<div id="info"></div>
</main>
<div class="mapWrap">
<div id="map"></div>
<div id="turnBanner" class="turnBanner"><span id="turnMain" class="turnMain"></span><span id="turnSub" class="turnSub"></span></div>
<button class="voiceFab" id="voiceToggle" aria-label="Toggle voice guidance" aria-pressed="false">&#128266;</button>
<button class="locateFab" id="mapLocateBtn" aria-label="Locate me">&#8982;</button>
</div>
</div>
<div id="reportModalOverlay" class="modal-overlay">
<div class="modal-box">
<h3 id="modalTitle">Report</h3>
<div class="field">
<label for="reportNote">Message (optional)</label>
<textarea id="reportNote" placeholder="Add details..."></textarea>
</div>
<div class="field">
<label for="reportFile">Photo or video (optional)</label>
<input type="file" id="reportFile" accept="image/*,video/*" />
</div>
<div id="modalStatus"></div>
<div class="modal-actions">
<button id="modalCancel" type="button">Cancel</button>
<button id="modalSubmit" type="button">Submit</button>
</div>
</div>
</div>
<div id="profileOverlay" class="modal-overlay">
<div class="modal-box">
<h3>Your Profile</h3>
<div class="field">
<label for="profName">Name</label>
<input id="profName" placeholder="Full name" />
</div>
<div class="field">
<label for="profEmail">Email</label>
<input id="profEmail" type="email" placeholder="you@example.com" />
</div>
<div class="field">
<label for="profPhone">Phone number</label>
<input id="profPhone" placeholder="+256 7xx xxx xxx" />
</div>
<div class="field">
<label for="profAddress">Location address</label>
<input id="profAddress" placeholder="Address, place or grid ID" />
</div>
<div id="profileStatus" style="font-size:12px;color:var(--text-secondary);min-height:16px;margin-top:4px;"></div>
<div class="modal-actions">
<button id="profileCancel" type="button">Close</button>
<button id="profileSave" type="button" style="background:var(--accent-blue);border:0;">Save</button>
</div>
</div>
</div>
<div id="moreOverlay" class="modal-overlay">
<div class="modal-box" style="max-width:480px;">
<h3>More</h3>
<div class="field">
<label for="weatherRegion">Weather region</label>
<select id="weatherRegion">
<option>Kampala</option>
<option>Entebbe</option>
<option>Jinja</option>
<option>Mbarara</option>
<option>Gulu</option>
<option>Mbale</option>
<option>Fort Portal</option>
<option>Arua</option>
<option>Masaka</option>
<option>Lira</option>
</select>
</div>
<div id="weatherForecast" style="display:flex;gap:6px;overflow-x:auto;padding:4px 0;"></div>
<h3 style="margin-top:16px;">Trending in Uganda</h3>
<div id="newsList" style="display:flex;flex-direction:column;gap:8px;"></div>
<div class="modal-actions">
<button id="moreClose" type="button" style="grid-column:1 / -1;">Close</button>
</div>
</div>
</div>
<div class="navWrap">
<div id="reportMenu" class="reportMenu">
<button class="reportType" data-category="police">Police</button>
<button class="reportType" data-category="accident">Accident</button>
<button class="reportType" data-category="road_closure">Closure</button>
<button class="reportType" data-category="bridge">Bridge</button>
<button class="reportType" data-category="traffic">Traffic</button>
<button class="reportType" data-category="weather">Weather</button>
</div>
<nav class="bottomNav">
<button class="navTab active" id="tabHome"><span class="tabIcon">&#8962;</span>Home</button>
<button class="navTab" id="tabAddress"><span class="tabIcon">&#128205;</span>Address</button>
<button class="navTab" id="tabSaved"><span class="tabIcon">&#128278;</span>Saved</button>
<button class="navTab" id="reportBtn"><span class="tabIcon">&#9888;</span>Report</button>
<button class="navTab" id="tabMore"><span class="tabIcon">&#8943;</span>More</button>
</nav>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js?v=6"></script>
<script>
(function () {
function setVH() {
document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
setVH();
window.addEventListener('resize', setVH);

var tabs = ['tabHome','tabAddress','tabSaved','reportBtn','tabMore'];
function setActiveTab(id) {
tabs.forEach(function (t) {
var el = document.getElementById(t);
if (el) el.classList.toggle('active', t === id);
});
}

var homeBtn = document.getElementById('tabHome');
if (homeBtn) homeBtn.addEventListener('click', function () { setActiveTab('tabHome'); });

var addressBtn = document.getElementById('tabAddress');
if (addressBtn) addressBtn.addEventListener('click', function () {
window.location.href = '/submit';
});

var savedBtn = document.getElementById('tabSaved');
if (savedBtn) savedBtn.addEventListener('click', function () { setActiveTab('tabSaved'); });

var moreBtn = document.getElementById('tabMore');
if (moreBtn) moreBtn.addEventListener('click', function () { setActiveTab('tabMore'); });

var reportBtn = document.getElementById('reportBtn');
var reportMenu = document.getElementById('reportMenu');
if (reportBtn && reportMenu) {
reportBtn.addEventListener('click', function (e) {
e.stopPropagation();
var isOpen = reportMenu.style.display === 'grid';
reportMenu.style.display = isOpen ? 'none' : 'grid';
setActiveTab(isOpen ? 'tabHome' : 'reportBtn');
});
document.addEventListener('click', function (e) {
if (reportMenu.style.display !== 'grid') return;
if (reportMenu.contains(e.target) || reportBtn.contains(e.target)) return;
reportMenu.style.display = 'none';
});
}

var mapLocateBtn = document.getElementById('mapLocateBtn');
if (mapLocateBtn) mapLocateBtn.addEventListener('click', function () {
var ml = document.getElementById('myLocation');
if (ml) ml.click();
});

var startLocateBtn = document.getElementById('startLocateBtn');
if (startLocateBtn) startLocateBtn.addEventListener('click', function () {
var ml = document.getElementById('myLocation');
if (ml) ml.click();
});
})();
</script>
</body>
</html>
