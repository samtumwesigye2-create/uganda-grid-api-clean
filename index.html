<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Uganda National Address Finder</title>

  <link
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
      opacity: 0.8;
    }

    .search {
      background: white;
      padding: 18px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      max-width: 700px;
      margin: auto;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 14px 18px;
      background: #146c43;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      max-width: 700px;
      margin: 10px auto 0;
      font-size: 14px;
    }

    #results {
      max-width: 700px;
      margin: 12px auto;
    }

    .result-card {
      background: white;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0002;
      cursor: pointer;
    }

    .result-card h2 {
      margin-top: 0;
      font-size: 22px;
    }

    .result-card p {
      margin: 7px 0;
    }

    #map {
      width: 100%;
      height: 55vh;
      min-height: 400px;
    }

    .footer {
      text-align: center;
      padding: 14px;
      font-size: 12px;
      color: #666;
    }

    @media (max-width: 600px) {
      .search-box {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      #map {
        height: 50vh;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Uganda National Address Finder</h1>
  <p>Search by address, Grid ID, or Building ID</p>
</header>

<section class="search">

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="Example: 245 Victoria Road or UG-101-045-018-000245"
      autocomplete="off"
    >

    <button id="searchButton">
      Find Address
    </button>
  </div>

  <div id="message"></div>

</section>

<div id="results"></div>

<div id="map"></div>

<div class="footer">
  Uganda National Grid — Addressing System
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>

const API =
  "https://uganda-grid-api-clean-production.up.railway.app";

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",
  center: [32.5825, 0.3476],
  zoom: 6
});

map.addControl(
  new maplibregl.NavigationControl()
);

let marker = null;

function showLocation(data) {

  const longitude = Number(data.longitude);
  const latitude = Number(data.latitude);

  if (
    Number.isFinite(longitude) &&
    Number.isFinite(latitude)
  ) {

    if (marker) {
      marker.remove();
    }

    marker =
      new maplibregl.Marker()
        .setLngLat([
          longitude,
          latitude
        ])
        .addTo(map);

    map.flyTo({
      center: [
        longitude,
        latitude
      ],
      zoom: 16
    });
  }
}

function createResultCard(data) {

  const card = document.createElement("div");
  card.className = "result-card";

  card.innerHTML = `
    <h2>${data.address || "Address"}</h2>

    <p>
      <strong>Grid ID:</strong>
      ${data.grid_id || ""}
    </p>

    <p>
      <strong>District:</strong>
      ${data.district_code || ""}
    </p>

    <p>
      <strong>Subcounty:</strong>
      ${data.subcounty_code || ""}
    </p>

    <p>
      <strong>Parish:</strong>
      ${data.parish_code || ""}
    </p>

    <p>
      <strong>Building ID:</strong>
      ${data.building_id || ""}
    </p>

    <p>
      <strong>Coordinates:</strong>
      ${data.latitude}, ${data.longitude}
    </p>
  `;

  card.addEventListener(
    "click",
    function() {
      showLocation(data);
    }
  );

  return card;
}

async function searchAddress() {

  const input =
    document.getElementById("searchInput");

  const message =
    document.getElementById("message");

  const results =
    document.getElementById("results");

  const query =
    input.value.trim();

  if (!query) {
    message.textContent =
      "Enter an address, Grid ID, or Building ID.";
    return;
  }

  message.textContent =
    "Searching...";

  results.innerHTML = "";

  try {

    const response =
      await fetch(
        API +
        "/search?q=" +
        encodeURIComponent(query)
      );

    if (!response.ok) {
      throw new Error(
        "Search failed"
      );
    }

    const data =
      await response.json();

    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {

      message.textContent =
        "No matching address found.";

      return;
    }

    message.textContent =
      data.length === 1
        ? "1 address found."
        : data.length + " addresses found.";

    data.forEach(function(record) {

      const card =
        createResultCard(record);

      results.appendChild(card);

    });

    showLocation(data[0]);

  } catch (error) {

    message.textContent =
      "Search failed. Please try again.";

  }
}

document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    searchAddress
  );

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        searchAddress();
      }

    }
  );

</script>

</body>
</html>
