<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Uganda National Grid</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px Arial;background:#eef1f4;color:#111827}header{height:44px;background:linear-gradient(135deg,#111827,#253447);color:#fff;padding:6px 8px;text-align:center;box-shadow:0 2px 8px #0003}header h1{margin:0;font-size:18px;letter-spacing:.3px}header small{font-size:9px;opacity:.8}main{margin:4px 6px;padding:6px 7px;background:#fff;border-radius:9px;box-shadow:0 2px 8px #0002}label{font-size:14px;font-weight:900;display:block;margin:1px 0;color:#111827}input,select{width:100%;height:28px;padding:4px 7px;margin:2px 0;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;font-size:12px;outline:none}input:focus{border-color:#d71920;box-shadow:0 0 0 2px #d7192022}.suggest{display:none;background:#fff;border:1px solid #cbd5e1;border-radius:6px;max-height:72px;overflow:hidden;position:relative;z-index:2000;box-shadow:0 3px 8px #0002}.suggest div{padding:5px 7px;font-size:10px;border-bottom:1px solid #e5e7eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controlrow{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:3px}.controlrow>*{width:100%;height:30px;min-width:0;margin:0;padding:2px;font-size:10px;border-radius:6px}.controlrow button{background:#d71920;color:#fff;border:0;font-weight:800;box-shadow:0 1px 3px #0002}.provider{background:#fff!important;color:#111!important;border:1px solid #9ca3af!important;font-weight:800}.ugamap{display:flex!important;flex-direction:column;justify-content:center;align-items:center}.ugamap .flag{font-size:8px;line-height:8px}.resolved{font-size:9px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:10px;font-weight:700;color:#475569;min-height:11px}.status.ok{color:#15803d}.status.err{color:#b91c1c}#info{height:32px;padding:4px 8px;font-size:10px;background:#fff;font-weight:700;box-shadow:0 1px 5px #0002;position:relative;z-index:500}.routecard{display:inline-block;background:#f8fafc;border-radius:6px;padding:3px 6px;margin-right:3px}#map{height:calc(100vh - 252px);min-height:220px;width:100%;background:#dbe4ea}.reportbar{position:absolute;right:8px;top:8px;z-index:1200;display:flex;gap:3px;flex-wrap:wrap;max-width:210px}.reportbar button{border:0;border-radius:7px;padding:6px 7px;background:#fff;box-shadow:0 2px 7px #0003;font-size:10px;font-weight:800}.reportpanel{display:none;position:absolute;right:8px;top:48px;z-index:1300;width:230px;background:#fff;border-radius:9px;padding:8px;box-shadow:0 4px 14px #0004}.reportpanel h3{margin:0 0 5px;font-size:13px}.reportpanel select,.reportpanel textarea,.reportpanel button{width:100%;margin:3px 0;height:30px;border:1px solid #cbd5e1;border-radius:6px;font-size:11px}.reportpanel textarea{height:50px;padding:5px}.reportpanel button{background:#d71920;color:#fff;font-weight:800;border:0}.inspiration{position:absolute;left:0;right:0;bottom:0;height:48px;background:#fff;text-align:center;padding:3px;border-top:2px solid #d71920;z-index:1000;box-shadow:0 -2px 8px #0002}.inspiration .flag{font-size:17px;line-height:17px}.inspiration h2{display:inline;margin:0 5px;font-size:13px;color:#111827}.inspiration p{display:inline;margin:0;color:#4b5563;font-size:9px}</style></head><body><header><h1>🇺🇬 Uganda National Grid</h1><small>CONNECTED. MAPPED. MOVING UGANDA FORWARD.</small></header><main><label>Start Location</label><input id="start" autocomplete="off" placeholder="UG-ENT-000001 or 1001 Lake Victoria Drive, Entebbe"><div id="ss" class="suggest"></div><div id="sr" class="resolved"></div><label>Destination</label><input id="dest" autocomplete="off" placeholder="UG-ENT-000005 or 1009 Lake Victoria Drive, Entebbe"><div id="ds" class="suggest"></div><div id="dr" class="resolved"></div><div class="controlrow"><select id="mode"><option value="driving">🚗 Drive</option><option value="walking">🚶 Walk</option><option value="cycling">🚲 Bike</option><option value="flight">✈️ Plane</option></select><button id="route">Route</button><button id="navigate">🧭 Navigate</button><button id="myLocation">📍 Me</button><button class="provider ugamap" id="ugamaps"><span>UGAMAP</span><span class="flag">🇺🇬</span></button><button class="provider" id="googleMaps">Google</button></div><div id="status" class="status"></div></main><div id="info">🇺🇬 Uganda National Grid · Ready</div><div id="map"><div class="reportbar"><button onclick="openReport('accident')">🚨 Accident</button><button onclick="openReport('police')">👮 Police</button><button onclick="openReport('closure')">🚧 Closure</button><button onclick="openReport('infrastructure')">🌉 Road Info</button></div><div id="reportpanel" class="reportpanel"><h3>🇺🇬 Report on road</h3><select id="reportType"><option value="accident">🚨 Accident</option><option value="police">👮 Police / checkpoint</option><option value="closure">🚧 Road closure</option><option value="bridge">🌉 Bridge</option><option value="roundabout">🔄 Roundabout</option><option value="highway">🛣️ Controlled highway</option></select><textarea id="reportNote" placeholder="Optional details"></textarea><button onclick="submitReport()">Submit at map location</button><button onclick="closeReport()" style="background:#64748b">Cancel</button></div></div><section class="inspiration"><span class="flag">🇺🇬</span><h2>One Grid. One Nation. One Future.</h2><p>Building a connected Uganda, one community at a time.</p></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://uganda-grid-api-clean.production.up.railway.app',G=id=>document.getElementById(id),map=L.map('map').setView([1.3733,32.2903],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const status=G('status'),info=G('info'),start=G('start'),dest=G('dest'),route=G('route'),navigate=G('navigate'),myLocation=G('myLocation'),mode=G('mode');let line,sm,dm,userMarker,simTimer,navActive=false,navPaused=false,navToken=0,navPts=[],navIndex=0,currentNavPos=null,selectedStart=null,selectedDest=null,reportPosition=null;let timers={start:null,dest:null};async function grid(q){const r=await fetch(API+'/search?q='+encodeURIComponent(q));if(!r.ok)throw Error('Grid service unavailable');const d=await r.json();return d.results||[]}async function locate(q){if(/^UG-[A-Z0-9]+-\d+$/i.test(q)){const xs=await grid(q),x=xs[0];if(!x)throw Error('Grid ID not found');return{lat:+x.latitude,lon:+x.longitude,id:x.grid_id,address:x.address}}const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ug&q='+encodeURIComponent(q)),d=await r.json();if(!d[0])throw Error('Location not found');return{lat:+d[0].lat,lon:+d[0].lon,address:d[0].display_name}}function show(id,x){G(id).textContent=(x.id?x.id+' — ':'')+x.address}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function selectLocation(input,box,out,kind){const q=input.value.trim();box.style.display='none';if(q.length<3){G(out).textContent='';return}status.textContent='Resolving '+kind+'…';status.className='status';try{const x=await locate(q);show(out,x);if(kind==='Destination'){selectedDest=x;if(navActive)rerouteDuringNavigation(x)}else selectedStart=x;status.textContent='✓ '+kind+' selected';status.className='status ok'}catch(e){G(out).textContent='';status.textContent=e.message;status.className='status err'}}async function suggest(input,box,kind,out){clearTimeout(timers[kind]);const q=input.value.trim();if(q.length<3){box.style.display='none';return}timers[kind]=setTimeout(async()=>{try{let arr=[];if(/^UG-/i.test(q)){arr=await grid(q)}else{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=4&countrycodes=ug&q='+encodeURIComponent(q));arr=await r.json()}box.innerHTML=arr.slice(0,4).map(x=>{const address=x.address||x.display_name||'Unknown address',id=x.grid_id||'';return '<div data-value="'+esc(id||address)+'">'+(id?'<b>'+esc(id)+'</b> · ':'')+esc(address)+'</div>'}).join('');box.style.display=arr.length?'block':'none';box.querySelectorAll('div').forEach(el=>el.onclick=async()=>{input.value=el.dataset.value;box.style.display='none';await selectLocation(input,box,out,kind)})}catch{box.style.display='none'}},180)}start.oninput=()=>{selectedStart=null;suggest(start,G('ss'),'Start Location','sr')};dest.oninput=()=>{selectedDest=null;suggest(dest,G('ds'),'Destination','dr')};start.onchange=()=>selectLocation(start,G('ss'),'sr','Start Location');dest.onchange=()=>selectLocation(dest,G('ds'),'dr','Destination');start.onblur=()=>setTimeout(()=>G('ss').style.display='none',180);dest.onblur=()=>setTimeout(()=>G('ds').style.display='none',180);function hav(a,b){const R=6371000,p=Math.PI/180,x=Math.sin((b.lat-a.lat)*p/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin((b.lon-a.lon)*p/2)**2;return 2*R*Math.asin(Math.sqrt(x))}async function getRoute(a,b){if(mode.value==='flight'){const d=hav(a,b);return{pts:[[a.lat,a.lon],[b.lat,b.lon]],distance:d,duration:d/800*3600}}const costing=mode.value==='walking'?'pedestrian':mode.value==='cycling'?'bicycle':'auto',payload={locations:[{lat:a.lat,lon:a.lon},{lat:b.lat,lon:b.lon}],costing,units:'kilometers',directions_options:{units:'kilometers'}},r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error('Mode routing service unavailable');const d=await r.json();if(!d.trip||!d.trip.legs||!d.trip.legs[0])throw Error('No route found');const leg=d.trip.legs[0],shape=decodeShape(leg.shape),s=leg.summary||{};return{pts:shape,distance:Number(s.length)||0,duration:Number(s.time)||0}}function decodeShape(str){let i=0,la=0,lo=0,o=[];while(i<str.length){let sh=0,re=0,b;do{b=str.charCodeAt(i++)-63;re|=(b&31)<<sh;sh+=5}while(b>=32);la+=(re&1)?~(re>>1):re>>1;sh=0;re=0;do{b=str.charCodeAt(i++)-63;re|=(b&31)<<sh;sh+=5}while(b>=32);lo+=(re&1)?~(re>>1):re>>1;o.push([la/1e6,lo/1e6])}return o}function formatTime(s){const m=Math.max(1,Math.round(s/60));return m<60?m+' min':Math.floor(m/60)+' hr '+(m%60?m%60+' min':'')}function nearestIndex(pos,pts){let best=0,bd=Infinity;for(let i=0;i<pts.length;i++){const d=(pts[i][0]-pos[0])**2+(pts[i][1]-pos[1])**2;if(d<bd){bd=d;best=i}}return best}function setRouteLine(pts){if(line)map.removeLayer(line);line=L.polyline(pts,{color:'#d71920',weight:5,opacity:.9}).addTo(map)}async function drawRoute(a,b){const z=await getRoute(a,b);setRouteLine(z.pts);if(sm)map.removeLayer(sm);if(dm)map.removeLayer(dm);sm=L.marker([a.lat,a.lon]).addTo(map).bindPopup('<b>🇺🇬 Start</b><br>'+a.address);dm=L.marker([b.lat,b.lon]).addTo(map).bindPopup('<b>Destination</b><br>'+b.address);map.fitBounds(line.getBounds(),{padding:[20,20]});info.innerHTML='<span class="routecard">'+mode.options[mode.selectedIndex].text+'</span><span class="routecard">📏 '+z.distance.toFixed(1)+' km</span><span class="routecard">⏱ '+formatTime(z.duration)+'</span>';return z}async function recalc(){if(!start.value||!dest.value){status.textContent='Enter both locations first.';status.className='status err';return}status.textContent='Updating '+mode.options[mode.selectedIndex].text+' route…';status.className='status';try{const a=selectedStart||await locate(start.value),b=selectedDest||await locate(dest.value);selectedStart=a;selectedDest=b;show('sr',a);show('dr',b);await drawRoute(a,b);status.textContent='✓ '+mode.options[mode.selectedIndex].text+' route ready';status.className='status ok'}catch(e){status.textContent=e.message;status.className='status err'}}route.onclick=recalc;mode.onchange=async()=>{if(navActive&&currentNavPos&&selectedDest)await rerouteFrom(currentNavPos,selectedDest,true);else await recalc()};async function rerouteFrom(pos,destination,keepNavigation){const token=++navToken;status.textContent='🔄 Recalculating…';try{const a={lat:pos[0],lon:pos[1],address:'Current position'},z=await getRoute(a,destination);if(token!==navToken||!navActive)return;navPts=z.pts;navIndex=nearestIndex(pos,navPts);setRouteLine(navPts);if(dm)map.removeLayer(dm);dm=L.marker([destination.lat,destination.lon]).addTo(map).bindPopup('<b>Destination</b><br>'+destination.address);info.innerHTML='<span class="routecard">'+mode.options[mode.selectedIndex].text+'</span><span class="routecard">📏 '+z.distance.toFixed(1)+' km</span><span class="routecard">⏱ '+formatTime(z.duration)+'</span>';status.textContent='✓ Route updated';status.className='status ok';if(userMarker)userMarker.setLatLng(navPts[navIndex])}catch(e){status.textContent='Route update failed — keeping current route.';status.className='status err'}}async function rerouteDuringNavigation(destination){if(!navActive)return;await rerouteFrom(currentNavPos||navPts[navIndex],destination,true)}function setNavButton(){if(!navActive){navigate.textContent='🧭 Navigate';navigate.style.background='#d71920'}else if(navPaused){navigate.textContent='▶ Resume';navigate.style.background='#15803d'}else{navigate.textContent='⏸ Pause';navigate.style.background='#d97706'}}function stopNavigation(){navToken++;navActive=false;navPaused=false;currentNavPos=null;navPts=[];navIndex=0;if(simTimer){clearInterval(simTimer);simTimer=null}if(userMarker){map.removeLayer(userMarker);userMarker=null}setNavButton();status.textContent='✕ Navigation stopped';status.className='status';if(line){map.removeLayer(line);line=null}}async function startNavigation(){if(!start.value||!dest.value){status.textContent='Enter Start and Destination.';status.className='status err';return}try{navActive=true;navPaused=false;navToken++;const a=selectedStart||await locate(start.value),b=selectedDest||await locate(dest.value),z=await getRoute(a,b);selectedStart=a;selectedDest=b;navPts=z.pts;navIndex=0;currentNavPos=navPts[0];if(line)map.removeLayer(line);line=L.polyline(navPts,{color:'#d71920',weight:5,opacity:.9}).addTo(map);map.fitBounds(line.getBounds(),{padding:[20,20]});if(userMarker)map.removeLayer(userMarker);userMarker=L.marker(navPts[0]).addTo(map);info.innerHTML='<span class="routecard">'+mode.options[mode.selectedIndex].text+'</span><span class="routecard">📏 '+z.distance.toFixed(1)+' km</span><span class="routecard">⏱ '+formatTime(z.duration)+'</span>';status.textContent='🇺🇬 Navigation active';status.className='status ok';setNavButton();simTimer=setInterval(()=>{if(!navActive||navPaused)return;if(navIndex>=navPts.length-1){clearInterval(simTimer);simTimer=null;navActive=false;navPaused=false;setNavButton();status.textContent='✓ Arrived at destination.';return}navIndex++;currentNavPos=navPts[navIndex];userMarker.setLatLng(currentNavPos);map.panTo(currentNavPos,{animate:true,duration:.2})},600)}catch(e){navActive=false;setNavButton();status.textContent=e.message;status.className='status err'}}navigate.onclick=()=>{if(!navActive)startNavigation();else if(!navPaused){navPaused=true;status.textContent='⏸ Navigation paused';setNavButton()}else stopNavigation()};myLocation.onclick=()=>navigator.geolocation.getCurrentPosition(p=>{if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([p.coords.latitude,p.coords.longitude]).addTo(map);map.setView([p.coords.latitude,p.coords.longitude],16);status.textContent='📍 Your location found.'},()=>status.textContent='Unable to access your location.',{enableHighAccuracy:true,timeout:10000});G('ugamaps').onclick=()=>{map.invalidateSize();status.textContent='🇺🇬 UGAMAP is the built-in map.'};G('googleMaps').onclick=()=>window.open(dest.value?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest.value):'https://www.google.com/maps','_blank');function openReport(type){G('reportType').value=type==='infrastructure'?'bridge':type;G('reportpanel').style.display='block';reportPosition=null;status.textContent='Tap the map where the report belongs.'}function closeReport(){G('reportpanel').style.display='none';reportPosition=null}map.on('click',e=>{if(G('reportpanel').style.display==='block'){reportPosition=e.latlng;status.textContent='📍 Report location selected.'}});async function submitReport(){if(!reportPosition){status.textContent='Tap the map to choose a location.';return}try{const r=await fetch(API+'/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:G('reportType').value,latitude:reportPosition.lat,longitude:reportPosition.lng,description:G('reportNote').value||''})});if(!r.ok)throw Error('Report service unavailable');L.marker(reportPosition).addTo(map).bindPopup('<b>'+G('reportType').selectedOptions[0].text+'</b><br>'+esc(G('reportNote').value||'Reported location')).openPopup();closeReport();status.textContent='✓ Report submitted';status.className='status ok'}catch(e){status.textContent=e.message;status.className='status err'}}info.textContent='🇺🇬 Uganda National Grid · Loading…';grid('UG-ENT-000001').then(x=>info.textContent=x.length?'🇺🇬 Uganda National Grid · 50 real test records loaded':'🇺🇬 Uganda National Grid · Ready').catch(()=>info.textContent='🇺🇬 Uganda National Grid · Ready');setNavButton();</script></body></html>
