<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Uganda National Grid</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef1f4;
}

header{
background:#111827;
color:white;
padding:25px;
text-align:center;
}

h1{
margin:0;
font-size:32px;
}

.container{
padding:15px;
background:white;
margin:15px;
border-radius:12px;
}

input{
width:100%;
padding:14px;
margin:8px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
background:#e11d22;
color:white;
border:0;
padding:14px 25px;
border-radius:8px;
font-size:18px;
}

#map{
height:500px;
margin-top:15px;
}

.suggestions{
background:white;
border:1px solid #ccc;
}

.suggestions div{
padding:10px;
border-bottom:1px solid #ddd;
}
</style>

</head>

<body>

<header>
<h1>Uganda National Grid</h1>
<p>National transportation and infrastructure network</p>
</header>

<div class="container">

<label>Start Location</label>
<input id="start" placeholder="Enter starting location">
<div id="startSug" class="suggestions"></div>

<label>Destination</label>
<input id="end" placeholder="Enter destination">
<div id="endSug" class="suggestions"></div>

<button onclick="route()">Find Route</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map=L.map('map').setView([1.3733,32.2903],7);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);


function searchBox(input,sug){

input.addEventListener("input",async()=>{

let q=input.value;

if(q.length<3){
sug.innerHTML="";
return;
}

let r=await fetch(
"https://nominatim.openstreetmap.org/search?format=json&countrycodes=ug&q="+q
);

let data=await r.json();

sug.innerHTML="";

data.slice(0,5).forEach(x=>{

let d=document.createElement("div");

d.innerText=x.display_name;

d.onclick=()=>{

input.value=x.display_name;
sug.innerHTML="";

};

sug.appendChild(d);

});

});

}


searchBox(
document.getElementById("start"),
document.getElementById("startSug")
);

searchBox(
document.getElementById("end"),
document.getElementById("endSug")
);


function route(){

alert(
"Route requested from:\n"+
document.getElementById("start").value+
"\nTo:\n"+
document.getElementById("end").value
);

}

</script>

</body>
</html>
