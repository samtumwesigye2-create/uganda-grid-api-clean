<!DOCTYPE html>
<html>
<head>

<title>Uganda National Grid Search</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

body {
    font-family: Arial, sans-serif;
    margin: 30px;
}

h1 {
    font-size: 36px;
}

input {
    width: 350px;
    padding: 12px;
    font-size: 16px;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
}

table {
    margin-top: 25px;
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
}

th {
    background: #eee;
}

#map {
    height: 450px;
    margin-top: 30px;
}

</style>

</head>


<body>


<h1>
Uganda National Grid Search
</h1>


<input 
id="searchBox"
placeholder="Search address or code"
/>


<button onclick="searchAddress()">
Search
</button>



<table>

<thead>

<tr>
<th>ID</th>
<th>Street</th>
<th>Address</th>
</tr>

</thead>


<tbody id="results">

</tbody>


</table>



<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="app.js"></script>


</body>

</html>
