<!DOCTYPE html>
<html>
<head>
<title>Uganda National Grid API</title>

<style>
body {
    font-family: Arial;
    margin: 40px;
}

input {
    width: 400px;
    padding: 12px;
    font-size: 18px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
}

table {
    margin-top: 30px;
    border-collapse: collapse;
    width: 80%;
}

td, th {
    border: 1px solid #ccc;
    padding: 12px;
    text-align: left;
}
</style>

</head>


<body>

<h1>Uganda National Grid API</h1>


<input id="searchBox" placeholder="Search address or code">

<button onclick="searchAddress()">
Search
</button>


<table>

<thead>
<tr>
<th>ID</th>
<th>Code</th>
<th>Address</th>
</tr>
</thead>


<tbody id="results">

</tbody>


</table>



<script>

const API = "https://uganda-grid-api-clean-production.up.railway.app";


async function searchAddress(){

    let q = document.getElementById("searchBox").value;


    let response = await fetch(
        API + "/search?q=" + encodeURIComponent(q)
    );


    let data = await response.json();


    console.log(data);


    let table = document.getElementById("results");


    table.innerHTML = "";


    data.results.forEach(function(item){

        table.innerHTML += `

        <tr>

        <td>${item.grid_id || ""}</td>

        <td>${item.street || ""}</td>

        <td>${item.address || ""}</td>

        </tr>

        `;

    });


}

</script>


</body>
</html>
