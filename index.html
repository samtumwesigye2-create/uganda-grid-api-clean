<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Uganda National Grid</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg-page:#0b1220;
    --bg-header:#0f1830;
    --bg-card:#141b2e;
    --bg-input:#1b2338;
    --text-primary:#f5f7fb;
    --text-secondary:#9aa4bd;
    --border-subtle:rgba(255,255,255,0.08);
    --accent-red:#e0332f;
    --accent-blue:#3b5bfd;
    --accent-amber:#f5a623;
    --success-bg:rgba(16,60,36,0.55);
    --success-text:#6fe3a1;
    --err-bg:rgba(80,20,20,0.55);
    --err-text:#f39a9a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:var(--bg-page);color:var(--text-primary);padding-bottom:82px}
  header{background:var(--bg-header);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-subtle)}
  header .icon-btn{background:none;border:0;color:var(--text-primary);font-size:20px;padding:6px;width:auto}
  header .titleWrap{text-align:center;flex:1}
  header h1{margin:0;font-size:18px;font-weight:700}
  header p{margin:2px 0 0;font-size:11px;color:var(--text-secondary)}
  .panel{max-width:900px;margin:12px auto;padding:12px}
  .field{position:relative;margin-bottom:12px}
  label{display:block;font-weight:700;font-size:12px;margin-bottom:6px;color:var(--text-secondary)}
  input,select,textarea{width:100%;font-size:15px;border-radius:12px;padding:12px 40px 12px 14px;border:1px solid var(--border-subtle);background:var(--bg-input);color:var(--text-primary)}
  input::placeholder,textarea::placeholder{color:var(--text-secondary)}
  .fieldIcon{position:absolute;right:12px;top:38px;color:var(--text-secondary);font-size:16px;background:none;border:0;padding:4px;cursor:pointer}
  button{width:100%;font-size:15px;border-radius:12px;padding:12px;border:0;font-weight:700;cursor:pointer;color:var(--text-primary)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  select{background:var(--bg-input);padding:12px 14px}
  #navigate{background:var(--accent-red)}
  #navigate .navMain{display:block;font-size:15px}
  #navigate .navSub{display:block;font-size:11px;font-weight:400;opacity:.85}
  .secondaryBtn{background:var(--bg-input);border:1px solid var(--border-subtle)}
  .createAddressLink{display:block;text-decoration:none;text-align:center;padding:12px;border-radius:12px;font-weight:700;background:var(--accent-blue);margin-bottom:8px}
  #reportBtn{background:var(--accent-amber);color:#241a00;margin-bottom:8px}
  .suggest{position:absolute;left:0;right:0;top:100%;display:none;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:10px;max-height:220px;overflow:auto;z-index:3000}
  .suggest div{padding:10px;border-bottom:1px solid var(--border-subtle);cursor:pointer;font-size:13px}
  .suggest div:last-child{border-bottom:0}
  .selected{font-size:12px;color:var(--text-secondary);min-height:16px;margin-top:4px}
  .status{font-size:13px;margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--bg-input)}
  .status.ok{background:var(--success-bg);color:var(--success-text)}
  .status.err{background:var(--err-bg);color:var(--err-text)}
  #info{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .routecard{background:var(--bg-input);border-radius:999px;padding:6px 10px;font-size:12px}
  .reportMenu{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
  .reportMenu button{background:var(--bg-input);border:1px solid var(--border-subtle);font-weight:600;font-size:12px;padding:10px 4px}
  .navControls{display:none;gap:8px;margin-bottom:8px}
  .navControls.active{display:grid;grid-template-columns:1fr 1fr 1fr}
  .navControls button{font-size:13px;padding:10px 6px;background:var(--bg-input);border:1px solid var(--border-subtle)}
  .mapWrap{position:relative;max-width:1100px;margin:0 auto}
  #map{height:calc(100vh - 470px);min-height:340px;width:100%;border-radius:0}
  .locateFab{position:absolute;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;background:#fff;color:#111;font-size:18px;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:900}
  .nav-arrow-icon{background:transparent !important;border:none !important}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5000;align-items:center;justify-content:center;padding:16px}
  .modal-overlay.active{display:flex}
  .modal-box{background:var(--bg-card);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
  .modal-box h3{margin:0 0 10px;font-size:15px}
  .modal-box textarea{min-height:70px;font-family:inherit;resize:vertical}
  .modal-box input[type=file]{padding:8px;border:1px dashed var(--border-subtle)}
  #modalStatus{font-size:12px;color:var(--text-secondary);min-height:16px;margin-top:6px}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .modal-actions button{background:var(--bg-input);border:1px solid var(--border-subtle)}
  #modalSubmit{background:var(--accent-blue);border:0}
  .bottomNav{position:fixed;left:0;right:0;bottom:0;background:var(--bg-header);border-top:1px solid var(--border-subtle);display:flex;justify-content:space-around;padding:8px 0 max(8px, env(safe-area-inset-bottom));z-index:2000}
  .navTab{background:none;border:0;color:var(--text-secondary);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;width:auto;padding:4px 8px}
  .navTab.active{color:var(--text-primary)}
  .navTab .tabIcon{font-size:18px}
  @media(max-width:600px){#map{height:calc(100vh - 520px);min-height:320px}}
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
  <div class="titleWrap">
    <h1>Uganda National Grid</h1>
    <p>Search, route and navigate across Uganda</p>
  </div>
  <button class="icon-btn" id="bellBtn" aria-label="Notifications">&#128276;</button>
</header>

<main class="panel">
  <div class="field">
    <label for="start">Start location</label>
    <input id="start" autocomplete="off" placeholder="Address, place or grid ID e.g. 1001 Lake Victoria Drive" />
    <button type="button" class="fieldIcon" id="startLocateBtn" aria-label="Use my location">&#8982;</button>
    <div id="ss" class="suggest"></div><div id="sr" class="selected"></div>
  </div>
  <div class="field">
    <label for="dest">Destination</label>
    <input id="dest" autocomplete="off" placeholder="Address, place or grid ID e.g. UG-ENT-000400" />
    <span class="fieldIcon">&#128205;</span>
    <div id="ds" class="suggest"></div><div id="dr" class="selected"></div>
  </div>

  <div class="row">
    <select id="mode" aria-label="Travel mode"><option value="driving">Driving</option><option value="walking">Walking</option><option value="cycling">Cycling</option><option value="flight">Flight</option></select>
    <button id="navigate"><span class="navMain">UGAMAP</span><span class="navSub">Navigate</span></button>
  </div>

  <div class="row">
    <button id="myLocation" class="secondaryBtn">My location</button>
    <button id="googleMaps" class="secondaryBtn">Google Maps</button>
  </div>

  <a href="/submit" class="createAddressLink">Create My Address</a>
  <button id="reportBtn">Report</button>

  <div id="reportMenu" class="reportMenu">
    <button class="reportType" data-category="police">Police</button>
    <button class="reportType" data-category="accident">Accident</button>
    <button class="reportType" data-category="road_closure">Closure</button>
    <button class="reportType" data-category="bridge">Bridge</button>
    <button class="reportType" data-category="traffic">Traffic</button>
    <button class="reportType" data-category="weather">Weather</button>
  </div>

  <div id="navControls" class="navControls">
    <button id="navPause">Pause</button>
    <button id="navCancel">Cancel</button>
    <button id="navRecenter">Recenter</button>
  </div>

  <div id="status" class="status">Loading...</div>
  <div id="info"></div>
</main>

<div class="mapWrap">
  <div id="map"></div>
  <button class="locateFab" id="mapLocateBtn" aria-label="Locate me">&#8982;</button>
</div>

<div id="reportModalOverlay" class="modal-overlay">
  <div class="modal-box">
    <h3 id="modalTitle">Report</h3>
    <div class="field">
      <label for="reportNote">Message (optional)</label>
      <textarea id="reportNote" placeholder="Add details..."></textarea>
    </div>
    <div class="field">
      <label for="reportFile">Photo or video (optional)</label>
      <input type="file" id="reportFile" accept="image/*,video/*" />
    </div>
    <div id="modalStatus"></div>
    <div class="modal-actions">
      <button id="modalCancel" type="button">Cancel</button>
      <button id="modalSubmit" type="button">Submit</button>
    </div>
  </div>
</div>

<nav class="bottomNav">
  <button class="navTab active" id="tabHome"><span class="tabIcon">&#8962;</span>Home</button>
  <button class="navTab" id="tabMap"><span class="tabIcon">&#128506;</span>Map</button>
  <button class="navTab" id="tabSaved"><span class="tabIcon">&#128278;</span>Saved</button>
  <button class="navTab" id="tabReport"><span class="tabIcon">&#9888;</span>Report</button>
  <button class="navTab" id="tabMore"><span class="tabIcon">&#8943;</span>More</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js"></script>
<script>
(function () {
  var tabs = ['tabHome','tabMap','tabSaved','tabReport','tabMore'];
  function setActiveTab(id) {
    tabs.forEach(function (t) {
      var el = document.getElementById(t);
      if (el) el.classList.toggle('active', t === id);
    });
  }
  var homeBtn = document.getElementById('tabHome');
  if (homeBtn) homeBtn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setActiveTab('tabHome');
  });
  var mapBtn = document.getElementById('tabMap');
  if (mapBtn) mapBtn.addEventListener('click', function () {
    var el = document.querySelector('.mapWrap');
    if (el) el.scrollIntoView({ behavior: 'smooth' });
    setActiveTab('tabMap');
  });
  var reportTabBtn = document.getElementById('tabReport');
  if (reportTabBtn) reportTabBtn.addEventListener('click', function () {
    var rb = document.getElementById('reportBtn');
    if (rb) rb.click();
    setActiveTab('tabReport');
  });
  var savedBtn = document.getElementById('tabSaved');
  if (savedBtn) savedBtn.addEventListener('click', function () { setActiveTab('tabSaved'); });
  var moreBtn = document.getElementById('tabMore');
  if (moreBtn) moreBtn.addEventListener('click', function () { setActiveTab('tabMore'); });

  var mapLocateBtn = document.getElementById('mapLocateBtn');
  if (mapLocateBtn) mapLocateBtn.addEventListener('click', function () {
    var ml = document.getElementById('myLocation');
    if (ml) ml.click();
  });
  var startLocateBtn = document.getElementById('startLocateBtn');
  if (startLocateBtn) startLocateBtn.addEventListener('click', function () {
    var ml = document.getElementById('myLocation');
    if (ml) ml.click();
  });
})();
</script>
</body>
</html>
