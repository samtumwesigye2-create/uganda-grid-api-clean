<!DOCTYPE html>
<html>

<head>

<title>Uganda National Grid API</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

body{
font-family:Arial,sans-serif;
margin:30px;
}

h1{
font-size:36px;
}

input{
width:60%;
padding:12px;
font-size:18px;
}

button{
padding:12px 20px;
font-size:18px;
cursor:pointer;
margin:5px;
}

table{
margin-top:20px;
border-collapse:collapse;
width:100%;
}

th,td{
border:1px solid #ccc;
padding:12px;
}

#map{
height:400px;
width:100%;
margin-top:20px;
}

.navigation{
margin-top:20px;
padding:15px;
border:1px solid #ccc;
}


</style>


</head>


<body>


<h1>Uganda National Grid API</h1>


<h3>Start Location</h3>

<input 
id="startBox"
placeholder="Enter starting address"
>

<button onclick="setStartLocation()">
Set Start
</button>


<h3>Destination</h3>

<input 
id="searchBox"
value="UG-ENT-000211"
>


<button onclick="searchAddress()">
Search
</button>



<table>

<thead>

<tr>
<th>ID</th>
<th>Code</th>
<th>Address</th>
</tr>

</thead>


<tbody id="results">

</tbody>


</table>



<div id="map"></div>



<div id="ugamapPanel" class="navigation">


<h2>🧭 UGAMAP Navigation</h2>


<p id="routeInfo">
Destination ready.
</p>


<button onclick="startUGAMAPRoute()">
Start UGAMAP Route
</button>


</div>




<div class="navigation">


<h2>Navigation</h2>


<button onclick="ugamap()">
🧭 UGAMAP
</button>


<button onclick="navigate()">
🌍 Google Maps
</button>


<button onclick="getLocation()">
📍 My Location
</button>


</div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet-routing-machine.js"></script>


<script>


const API =
"https://uganda-grid-api-clean-production.up.railway.app";


let latitude = null;
let longitude = null;


let userLat = null;
let userLng = null;


let map =
L.map('map')
.setView([0.3476,32.5825],10);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
)
.addTo(map);



let marker = null;
let userMarker = null;
let routeLine = null;

async function setStartLocation(){

let query =
document.getElementById("startBox").value;


let response =
await fetch(
`${API}/search?q=${query}`
);


let data =
await response.json();


let place =
data.results[0];


if(!place){

alert("Start location not found");
return;

}


userLat =
Number(place.latitude);


userLng =
Number(place.longitude);


alert(
"Start location set"
);


}


async function searchAddress(){


let query =
document.getElementById("searchBox").value.trim();



let response =
await fetch(
`${API}/search?q=${query}`
);



let data =
await response.json();



let table =
document.getElementById("results");


table.innerHTML = "";



if(!data.results || data.results.length === 0){

alert("Address not found");

return;

}



data.results.forEach(place=>{


latitude =
Number(place.latitude);


longitude =
Number(place.longitude);



table.innerHTML +=
`

<tr>

<td>${place.grid_id}</td>

<td>${place.street}</td>

<td>${place.address}</td>

</tr>

`;



if(marker){

map.removeLayer(marker);

}



marker =
L.marker(
[
latitude,
longitude
]
)
.addTo(map)
.bindPopup(
place.address
)
.openPopup();



map.setView(
[
latitude,
longitude
],
16
);



});


}





function navigate(){


if(latitude && longitude){


window.open(

`https://www.google.com/maps/dir/?api=1&destination=${latitude},${longitude}`

);


}

else{

alert("Search location first");

}


}




function ugamap(){


if(!latitude || !longitude){

alert("Search destination first");

return;

}



if(!userLat || !userLng){


userLat = -0.0466;

userLng = 32.4635;


}



drawUGAMAPRoute();



}
function drawUGAMAPRoute(){


if(routeLine){

map.removeLayer(routeLine);

}



let start =
[
userLat,
userLng
];



let end =
[
latitude,
longitude
];



routeLine =
L.polyline(
[
start,
end
],
{
color:"blue",
weight:5
}

)
.addTo(map);



map.fitBounds(
routeLine.getBounds()
);



document.getElementById("routeInfo").innerHTML =

`
🧭 UGAMAP Route Active

<br><br>

From:

${userLat},
${userLng}

<br><br>

To:

${latitude},
${longitude}

`;

}




function startUGAMAPRoute(){

    if(!latitude || !longitude){

        alert("Search destination first");
        return;

    }


    if(ugamapVehicle){

        map.removeLayer(ugamapVehicle);

    }


    ugamapVehicle = L.marker(
        [
            userLat,
            userLng
        ]
    )
    .addTo(map)
    .bindPopup("UGAMAP Navigation Active")
    .openPopup();



    let steps = 100;
    let current = 0;


    if(ugamapTimer){

        clearInterval(ugamapTimer);

    }



    ugamapTimer = setInterval(function(){


        current++;


        let newLat =
        userLat +
        ((latitude - userLat) * current / steps);



        let newLng =
        userLng +
        ((longitude - userLng) * current / steps);



        ugamapVehicle.setLatLng(
            [
                newLat,
                newLng
            ]
        );



        if(current >= steps){

            clearInterval(ugamapTimer);

        }


    },100);


}



function getLocation(){


if(navigator.geolocation){



navigator.geolocation.getCurrentPosition(


function(position){


userLat =
position.coords.latitude;


userLng =
position.coords.longitude;



if(userMarker){

map.removeLayer(userMarker);

}



userMarker =

L.marker(
[
userLat,
userLng
]

)
.addTo(map)
.bindPopup(
"You are here"
)
.openPopup();



map.setView(
[
userLat,
userLng
],
14
);



},


function(){


alert(
"Location permission denied"
);


}


);


}

else{


alert(
"GPS not supported"
);


}


}




searchAddress();



</script>


</body>

</html>
