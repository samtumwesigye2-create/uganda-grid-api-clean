<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Uganda National Grid</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .search {
      background: white;
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      padding: 13px 22px;
      margin-top: 8px;
      border: none;
      border-radius: 7px;
      background: #d71920;
      color: white;
      font-size: 16px;
    }

    #map {
      width: 100%;
      max-width: 1100px;
      height: 600px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>

<body>

<header>
  <h1>Uganda National Grid</h1>
  <p>National transportation and infrastructure network</p>
</header>

<section class="search">

  <label for="start">Start Location</label>

  <input
    id="start"
    placeholder="Enter starting location"
  >

  <label for="destination">Destination</label>

  <input
    id="destination"
    placeholder="Enter destination"
  >

  <button onclick="findRoute()">
    Find Route
  </button>

</section>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
