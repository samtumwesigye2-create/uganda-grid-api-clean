<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uganda National Grid</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px Arial;background:#f4f6f8}header{background:#111827;color:#fff;padding:18px;text-align:center}main{max-width:1000px;margin:15px auto;padding:15px;background:#fff;border-radius:10px}input,select{width:100%;padding:12px;margin:6px 0 10px;box-sizing:border-box}button{padding:12px 18px;background:#d71920;color:#fff;border:0;border-radius:6px;margin:4px}.map-links{display:flex;gap:8px;align-items:stretch;margin:10px 0}.map-links button{flex:1;margin:0;background:#fff;color:#111;border:1px solid #bbb;font-weight:700}.result{margin-top:10px;padding:12px;border:1px solid #ccc;border-radius:7px;cursor:pointer}.resolved{font-size:13px;color:#374151;margin-bottom:8px}#map{height:600px;margin:15px auto;max-width:1100px}#info{padding:12px}</style></head><body><header><h1>Uganda National Grid</h1></header><main><div class="map-links"><button id="ugamaps">🇺🇬 UGAMAPS</button><button id="googleMaps">Google Maps</button></div><label>Start Location</label><input id="start" placeholder="Kampala or UG-ENT-000001"><div id="sr" class="resolved"></div><label>Destination</label><input id="dest" placeholder="Jinja or UG-ENT-000002"><div id="dr" class="resolved"></div><label>Travel Mode</label><select id="mode"><option value="driving">🚗 Drive</option><option value="walking">🚶 Walk</option><option value="cycling">🚲 Bike</option><option value="flight">✈️ Plane</option></select><button id="route">Find Route</button><button id="navigate">🧭 Navigation</button><button id="myLocation">📍 My Location</button><div id="status"></div></main><main><label>Grid ID / Address Search</label><input id="search" placeholder="Example: UG-ENT-000001"><button id="searchBtn">Search Grid</button><div id="result"></div></main><main><label>Navigation Test Mode</label><select id="navMode"><option value="simulate">🇺🇬 Uganda Simulation (recommended while testing in US)</option><option value="gps">📍 Real GPS Location</option></select></main><div id="info">Uganda National Grid: test layer initializing...</div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://uganda-grid-api-clean-production.up.railway.app';const map=L.map('map').setView([1.3733,32.2903],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let line,sm,dm,gridMarker,userMarker,userLocation=null,watchId=null,simTimer=null,lastDestination=null;const $=id=>document.getElementById(id);const status=$('status'),info=$('info'),start=$('start'),dest=$('dest'),route=$('route'),navigate=$('navigate'),myLocation=$('myLocation'),search=$('search'),result=$('result'),mode=$('mode'),navMode=$('navMode'),ugamaps=$('ugamaps'),googleMaps=$('googleMaps');async function grid(q){const r=await fetch(API+'/search?q='+encodeURIComponent(q));if(!r.ok)throw Error('Grid service unavailable');const d=await r.json();return d.results&&d.results[0]||null}async function locate(q){if(/^UG-[A-Z0-9]+-\d+$/i.test(q)){const x=await grid(q);if(!x)throw Error('Grid ID not found');return{lat:+x.latitude,lon:+x.longitude,id:x.grid_id,address:x.address}}const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ug&q='+encodeURIComponent(q));const d=await r.json();if(!d[0])throw Error('Location not found');return{lat:+d[0].lat,lon:+d[0].lon,address:d[0].display_name}}function show(id,x){$(id).textContent=(x.id?x.id+' — ':'')+x.address}function focusPoint(x){if(gridMarker)map.removeLayer(gridMarker);gridMarker=L.marker([x.lat,x.lon]).addTo(map).bindPopup('<b>'+(x.id||'')+'</b><br>'+x.address).openPopup();map.setView([x.lat,x.lon],17)}async function preview(input,out){const q=$(input).value.trim();if(!q)return;try{const x=await locate(q);show(out,x);focusPoint(x)}catch(e){$(out).textContent=e.message}}start.onblur=()=>preview('start','sr');dest.onblur=()=>preview('dest','dr');function haversine(a,b){const R=6371000,p=Math.PI/180,dlat=(b.lat-a.lat)*p,dlon=(b.lon-a.lon)*p,x=Math.sin(dlat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}async function getRoute(a,b){const m=mode.value;if(m==='flight')return{pts:[[a.lat,a.lon],[b.lat,b.lon]],distance:haversine(a,b),duration:haversine(a,b)/700*3600};const profile=m==='walking'?'foot':m==='cycling'?'bike':'driving';const u='https://router.project-osrm.org/route/v1/'+profile+'/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=full&geometries=geojson';const r=await(await fetch(u)).json();if(!r.routes?.length)throw Error('No '+m+' route found');const z=r.routes[0];return{pts:z.geometry.coordinates.map(p=>[p[1],p[0]]),distance:z.distance,duration:z.duration}}async function buildRoute(a,b,fit=true){const z=await getRoute(a,b);lastDestination=b;if(line)map.removeLayer(line);if(sm)map.removeLayer(sm);if(dm)map.removeLayer(dm);line=L.polyline(z.pts,{color:'#d71920',weight:6,opacity:.95}).addTo(map);sm=L.marker([a.lat,a.lon]).addTo(map).bindPopup('<b>Start</b><br>'+(a.id||'')+'<br>'+a.address);dm=L.marker([b.lat,b.lon]).addTo(map).bindPopup('<b>Destination</b><br>'+(b.id||'')+'<br>'+b.address);if(fit)map.fitBounds(line.getBounds(),{padding:[60,60]});info.innerHTML='<b>'+mode.options[mode.selectedIndex].text+' route</b><br>Distance: '+(z.distance/1000).toFixed(1)+' km<br>Estimated time: '+Math.floor(z.duration/3600)+' hr '+Math.round(z.duration%3600/60)+' min';return z}route.onclick=async()=>{if(!start.value||!dest.value){status.textContent='Please enter both locations.';return}route.disabled=true;status.textContent='Calculating...';try{const a=await locate(start.value),b=await locate(dest.value);show('sr',a);show('dr',b);await buildRoute(a,b);status.textContent='Route found successfully.'}catch(e){status.textContent=e.message}finally{route.disabled=false}};myLocation.onclick=()=>{if(!navigator.geolocation){status.textContent='Location is not supported on this device.';return}status.textContent='Finding your location...';navigator.geolocation.getCurrentPosition(p=>{userLocation={lat:p.coords.latitude,lon:p.coords.longitude};if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([userLocation.lat,userLocation.lon]).addTo(map).bindPopup('<b>My Location</b>').openPopup();map.setView([userLocation.lat,userLocation.lon],16);status.textContent='Your real location found.'},()=>status.textContent='Unable to access your location. Allow location access and try again.',{enableHighAccuracy:true,timeout:10000})};navigate.onclick=async()=>{if(!dest.value){status.textContent='Select a destination first.';return}try{const b=await locate(dest.value);if(navMode.value==='simulate'){if(!start.value){status.textContent='Enter a Uganda Grid ID in Start Location first.';return}const a=await locate(start.value),z=await getRoute(a,b),pts=z.pts;let i=0;if(simTimer)clearInterval(simTimer);if(userMarker)map.removeLayer(userMarker);userMarker=L.marker(pts[0]).addTo(map).bindPopup('<b>Simulated Navigation</b>').openPopup();if(line)map.removeLayer(line);line=L.polyline(pts,{color:'#d71920',weight:6,opacity:.95}).addTo(map);map.fitBounds(line.getBounds(),{padding:[70,70]});status.textContent='🇺🇬 Navigation simulation active.';simTimer=setInterval(()=>{if(i>=pts.length-1){clearInterval(simTimer);status.textContent='Navigation simulation arrived at destination.';return}i++;userMarker.setLatLng(pts[i]);map.panTo(pts[i],{animate:true,duration:.3})},700)}else{status.textContent='Requesting your real GPS location...';navigator.geolocation.getCurrentPosition(async p=>{userLocation={lat:p.coords.latitude,lon:p.coords.longitude};if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([userLocation.lat,userLocation.lon]).addTo(map);await buildRoute(userLocation,b);status.textContent='Real GPS navigation active.';if(watchId)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(async q=>{userLocation={lat:q.coords.latitude,lon:q.coords.longitude};userMarker.setLatLng([q.coords.latitude,q.coords.longitude]);try{await buildRoute(userLocation,b,false)}catch(e){}},{enableHighAccuracy:true,maximumAge:2000,timeout:10000})}},()=>status.textContent='Allow location access to use real GPS navigation.',{enableHighAccuracy:true,timeout:10000})}}catch(e){status.textContent=e.message}};searchBtn.onclick=async()=>{const q=search.value.trim();result.innerHTML='Searching...';try{const x=await grid(q);if(!x){result.textContent='Grid record not found.';return}const p=[+x.latitude,+x.longitude];result.innerHTML='<div class="result"><b>'+x.grid_id+'</b><br>'+x.address+'<br><small>Tap to select as destination</small></div>';focusPoint({lat:p[0],lon:p[1],id:x.grid_id,address:x.address});result.firstElementChild.onclick=()=>{dest.value=x.grid_id;show('dr',{id:x.grid_id,address:x.address});focusPoint({lat:p[0],lon:p[1],id:x.grid_id,address:x.address});status.textContent='Destination selected. Tap Find Route or Navigation.'}}catch(e){result.textContent='Grid search unavailable.'}};function openMapProvider(provider){const q=dest.value.trim();if(provider==='google'){window.open(q?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q):'https://www.google.com/maps','_blank')}else{map.scrollIntoView({behavior:'smooth'});setTimeout(()=>map.invalidateSize(),100);status.textContent='🇺🇬 UGAMAPS is the built-in map.'}}ugamaps.onclick=()=>openMapProvider('ugamaps');googleMaps.onclick=()=>openMapProvider('google');info.textContent='Uganda National Grid: map ready — loading test records...';grid('UG-ENT-000001').then(x=>{info.textContent=x?'Uganda National Grid: 50 real test records loaded':'Uganda National Grid: map ready — test record not found'}).catch(()=>{info.textContent='Uganda National Grid: map ready — grid service unavailable'});</script></body></html>
