<body>
<div class="ungGlobalBrand" id="ungGlobalBrand"><a href="/" aria-label="Uganda National Grid home"><img src="/assets/uganda-national-grid-logo.jpg?v=official" alt="Uganda National Grid" /></a></div>

<header>
<button class="icon-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
<div class="titleWrap">
<h1>Uganda National Grid</h1>
<p>Search, route and navigate across Uganda</p>
</div>
<button class="icon-btn" id="bellBtn" aria-label="Notifications">&#128276;</button>
</header>
<div class="contentScroll" id="contentScroll">
<main class="panel">
<div class="field">
<label for="start">Start location</label>
<input id="start" autocomplete="off" placeholder="Address, place or grid ID e.g. 1001 Lake Victoria Drive" />
<button type="button" class="fieldIcon" id="startLocateBtn" aria-label="Use my location">&#8982;</button>
<div id="ss" class="suggest"></div><div id="sr" class="selected"></div>
</div>
<div class="field">
<label for="dest">Destination</label>
<input id="dest" autocomplete="off" placeholder="Address, place or grid ID e.g. UG-ENT-000400" />
<span class="fieldIcon">&#128205;</span>
<div id="ds" class="suggest"></div><div id="dr" class="selected"></div>
</div>
<div class="row">
<select id="mode" aria-label="Travel mode"><option value="driving">&#128664; Driving</option><option value="walking">&#128694; Walking</option><option value="cycling">&#128692; Cycling</option><option value="flight">&#9992;&#65039; Flight</option></select>
<button id="navigate">
<svg class="btnIcon" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<path d="M12 2 L19 21 L12 17 L5 21 Z" fill="#ffffff"/>
</svg>
<span class="navText"><span class="navMain">UGAMAP</span><span class="navSub">Navigate</span></span>
</button>
</div>
<div class="row">
<button id="myLocation" class="secondaryBtn">My location</button>
<button id="googleMaps">
<svg class="btnIcon" width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
<path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
<path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
<path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
</svg>
Google Maps
</button>
</div>
<div id="status" class="status">Loading...</div>
<div id="info"></div>
</main>
<div class="mapWrap">
<div id="map"></div>

<div class="navOverlayTop">
<div id="turnBanner" class="turnBanner">
<div class="turnRow">
<span id="turnArrowGlyph" class="turnArrowGlyph">&#8593;</span>
<span id="turnMain" class="turnMain"></span>
</div>
<span id="turnSub" class="turnSub"></span>
<div class="progressTrack"><div id="turnProgressFill" class="progressFill"></div></div>
</div>
