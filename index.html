<!DOCTYPE html>
<html>
<head>
<title>Uganda National Grid API</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link 
rel="stylesheet" 
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>

body{
    font-family: Arial, sans-serif;
    margin:30px;
}

h1{
    font-size:36px;
}

input{
    width:60%;
    padding:12px;
    font-size:18px;
}

button{
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
}

table{
    margin-top:20px;
    border-collapse:collapse;
    width:100%;
}

td,th{
    border:1px solid #ccc;
    padding:12px;
    text-align:left;
}

#map{
    height:400px;
    margin-top:30px;
}

.nav{
    margin-top:20px;
}

</style>

</head>


<body>

<h1>Uganda National Grid API</h1>


<input 
id="searchBox"
placeholder="Search address or code"
value="UG-ENT-000211"
/>

<button onclick="searchAddress()">
Search
</button>


<table>

<thead>
<tr>
<th>ID</th>
<th>Code</th>
<th>Address</th>
</tr>
</thead>


<tbody id="results">

</tbody>

</table>


<div id="map"></div>


<div class="nav">

<button onclick="navigate()">
Navigate
</button>

</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="app.js"></script>


</body>
</html>
