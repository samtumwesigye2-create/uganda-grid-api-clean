<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uganda National Grid</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px Arial;background:#f4f6f8}header{background:#111827;color:#fff;padding:18px;text-align:center}main{max-width:1000px;margin:15px auto;padding:15px;background:#fff;border-radius:10px}input{width:100%;padding:12px;margin:6px 0 10px;box-sizing:border-box}button{padding:12px 18px;background:#d71920;color:#fff;border:0;border-radius:6px}.result{margin-top:10px;padding:12px;border:1px solid #ccc;border-radius:7px;cursor:pointer}.resolved{font-size:13px;color:#374151;margin-bottom:8px}#map{height:600px;margin:15px auto;max-width:1100px}#info{padding:12px}</style></head><body><header><h1>Uganda National Grid</h1></header><main><label>Start Location</label><input id="start" placeholder="Kampala or UG-ENT-000001"><div id="sr" class="resolved"></div><label>Destination</label><input id="dest" placeholder="Jinja or UG-ENT-000002"><div id="dr" class="resolved"></div><button id="route">Find Route</button><div id="status"></div></main><main><label>Grid ID / Address Search</label><input id="search" placeholder="Example: UG-ENT-000001"><button id="searchBtn">Search Grid</button><div id="result"></div></main><div id="info">Uganda National Grid: loading...</div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://uganda-grid-api-clean-production.up.railway.app';const map=L.map('map').setView([1.3733,32.2903],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let line,sm,dm,gridMarker;async function grid(q){let r=await fetch(API+'/search?q='+encodeURIComponent(q));let d=await r.json();return d.results&&d.results[0]||null}async function locate(q){if(/^UG-[A-Z0-9]+-\d+$/i.test(q)){let x=await grid(q);if(!x)throw Error('Grid ID not found');return{lat:+x.latitude,lon:+x.longitude,id:x.grid_id,address:x.address}}let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ug&q='+encodeURIComponent(q));let d=await r.json();if(!d[0])throw Error('Location not found');return{lat:+d[0].lat,lon:+d[0].lon,address:d[0].display_name}}function show(id,x){document.getElementById(id).textContent=(x.id?x.id+' — ':'')+x.address}async function preview(input,out){let q=document.getElementById(input).value.trim();if(!q)return;try{let x=await locate(q);show(out,x);focusPoint(x)}catch(e){document.getElementById(out).textContent=e.message}}function focusPoint(x){if(gridMarker)map.removeLayer(gridMarker);gridMarker=L.marker([x.lat,x.lon]).addTo(map).bindPopup('<b>'+(x.id||'')+'</b><br>'+x.address).openPopup();map.setView([x.lat,x.lon],17)}start.onblur=()=>preview('start','sr');dest.onblur=()=>preview('dest','dr');route.onclick=async()=>{if(!start.value||!dest.value){status.textContent='Please enter both locations.';return}route.disabled=true;status.textContent='Calculating...';try{let a=await locate(start.value),b=await locate(dest.value);show('sr',a);show('dr',b);let r=await(await fetch('https://router.project-osrm.org/route/v1/driving/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=full&geometries=geojson')).json();if(!r.routes?.length)throw Error('No route found');let z=r.routes[0],pts=z.geometry.coordinates.map(p=>[p[1],p[0]]);if(line)map.removeLayer(line);if(sm)map.removeLayer(sm);if(dm)map.removeLayer(dm);line=L.polyline(pts,{color:'#d71920',weight:6}).addTo(map);sm=L.marker([a.lat,a.lon]).addTo(map).bindPopup('<b>Start</b><br>'+(a.id||'')+'<br>'+a.address);dm=L.marker([b.lat,b.lon]).addTo(map).bindPopup('<b>Destination</b><br>'+(b.id||'')+'<br>'+b.address);map.fitBounds(line.getBounds(),{padding:[30,30]});status.textContent='Route found successfully.';info.innerHTML='<b>Route found</b><br>Distance: '+(z.distance/1000).toFixed(1)+' km<br>Estimated driving time: '+Math.floor(z.duration/3600)+' hr '+Math.round(z.duration%3600/60)+' min'}catch(e){status.textContent=e.message}finally{route.disabled=false}};searchBtn.onclick=async()=>{let q=search.value.trim();result.innerHTML='Searching...';try{let x=await grid(q);if(!x){result.textContent='Grid record not found.';return}let p=[+x.latitude,+x.longitude];result.innerHTML='<div class="result"><b>'+x.grid_id+'</b><br>'+x.address+'<br><small>Tap to select as destination</small></div>';focusPoint({lat:p[0],lon:p[1],id:x.grid_id,address:x.address});result.firstElementChild.onclick=()=>{dest.value=x.grid_id;show('dr',{id:x.grid_id,address:x.address});focusPoint({lat:p[0],lon:p[1],id:x.grid_id,address:x.address});status.textContent='Destination selected. Tap Find Route.'}}catch(e){result.textContent='Grid search unavailable.'}};fetch(API+'/search?q=Entebbe').then(r=>r.json()).then(d=>info.textContent='Uganda National Grid: '+((d.results||[]).length)+' real test records loaded').catch(()=>info.textContent='Uganda National Grid: test layer unavailable');</script></body></html>
