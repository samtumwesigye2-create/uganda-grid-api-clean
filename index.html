<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Uganda National Grid</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body{
margin:0;
font-family:Arial;
background:#eef1f4;
}

header{
background:#111827;
color:white;
padding:25px;
text-align:center;
}

h1{
margin:0;
}

.container{
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
margin:8px 0;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#d71920;
color:white;
border:0;
padding:14px 20px;
border-radius:8px;
font-size:16px;
}

#map{
height:500px;
width:100%;
border-radius:12px;
}

</style>

</head>


<body>


<header>

<h1>🇺🇬 Uganda National Grid</h1>

<p>CONNECTED. MAPPED. MOVING UGANDA FORWARD.</p>

</header>



<div class="container">


<div class="card">

<input id="start" placeholder="Start city (Kampala)">

<input id="destination" placeholder="Destination (Jinja)">

<button onclick="findRoute()">
Find Route
</button>

</div>


<div id="map"></div>


</div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="./app.js"></script>


</body>

</html>
