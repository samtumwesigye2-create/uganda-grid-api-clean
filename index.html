<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Uganda National Grid</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef1f4;
}

header{
background:#111827;
color:white;
text-align:center;
padding:20px;
}

.container{
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
margin:8px 0;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:14px 20px;
background:#d71920;
color:white;
border:0;
border-radius:8px;
font-size:16px;
}

#map{
height:500px;
width:100%;
border-radius:12px;
}

</style>

</head>

<body>

<header>
<h1>🇺🇬 Uganda National Grid</h1>
<p>CONNECTED. MAPPED. MOVING UGANDA FORWARD.</p>
</header>


<div class="container">

<div class="card">

<input id="start" placeholder="Start city">

<input id="destination" placeholder="Destination city">

<button onclick="findRoute()">
Preview Route
</button>

</div>


<div id="map"></div>


</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="app.js"></script>


</body>
</html>
