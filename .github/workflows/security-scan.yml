name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax check
        run: python -m compileall -q .

      - name: Dependency vulnerability audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Repository malware scan
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam
          test -n "$(find /var/lib/clamav -maxdepth 1 -type f \( -name '*.cvd' -o -name '*.cld' \) -print -quit)"
          clamscan --recursive --infected --exclude-dir='\.git' .

      - name: Reject dangerous executable artifacts
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find . -path './.git' -prune -o -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.scr' -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' -o -iname '*.jar' \) -print)
          if [ -n "$bad" ]; then
            echo 'Unexpected executable artifacts found:'
            echo "$bad"
            exit 1
          fi

      - name: Scan for accidental private keys
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIlE --exclude-dir=.git --exclude='security-scan.yml' 'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY' .; then
            echo 'Potential private key material detected.'
            exit 1
          fi
