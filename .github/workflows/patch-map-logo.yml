name: Patch Map Header Logo
on:
  push:
    paths:
      - '.github/workflows/patch-map-logo.yml'
      - 'scripts/patch_map_logo.py'
permissions:
  contents: write
jobs:
  patch-map-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_map_logo.py
      - name: Commit map header logo only
        run: |
          if git diff --quiet -- index.html; then
            echo "No map logo changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add compact logo to map header"
          git push origin HEAD:main
