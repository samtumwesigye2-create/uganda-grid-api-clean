name: Apply One Page Business Documents
on:
  push:
    paths:
      - 'scripts/apply_one_page_business_docs.py'
      - '.github/workflows/apply-one-page-business-docs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_one_page_business_docs.py
      - name: Commit one-page document links
        run: |
          if git diff --quiet -- business-documents/invoice.html business-documents/bill-of-lading.html business-documents/receipt.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business-documents/invoice.html business-documents/bill-of-lading.html business-documents/receipt.html
          git commit -m "Force business documents to single printed page"
          git push origin HEAD:main
