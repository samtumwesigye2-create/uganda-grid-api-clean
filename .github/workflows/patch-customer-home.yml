name: Patch Customer Logistics Home

on:
  push:
    paths:
      - 'scripts/patch_customer_home.py'
      - '.github/workflows/patch-customer-home.yml'

permissions:
  contents: write

jobs:
  patch-customer-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer index
        run: python scripts/patch_customer_home.py
      - name: Commit customer homepage
        run: |
          if git diff --quiet -- index.html; then
            echo "No customer homepage changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add customer logistics homepage sections [skip ci]"
          git push origin HEAD:main
