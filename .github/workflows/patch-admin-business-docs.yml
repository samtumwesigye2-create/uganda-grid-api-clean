name: Patch Admin Business Documents

on:
  push:
    paths:
      - '.github/workflows/patch-admin-business-docs.yml'

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add business document launchers to admin
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin.html')
          text = path.read_text(encoding='utf-8')

          css_marker = '  .dashNote { font-size:11px; color:#666; margin-top:6px; }\n'
          css = '''
  .doc-launch-section { margin: 4px 0 22px; padding:14px; background:#151829; border:1px solid #2a2d3e; border-radius:12px; }
  .doc-launch-title { font-size:13px; font-weight:800; letter-spacing:.06em; color:#9fb0ff; margin-bottom:10px; }
  .doc-launch-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .doc-launch-card { display:block; text-decoration:none; color:#fff; border-radius:10px; padding:14px; min-height:112px; border:1px solid rgba(255,255,255,.12); }
  .doc-launch-card.invoice { background:linear-gradient(135deg,#087b4c,#12a66a); }
  .doc-launch-card.bol { background:linear-gradient(135deg,#274ec7,#3b6cff); }
  .doc-launch-card.receipt { background:linear-gradient(135deg,#6d27a8,#9138cc); }
  .doc-launch-card .doc-icon { font-size:24px; display:block; margin-bottom:8px; }
  .doc-launch-card strong { display:block; font-size:16px; margin-bottom:4px; }
  .doc-launch-card small { display:block; color:rgba(255,255,255,.82); line-height:1.35; }
  .doc-launch-card .doc-action { display:block; margin-top:10px; font-size:12px; font-weight:800; }
  @media (max-width:650px) { .doc-launch-grid { grid-template-columns:1fr; } .doc-launch-card { min-height:auto; } }
'''
          if 'doc-launch-section' not in text:
              if css_marker not in text:
                  raise SystemExit('CSS marker not found')
              text = text.replace(css_marker, css_marker + css, 1)

          text = text.replace('data-tab="invoices">Invoices</div>', 'data-tab="invoices">Invoice Records</div>')
          text = text.replace('data-tab="bol">Bill of Lading</div>', 'data-tab="bol">B/L Records</div>')

          tabs_marker = '    <div class="tab" data-tab="data">Data</div>\n  </div>\n'
          launcher = '''    <div class="tab" data-tab="data">Data</div>
  </div>

  <section class="doc-launch-section">
    <div class="doc-launch-title">BUSINESS DOCUMENTS</div>
    <div class="doc-launch-grid">
      <a class="doc-launch-card invoice" href="/business-documents/invoice.html">
        <span class="doc-icon">▣</span>
        <strong>Invoice</strong>
        <small>Create a clean customer invoice with automatic totals and print/PDF support.</small>
        <span class="doc-action">CREATE INVOICE →</span>
      </a>
      <a class="doc-launch-card bol" href="/business-documents/bill-of-lading.html">
        <span class="doc-icon">▤</span>
        <strong>Bill of Lading</strong>
        <small>Create shipping paperwork for shipper, consignee, carrier and goods.</small>
        <span class="doc-action">CREATE B/L →</span>
      </a>
      <a class="doc-launch-card receipt" href="/business-documents/receipt.html">
        <span class="doc-icon">▧</span>
        <strong>Receipt</strong>
        <small>Create payment receipts with automatic totals and print/PDF support.</small>
        <span class="doc-action">CREATE RECEIPT →</span>
      </a>
    </div>
  </section>
'''
          if '<section class="doc-launch-section">' not in text:
              if tabs_marker not in text:
                  raise SystemExit('Tabs marker not found')
              text = text.replace(tabs_marker, launcher, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit admin integration
        run: |
          if git diff --quiet -- admin.html; then
            echo 'No admin change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Add business document launchers to admin [skip ci]'
          git push origin HEAD:main
