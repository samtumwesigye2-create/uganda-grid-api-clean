name: Patch Admin Business Documents

on:
  push:
    paths:
      - '.github/workflows/patch-admin-business-docs.yml'
      - 'scripts/patch_admin_docs.py'

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch admin
        run: python scripts/patch_admin_docs.py
      - name: Commit changes
        run: |
          if git diff --quiet -- admin.html; then
            echo "No admin changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Make business document launchers compact [skip ci]"
          git push origin HEAD:main
