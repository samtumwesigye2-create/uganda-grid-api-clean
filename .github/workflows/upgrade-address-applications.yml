name: Upgrade Address Applications
on:
  push:
    paths:
      - '.github/workflows/upgrade-address-applications.yml'
      - 'scripts/upgrade_address_applications.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/upgrade_address_applications.py
      - name: Commit changes
        run: |
          if git diff --quiet -- submit.html main.py commercial.py admin.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submit.html main.py commercial.py admin.html
          git commit -m "Upgrade residential and commercial address applications [skip ci]"
          git push origin HEAD:main
