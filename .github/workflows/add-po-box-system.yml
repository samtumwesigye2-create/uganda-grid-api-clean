name: Add PO Box System
on:
  push:
    paths:
      - '.github/workflows/add-po-box-system.yml'
      - 'scripts/add_po_box_system.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch customer and admin pages
        run: python scripts/add_po_box_system.py
      - name: Commit generated page changes
        run: |
          if git diff --quiet -- ship.html admin.html; then
            echo "No page changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ship.html admin.html
          git commit -m "Add managed PO Box application workflow [skip ci]"
          git push origin HEAD:main
