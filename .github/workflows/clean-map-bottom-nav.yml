name: Clean Map Bottom Navigation
on:
  push:
    paths:
      - '.github/workflows/clean-map-bottom-nav.yml'
      - 'scripts/clean_map_bottom_nav.py'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/clean_map_bottom_nav.py
      - name: Commit cleanup
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove nonfunctional map dashboard buttons [skip ci]"
          git push origin HEAD:main
