name: Upgrade Customer Tracking
on:
  push:
    paths:
      - '.github/workflows/upgrade-customer-tracking.yml'
      - 'scripts/upgrade_customer_tracking.py'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade live customer tracking
        run: python scripts/upgrade_customer_tracking.py
      - name: Commit customer page
        run: |
          if git diff --quiet -- ship.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ship.html
          git commit -m "Add live customer shipment tracking timeline [skip ci]"
          git push origin HEAD:main
