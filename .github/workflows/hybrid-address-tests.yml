name: Hybrid Address Approval Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  address-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run hybrid approval tests
        run: python -m unittest tests.test_address_confidence -v
