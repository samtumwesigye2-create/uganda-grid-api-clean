name: Connect Postal Assignment
on:
  push:
    paths:
      - 'scripts/connect_postal_assignment.py'
      - '.github/workflows/connect-postal-assignment.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/connect_postal_assignment.py
      - name: Commit postal integration
        run: |
          if git diff --quiet -- main.py commercial.py; then
            echo "No postal changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py commercial.py
          git commit -m "Connect automatic postal ZIP assignment [skip ci]"
          git push origin HEAD:main
